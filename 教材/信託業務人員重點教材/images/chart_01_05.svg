<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 詐害信託撤銷權判定流程與除斥期間 (信託法第 6、7 條)</text>

  <!-- 流程四步驟 -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="180" height="130" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="180" height="36" rx="10" fill="url(#gradRose)"/>
    <text x="90" y="24" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">步驟 1: 脫產詐害行為</text>
    <text x="15" y="65" fill="#fca5a5" font-size="13" font-weight="700">債務人惡意移轉</text>
    <text x="15" y="88" fill="#cbd5e1" font-size="12">委託人明知有債務</text>
    <text x="15" y="108" fill="#cbd5e1" font-size="12">仍將房產/資金信託</text>
  </g>

  <g transform="translate(260, 75)" filter="url(#shadow)">
    <rect width="180" height="130" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="180" height="36" rx="10" fill="url(#gradAmber)"/>
    <text x="90" y="24" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">步驟 2: 債權人提告</text>
    <text x="15" y="65" fill="#fde68a" font-size="13" font-weight="700">聲請法院撤銷</text>
    <text x="15" y="88" fill="#cbd5e1" font-size="12">受害債權人向法院</text>
    <text x="15" y="108" fill="#cbd5e1" font-size="12">提起詐害信託撤銷訴訟</text>
  </g>

  <g transform="translate(480, 75)" filter="url(#shadow)">
    <rect width="180" height="130" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="180" height="36" rx="10" fill="url(#gradBlue)"/>
    <text x="90" y="24" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">步驟 3: 法院判決撤銷</text>
    <text x="15" y="65" fill="#93c5fd" font-size="13" font-weight="700">法院判決撤銷信託行為</text>
    <text x="15" y="88" fill="#cbd5e1" font-size="12">法院判決撤銷確定</text>
    <text x="15" y="108" fill="#cbd5e1" font-size="12">依判決及法規回復原狀</text>
  </g>

  <g transform="translate(700, 75)" filter="url(#shadow)">
    <rect width="180" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="180" height="36" rx="10" fill="url(#gradEmerald)"/>
    <text x="90" y="24" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">步驟 4: 強制執行受償</text>
    <text x="15" y="65" fill="#6ee7b7" font-size="13" font-weight="700">查封拍賣受償</text>
    <text x="15" y="88" fill="#cbd5e1" font-size="12">債權人得對該財產</text>
    <text x="15" y="108" fill="#cbd5e1" font-size="12">合法聲請查封拍賣！</text>
  </g>

  <!-- 箭頭 -->
  <path d="M 220 140 L 260 140" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 440 140 L 480 140" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 660 140 L 700 140" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 下方除斥期間重要提醒 -->
  <g transform="translate(140, 240)" filter="url(#shadow)">
    <rect width="640" height="85" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="320" y="32" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle"> 撤銷權消滅時效（除斥期間）：知一成十</text>
    <text x="320" y="58" fill="#cbd5e1" font-size="14" text-anchor="middle">• 自債權人「知有撤銷原因」時起：1 年間不行使而消滅</text>
    <text x="320" y="78" fill="#cbd5e1" font-size="14" text-anchor="middle">• 自「信託行為成立」時起：逾 10 年者亦消滅！</text>
  </g>

</svg>
