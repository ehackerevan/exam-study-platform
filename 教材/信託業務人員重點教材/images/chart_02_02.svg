<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託業資本額與賠償準備金 (信託業法第 10、34 條)</text>

  <!-- 三大資金柱狀防線 -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradBlue)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">1. 最低實收資本額</text>
    
    <text x="130" y="80" fill="#60a5fa" font-size="24" font-weight="800" text-anchor="middle">20 億元</text>
    <text x="25" y="125" fill="#cbd5e1" font-size="13">• 發起人於發起時一次認足</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="13">• 依設立標準及出資規範</text>
    <text x="25" y="185" fill="#cbd5e1" font-size="13">• 兼營機構依其監理規定辦理</text>
    <text x="25" y="215" fill="#38bdf8" font-size="13"> 依信託業設立標準第 3 條</text>
  </g>

  <g transform="translate(330, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradAmber)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">2. 營業保證金辨析</text>
    
    <text x="130" y="80" fill="#fbbf24" font-size="24" font-weight="800" text-anchor="middle">無一般 5% 提存比例</text>
    <text x="25" y="125" fill="#cbd5e1" font-size="13">• 不等同賠償準備金</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="13">• 依各業務法規判斷</text>
    <text x="25" y="185" fill="#cbd5e1" font-size="13">• 不宜混為同一制度</text>
    <text x="25" y="215" fill="#fbbf24" font-size="13"> 信託業法無此一般制度</text>
  </g>

  <g transform="translate(620, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradEmerald)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">3. 賠償準備金 (第34條)</text>
    
    <text x="130" y="80" fill="#34d399" font-size="24" font-weight="800" text-anchor="middle">最低 5,000 萬元</text>
    <text x="25" y="120" fill="#a7f3d0" font-size="13">• 取得執照後 1 個月內繳存</text>
    <text x="25" y="145" fill="#a7f3d0" font-size="13">• 一般業務 1/1000；基金保管 1/10000</text>
    <text x="25" y="170" fill="#f87171" font-size="13">現金或政府債券繳存中央銀行</text>
    <text x="25" y="200" fill="#fbbf24" font-size="14" font-weight="700"> 委託人或受益人依法有優先受償權</text>
  </g>

</svg>