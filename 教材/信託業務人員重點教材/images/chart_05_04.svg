<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 員工持股信託 (ESOT) vs 員工福利儲蓄信託 (EFST) 核心比較</text>

  <g transform="translate(40, 70)" filter="url(#shadow)">
    <rect width="400" height="250" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="400" height="42" rx="10" fill="url(#gradBlue)"/>
    <text x="200" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 員工持股信託 (ESOT)</text>
    <text x="25" y="75" fill="#60a5fa" font-size="15" font-weight="700">投資標的：專買自家公司股票！</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 資金來源：員工自提金 ＋ 公司獎助金 (如 1:1)</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="13">• 核心目的：員工與企業命運一體化、凝聚向心力</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="13">• 退休或離職時：領取實體股票或折算現金返還</text>
    <text x="25" y="195" fill="#38bdf8" font-size="13"> 稅務：公司獎助金為員工當年度「其他所得」！</text>
  </g>

  <g transform="translate(480, 70)" filter="url(#shadow)">
    <rect width="400" height="250" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="400" height="42" rx="10" fill="url(#gradEmerald)"/>
    <text x="200" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 員工福利儲蓄信託 (EFST)</text>
    <text x="25" y="75" fill="#34d399" font-size="15" font-weight="700">投資標的：多元資產組合！</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 投資範圍：國內外基金、優質公債、存款</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="13">• 核心目的：為員工長期儲蓄退休金、分散股市單一風險</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="13">• 標的決定：由員工於約定選單中自由配置比例</text>
    <text x="25" y="195" fill="#fbbf24" font-size="13"> 適合非上市櫃公司或穩健保守型企業推廣！</text>
  </g>

</svg>