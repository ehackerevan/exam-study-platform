<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託資金集合管理運用帳戶（CIT）基本架構</text>

  <!-- 左邊小額資金 -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="200" height="220" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="35" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">多數小額投資人</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 投資人 A: 10 萬元</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 投資人 B: 50 萬元</text>
    <text x="20" y="135" fill="#cbd5e1" font-size="13">• 投資人 C: 100 萬元</text>
    <text x="20" y="175" fill="#38bdf8" font-size="13"> 簽訂信託契約</text>
  </g>

  <!-- 中間集合大水庫 -->
  <g transform="translate(320, 65)" filter="url(#shadow)">
    <rect width="280" height="240" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="38" fill="#38bdf8" font-size="17" font-weight="800" text-anchor="middle"> 集合管理運用帳戶 (CIT)</text>
    <text x="140" y="65" fill="#93c5fd" font-size="13" text-anchor="middle">將不同信託資金集合管理運用</text>
    
    <text x="20" y="105" fill="#a7f3d0" font-size="13">• 依約定條款計算各委託人的信託受益權</text>
    <text x="20" y="135" fill="#a7f3d0" font-size="13">• 淨資產價值依管理辦法與約定條款計算</text>
    <text x="20" y="165" fill="#a7f3d0" font-size="13">• 加入／退出時點與計價方式依約定條款</text>
    <text x="20" y="205" fill="#fbbf24" font-size="14" font-weight="700"> 非專業／專業投資人帳戶適用規範不同</text>
  </g>

  <!-- 右邊多元投資配置 -->
  <g transform="translate(680, 75)" filter="url(#shadow)">
    <rect width="200" height="220" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="100" y="35" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">分散標的投資組合</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 政府公債 / 國庫券</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 上市櫃公司股票</text>
    <text x="20" y="135" fill="#cbd5e1" font-size="13">• 短期票券 / 金融債</text>
    <text x="20" y="165" fill="#cbd5e1" font-size="13">• 銀行存款 (流動資產)</text>
    <text x="20" y="195" fill="#fbbf24" font-size="12">投資範圍及比率受法規／計畫限制</text>
  </g>

  <path d="M 240 175 L 320 175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 600 175 L 680 175" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

</svg>