<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 公益信託、基金保管與安養信託重點架構</text>

  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradBlue)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 公益信託專章</text>
    <text x="20" y="75" fill="#60a5fa" font-size="14" font-weight="700">不特定公眾利益</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 各目的事業主管機關許可</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="13">•  強制設置信託監察人</text>
    <text x="20" y="155" fill="#cbd5e1" font-size="13">• 每年至少一次報主管機關核備並公告</text>
    <text x="20" y="185" fill="#fca5a5" font-size="13">• 無約定歸屬權利人時，依第 79 條處理</text>
  </g>

  <g transform="translate(330, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradAmber)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 基金保管機構業務</text>
    <text x="20" y="75" fill="#fbbf24" font-size="14" font-weight="700">款券資產獨立保管</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 投信做決策、保管行管錢</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="13">• 相互持股達 10% 原則不得擔任，核准例外</text>
    <text x="20" y="155" fill="#cbd5e1" font-size="13">• 按基金帳戶別獨立設帳保管</text>
    <text x="20" y="185" fill="#38bdf8" font-size="13"> 依法律、契約與投信運用指示辦理保管收付</text>
  </g>

  <g transform="translate(620, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradRose)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 高齡安養與照護</text>
    <text x="20" y="75" fill="#f472b6" font-size="14" font-weight="700">依契約安排照護費用</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 醫療/養護費用直付專用</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="13">• 可依契約設計監察人／共同簽核等機制</text>
    <text x="20" y="155" fill="#cbd5e1" font-size="13">• 結合安養機構與跨業結盟</text>
    <text x="20" y="185" fill="#34d399" font-size="13"> 一般私益安養信託非法律一律強制設監察人</text>
  </g>

</svg>