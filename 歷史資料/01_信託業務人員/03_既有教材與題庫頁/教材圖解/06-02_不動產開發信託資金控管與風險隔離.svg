<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 不動產開發信託：資金控管與風險隔離</text>

  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="250" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="35" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">1. 三方資金入庫</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 地主土地產權信託</text>
    <text x="20" y="100" fill="#cbd5e1" font-size="13">• 建商自備工程資金</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="13">• 預售屋承購戶自備款</text>
    <text x="20" y="155" fill="#38bdf8" font-size="13"> 匯入受託銀行專戶</text>
  </g>

  <g transform="translate(340, 75)" filter="url(#shadow)">
    <rect width="240" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="35" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">2. 工程／資金控管</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 是否由建經公司查核</text>
    <text x="20" y="100" fill="#cbd5e1" font-size="13">  依個案契約安排</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="13">• 撥款條件依信託契約</text>
    <text x="20" y="155" fill="#34d399" font-size="13"> 信託可降低挪用風險</text>
  </g>

  <g transform="translate(630, 75)" filter="url(#shadow)">
    <rect width="250" height="180" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="125" y="35" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">3. 續建／完工不是信託當然效果</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 是否有續建或完工承諾</text>
    <text x="20" y="100" fill="#cbd5e1" font-size="13">  要看契約與其他履約保證</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="13">• 信託本身不等於銀行保證</text>
    <text x="20" y="155" fill="#fbbf24" font-size="13"> 應逐案確認保障內容</text>
  </g>

  <path d="M 290 150 L 340 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 150 L 630 150" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

</svg>