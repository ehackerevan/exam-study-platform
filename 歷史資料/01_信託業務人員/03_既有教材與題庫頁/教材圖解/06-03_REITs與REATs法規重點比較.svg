<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="430" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> REITs 與 REATs 法規重點比較</text>

  <!-- REITs 卡片 -->
  <g transform="translate(40, 70)" filter="url(#shadow)">
    <rect width="400" height="320" rx="14" fill="#0f2942" stroke="#38bdf8" stroke-width="2.5"/>
    <rect width="400" height="56" rx="14" fill="url(#gradBlue)"/>
    <text x="200" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle"> REITs 不動產投資信託</text>
    
    <text x="25" y="90" fill="#7dd3fc" font-size="15" font-weight="700">1. 發起思維：</text>
    <text x="120" y="90" fill="#e2e8f0" font-size="14">募集資金後依計畫投資不動產等標的</text>
    
    <text x="25" y="130" fill="#7dd3fc" font-size="15" font-weight="700">2. 證券本質：</text>
    <text x="120" y="130" fill="#e2e8f0" font-size="14">經濟性質可類比收益型投資，仍以契約為準</text>

    <text x="25" y="170" fill="#7dd3fc" font-size="15" font-weight="700">3. 存續期間：</text>
    <text x="120" y="170" fill="#e2e8f0" font-size="14">信託契約依法應記載【基金存續期間】</text>

    <text x="25" y="215" fill="#38bdf8" font-size="15" font-weight="700">4. 追加發行：</text>
    <text x="120" y="215" fill="#34d399" font-size="15" font-weight="700"> 追加募集／私募須依規定程序辦理</text>

    <text x="25" y="260" fill="#38bdf8" font-size="15" font-weight="700">5. 收益分配：</text>
    <text x="120" y="260" fill="#fbbf24" font-size="15" font-weight="700"> 契約配息比率≥90%；應分配收益 6 個月內分配</text>

    <text x="25" y="300" fill="#7dd3fc" font-size="15" font-weight="700">6. 借款限制：</text>
    <text x="120" y="300" fill="#e2e8f0" font-size="14">借款依證券化條例第 19 條等規定辦理</text>
  </g>

  <!-- REATs 卡片 -->
  <g transform="translate(480, 70)" filter="url(#shadow)">
    <rect width="400" height="320" rx="14" fill="#3d2806" stroke="#fbbf24" stroke-width="2.5"/>
    <rect width="400" height="56" rx="14" fill="url(#gradAmber)"/>
    <text x="200" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle"> REATs 不動產資產信託</text>
    
    <text x="25" y="90" fill="#fde68a" font-size="15" font-weight="700">1. 發起思維：</text>
    <text x="120" y="90" fill="#e2e8f0" font-size="14">委託人移轉既有不動產／權利辦理證券化</text>
    
    <text x="25" y="130" fill="#fde68a" font-size="15" font-weight="700">2. 證券本質：</text>
    <text x="120" y="130" fill="#e2e8f0" font-size="14">收益與本金分配依資產信託計畫及契約</text>

    <text x="25" y="170" fill="#fde68a" font-size="15" font-weight="700">3. 存續期間：</text>
    <text x="120" y="170" fill="#e2e8f0" font-size="14">資產信託計畫／契約應記載【存續期間】</text>

    <text x="25" y="215" fill="#f87171" font-size="15" font-weight="700">4. 追加發行：</text>
    <text x="120" y="215" fill="#f87171" font-size="15" font-weight="700">變更或發行安排依計畫、契約與主管機關規定</text>

    <text x="25" y="260" fill="#fde68a" font-size="15" font-weight="700">5. 收益分配：</text>
    <text x="120" y="260" fill="#e2e8f0" font-size="14">本金、利益、孳息等依契約約定分配</text>

    <text x="25" y="300" fill="#f87171" font-size="15" font-weight="700">6. 借款限制：</text>
    <text x="120" y="300" fill="#f87171" font-size="14">相關融資限制依不動產證券化法規判斷</text>
  </g>

</svg>