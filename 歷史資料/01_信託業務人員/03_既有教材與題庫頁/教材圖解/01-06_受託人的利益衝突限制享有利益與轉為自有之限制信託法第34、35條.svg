<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="390" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 受託人的利益衝突限制：享有利益與轉為自有之限制 (信託法第 34、35 條)</text>

  <!-- 左卡片: 第34條 -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="400" height="270" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="400" height="42" rx="10" fill="url(#gradBlue)"/>
    <text x="200" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 信託法第 34 條：受託人享有信託利益限制</text>
    
    <text x="25" y="75" fill="#f87171" font-size="15" font-weight="700">❌ 原則：受託人不得享有信託利益！</text>
    <text x="25" y="98" fill="#cbd5e1" font-size="13">避免受託人因管理信託財產而取得不當利益。</text>

    <text x="25" y="145" fill="#34d399" font-size="15" font-weight="700"> 例外許可：共同受益人之一</text>
    <text x="25" y="170" fill="#cbd5e1" font-size="13">受託人「得」為共同受益人之一（如合夥/共同共有）。</text>
    
    <text x="25" y="215" fill="#fbbf24" font-size="14" font-weight="700">⚠ 第 34 條重點：</text>
    <text x="25" y="238" fill="#fca5a5" font-size="13">受託人不得單獨享有全部信託利益</text>
    <text x="25" y="258" fill="#cbd5e1" font-size="12">與他人為共同受益人時，屬法定例外</text>
  </g>

  <!-- 右卡片: 第35條 -->
  <g transform="translate(480, 75)" filter="url(#shadow)">
    <rect width="400" height="270" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="400" height="42" rx="10" fill="url(#gradPurple)"/>
    <text x="200" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 信託法第 35 條：信託財產轉為自有之限制</text>
    
    <text x="25" y="75" fill="#f87171" font-size="15" font-weight="700">❌ 原則：受託人不得將信託財產轉為自有！</text>
    <text x="25" y="98" fill="#cbd5e1" font-size="13">亦不得於信託財產上設定任何抵押或自身權利。</text>

    <text x="25" y="140" fill="#34d399" font-size="15" font-weight="700"> 第 35 條第 1 項三種例外：</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="13">1. 經受益人【書面同意】，且依【公平市價】進行交易</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="13">2. 由【集中交易市場】競價買入有公開市價者</text>
    <text x="25" y="225" fill="#cbd5e1" font-size="13">3. 有不得已事由，經【法院許可】者</text>
    <text x="25" y="255" fill="#a7f3d0" font-size="12">另：繼承、合併等概括承受依第 2 項不適用第 1 項限制</text>
  </g>

</svg>