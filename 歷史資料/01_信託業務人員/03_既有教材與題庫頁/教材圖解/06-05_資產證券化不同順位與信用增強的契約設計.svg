<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 資產證券化：不同順位與信用增強的契約設計</text>

  <g transform="translate(60, 70)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="200" height="75" rx="10" fill="url(#gradEmerald)"/>
    <text x="100" y="45" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">優先順位 Senior</text>
    <text x="220" y="32" fill="#34d399" font-size="15" font-weight="700">依證券化計畫約定較優先的本金／收益分配順位</text>
    <text x="220" y="55" fill="#cbd5e1" font-size="13">信用評等與發行比例並非法律固定，依資產品質、發行條件與評等結果而定</text>
  </g>

  <g transform="translate(60, 155)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="200" height="75" rx="10" fill="url(#gradAmber)"/>
    <text x="100" y="45" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">中順位 Mezzanine</text>
    <text x="220" y="32" fill="#fbbf24" font-size="15" font-weight="700">可依證券化計畫設計介於優先與次順位之間的順位</text>
    <text x="220" y="55" fill="#cbd5e1" font-size="13">報酬、風險、分配順位均以發行條件及契約為準</text>
  </g>

  <g transform="translate(60, 240)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="200" height="75" rx="10" fill="url(#gradRose)"/>
    <text x="100" y="45" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">次順位 Subordinated</text>
    <text x="220" y="32" fill="#f87171" font-size="15" font-weight="700">通常設計為較後順位承擔損失，但比例不是法定固定值</text>
    <text x="220" y="55" fill="#cbd5e1" font-size="13"> 是否由創始機構持有次順位，須看證券化計畫與發行條件，並非一律法定</text>
  </g>

</svg>