<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託股票表決權行使原則（信託業法第 20-1 條）</text>

  <g transform="translate(50, 75)" filter="url(#shadow)">
    <rect width="250" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="35" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">信託契約</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 約定表決權行使方式</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 可設計指示或決策機制</text>
    <text x="20" y="135" fill="#38bdf8" font-size="13"> 先看契約約定</text>
  </g>

  <g transform="translate(340, 75)" filter="url(#shadow)">
    <rect width="240" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="35" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">受託人／信託業</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="13">• 依信託契約約定行使</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 可與其他信託／自有財產</text>
    <text x="20" y="135" fill="#fbbf24" font-size="14" font-weight="700">  分別計算表決權</text>
  </g>

  <g transform="translate(620, 75)" filter="url(#shadow)">
    <rect width="250" height="180" rx="10" fill="#3b0f0f" stroke="#ef4444" stroke-width="2"/>
    <text x="125" y="35" fill="#fca5a5" font-size="16" font-weight="700" text-anchor="middle">表決權判斷</text>
    <text x="20" y="75" fill="#fca5a5" font-size="13">• 不是一律由銀行自由決定</text>
    <text x="20" y="110" fill="#ef4444" font-size="14" font-weight="700">• 也不是一律由持股會代表親投</text>
    <text x="20" y="135" fill="#cbd5e1" font-size="13"> 核心：依信託契約與相關法規辦理</text>
  </g>

  <path d="M 300 150 L 340 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 150 L 620 150" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

</svg>