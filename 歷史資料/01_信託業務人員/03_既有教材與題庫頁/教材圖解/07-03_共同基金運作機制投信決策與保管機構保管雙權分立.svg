<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 共同基金運作機制：投信 (決策) 與保管機構 (保管) 雙權分立</text>

  <g transform="translate(60, 75)" filter="url(#shadow)">
    <rect width="360" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="360" height="42" rx="10" fill="url(#gradBlue)"/>
    <text x="180" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">證券投資信託事業（投信）</text>
    <text x="25" y="75" fill="#60a5fa" font-size="15" font-weight="700">負責基金募集、投資研究與運用決策</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 負責基金募集、投資研究與資產配置</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="13">• 下達買進賣出投資指示</text>
    <text x="25" y="155" fill="#f87171" font-size="13">基金資產與投信、保管機構自有財產分離</text>
  </g>

  <g transform="translate(500, 75)" filter="url(#shadow)">
    <rect width="360" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="360" height="42" rx="10" fill="url(#gradEmerald)"/>
    <text x="180" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">基金保管機構（信託公司／兼營信託銀行）</text>
    <text x="25" y="75" fill="#34d399" font-size="15" font-weight="700">依法律、命令與信託契約獨立保管基金資產</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 按基金帳戶別獨立設帳保管</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="13">• 依投信運用指示辦理保管、處分、收付</text>
    <text x="25" y="155" fill="#fbbf24" font-size="13"> 不要把投信與保管機構職責混為一談</text>
  </g>

  <!-- 中間雙向箭頭防火牆 -->
  <path d="M 420 165 L 500 165" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

</svg>