<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="420" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託財產強制執行判斷流程與三類法定例外 (信託法第 12 條)</text>

  <!-- 決策起點 -->
  <g transform="translate(310, 65)" filter="url(#shadow)">
    <polygon points="150,0 300,45 150,90 0,45" fill="url(#gradBlue)"/>
    <text x="150" y="50" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">債權人聲請法院對信託財產強制執行？</text>
  </g>

  <!-- 原則禁止卡片 (左側) -->
  <g transform="translate(40, 200)" filter="url(#shadow)">
    <rect width="360" height="170" rx="12" fill="#3f1212" stroke="#ef4444" stroke-width="2"/>
    <rect width="360" height="44" rx="12" fill="url(#gradRose)"/>
    <text x="180" y="28" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">❌ 原則：原則不得強制執行！</text>
    
    <text x="20" y="75" fill="#fca5a5" font-size="14" font-weight="600">• 委託人自己的普通債權人：不可查封！</text>
    <text x="20" y="105" fill="#fca5a5" font-size="14" font-weight="600">• 受託人自己的私人債權人：不可查封！</text>
    <text x="20" y="135" fill="#cbd5e1" font-size="13"> 違反規定者，受託人/受益人得提起異議之訴！</text>
  </g>

  <!-- 例外准許卡片 (右側) -->
  <g transform="translate(460, 180)" filter="url(#shadow)">
    <rect width="420" height="210" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <rect width="420" height="44" rx="12" fill="url(#gradEmerald)"/>
    <text x="210" y="28" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 但書例外：以下三種情形得強制執行！</text>
    
    <text x="20" y="75" fill="#a7f3d0" font-size="14" font-weight="700">1. 信託前已存在於該財產之權利</text>
    <text x="35" y="98" fill="#cbd5e1" font-size="13">• 例如：信託前房屋已向銀行設定第一順位抵押權</text>

    <text x="20" y="128" fill="#a7f3d0" font-size="14" font-weight="700">2. 因處理信託事務所生之權利</text>
    <text x="35" y="150" fill="#cbd5e1" font-size="13">• 例如：信託大樓之裝潢修繕工程款、地價稅房屋稅</text>

    <text x="20" y="180" fill="#a7f3d0" font-size="14" font-weight="700">3. 其他法律另有規定</text>
    <text x="35" y="200" fill="#cbd5e1" font-size="13">• 依個別法律規定判斷</text>
  </g>

  <!-- 連線 -->
  <path d="M 310 110 L 220 110 L 220 200" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="150" fill="#f87171" font-size="13" font-weight="700">一般債務</text>

  <path d="M 610 110 L 670 110 L 670 180" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="690" y="150" fill="#34d399" font-size="13" font-weight="700">法定例外</text>

</svg>