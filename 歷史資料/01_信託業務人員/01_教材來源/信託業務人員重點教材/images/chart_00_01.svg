<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託業務人員教材內容地圖</text>
  
  <g transform="translate(335, 70)" filter="url(#shadow)">
    <rect width="250" height="54" rx="10" fill="url(#gradEmerald)"/>
    <text x="125" y="34" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">教材章節與主題</text>
  </g>

  <!-- 三大支柱 -->
  <!-- 支柱 1: 信託法規篇 -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#gradBlue)"/>
    <text x="130" y="32" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 信託法規篇</text>
  </g>
  <g transform="translate(40, 225)" filter="url(#shadow)">
    <rect width="260" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="18" y="32" fill="#60a5fa" font-size="15" font-weight="700">01 信託法基礎精粹</text>
    <text x="18" y="56" fill="#cbd5e1" font-size="13">• 成立要件 / 對抗要件</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="13">• 財產獨立性 / 撤銷權</text>
    
    <text x="18" y="112" fill="#60a5fa" font-size="15" font-weight="700">02 信託業法監理架構</text>
    <text x="18" y="136" fill="#cbd5e1" font-size="13">• 20 億資本 / 賠償準備金</text>
    <text x="18" y="158" fill="#cbd5e1" font-size="13">• 利害關係人交易防火牆</text>

    <text x="18" y="190" fill="#60a5fa" font-size="15" font-weight="700">03 信託稅制</text>
    <text x="18" y="210" fill="#cbd5e1" font-size="13">• 所得稅穿透 / 贈與稅折現</text>
  </g>

  <!-- 支柱 2: 信託實務篇 -->
  <g transform="translate(330, 160)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#gradAmber)"/>
    <text x="130" y="32" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 信託實務篇</text>
  </g>
  <g transform="translate(330, 225)" filter="url(#shadow)">
    <rect width="260" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="32" fill="#fbbf24" font-size="15" font-weight="700">04 金錢信託與集管</text>
    <text x="18" y="56" fill="#cbd5e1" font-size="13">• 特定金錢信託 (代操/基金)</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="13">• 集管帳戶雙十比率</text>
    
    <text x="18" y="112" fill="#fbbf24" font-size="15" font-weight="700">05 證券與員工持股</text>
    <text x="18" y="136" fill="#cbd5e1" font-size="13">• 借券業務 / 股票過戶</text>
    <text x="18" y="158" fill="#cbd5e1" font-size="13">• 員工持股會表決權</text>

    <text x="18" y="190" fill="#fbbf24" font-size="15" font-weight="700">06 不動產與證券化</text>
    <text x="18" y="210" fill="#cbd5e1" font-size="13">• 開發信託 / REITs vs REATs</text>
  </g>

  <!-- 支柱 3: 衝刺速查篇 -->
  <g transform="translate(620, 160)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#gradRose)"/>
    <text x="130" y="32" fill="#fff" font-size="16" font-weight="700" text-anchor="middle"> 速查篇</text>
  </g>
  <g transform="translate(620, 225)" filter="url(#shadow)">
    <rect width="260" height="220" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="18" y="32" fill="#fda4af" font-size="15" font-weight="700">07 公益信託與安養</text>
    <text x="18" y="56" fill="#cbd5e1" font-size="13">• 目的事業主管機關許可</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="13">• 信託監察人「應」設置</text>

    <text x="18" y="125" fill="#fda4af" font-size="15" font-weight="700">08 法規數字與易錯觀念</text>
    <text x="18" y="150" fill="#cbd5e1" font-size="13">• 法定期限、比率與門檻</text>
    <text x="18" y="172" fill="#cbd5e1" font-size="13">• 歷屆題型與答案核對</text>
    <text x="18" y="194" fill="#cbd5e1" font-size="13">• 法規條文與官方來源</text>
  </g>

  <path d="M 460 124 L 460 145 L 170 145 L 170 160" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 124 L 460 160" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M 460 124 L 460 145 L 750 145 L 750 160" stroke="#f43f5e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

</svg>