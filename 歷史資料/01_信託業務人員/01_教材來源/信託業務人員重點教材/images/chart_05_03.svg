<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 有價證券借貸交易 (借券業務) 四方運作與擔保維持率架構</text>

  <g transform="translate(50, 75)" filter="url(#shadow)">
    <rect width="240" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="35" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">委託人 (股票出借方)</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="13">• 出具【借貸同意書】</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="13">• 授權受託銀行出借股票</text>
    <text x="15" y="135" fill="#34d399" font-size="13"> 獲取穩健借券利息收益！</text>
  </g>

  <g transform="translate(340, 75)" filter="url(#shadow)">
    <rect width="240" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="35" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">受託銀行 (借貸中介)</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="13">• 媒合證券交易所借券系統</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="13">• 嚴格控管【擔保維持率 140%】</text>
    <text x="15" y="135" fill="#fbbf24" font-size="13"> 低於 120% 啟動追繳保證金！</text>
  </g>

  <g transform="translate(630, 75)" filter="url(#shadow)">
    <rect width="240" height="180" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="35" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">借券人 (外資/券商)</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="13">• 繳交充足擔保品 (現金/公債)</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="13">• 定期支付借券手續費</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="13">• 到期返還同種類同數量股票</text>
  </g>

  <path d="M 290 145 L 340 145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 145 L 630 145" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

</svg>