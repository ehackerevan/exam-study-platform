<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託所得稅報稅申報與憑單填發關鍵時程 (所得稅法第 6 條之 2、89 條之 1)</text>

  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradBlue)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">1. 所得發生年度</text>
    <text x="25" y="75" fill="#60a5fa" font-size="14" font-weight="700">日常帳務備查</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 受託人設專用帳簿</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="13">• 載明各項收支明細</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="13">• 所得發生即歸屬該年度</text>
    <text x="25" y="195" fill="#fbbf24" font-size="13"> 不論受託人何時實際分配！</text>
  </g>

  <g transform="translate(330, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradAmber)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">2. 次年 1 月底 / 2 月 10 日</text>
    <text x="25" y="75" fill="#fbbf24" font-size="14" font-weight="700">開具憑單向國稅局申報</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 1 月底前：向國稅局申報</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="13">  扣繳或免扣繳憑單</text>
    <text x="25" y="160" fill="#cbd5e1" font-size="13">• 2 月 10 日前：填發憑單</text>
    <text x="25" y="185" fill="#cbd5e1" font-size="13">  送達納稅義務人 (受益人)</text>
    <text x="25" y="210" fill="#fca5a5" font-size="13"> 考題每年必出日期！</text>
  </g>

  <g transform="translate(620, 75)" filter="url(#shadow)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="260" height="42" rx="10" fill="url(#gradEmerald)"/>
    <text x="130" y="27" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">3. 每年 5 月報稅季</text>
    <text x="25" y="75" fill="#34d399" font-size="14" font-weight="700">實質納稅人綜合所得稅</text>
    <text x="25" y="105" fill="#cbd5e1" font-size="13">• 自益信託：由委託人申報</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="13">• 他益信託：由受益人申報</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="13">• 並入個人綜合所得總額</text>
    <text x="25" y="195" fill="#a7f3d0" font-size="13"> 適用個人累進所得稅率</text>
  </g>

  <path d="M 300 190 L 330 190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 590 190 L 620 190" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

</svg>