<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="430" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> REIT 與 REAT：信託目的與受益證券</text>

  <!-- REITs 卡片 -->
  <g transform="translate(40, 70)" filter="url(#shadow)">
    <rect width="400" height="320" rx="14" fill="#0f2942" stroke="#38bdf8" stroke-width="2.5"/>
    <rect width="400" height="56" rx="14" fill="url(#gradBlue)"/>
    <text x="200" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle"> REITs 不動產投資信託</text>
    
    <text x="25" y="90" fill="#7dd3fc" font-size="15" font-weight="700">1. 信託架構：</text>
    <text x="120" y="90" fill="#e2e8f0" font-size="14">募集或私募資金，依契約投資不動產</text>
    
    <text x="25" y="130" fill="#7dd3fc" font-size="15" font-weight="700">2. 主要特徵：</text>
    <text x="120" y="130" fill="#e2e8f0" font-size="14">投資不動產或相關權利，收益依契約分配</text>

    <text x="25" y="170" fill="#7dd3fc" font-size="15" font-weight="700">3. 期限：</text>
    <text x="120" y="170" fill="#e2e8f0" font-size="14">依信託契約及相關法規</text>

    <text x="25" y="215" fill="#38bdf8" font-size="15" font-weight="700">4. 追加規定：</text>
    <text x="120" y="215" fill="#34d399" font-size="15" font-weight="700"> 依法律與契約條件辦理</text>

    <text x="25" y="260" fill="#38bdf8" font-size="15" font-weight="700">5. 收益分配：</text>
    <text x="120" y="260" fill="#fbbf24" font-size="15" font-weight="700"> 每年配息比率應達可分配收益 90% 以上</text>

    <text x="25" y="300" fill="#7dd3fc" font-size="15" font-weight="700">6. 借款限制：</text>
    <text x="120" y="300" fill="#e2e8f0" font-size="14">依信託資產信用評等與法規限制</text>
  </g>

  <!-- REATs 卡片 -->
  <g transform="translate(480, 70)" filter="url(#shadow)">
    <rect width="400" height="320" rx="14" fill="#3d2806" stroke="#fbbf24" stroke-width="2.5"/>
    <rect width="400" height="56" rx="14" fill="url(#gradAmber)"/>
    <text x="200" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle"> REATs 不動產資產信託</text>
    
    <text x="25" y="90" fill="#fde68a" font-size="15" font-weight="700">1. 信託架構：</text>
    <text x="120" y="90" fill="#e2e8f0" font-size="14">委託人將不動產信託予受託機構並發行受益證券</text>
    
    <text x="25" y="130" fill="#fde68a" font-size="15" font-weight="700">2. 主要特徵：</text>
    <text x="120" y="130" fill="#e2e8f0" font-size="14">受益證券權利依分券方式及契約約定</text>

    <text x="25" y="170" fill="#fde68a" font-size="15" font-weight="700">3. 期限：</text>
    <text x="120" y="170" fill="#e2e8f0" font-size="14">期限依信託契約及發行文件</text>

    <text x="25" y="215" fill="#f87171" font-size="15" font-weight="700">4. 追加規定：</text>
    <text x="120" y="215" fill="#f87171" font-size="15" font-weight="700">依法律及契約規定辦理</text>

    <text x="25" y="260" fill="#fde68a" font-size="15" font-weight="700">5. 收益分配：</text>
    <text x="120" y="260" fill="#e2e8f0" font-size="14">收益與本金依契約及受益證券條件分配</text>

    <text x="25" y="300" fill="#f87171" font-size="15" font-weight="700">6. 借款限制：</text>
    <text x="120" y="300" fill="#f87171" font-size="14">借款條件依適用法規及信託契約</text>
  </g>

</svg>