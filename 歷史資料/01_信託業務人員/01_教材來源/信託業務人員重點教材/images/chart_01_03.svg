<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="520" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託財產獨立性：法律原則與界線</text>

  <!-- 中心核心：信託財產防彈衣 -->
  <g transform="translate(300, 180)" filter="url(#shadow)">
    <rect width="320" height="150" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
    <text x="160" y="45" fill="#6ee7b7" font-size="18" font-weight="700" text-anchor="middle">【信託財產】</text>
    <text x="160" y="75" fill="#a7f3d0" font-size="14" font-weight="600" text-anchor="middle">信託財產與自有財產分別管理</text>
    <text x="160" y="105" fill="#d1fae5" font-size="13" text-anchor="middle">• 實質獨立於委託人與受託人</text>
    <text x="160" y="128" fill="#d1fae5" font-size="13" text-anchor="middle">• 信託法第 12 條：原則上不得強制執行</text>
  </g>

  <!-- 左側威脅：委託人欠債破產 -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="35" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">委託人債務與破產</text>
    <text x="105" y="65" fill="#cbd5e1" font-size="12" text-anchor="middle">委託人個人在外欠債破產</text>
    <text x="105" y="90" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle">依法定例外判斷執行範圍。</text>
  </g>

  <!-- 右側威脅：受託人個人身故/倒閉 -->
  <g transform="translate(670, 80)" filter="url(#shadow)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="35" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">受託人死亡或破產時</text>
    <text x="105" y="65" fill="#cbd5e1" font-size="12" text-anchor="middle">不屬遺產、不列破產財團</text>
    <text x="105" y="90" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle">信託財產不列入受託人遺產或破產財團。</text>
  </g>

  <!-- 底部威脅：私人債務抵銷與混同 -->
  <g transform="translate(300, 380)" filter="url(#shadow)">
    <rect width="320" height="90" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="34" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">債務抵銷與混同限制</text>
    <text x="160" y="60" fill="#cbd5e1" font-size="13" text-anchor="middle">受託人個人欠款不得與信託債權抵銷</text>
    <text x="160" y="80" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle">依信託法規定分別處理。</text>
  </g>

  <!-- 阻擋箭頭線條 -->
  <path d="M 250 145 L 300 210" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 670 145 L 620 210" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 460 380 L 460 330" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>

</svg>