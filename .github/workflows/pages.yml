name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build unified study packs
        run: npm run build:ui && npm run validate:offline
      - name: Prepare public site
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/exam-study-platform-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: node .github/scripts/prepare-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/exam-study-platform-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
