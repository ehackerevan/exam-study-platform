    function openImageLightbox(src, caption) {
      currentImgSrc = src;
      const modal = document.getElementById('imageLightboxModal');
      const img = document.getElementById('lightboxImg');
      const titleEl = document.getElementById('lightboxTitle');
      if (!modal || !img) return;

      img.src = src;
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = caption || '檢視大圖';
      const cleanCaption = tempDiv.textContent || tempDiv.innerText || '';
      if (titleEl) {
        titleEl.innerHTML = `<span>🔍 ${cleanCaption}</span>`;
      }
      currentScale = 1.0;
      img.style.transform = 'scale(1.0)';
      modal.classList.add('active', 'open');
    }

    function closeImageLightbox() {
      const modal = document.getElementById('imageLightboxModal');
      const img = document.getElementById('lightboxImg');
      if (modal) modal.classList.remove('active', 'open');
      if (img) img.src = '';
    }

    function zoomLightboxImage(factor) {
      const img = document.getElementById('lightboxImg');
      if (!img) return;
      currentScale = Math.max(0.4, Math.min(4.0, currentScale * factor));
      img.style.transform = `scale(${currentScale})`;
    }

    function resetLightboxImage() {
      const img = document.getElementById('lightboxImg');
      if (!img) return;
      currentScale = 1.0;
      img.style.transform = 'scale(1.0)';
    }

    function openImageInNewTab() {
      if (currentImgSrc) window.open(currentImgSrc, '_blank');
    }

    const zoomImage = zoomLightboxImage;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeImageLightbox();
    });

    const lightboxModal = document.getElementById('imageLightboxModal');
    if (lightboxModal) {
      lightboxModal.addEventListener('click', (e) => {
        if (e.target === lightboxModal || e.target.id === 'lightboxBody') {
          closeImageLightbox();
        }
      });
    }

    // ==================== 章節載入與切換 (極速秒開，無阻礙) ====================
    function loadChapter(index) {
      currentChapterIndex = index;
      const chapter = courseData.chapters[index];

      // 更新麵包屑
      document.getElementById('breadcrumbTitle').innerHTML = `<span>${chapter.icon} ${chapter.title}</span>`;

      // 更新側邊欄
      renderSidebar(document.getElementById('searchInput').value);

      // 渲染 Markdown 教材 (秒級渲染)
      const rawHtml = marked.parse(chapter.markdown);
      const markdownOutput = document.getElementById('markdownOutput');
      markdownOutput.innerHTML = highlightLegalText(rawHtml);
      enhanceResponsiveTables(markdownOutput);

      if (chapter.id !== 'c00') {
        const section = document.createElement('section');
        section.className = 'chapter-high-frequency';
        section.setAttribute('aria-labelledby', `highFrequencyTitle-${chapter.id}`);
        const isNumericReview = chapter.id === 'c08';
        section.innerHTML = `<h2 id="highFrequencyTitle-${chapter.id}">${isNumericReview ? '全題庫高頻數字與期間觀念' : '本章出題率最高的觀念'}｜精選10題</h2><p>依第41至62期出題次數排列觀念，每題旁標示出現次數。</p><div class="chapter-high-frequency-list"></div><p><a href="信託歷屆題庫.html">前往完整歷屆題庫 ↗</a></p>`;
        markdownOutput.appendChild(section);
        renderConceptQuizzes(chapter, section.querySelector('.chapter-high-frequency-list'));
      }

      // 更新考點篩選下拉清單
      updateBankConceptSelect(chapter.id);

      // 延遲按需渲染題庫：只有當前在題庫分頁才重新過濾與渲染，否則不浪費 CPU
      // 專注渲染本章精選 10 題

      // 捲動至頂部
      document.getElementById('contentContainer').scrollTop = 0;

      // 更新底部按鈕
      document.getElementById('prevChapterBtn').style.visibility = index > 0 ? 'visible' : 'hidden';
      document.getElementById('nextChapterBtn').style.visibility = index < courseData.chapters.length - 1 ? 'visible' : 'hidden';
    };

    // ==================== 題目切換 (Tab Switch) ====================
    function switchQuizTab(tab) {
      const qSection = document.getElementById('quizSection');
      if (qSection) qSection.scrollIntoView({ behavior: 'smooth' });
    }

    // ==================== 1. 精選觀念題目渲染 ====================
    function renderConceptQuizzes(chapter, quizList = document.getElementById('quizList')) {
      const quizzes = (window.EXAM_BANK_DATA && window.EXAM_BANK_DATA[chapter.id]) || courseData.quizzes[chapter.id] || [];

      if (!quizzes || quizzes.length === 0) {
        quizList.innerHTML = '<p style="color:var(--text-muted); padding:16px;">本章節為全景導讀與速查單元，請前往其他實務章節演練精選考題。</p>';
        return;
      }

      quizList.innerHTML = '';
      quizzes.forEach((q, qIdx) => {
        const qid = `concept_${chapter.id}_${qIdx}`;
        const savedAns = userAnswers[qid];
        const isAnswered = savedAns !== undefined;
        const correctAns = parseInt(q.answer, 10) + 1;
        const isCorrect = isAnswered && parseInt(savedAns, 10) === correctAns;

        const card = document.createElement('div');
        card.className = 'quiz-card';

        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
          const optNum = optIdx + 1;
          let optCls = '';
          if (isAnswered) {
            if (optNum === correctAns) optCls = 'selected-correct';
            else if (optNum === parseInt(savedAns, 10)) optCls = 'selected-wrong';
          }

          // 清理重複選項前綴
          const cleanOptText = opt.replace(/^\s*[\(（]?[1-4A-Da-d一二三四][\)）\.\s、\-]\s*/, '').trim();

          optionsHtml += `
            <div class="quiz-option ${optCls}" onclick="checkAnswer(this, '${qid}', ${optNum}, ${correctAns}, 'explain_${chapter.id}_${qIdx}')">
              <span style="font-weight:700; width:24px; color:var(--primary);">(${optNum})</span>
              <span>${highlightLegalText(cleanOptText)}</span>
            </div>
          `;
        });

        const termLabel = q.term ? `第 ${q.term} 期 ${q.subject || '實務'} 第 ${q.number} 題` : `高頻精選第 ${qIdx + 1} 題`;

        card.innerHTML = `
          <p class="question-warning">若覺得答案有怪怪的，請一律查資料，我比較懶，用AI整理、檢查幾次就沒再人工審核了</p>
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px;">
            <span class="badge" style="background:var(--primary-light); color:var(--primary); font-size:0.75rem; font-weight:700; padding:2px 8px; border-radius:4px;">
              ${termLabel}
            </span>
            ${q.topic ? `<span class="topic-badge">💡 ${q.topic}</span>` : ''}
            ${q.frequency ? `<span class="topic-badge">📊 ${q.frequencyScope || '本章'} ${q.frequency} 題｜#${q.topicRank}</span>` : ''}
            ${isAnswered ? (isCorrect ? '<span style="color:var(--primary); font-size:0.8rem; font-weight:700;">✅ 已掌握</span>' : '<span style="color:var(--danger); font-size:0.8rem; font-weight:700;">❌ 曾答錯</span>') : ''}
          </div>
          <div class="question-heading">
          <div class="quiz-question" style="font-size:1.02rem; line-height:1.65; margin-bottom:12px; font-weight:600; color:var(--text-main);">
            ${highlightLegalText(q.stem)}
          </div>
            <a class="answer-search" href="https://www.google.com/search?q=${encodeURIComponent(q.stem)}" target="_blank" rel="noopener noreferrer" aria-label="查答案：Google搜尋本題（開啟新分頁）">查答案</a>
          </div>
          <div class="quiz-options">${optionsHtml}</div>
          <div class="quiz-explain ${isAnswered ? 'show' : ''}" id="explain_${chapter.id}_${qIdx}">
            <div style="font-weight:700; font-size:0.95rem; margin-bottom:4px; color:${isCorrect ? 'var(--primary)' : 'var(--danger)'};">
              ${isCorrect ? '🎉 答對了！精準掌握最高頻考點' : `💡 官方公布正確答案：選項 (${correctAns})`}
            </div>
            ${q.note ? `<div style="margin-top:8px; padding:10px 14px; background:var(--bg-tertiary); border-left:3px solid var(--primary); border-radius:4px; font-size:0.88rem; line-height:1.6; color:var(--text-main); white-space:pre-line;">${highlightLegalText(q.note)}</div>` : ''}
          </div>
        `;
        quizList.appendChild(card);
      });
    }

    // 精選觀念題作答檢查
    function checkAnswer(elem, qid, selected, correct, explainId) {
      saveUserAnswer(qid, selected);
      const parent = elem.parentElement;
      const allOptions = parent.querySelectorAll('.quiz-option');
      allOptions.forEach(opt => opt.classList.remove('selected-correct', 'selected-wrong'));

      if (selected === correct) {
        elem.classList.add('selected-correct');
      } else {
        elem.classList.add('selected-wrong');
        if (allOptions[correct - 1]) allOptions[correct - 1].classList.add('selected-correct');
      }

      const explainEl = document.getElementById(explainId);
      if (explainEl) {
        explainEl.classList.add('show');
        const isRight = selected === correct;
        explainEl.innerHTML = `
          <div style="font-weight:700; font-size:0.95rem; margin-bottom:4px; color:${isRight ? 'var(--primary)' : 'var(--danger)'};">
            ${isRight ? '🎉 答對了！掌握核心考點' : `💡 官方公布正確答案為 (${correct})`}
          </div>
        `;
      }
    };

    // ==================== 2. 全真歷屆題庫系統 (極速按需切片與快取) ====================
    function filterBankQuestions() {
      const chapter = courseData.chapters[currentChapterIndex];
      const bankData = window.EXAM_BANK_DATA || courseData.full_bank || {};
      const allItems = bankData[chapter.id] || [];

      const statusEl = document.getElementById('bankStatusText');
      if (allItems.length === 0) {
        if (!window.EXAM_BANK_DATA) {
          if (statusEl) statusEl.innerHTML = '⚡ 歷屆題庫資料載入中，請稍候...';
          setTimeout(filterBankQuestions, 300);
          return;
        }
        if (statusEl) statusEl.textContent = '此單元無單獨歷屆真題。';
        filteredBankQuestions = [];
        renderBankQuestions();
        return;
      }

      const periodVal = document.getElementById('bankPeriodSelect') ? document.getElementById('bankPeriodSelect').value : 'all';
      const onlyWrong = document.getElementById('bankOnlyWrongCheckbox') ? document.getElementById('bankOnlyWrongCheckbox').checked : false;
      const conceptVal = document.getElementById('bankConceptSelect') ? document.getElementById('bankConceptSelect').value : 'ALL';

      filteredBankQuestions = allItems.filter(q => {
        // 期數過濾
        if (periodVal === 'latest') {
          if (q.term < 60) return false;
        } else if (periodVal !== 'all') {
          if (String(q.term) !== periodVal) return false;
        }

        // 73 觀念主題過濾
        if (conceptVal && conceptVal !== 'ALL') {
          if (q.topic !== conceptVal) return false;
        }

        // 僅看錯題
        if (onlyWrong) {
          const qid = `bank_${q.id || (q.term + '_' + q.number)}`;
          const ans = userAnswers[qid];
          if (ans === undefined || Number(ans) === Number(q.answer) + 1) return false;
        }

        return true;
      });

      if (statusEl) {
        statusEl.textContent = `共符合 ${filteredBankQuestions.length} / ${allItems.length} 題`;
      }

      currentBankPage = 0;
      renderBankQuestions();
    };

    function changeBankPage(delta) {
      const totalPages = Math.ceil(filteredBankQuestions.length / BANK_PAGE_SIZE) || 1;
      const newPage = currentBankPage + delta;
      if (newPage >= 0 && newPage < totalPages) {
        currentBankPage = newPage;
        renderBankQuestions();
        const fullBankArea = document.getElementById('fullBankArea');
        if (fullBankArea) fullBankArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    function renderBankQuestions() {
      const container = document.getElementById('bankCardsContainer');
      const pageIndicator = document.getElementById('bankPageIndicator');
      const prevBtn = document.getElementById('bankPrevBtn');
      const nextBtn = document.getElementById('bankNextBtn');

      if (!container) return;

      const totalItems = filteredBankQuestions.length;
      const totalPages = Math.ceil(totalItems / BANK_PAGE_SIZE) || 1;

      if (totalItems === 0) {
        container.innerHTML = '<div style="padding:32px; text-align:center; color:var(--text-muted);">無符合篩選條件的精選真題。</div>';
        if (pageIndicator) pageIndicator.textContent = '第 1 / 1 頁';
        if (prevBtn) prevBtn.disabled = true;
        if (nextBtn) nextBtn.disabled = true;
        return;
      }

      const start = currentBankPage * BANK_PAGE_SIZE;
      const end = Math.min(start + BANK_PAGE_SIZE, totalItems);
      const pageQuestions = filteredBankQuestions.slice(start, end);

      container.innerHTML = '';
      const fragment = document.createDocumentFragment();

      pageQuestions.forEach((q, idx) => {
        const qid = `bank_${q.id || (q.term + '_' + q.number)}`;
        const userAns = userAnswers[qid];
        const isAnswered = userAns !== undefined;
        const correctAns = parseInt(q.answer, 10) + 1;
        const isCorrect = isAnswered && parseInt(userAns, 10) === correctAns;

        const card = document.createElement('div');
        card.className = 'bank-card';

        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
          const optNum = optIdx + 1;
          let optCls = '';
          if (isAnswered) {
            if (optNum === correctAns) optCls = 'selected-correct';
            else if (optNum === parseInt(userAns, 10)) optCls = 'selected-wrong';
          }

          // 清理重複選項前綴
          const cleanOptText = opt.replace(/^\s*[\(（]?[1-4A-Da-d一二三四][\)）\.\s、\-]\s*/, '').trim();

          optionsHtml += `
            <div class="quiz-option ${optCls}" onclick="checkBankAnswer(this, '${qid}', ${optNum}, ${correctAns})">
              <span style="font-weight:700; width:24px; color:var(--primary);">(${optNum})</span>
              <span>${highlightLegalText(cleanOptText)}</span>
            </div>
          `;
        });

        const termLabel = q.term ? `第 ${q.term} 期 ${q.subject || '實務'} 第 ${q.number} 題` : `高頻考題第 ${start + idx + 1} 題`;

        card.innerHTML = `
          <p class="question-warning">若覺得答案有怪怪的，請一律查資料，我比較懶，用AI整理、檢查幾次就沒再人工審核了</p>
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px;">
            <span class="badge" style="background:var(--primary-light); color:var(--primary); font-size:0.75rem; font-weight:700; padding:2px 8px; border-radius:4px;">
              ${termLabel}
            </span>
            ${q.topic ? `<span class="topic-badge">💡 ${q.topic}</span>` : ''}
            ${isAnswered ? (isCorrect ? '<span style="color:var(--primary); font-size:0.8rem; font-weight:700;">✅ 已答對</span>' : '<span style="color:var(--danger); font-size:0.8rem; font-weight:700;">❌ 曾答錯</span>') : ''}
          </div>
          <div class="question-heading">
          <div class="quiz-question" style="font-size:1.02rem; line-height:1.65; margin-bottom:12px; font-weight:600; color:var(--text-main);">
            ${highlightLegalText(q.stem)}
          </div>
            <a class="answer-search" href="https://www.google.com/search?q=${encodeURIComponent(q.stem)}" target="_blank" rel="noopener noreferrer" aria-label="查答案：Google搜尋本題（開啟新分頁）">查答案</a>
          </div>
          <div class="quiz-options">${optionsHtml}</div>
          <div class="quiz-explain ${isAnswered ? 'show' : ''}" id="bank_explain_${qid}">
            <div style="font-weight:700; font-size:0.95rem; margin-bottom:4px; color:${isCorrect ? 'var(--primary)' : 'var(--danger)'};">
              ${isCorrect ? '🎉 答對了！掌握高頻核心' : `💡 官方公布正確答案：選項 (${correctAns})`}
            </div>
            ${q.note ? `<div style="margin-top:8px; padding:10px 14px; background:var(--bg-tertiary); border-left:3px solid var(--primary); border-radius:4px; font-size:0.88rem; line-height:1.6; color:var(--text-main); white-space:pre-line;">${highlightLegalText(q.note)}</div>` : ''}
          </div>
        `;
        fragment.appendChild(card);
      });

      container.appendChild(fragment);

      if (pageIndicator) pageIndicator.textContent = `第 ${currentBankPage + 1} / ${totalPages} 頁`;
      if (prevBtn) prevBtn.disabled = currentBankPage === 0;
      if (nextBtn) nextBtn.disabled = currentBankPage >= totalPages - 1;
    }

    function checkBankAnswer(elem, qid, selected, correct) {
      saveUserAnswer(qid, selected);
      const parent = elem.parentElement;
      const allOptions = parent.querySelectorAll('.quiz-option');
      allOptions.forEach(opt => opt.classList.remove('selected-correct', 'selected-wrong'));

      if (selected === correct) {
        elem.classList.add('selected-correct');
      } else {
        elem.classList.add('selected-wrong');
        if (allOptions[correct - 1]) allOptions[correct - 1].classList.add('selected-correct');
      }

      const explainEl = document.getElementById(`bank_explain_${qid}`);
      if (explainEl) {
        explainEl.classList.add('show');
        if (selected !== correct) {
          explainEl.innerHTML = `<strong>💡 官方公佈答案：選項 (${correct})</strong> ` + (selected === correct ? '<span style="color:var(--primary); margin-left:8px;">(答對了！掌握核心觀念)</span>' : '<span style="color:var(--danger); margin-left:8px;">(答錯了，已自動納入錯題分析)</span>');

        }
      }
    }


    // ==================== 官方法規 Modal 邏輯 ====================
    const lawsModal = document.getElementById('lawsModalOverlay');
    const lawCatSelect = document.getElementById('lawCategorySelect');
    const lawListContainer = document.getElementById('lawArticlesList');

    if (lawCatSelect) {
      lawCatSelect.onchange = () => {
        const key = lawCatSelect.value;
        if (!key || !courseData.laws[key]) {
          lawListContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">請選擇上方條文項目。</p>';
          return;
        }
        const law = courseData.laws[key];
        let html = `<div style="margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">
                      來源機關：<strong>${law.owner}</strong> ｜ 條文數量：${Object.keys(law.articles).length} 條 ｜
                      <a href="${law.url}" target="_blank" rel="noopener" style="color:var(--accent);">全國法規資料庫官方全文 ↗</a>
                    </div>`;
        for (const [artNum, artText] of Object.entries(law.articles)) {
          const parts = artNum.split('-');
          const artTitle = `第 ${parts[0]} 條${parts[1] ? '之 ' + parts[1] : ''}`;
          html += `<div class="law-article-card">
                     <h5>${artTitle}</h5>
                     <p>${highlightLegalText(artText)}</p>
                   </div>`;
        }
        lawListContainer.innerHTML = html;
      };
    }

    // ==================== 73 觀念主題篩選器 ====================
    function updateBankConceptSelect(chapId) {
      const bankConceptSelect = document.getElementById('bankConceptSelect');
      if (!bankConceptSelect) return;
      bankConceptSelect.innerHTML = '<option value="ALL">💡 所有觀念主題 (73大考點)</option>';
      const bankData = window.EXAM_BANK_DATA || courseData.full_bank || {};
      const bankItems = bankData[chapId] || [];
      const topics = {};
      bankItems.forEach(q => {
        if (q.topic) {
          topics[q.topic] = (topics[q.topic] || 0) + 1;
        }
      });
      for (const [top, cnt] of Object.entries(topics)) {
        const opt = document.createElement('option');
        opt.value = top;
        opt.textContent = `${top} (${cnt}題)`;
        bankConceptSelect.appendChild(opt);
      }
    }
    const bankConceptSelectEl = document.getElementById('bankConceptSelect');
    if (bankConceptSelectEl) {
      bankConceptSelectEl.onchange = () => {
        currentBankPage = 0;
        filterBankQuestions();
      };
    }


    // ==================== 上一章 / 下一章底部按鈕事件綁定 ====================
    const prevChapterBtn = document.getElementById('prevChapterBtn');
    if (prevChapterBtn) {
      prevChapterBtn.onclick = () => {
        if (currentChapterIndex > 0) {
          loadChapter(currentChapterIndex - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          const mainContent = document.querySelector('.main-content');
          if (mainContent) mainContent.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
    }
    const nextChapterBtn = document.getElementById('nextChapterBtn');
    if (nextChapterBtn) {
      nextChapterBtn.onclick = () => {
        if (currentChapterIndex < courseData.chapters.length - 1) {
          loadChapter(currentChapterIndex + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          const mainContent = document.querySelector('.main-content');
          if (mainContent) mainContent.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
    }

    // ==================== 行動端底部浮動列互動事件 ====================
    if (document.getElementById('mobileBarMenuBtn')) {
      document.getElementById('mobileBarMenuBtn').onclick = () => toggleSidebar(true);
    }
    if (document.getElementById('mobileBarPrevBtn')) {
      document.getElementById('mobileBarPrevBtn').onclick = () => {
        if (currentChapterIndex > 0) loadChapter(currentChapterIndex - 1);
      };
    }
    if (document.getElementById('mobileBarNextBtn')) {
      document.getElementById('mobileBarNextBtn').onclick = () => {
        if (currentChapterIndex < courseData.chapters.length - 1) loadChapter(currentChapterIndex + 1);
      };
    }
    if (document.getElementById('mobileBarQuizBtn')) {
      document.getElementById('mobileBarQuizBtn').onclick = () => {
        const quizSection = document.getElementById('quizSection');
        if (quizSection) {
          quizSection.scrollIntoView({ behavior: 'smooth' });
          switchQuizTab('bank');
        }
      };
    }
    if (document.getElementById('mobileBarThemeBtn')) {
      if (document.getElementById('mobileBarThemeBtn')) document.getElementById('mobileBarThemeBtn').onclick = () => toggleTheme();
    }
    if (document.getElementById('themeToggleBtn')) {
      document.getElementById('themeToggleBtn').onclick = () => toggleTheme();
    }

    // 初始化啟動
    renderSidebar();

    // 全域函式掛載
    window.loadChapter = loadChapter;
    window.switchQuizTab = switchQuizTab;
    window.filterBankQuestions = filterBankQuestions;
    window.changeBankPage = changeBankPage;
    window.checkAnswer = checkAnswer;
    window.checkBankAnswer = checkBankAnswer;
    window.toggleSidebar = toggleSidebar;
    window.openImageLightbox = openImageLightbox;
    window.closeImageLightbox = closeImageLightbox;
    window.zoomImage = zoomImage;
    window.openImageInNewTab = openImageInNewTab;
    window.zoomLightboxImage = zoomLightboxImage;
    window.resetLightboxImage = resetLightboxImage;

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
    }
    window.toggleTheme = toggleTheme;

    loadChapter(0);
    updateGlobalStats();

</script>
</body>
