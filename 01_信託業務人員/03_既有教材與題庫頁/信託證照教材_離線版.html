  <style>
    :root {
      --font-main: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* 深色模式：夜藍底、天藍主色、琥珀重點 */
      --bg-primary: #111827;
      --bg-secondary: #172033;
      --bg-tertiary: #222d42;
      --bg-card: rgba(30, 41, 59, 0.88);
      --bg-card-hover: #2c3a52;
      --border-color: rgba(148, 163, 184, 0.18);
      --border-highlight: rgba(56, 189, 248, 0.42);

      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-subtle: #94a3b8;

      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-light: rgba(56, 189, 248, 0.14);
      --accent: #fbbf24;
      --accent-light: rgba(251, 191, 36, 0.14);
      --accent-contrast: #172033;
      --warning: #f59e0b;
      --danger: #fb7185;

      --shadow-sm: 0 2px 8px rgba(2, 6, 23, 0.28);
      --shadow-md: 0 8px 24px rgba(2, 6, 23, 0.34);
      --shadow-lg: 0 16px 40px rgba(2, 6, 23, 0.46);

      --sidebar-width: 320px;
      --topbar-height: 64px;
    }

    [data-theme="light"] {
      --bg-primary: #f5f7fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #eef2f7;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border-color: #d9e2ec;
      --border-highlight: rgba(2, 132, 199, 0.38);

      --text-main: #172033;
      --text-muted: #526174;
      --text-subtle: #8291a7;

      --primary: #0369a1;
      --primary-hover: #075985;
      --primary-light: #e0f2fe;
      --accent: #b45309;
      --accent-light: #fff7ed;
      --accent-contrast: #ffffff;
      --warning: #d97706;
      --danger: #dc2626;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-subtle);
    }

    /* ==================== 法規語意色彩引擎 (Legal Syntax Highlighting) ==================== */
    .legal-word {
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1.25;
    }

    /* 禁止詞 (Red) */
    .legal-ban {
      color: #f87171;
      background: rgba(239, 68, 68, 0.14);
      border-bottom: 2px solid #ef4444;
    }
    [data-theme="light"] .legal-ban {
      color: #dc2626;
      background: rgba(239, 68, 68, 0.12);
      border-bottom: 2px solid #dc2626;
    }

    /* 義務詞 (Blue) */
    .legal-duty {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.14);
      border-bottom: 2px solid #3b82f6;
    }
    [data-theme="light"] .legal-duty {
      color: #2563eb;
      background: rgba(59, 130, 246, 0.12);
      border-bottom: 2px solid #2563eb;
    }

    /* 裁量詞 (Purple) */
    .legal-allow {
      color: #c084fc;
      background: rgba(168, 85, 247, 0.14);
      border-bottom: 1.5px dashed #a855f7;
    }
    [data-theme="light"] .legal-allow {
      color: #9333ea;
      background: rgba(168, 85, 247, 0.12);
      border-bottom: 1.5px dashed #9333ea;
    }

    /* 條件但書 (Amber) */
    .legal-condition {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.14);
      border-bottom: 1.5px solid #f59e0b;
    }
    [data-theme="light"] .legal-condition {
      color: #d97706;
      background: rgba(245, 158, 11, 0.12);
      border-bottom: 1.5px solid #d97706;
    }

    /* 時間期限 (Cyan) */
    .legal-time {
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.16);
      border-bottom: 2px double #06b6d4;
      text-shadow: 0 0 6px rgba(34, 211, 238, 0.3);
    }
    [data-theme="light"] .legal-time {
      color: #0891b2;
      background: rgba(6, 182, 212, 0.12);
      border-bottom: 2px double #0891b2;
      text-shadow: none;
    }

    /* ==================== 官方條文卡片 (Law Card Details) ==================== */
    .law-card {
      margin: 24px 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .law-card summary {
      padding: 14px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      transition: background 0.2s;
    }
    .law-card summary:hover {
      background: var(--bg-card-hover);
    }
    .law-card-content {
      padding: 16px 20px;
      font-size: 0.92rem;
      line-height: 1.8;
      border-top: 1px solid var(--border-color);
    }
    .law-card-content p {
      margin-bottom: 12px;
    }
    .law-card-content p:last-child {
      margin-bottom: 0;
    }

    /* Layout Containers */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Top Bar */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      font-size: 1.25rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 本機進度狀態 Badge */
    .progress-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .btn-action {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-action.highlight {
      background: linear-gradient(135deg, var(--accent), var(--warning));
      color: var(--accent-contrast);
      border: none;
    }

    .btn-icon {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Sidebar Content */
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px 10px 34px;
      min-height: 44px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 0.9rem;
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      min-height: 48px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      margin-bottom: 4px;
      position: relative;
    }
    .menu-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-main);
    }
    .menu-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    .menu-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .menu-item-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .menu-item-info {
      flex: 1;
      min-width: 0;
    }

    .menu-item-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .menu-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-subtle);
    }

    /* Content Area */
    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .article-wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Markdown Styling */
    .markdown-body {
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .markdown-body h1 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .markdown-body h2 {
      font-size: 1.55rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .markdown-body h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1.2em;
      background: var(--primary);
      border-radius: 2px;
    }

    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 18px;
    }

    .markdown-body a {
      color: var(--primary);
      font-weight: 600;
      text-decoration-color: color-mix(in srgb, var(--primary) 45%, transparent);
      text-underline-offset: 3px;
    }
    .markdown-body a:hover {
      color: var(--primary-hover);
      text-decoration-thickness: 2px;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border-radius: 0 8px 8px 0;
      margin: 24px 0;
      color: var(--text-muted);
    }
    .markdown-body blockquote strong {
      color: var(--text-main);
    }

    /* ==================== 響應式表格：桌機表格 / 平板換行 / 手機卡片 ==================== */
    .table-scroll-wrapper {
      position: relative;
      width: 100%;
      margin: 1.5rem 0;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-scroll-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 14px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .table-mode-note {
      color: var(--text-muted);
      font-weight: 500;
      text-align: right;
    }

    .table-scroll-inner {
      width: 100%;
      overflow: visible;
      display: block;
    }

    .markdown-body table,
    .table-scroll-inner table {
      width: 100% !important;
      min-width: 0 !important;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.9rem;
      table-layout: auto;
    }

    .markdown-body th,
    .table-scroll-inner th {
      background: var(--bg-tertiary);
      color: var(--text-main);
      font-weight: 700;
      text-align: left;
      padding: 11px 14px;
      border-bottom: 2px solid var(--border-highlight);
      border-right: 1px solid var(--border-color);
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .markdown-body td,
    .table-scroll-inner td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--text-muted);
      vertical-align: top;
      line-height: 1.6;
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: anywhere !important;
    }

    .markdown-body th:last-child,
    .table-scroll-inner th:last-child,
    .markdown-body td:last-child,
    .table-scroll-inner td:last-child {
      border-right: none;
    }

    .markdown-body tr:last-child td,
    .table-scroll-inner tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:hover td,
    .table-scroll-inner tr:hover td {
      background: var(--primary-light);
    }

    /* 平板：保留表格，但固定欄寬並允許標題、內容自然換行。 */
    @media (max-width: 900px) and (min-width: 641px) {
      .table-scroll-inner {
        overflow: visible !important;
      }

      .markdown-body table,
      .table-scroll-inner table {
        table-layout: fixed !important;
        width: 100% !important;
      }

      .markdown-body th,
      .table-scroll-inner th,
      .markdown-body td,
      .table-scroll-inner td {
        padding: 9px 10px;
        font-size: 0.84rem;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
      }

      .table-mode-note {
        max-width: 52%;
      }
    }

    /* 手機：每一列自動轉成卡片，完全不需要左右滑動。 */
    @media (max-width: 640px) {
      .table-scroll-wrapper {
        border: none;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }

      .table-scroll-hint {
        border: 1px solid var(--border-color);
        border-radius: 9px;
        margin-bottom: 10px;
        padding: 8px 10px;
      }

      .table-mode-note {
        display: none;
      }

      .table-scroll-inner {
        overflow: visible !important;
        width: 100%;
      }

      .table-scroll-inner table,
      .markdown-body .table-scroll-inner table {
        display: block;
        width: 100% !important;
        min-width: 0 !important;
        table-layout: auto !important;
        background: transparent;
      }

      .table-scroll-inner thead {
        display: none;
      }

      .table-scroll-inner tbody {
        display: block;
        width: 100%;
      }

      .table-scroll-inner tbody tr {
        display: block;
        width: 100%;
        margin: 0 0 12px;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg-card);
        box-shadow: var(--shadow-sm);
      }

      .table-scroll-inner tbody td {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border-right: none !important;
        border-bottom: 1px solid var(--border-color);
        padding: 10px 12px;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--text-main);
        background: transparent;
      }

      .table-scroll-inner tbody td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 4px;
        color: var(--text-subtle);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .table-scroll-inner tbody td:first-child {
        color: var(--primary);
        font-size: 1.02rem;
        font-weight: 800;
        background: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-highlight);
      }

      .table-scroll-inner tbody td:first-child::before {
        display: none;
      }

      .table-scroll-inner tbody td:last-child {
        border-bottom: none;
      }

      .table-scroll-inner tbody tr:hover td {
        background: transparent;
      }

      .table-scroll-inner tbody tr:hover td:first-child {
        background: var(--bg-tertiary);
      }
    }

    .markdown-body strong {
      color: var(--primary);
      font-weight: 600;
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border-color);
      margin: 36px 0;
    }

    /* 內頁導覽卡片連結 */
    .chapter-card-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .chapter-card-link:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* ==================== 向量圖檔容器 (SVG Figure) ==================== */
    .diagram-figure {
      margin: 32px 0;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .diagram-figure:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 36px rgba(16, 185, 129, 0.15);
    }

    .diagram-figure-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
    }

    .diagram-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .diagram-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-lightbox-trigger {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      min-height: 38px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-lightbox-trigger:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .diagram-img-container {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1120;
      cursor: zoom-in;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .zoomable-svg {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      transition: transform 0.2s ease;
    }

    .diagram-caption {
      text-align: center;
      padding: 8px 16px;
      font-size: 0.82rem;
      color: var(--text-subtle);
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ==================== 題庫系統雙軌切換架構 ==================== */
    .quiz-section {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 2px dashed var(--border-color);
    }

    .quiz-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .quiz-tab-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .quiz-tab-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 全真題庫工具列 */
    .bank-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .bank-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .bank-select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      min-height: 40px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }

    .bank-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
      user-select: none;
    }
    .bank-checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .bank-status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .chapter-high-frequency { margin-top: 28px; padding-top: 20px; border-top: 2px solid var(--border-color); }
    .chapter-high-frequency > p { color: var(--text-muted); }
    .chapter-high-frequency-list { margin-top: 16px; }

    /* 題目卡片 */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .quiz-meta {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quiz-question {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      min-height: 48px;
      font-size: 0.95rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      line-height: 1.5;
    }
    .quiz-option:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--primary);
    }

    .quiz-option.selected-correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }
    .quiz-option.selected-wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .quiz-explain {
      margin-top: 14px;
      padding: 14px 18px;
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-main);
      display: none;
    }
    .quiz-explain.show {
      display: block;
    }

    /* 分頁按鈕列 */
    .bank-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-page {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Bottom Navigation */
    .bottom-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--text-main);

  --text-main: var(--site-ink);

  <script>

const courseData = {"chapters":[{"id":"c00","filename":"00_信託證照攻略與全景導讀.md","title":"全景導讀","icon":"00","badge":"導讀","weight":"教材使用方式","markdown":"# 信託業務人員重點教材\n\n本教材整理信託法制、業務監理、稅制與常見信託型態。法規數字會隨修法調整，現行規定查核至 2026 年 10 月 17 日；歷屆題目應依題目所屬年度判讀。\n\n## 章節\n\n- 第 01 章：信託法與信託財產\n- 第 02 章：信託業法與監理\n- 第 03 章：信託稅制\n- 第 04 章：金錢信託與集合管理\n- 第 05 章：有價證券信託與員工福利信託\n- 第 06 章：不動產信託與資產證券化\n- 第 07 章：公益信託與特殊形態信託\n- 第 08 章：法規數字與易錯觀念\n\n## 官方資料\n\n- [信託法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024)、[信託業法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027)、[信託業法施行細則](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310028)、[信託業設立標準](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310029)\n- [所得稅法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003)、[遺產及贈與稅法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072)、[土地稅法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096)\n- [信託資金集合管理運用管理辦法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310034)、[流動性資產範圍及比率準則](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310040)\n- [不動產證券化條例](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380169)、[金融資產證券化條例](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380122)、[證券投資信託基金管理辦法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400082)\n- [金管會信託業賠償準備金公告](https://law.fsc.gov.tw/LawContent.aspx?id=FE220606)\n"},{"id":"c01","filename":"01_信託法規精粹_生活圖解篇.md","title":"信託法與信託財產","icon":"01","badge":"第 01 章","weight":"45% 信託法規","markdown":"# 第 01 章：信託法基礎與信託財產獨立性（生活圖解篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n本章整理信託財產獨立性（第 12 條）、登記對抗要件（第 4 條）、詐害信託撤銷權（第 6 條）與受託人義務（第 22 至 35 條），並以情境說明法律原則與例外。\n\n![ 信託基本三面關係與法定架構](images/chart_01_01.svg)\n\n---\n\n##  一、信託的本質與生活化白話比喻\n\n### 1. 什麼是信託？（信託法第 1 條）\n> **法條原意**：稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。\n\n*   **高傳真金融實務情境（高齡安養與二代教育金傳承信託）**：\n    王老先生（**委託人**）將 1,000 萬元資金信託移轉予臺灣銀行信託部（**受託人**），簽訂信託契約，約定受託銀行每月撥付 3 萬元作為王老先生的生活安養費（**自益信託部分**），並約定在孫子小明考上大學後，每學期撥付 10 萬元學雜費與留學基金（**他益信託部分**）。\n    *   ① **財產權實質移轉**：1,000 萬元所有權名義已合法移轉至臺銀信託專戶，信託財產原則上與受託人自有財產區隔；強制執行仍須檢視信託法第 12 條但書及其他法律規定；\n    *   ② **分別管理義務**：臺銀必須將這筆資金與自有營運資產嚴格分帳、獨立列管；\n    *   ③ **贈與稅申報**：孫子小明享有學費給付之權利；若該安排依《遺產及贈與稅法》第 5 條之 1 發生應課贈與稅情形，委託人依第 24 條之 1 及第 24 條辦理，申報期限為 30 日。\n*   **四大核心構成要件**：\n    1.  **委託人必須把「財產權移轉或處分」給受託人**：受託人必須取得外觀上的所有權或名義，若只是口頭委託代跑腿、財產沒有過戶或移轉，僅是民法上的「委任」，而不是信託！\n    2.  **必須有「信託目的」**：目的必須合法、可能、確定，且不能違反公共秩序與善良風俗。\n    3.  **受託人是「為受益人利益」或「特定目的」而管理**：不是為受託人自己賺錢。\n    4.  **信託財產必須具體確定**：不能是抽象概念（例如不能以「未來可能發生的好運」為信託財產）。\n\n---\n\n##  二、信託的分類：圖表對照\n\n![ 信託三大核心法定分類架構](images/chart_01_02.svg)\n\n> ** 考古題易錯觀念（何者錯誤）**：\n> *   **陷阱 1**：自然人得否以「宣言信託」設立信託？\n>     *    **錯誤**！台灣《信託法》第 71 條規定，只有**法人**為增進公共利益，經主管機關許可，得以宣言信託成立公益信託。**自然人不可用宣言信託**！\n> *   **陷阱 2**：法定信託在台灣存在嗎？\n>     *    **非基於法律行為**！台灣信託法採設立信託主義（契約、遺囑、宣言），「法定信託」非由當事人之設立行為成立，為英美法系產物，非我國信託法規定之設立型態。\n\n---\n\n##  三、信託財產的獨立性（防彈衣理論）\n\n信託財產名義上雖然移轉到了受託人名下，但它既不是委託人的私產，也不是受託人的遺產，法律為它套上了一層**不可穿透的「防彈衣（防火牆）」**！\n\n![信託財產獨立性的原則與界線](images/chart_01_03.svg)\n\n### 1. 信託財產獨立性的主要規定（信託法第 9 至 14 條）\n1. **物上代位（第 9 條）**：信託財產因管理、處分、滅失或毀損取得的財產權，仍屬信託財產。財產形態改變不影響其信託財產性質；能否強制執行仍須依第 12 條判斷。\n2. **不屬受託人遺產（第 10 條）**：受託人死亡時，信託財產不列入其遺產。\n3. **不屬受託人破產財團（第 11 條）**：受託人破產時，信託財產不列入其破產財團。\n4. **強制執行限制（第 12 條）**：原則不得對信託財產強制執行；信託前已存在於該財產的權利、處理信託事務所生權利或其他法律另有規定者除外。\n5. **禁止抵銷（第 13 條）**：屬於信託財產的債權，不得與受託人個人債務抵銷。\n\n---\n\n### 🚨 2. 信託財產不得強制執行的三類法定例外\n\n信託法第 12 條第 1 項但書列出信託財產得強制執行的例外，應連同條文本文一起理解。\n\n![ 信託財產強制執行判斷流程與三類法定例外](images/chart_01_04.svg)\n\n> **審題提示**：\n> *   委託人的普通債權人拿本票裁定，要去查封信託財產？ ❌ **原則不得執行；仍須檢視第 12 條但書及其他法律規定。**\n> *   銀行在房子信託前，就已經設定了第一順位最高限額抵押權，委託人違約不繳房貸，銀行可否拍賣信託房屋？  **可以！此為「信託前已存在之權利」！**\n> *   受託人請水電師傅修繕信託的公寓水管，修繕完畢積欠工程款 10 萬元，水電師傅可否向法院聲請對信託公寓強制執行？  **可以！此為「因處理信託事務所生之權利」！**\n\n---\n\n##  四、信託公示制度：對抗要件（信託法第 4 條）\n\n信託不是兩個人在抽屜裡偷偷簽約就能對抗全世界，必須「公示」，不然第三人根本不知道財產已經信託！\n\n| 財產類型 | 公示與生效規定 | 未登記之法律效果 |\n| :--- | :--- | :--- |\n| **應登記之財產權**<br/>（如：土地、房屋、船舶、航空器、商標權、專利權） | 向地政機關或主管機關辦妥**信託登記** | 信託登記是對抗第三人的要件，不是信託契約的成立要件；未登記時，可能無法以信託關係對抗第三人。 |\n| **有價證券（股票、債券）** | 1. 記名股票：於證券上**載明為信託財產**（背書加註）<br/>2. 向發行公司**通知並為信託登記**（過戶備查） | **非經背書載明並通知公司登記，不得對抗發行公司及第三人** |\n\n> ** 實務精選案例【精華地漏辦信託專簿登記之對抗風險】**：\n> 陳董將名下一筆市價 5,000 萬元的精華土地信託移轉給好友張三管理，契約完全合法，但在地政事務所僅辦妥「所有權移轉登記」，卻漏未辦理「信託登記（未載明為信託財產及信託專簿）」：\n> ① **委託人與受託人間**：信託契約效力與財產權移轉登記應分別判斷。\n> ② **對外關係**：未辦妥信託登記時，不得以信託關係對抗第三人；個案執行效果仍依相關法規及事實判斷。\n\n> ** 考古題常見陷阱（第 41 期第 1 題情境）**：\n> *   題目：「以股票為信託者，通知發行公司即可對抗第三人？」\n> *    **錯！** 必須「載明於證券（股票背書）」**且**「通知公司登記」，兩道手續缺一不可，僅通知公司無效！\n\n---\n\n##  五、脫產防線：詐害信託與撤銷權（信託法第 6 條、第 7 條）\n\n【建商欠款脫產信託與除斥期間之防禦】\n包商黃董積欠下游材料商林老闆 3,000 萬元工程款，為免豪宅被查封，將名下價值 4,000 萬元的豪宅信託登記給不知情的胞弟作為子女教育基金：\n① **有害及債權**：黃董信託行為導致其剩餘資產不足清償債務，構成有害及債權；\n② **法院撤銷及受益人保護**：債權人得依第 6 條聲請法院撤銷有害債權的信託行為；受益人已取得的利益是否受影響，另依第 6 條第 2 項判斷，不概括以受益人是否知情作唯一結論。\n③ **嚴格除斥期間**：林老闆必須在「自知有撤銷原因起 1 年內」，或「自信託行為成立日起 10 年內」，向民事法院提起撤銷訴訟；逾期則撤銷權消滅！\n\n![ 詐害信託撤銷權判定流程與除斥期間](images/chart_01_05.svg)\n\n### 1. 撤銷的法定條件\n1.  **有害於債權人**：信託行為發生時，委託人之資產已經不足以清償所有既有債務（害及資力）。\n2. **受託人知情不是第 6 條所列的撤銷要件**：債權人仍須證明信託行為有害其債權，並向法院聲請撤銷。\n3.  **法定推定有害（第 6 條第 2 項）**：信託成立後 **6 個月內**，委託人被宣告破產者，**法律直接推定該信託行為有害於債權**！\n\n### 2. 撤銷權的除斥期間（時效重點數字！）\n*   **短期間**：自債權人**知有撤銷原因起，1 年間**不行使而消滅。\n*   **長期間**：自信託行為**成立日起，逾 10 年**不行使而消滅。\n\n---\n\n##  六、受託人的權利、義務與利益衝突迴避\n\n受託人掌管他人龐大身家，法規對其設定了極高的誠信標準：\n\n### 1. 受託人的主要義務\n1.  **善良管理人之注意義務（信託法第 22 條）**：\n    受託人應依信託本旨，以善良管理人之注意，處理信託事務。即使是**無償受託人**（沒收任何手續費或報酬），一樣要負**善良管理人**的高規格注意標準！（民法無償委任通常僅負與處理自己事務為同一之注意，但信託法標準更高！）。\n2.  **親自處理義務（第 25 條）**：\n    受託人原則上**應親自處理信託事務**。\n    *   **例外**：信託行為另有訂定，或有不得已事由時，得使第三人代為處理；受託人並依信託法第 26、27 條負相關責任。\n3. **分別管理義務（第 24 條）**：受託人應將信託財產與自有財產分別管理；不同信託的信託財產原則上分別管理，但信託行為另有約定時，依其約定。\n\n---\n\n### 2. 受託人享有利益與轉為自有之限制（信託法第 34、35 條）\n\n![ 受託人防弊規範：享有利益與轉為自有之限制](images/chart_01_06.svg)\n\n> **法條辨析**：\n> *   問：受託人可否同時為該信託之唯一受益人？\n>     *    信託法第 34 條規定，受託人不得享有信託利益，但與他人共同為受益人時例外；不得將該例外擴張成受託人可單獨享有全部利益。\n> *   問：受託人看中信託財產中的不動產或名車，想將信託財產轉為自有財產（自易交易），法律如何規範？\n    *    **原則不得為之。** 第 35 條列有三種例外：① 經受益人書面同意並依市價取得；② 由集中市場競價取得；③ 有不得已事由經法院許可。\n>     *    必須取得**受益人之書面同意**，並且要以**公平市價**承購！\n\n---\n\n##  七、信託之消滅與賸餘財產歸屬（信託法第 62~65 條）\n\n信託關係因為信託目的已完成、不能完成、期限屆滿、或終止而消滅時，剩下的財產該給誰？\n\n![信託關係消滅時信託財產的歸屬順序](images/chart_01_07.svg)\n\n> **信託法第 65 條**：信託行為另有約定時依約定；沒有約定時，先歸屬於享有全部信託利益的受益人，再由委託人或其繼承人承受。\n\n\n---\n\n##  法規原文對照庫\n<details class=\"law-card\">\n  <summary> 查閱中華民國《信託法》關鍵法定條文原文</summary>\n  <div class=\"law-card-content\">\n    <p><strong>第 1 條（信託定義）</strong>：稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。</p>\n    <p><strong>第 4 條（公示與對抗要件）</strong>：以應登記或註冊之財產權為信託者，非經信託登記，不得對抗第三人。以有價證券為信託者，非依目的事業主管機關規定於證券上或其他表彰權利之文件上載明為信託財產，不得對抗第三人。</p>\n    <p><strong>第 6 條（詐害信託撤銷權）</strong>：信託行為有害於委託人之債權人權利者，債權人得聲請法院撤銷之。信託成立後 6 個月內委託人破產者，推定其有害於債權。</p>\n    <p><strong>第 7 條（撤銷權除斥期間）</strong>：前條撤銷權，自債權人知有撤銷原因時起，1 年間不行使而消滅。自信託行為成立時起，逾 10 年者，亦同。</p>\n    <p><strong>第 12 條（強制執行禁止與例外）</strong>：對信託財產不得強制執行。但基於信託前已存在於該財產之權利、因處理信託事務所生之權利或其他法律有特別規定者，不在此限。</p>\n    <p><strong>第 34 條（受託人利益限制）</strong>：受託人不得以任何名義，享有信託利益。但與他人為共同受益人時，不在此限。</p>\n    <p><strong>第 35 條（轉為自有之限制）</strong>：受託人除有下列各款情形之一外，不得將信託財產轉為自有財產，或於該信託財產上設定或取得權利：一、經受益人書面同意，並依市價為之者。二、由集中市場競價取得者。三、有不得已事由經法院許可者。</p>\n  </div>\n</details>\n"},{"id":"c02","filename":"02_信託業法與監理架構_圖解篇.md","title":"信託業法與監理","icon":"02","badge":"第 02 章","weight":"38% 信託業法","markdown":"# 第 02 章：信託業法與金融監理架構（圖解篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n《信託業法》規範信託業的業務範圍、治理與監理。本章依現行法條整理設立條件、利害關係人交易及監理責任。\n本章整理信託業設立條件、利害關係人交易規範及監理責任。\n\n![ 信託業法金融監理金字塔與四大防線](images/chart_02_01.svg)\n\n---\n\n##  一、信託業的誕生：設立門檻與三道資金防線\n\n要開辦信託業務，法律採「特許營業許可制與業務分別核定原則」：\n① **分別核定原則**：信託業法第 16 條之信託業務與第 17 條之附屬業務，主管機關（金管會）必須「分別核定」，嚴禁概括核定；涉及外匯業務者另須經中央銀行許可。\n② **禁止承諾本金或最低收益率（第 31 條）**：信託業不得承諾擔保本金或最低收益率；商品發行機構的條件與受託銀行的責任，應依契約及相關法令判斷。\n\n![ 信託業三大法定資金防線與受償優先權](images/chart_02_02.svg)\n\n### 1. 信託業資本額與賠償準備金\n\n| 項目 | 法定金額 / 比率 | 繳存地點 / 形式 | 主要功能與受償權利 |\n| :--- | :--- | :--- | :--- |\n| **最低實收資本額** | 一般信託公司 **20 億元**；僅辦理不動產投資信託 **10 億元**、僅辦理不動產資產信託 **3 億元**、兩類均辦理 **10 億元** | 信託公司設立門檻；依業務範圍適用不同標準 | 依《信託業設立標準》第 3 條判讀 |\n| **營業保證金** | 《信託業法》未設一般信託業者繳存資本額 5% 營業保證金之規定 | 原表列此項混淆其他金融業務之保證金 | 不應與信託業賠償準備金混為一談 |\n| **賠償準備金**<br/>（信託業法第 34 條） | **最低 5,000 萬元**<br/>（並依受託總額千分之一或萬分之一累計） | 取得執照後 **1 個月內**<br/>以**現金或政府公債**繳存**中央銀行** | **專門擔保受託人違法疏失**。<br/> **委託人或受益人依法就賠償準備金有優先受償權！** |\n\n> ** 考古題易錯觀念（何者錯誤）**：\n> *   **陷阱 1**：賠償準備金繳存於財政部？ ❌ **錯誤！是繳存「中央銀行」！**\n> *   **陷阱 2**：賠償準備金得以股票或不動產繳存？ ❌ **錯誤！限以「現金」或「政府債券」繳存！**\n> *   **陷阱 3**：賠償準備金是一般債權人的擔保？ ❌ **錯誤！法律明定由「委託人或受益人」享有優先受償之權！**\n> *   **陷阱 4**：兼營信託業務之投信或證券商，其營業保證金不得充當賠償準備金？ ❌ **錯誤！兼營機構以現金或公債繳存之保證金，「得充當」信託業賠償準備金！**\n\n---\n\n##  二、信託業法第 25 條與第 27 條利害關係交易限制\n\n第 25 條列出信託業以信託財產進行利害關係交易的禁止事項及法定例外；第 27 條規範特定銀行業務及其他交易的事前約定或告知同意程序。\n\n![ 信託業法第 25 條與第 27 條利害關係交易限制](images/chart_02_03.svg)\n\n### 1. 信託業的「利害關係人」是誰？（信託業法第 7 條）\n記憶關鍵數字：**「持股 5%」與「持股 10%」**！\n*   持有信託公司股份總額 **5% 以上**之股東。\n*   信託業負責人（董、監、總經理）。\n*   信託業負責人獨資、合夥，或持股超過 **10%** 之企業。\n*   信託公司持股超過 **5%** 之轉投資企業。\n*   對信託財產具有**運用決定權之人**。\n\n### 2. 第 25 條與第 27 條交易規範對照\n\n| 比較維度 | 第 25 條（禁止事項與法定例外） | 第 27 條（事前約定或告知同意） |\n| :--- | :--- | :--- |\n| **規範內容** | 限制信託業以信託財產購買本身或利害關係人發行、承銷的證券、購買其財產或讓售財產予其本身或利害關係人。 | 限制信託業辦理特定銀行業務、外匯交易及第 25 條以外的利害關係交易。 |\n| **範圍** | 購買本身或利害關係人發行／承銷的有價證券或票券；購買其財產；讓售信託財產予其本身或利害關係人；主管機關另定事項。 | 購買銀行部門經紀的證券或票券；於本身銀行部門或利害關係人處存款或辦理外匯交易；其他第 25 條以外交易。 |\n| **例外或程序** | 信託財產不具運用決定權者不受第 1 項限制，但須充分告知；政府發行債券亦有法定例外。受益人書面同意本身不是例外。 | 依信託契約約定，或事先告知受益人並取得書面同意；不以董事會重度決議為第 27 條明文要件。 |\n\n---\n\n##  三、公司治理：信託財產評審委員會\n\n信託業管理這麼多龐大資產，資產到底值多少錢？有沒有跌價風險？需要專門委員會審核：\n\n![ 信託財產評審委員會開會週期與職權規範](images/chart_02_04.svg)\n\n*   **評審週期**：每三個月至少一次。\n*   **職責**：審查受託財產之評審原則、公允價格認定及後續風險控管，並將結果提報董事會。\n\n### 2. 信託業法定定期報告與會計師查核層級（核心觀念！）\n*   **每三個月至少一次**：評審信託財產並報告董事會。\n*   **每半營業年度終了後 2 個月內**：報送經會計師「核閱」之財務報告。\n*   **每營業年度終了後 4 個月內**：報送經會計師「查核簽證」之營業報告書、資產負債表、財產目錄及損益表，並辦理公告。\n\n---\n\n##  四、監理處分與罰則體系\n\n信託業違反法令或章程，或有損害受益人權益之虞時，主管機關得依法採取監理措施。\n\n![ 金管會對違法信託業之行政處分階梯](images/chart_02_05.svg)\n\n> ** 歷屆經典試題（解任董監職務）**：\n> *   題目：信託業董事或監察人違反法令時，信託業商業同業公會得否直接解除其職務？\n> *    **錯！** 同業公會無此行政權力，**只有主管機關（金管會）**有權命令解除其董監職務！\n\n\n---\n\n##  法規原文對照庫\n<details class=\"law-card\">\n  <summary> 查閱中華民國《信託業法》關鍵法定條文原文</summary>\n  <div class=\"law-card-content\">\n    <p><strong>第 10 條（設立資本額）</strong>：信託業之最低實收資本額，由主管機關審酌經濟情勢定之（一般信託公司為新臺幣 20 億元；不動產專營公司依業務類型適用不同門檻）。發起人應於發起時一次全額認足。</p>\n    <p><strong>第 25 條（特定利害關係交易限制）</strong>：信託業不得以信託財產進行條文列舉的交易；信託財產不具運用決定權或標的為政府發行債券時，依條文有例外，且須履行告知義務。</p>\n    <p><strong>第 27 條（特定銀行業務及其他交易）</strong>：對條文列舉的證券、存款、外匯及其他交易，除依信託契約約定，或事先告知受益人並取得書面同意外，不得辦理；信託財產不具運用決定權時另有法定例外。</p>\n    <p><strong>第 34 條（賠償準備金）</strong>：信託業應於取得營業執照後 1 個月內，以現金或政府公債繳存中央銀行作為賠償準備金。委託人或受益人就該賠償準備金有優先受償之權。</p>\n    <p><strong>第 44 條（主管機關處分權限）</strong>：信託業違反法令或章程時，主管機關得為糾正、命限期改善、停止部分業務、解除董監經理人職務，或廢止營業許可。</p>\n  </div>\n</details>\n"},{"id":"c03","filename":"03_信託稅制全攻略_穿透圖解篇.md","title":"信託稅制","icon":"03","badge":"第 03 章","weight":"7% 稅務題型","markdown":"# 第 03 章：信託相關稅制與所得分配（管道穿透圖解篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n信託稅制是許多考生覺得最抽象的章節，但只要掌握核心哲學——**「實質課稅原則」**與**「管道穿透理論（Conduit Theory）」**，整套邏輯就完全通順！\n\n![ 信託所得稅：透明水管「管道穿透理論」](images/chart_03_01.svg)\n\n---\n\n##  一、所得稅：透明水管「管道穿透原則」\n\n### 1. 所得稅課稅時點\n\n《所得稅法》第 3 條之 4 原則上以所得發生年度計算各類所得，按信託約定或可得推知的比例歸屬受益人。若受益人不特定或尚未存在，由受託人依規定申報納稅。\n\n符合條件的公益信託，以及經核准之共同信託基金、證券投資信託基金、期貨信託基金或其他信託基金，改於信託利益實際分配時由受益人併入分配年度所得。不可將一般原則套用到所有信託，也不宜將特定扣繳率說成固定的最高級距。\n\n### 2. 申報與憑單期限\n\n依《所得稅法》第 92 條之 1，受託人原則上應於每年 1 月底前申報上一年度信託資料，並於 2 月 10 日前填發相關憑單；每年 1 月遇連續 3 日以上國定假日者，申報期限延至 2 月 5 日、憑單填發期限延至 2 月 15 日。\n\n> 例外信託之課稅時點、所得類別及扣繳處理，應依所得稅法各項規定分別判斷。\n\n##  二、贈與稅與遺產稅：視同贈與與折現計算\n\n在傳統觀念中，把房子「過戶給別人」才是贈與。但信託法規下，**只要成立「他益信託」，法律就視同委託人把利益送給受益人了**！\n\n![ 他益信託視同贈與與 30 日申報期限](images/chart_03_03.svg)\n\n### 1. 贈與時點與申報期限\n*   **贈與時點**：以**信託契約成立日**、或**變更他益受益人日**、或**追加信託財產日**為贈與行為發生日。\n*   **申報期限**：他益信託依遺贈稅法第 5 條之 1 發生應課贈與稅情形時，委託人依第 24 條之 1 及第 24 條於贈與行為發生後 **30 日內**申報；公益信託依法律規定處理。\n\n### 2. 贈與價值計算公式（計算題常見常見考點！）\n\n當父母把 1,000 萬元信託，約定「期間 10 年，每年孳息給兒子，10 年期滿本金還給父母（**孳息他益、本金自益**）」，贈與金額該怎麼算？\n\n![ 信託財產本金折現與孳息拆解估價模型](images/chart_03_04.svg)\n\n> ** 實務精算案例【10年期本金他益信託之贈與稅折現】**：\n> 郭董交付 1,000 萬元現金信託，期間 10 年，約定「每年租金利息全由郭董自領（自益），10 年期滿 1,000 萬本金歸兒子小郭（本金他益）」：\n> ① 贈與標的係「10 年後才拿到的 1,000 萬元本金」，依法按成立時**中華郵政股份有限公司一年期定期儲金固定利率**（僅為試算假設，非現行固定利率）年複利折現：\n>    *   **法定折現公式**：`現值 (PV) = 本金 ÷ (1 + 郵儲利率)ⁿ`\n>    *   **本案數值試算**：`10,000,000 元 ÷ (1 + 0.02)¹⁰ ≈ 8,203,483 元`\n> ② 郭董僅須以折現後的現值約 820.3 萬元申報贈與稅，示範折現計算方式；實際金額依成立時法定利率與個案條件計算！\n\n> ** 考古題常見考點關鍵字**：\n> *   折現利率採用什麼利率？\n>     *    **「中華郵政股份有限公司一年期定期儲金固定利率」**（不可與其他銀行利率或活期存款利率混淆。）。\n\n---\n\n##  三、土地稅：地價稅與土地增值稅\n\n土地信託是信託業務最大宗之一，土增稅動輒上百萬，課不課稅是最大關鍵！\n\n### 1. 土地增值稅：信託關係人間五種不課徵情形\n\n![ 土地信託【不課徵】vs【應課徵】土地增值稅法定界線](images/chart_03_05.svg)\n\n《土地稅法》第 28 條之 3 列有五種信託關係人間移轉不課徵土地增值稅：①信託成立時委託人移轉給受託人；②存續中更換受託人；③契約明定委託人為受益人，信託消滅時受託人移轉給受益人；④遺囑信託消滅時受託人移轉給受益人；⑤信託不成立、無效、解除或撤銷時委託人與受託人間的移轉。其他移轉須按實際關係與法令判斷，不能一概視為免稅。\n\n### 2. 受託人賣土地時，誰繳稅？原地價怎麼算？（考超多次！）\n*   **納稅義務人**：以**受託人**為納稅義務人。\n*   **原地價起算點**：不是以「信託過戶當日」的地價算，而是以**委託人當初取得該土地時之原地價**作為基期計算漲價總數額！防止有人想用信託洗地價規避土增稅！\n\n### 3. 地價稅之課徵主體與累進稅率\n*   **納稅義務人**：以**受託人**為納稅義務人。\n*   **計稅方式（獨立分別計算）**：\n    受託人名下若有自己的土地，又有受託管理的信託土地，兩者**不可合併累進**！\n    *   受託人的**自有土地**：算一份地價總額。\n    *   受託人**信託 A 的土地**：獨立算一份地價總額。\n    *   受託人**信託 B 的土地**：再獨立算一份地價總額。\n    *    **分別計算地價總額，各自適用累進稅率**！\n\n---\n\n##  四、契稅、營業稅與印花稅速記\n\n| 稅目 | 委託人交付信託給受託人時 | 受託人返還委託人（自益信託）時 |\n| :--- | :--- | :--- |\n| **契稅** | **不課徵契稅** | **不課徵契稅** |\n| **營業稅** | **不課徵營業稅**（非銷售貨物或勞務） | **不課徵營業稅** |\n| **印花稅** | 辦理不動產移轉登記之書據，**應按金額千分之一貼用印花稅票** | 返還登記書據，**仍應貼用印花稅票** |\n\n> ** 印花稅特殊記憶點**：\n> 雖然土地增值稅和契稅「不課徵」，但只要拿著公定契約書去地政事務所辦理物權移轉登記，**印花稅就逃不掉，依規定貼用千分之一印花稅票**！\n\n\n---\n\n##  法規原文對照庫\n<details class=\"law-card\">\n  <summary> 查閱信託相關稅法關鍵條文原文（所得稅法、遺贈稅法、土地稅法）</summary>\n  <div class=\"law-card-content\">\n    <p><strong>所得稅法第 3 條之 4（導管穿透原則）</strong>：信託財產發生之收入，受託人應於所得發生年度，依所得稅法規定計算所得，並由受益人併入當年度所得額課徵所得稅。</p>\n    <p><strong>所得稅法第 92 條之 1（信託資料申報與憑單填發）</strong>：受託人應於每年 1 月底前，將上一年度信託專戶之財產目錄、收支計算表及扣繳憑單或免扣繳憑單向該管稽徵機關申報，並於 2 月 10 日前填發予納稅義務人。</p>\n    <p><strong>遺產及贈與稅法第 5 條之 1、24 條之 1</strong>：他益信託在法律規定的應課贈與稅情形，視為委託人贈與信託利益；申報期限依第 24 條為贈與行為發生後 30 日。不得將期限套用於所有信託。</p>\n    <p><strong>土地稅法第 28 條之 3（不課徵土地增值稅）</strong>：列有五種情形：信託成立時委託人與受託人間移轉；存續中更換受託人；契約明定委託人為受益人而信託消滅時受託人與受益人間移轉；遺囑信託消滅時受託人與受益人間移轉；信託不成立、無效、解除或撤銷時委託人與受託人間移轉。</p>\n    <p><strong>官方依據（查核至 2026 年 10 月 17 日）</strong>：<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096\">土地稅法第 28 條之 3</a>。</p>\n  </div>\n</details>\n"},{"id":"c04","filename":"04_金錢信託與集合管理_實務篇.md","title":"金錢信託與集合管理","icon":"04","badge":"第 04 章","weight":"36% 實務題型","markdown":"# 第 04 章：金錢信託與集合管理運用（實務篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n本章介紹金錢信託的指示權限、集合管理運用帳戶及其投資限制，並整理相關法規要件。\n掌握了「運用決定權在誰手裡」與「集合管理帳戶（集管帳戶）的投資規範」，實務科目就已經拿下一大半！\n\n![ 金錢信託分類架構與投資決定權歸屬](images/chart_04_01.svg)\n\n---\n\n##  一、金錢信託分類架構與生活化比喻\n\n### 1. 什麼是特定金錢信託 vs 非指定金錢信託？\n*   **運用決定權情境**：\n    *   ① **特定金錢信託（委託人具體指示運用事項）**：\n        張先生填單指定「以 100 萬元申購聯博全球高收益債券基金 A 股」。標的、金額、時點完全由客戶具體下達指示，銀行純粹擔任交易通道與受託保管者，絕無擅自變更之權。\n    *   ② **指定營運範圍金錢信託（委託人概括指定範圍，銀行選標的）**：\n        李董將 2,000 萬元交付信託，指示「資金限於投資臺灣前 50 大市值權值股與 AA 級金融債券」。至於挑選哪一檔股票、何時進場，全由銀行投資團隊在約定範圍內專業裁量。\n    *   ③ **不指定金錢信託（委託人完全不指定，銀行全權決定但嚴限法定四類）**：\n        王奶奶交付 500 萬元安養，未指定營運範圍或方法。受託人依信託業法第 32 條及相關運用準則，在法定範圍內管理；範圍包括現金及銀行存款、公債、公司債、金融債券、短期票券及經主管機關核准的業務。\n\n| 信託類別 | 運用標的指明度 | 投資決定權歸屬 | 實務最典型應用 |\n| :--- | :--- | :--- | :--- |\n| **特定金錢信託** | **具體指明**（哪一檔基金/哪支股票） | **委託人保留**（受託人無裁量權） | 國人透過銀行財富管理申購**境內外共同基金、海外債券、ETF** |\n| **指定營運範圍金錢信託** | **概括指定**（如約定投資台股大型權值股） | **受託人行使**（信託業代為運用） | 信託業全權委託代操盤 |\n| **非特定金錢信託** | **未指明任何標的** | **受託人行使**（完全自主裁量） | 依信託業法第 32 條規定之法定安全標的運用 |\n\n> **法規提醒（信託業法第 31 條）**：信託業不得承諾擔保本金或最低收益率；違反時依相關法規處理。\n\n---\n\n##  二、信託資金集合管理運用帳戶（CIT）制度\n\n「一個人拿 10 萬元買不起多檔優質標的，但一萬個人各拿 10 萬元就有 10 億元，能做分散風險的完美資產配置！」這就是**集合管理運用帳戶（簡稱集管帳戶）**的精髓。\n\n![ 集合管理運用帳戶 (CIT) 資金大水庫運作流程與受益權單位](images/chart_04_02.svg)\n\n### 1. 集管帳戶的設立與終止程序\n*   **設立主管機關**：信託業應訂定「集合管理運用計畫」，經**信託公會審查轉報金管會核准或備查**後始得開辦。\n*   **帳戶獨立性**：集管帳戶與信託業之自有財產或其他信託帳戶必須**嚴格獨立設帳、分別管理**。\n*   **受益人會議**：集管帳戶之重大變更（如修改管理計畫、更換受託人、提前終止），應經**受益人大會決議**。\n\n---\n\n##  三、集管帳戶投資防暴比率（重點數字清單！）\n\n主管機關為了避免集管帳戶踩雷或流動性不足爆發擠兌，設定了嚴格的「雙十比率」與「流動性資產限制」：\n\n![ 集合管理運用帳戶【雙十投資比率】與防弊風險限制](images/chart_04_03.svg)\n\n### 1. 核心投資比率速記對照表\n\n| 限制項目 | 法定比率上限 / 規定 | 制定目的（為什麼這樣規定？） |\n| :--- | :--- | :--- |\n| **單一企業集中度** | 帳戶總資產的 **10%** | 不把所有雞蛋放在同一個籃子裡 |\n| **單一公司股權控制度** | 該公司總發行股份的 **10%** | 防止信託機構假投資之名行介入經營權之實 |\n| **存放於單一金融機構** | 帳戶淨資產之 **10%** 或新臺幣 5,000 萬元 | 避免銀行倒閉風險 |\n| **流動性資產比率** | **由信託業同業公會訂定**，報金管會核定 | 確保投資人隨時要贖回時帳戶裡有足夠現金應付 |\n\n> ** 考古題常見陷阱（何者錯誤）**：\n> *   題目：集管帳戶得投資於單一公司股票達該集管帳戶淨資產價值 20%？\n>     *    **錯！** 法定上限為 **10%**！\n> *   題目：集管帳戶之流動資產比率由個別信託業自行決定？\n>     *    **錯！** 應由**信託公會擬定**，並報請**金管會核准**！\n\n---\n\n##  四、外幣金錢信託實務規範\n\n外幣金錢信託涉及新台幣兌換外幣，除了受金管會監管外，還必須遵守**中央銀行（央行）**的外匯管理條例：\n\n1.  **主管機關雙軌制**：金管會（業務主管）＋ 中央銀行（外匯業務主管）。\n2.  **幣別轉換與申報**：\n    *   以新臺幣交付、結購外幣投資國外標的者，依**外匯收支或交易申報辦法**辦理。\n    *   信託業辦理以外幣計價之金錢信託，本金與收益之交付及返還，均以**外幣**為之者，不計入委託人當年累積結匯額度。\n3.  **禁止外匯避險投機**：受託人辦理外幣信託，未經中央銀行許可，不得從事非避險性質之槓桿衍生性金融商品交易。\n"},{"id":"c05","filename":"05_有價證券信託與員工持股_實務篇.md","title":"有價證券與員工福利信託","icon":"05","badge":"第 05 章","weight":"39% 股票與借券","markdown":"# 第 05 章：有價證券信託與企業員工福利信託（實務篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n本章說明有價證券信託與員工福利信託的運作方式、權利義務及常見契約差異。\n本章說明股票表決權行使、證券借貸與員工持股信託的權利義務及契約安排。\n\n![ 有價證券信託與企業員工福利信託雙核心全景架構](images/chart_05_01.svg)\n\n---\n\n##  一、有價證券信託核心制度\n\n### 1. 對抗要件手續（曾於歷屆題目出現！）\n信託財產為有價證券（如上市公司股票）時，必須完成**「兩手策略」**：\n1.  **物理背書**：由受託人與委託人於股票背面之轉讓過戶申請書**背書載明為信託財產**。\n2.  **登記備查**：檢附信託契約，通知發行公司並於**公司股東名簿載明「某某銀行受託某某人信託財產專戶」**。\n*    **若未完成上述兩項，不得對抗發行公司及第三人！**\n\n![ 記名股票信託背書與股東名簿對抗要件流程](images/chart_05_02.svg)\n\n---\n\n### 2. 有價證券借貸（借券業務）實務\n\n把手頭上龐大的台積電股票信託給銀行，平時放著領股息，如果能借給外資放空或避險，還能多賺一筆「借券利息」，這就是有價證券借貸業務！\n\n![ 有價證券借貸交易 (借券業務) 四方運作與擔保維持率架構](images/chart_05_03.svg)\n\n*   **法規關鍵要件**：\n    1.  **事先授權**：信託契約中必須明訂，或事先取得**委託人（自益信託）或受益人（他益信託）的書面同意**。\n    2.  **擔保維持率**：借券人必須繳交法定比率之擔保品（通常在 140% 以上），低於維持率時受託人應通知補繳，否則立刻處分擔保品買回股票（斷頭平倉）。\n    3.  **除權除息補償**：借券期間若遇股票發放股利或現金增資，借券人必須按約定給予**權益補償**，不能損及信託財產利益。\n\n---\n\n##  二、企業員工福利信託：持股信託 vs 福儲信託\n\n【員工持股信託與員工福儲信託示例】\n下列為說明用途的假設案例，員工資格、提撥比例、投資標的及退會給付均依各持股會章程、信託契約及雇主辦法辦理：\n① **組織與提撥**：員工依章程推選代表成立「員工持股會」，由代表與受託銀行簽約開立信託專戶。假設員工每月自提 1 萬元，雇主另依適用辦法提撥相對金額；實際比例並無通用固定值；\n② **投資標的差異（重要考點）**：\n   *   **員工持股信託（ESOT）**：信託資金依約定專門在市場持續買入「自營雇主公司（自家公司）的股票」；\n   *   **員工福儲信託（EFST）**：投資標的多元化，除了自家股票外，更可配置於國內外基金、優質公債、金融債或定存，分散單一公司風險；\n③ **稅務與返還**：雇主提撥及員工自提部分的所得與扣繳時點，依實際法律關係、給付條件及稅法判斷；提前離職、退會時各部分如何返還，依章程及信託契約約定，不預設員工自提款一定全數返還。\n\n![ 員工持股信託 (ESOT) vs 員工福利儲蓄信託 (EFST) 核心比較](images/chart_05_04.svg)\n\n### 1. 員工持股信託 vs 員工福儲信託 差異對照表\n\n| 比較維度 | 員工持股信託（ESOT） | 員工福儲信託（EFST） |\n| :--- | :--- | :--- |\n| **主要投資標的** | **純粹投資本公司或關係企業之上市櫃股票** | **不限於自家股票**，可投資基金、存款、債券等多元商品 |\n| **主要目的** | 讓員工成為股東，同甘共苦、防止敵意併購、激勵士氣 | 著重於員工退休金準備、分散資產配置、避險保值 |\n| **組織機制** | 設立「員工持股會」 | 設立「員工福利儲蓄會」 |\n\n---\n\n##  三、員工持股信託的表決權行使\n\n信託業持有信託股票時，表決權可與其他信託財產及信託業自有財產分別計算；實際行使方式依信託契約約定。\n\n![ 信託業持有股票的表決權行使原則（信託業法第 20 條之 1）](images/chart_05_05.svg)\n\n### 1. 表決權行使依據\n1. 依《信託業法》第 20 條之 1，信託業行使信託股票表決權應依信託契約約定。\n2. 信託股票表決權得與其他信託財產及信託業自有財產分別計算。\n3. 持股會、受益人或受託機構如何形成或執行表決意思，應查閱個別信託契約及適用規定，不預設由單一主體行使。\n\n---\n\n##  四、退會與解約處理（離職、退休怎麼分？）\n\n當員工離職、資遣或退休時，累積在持股專戶裡的股票和現金如何拿回？\n\n1.  **退休或逝世**：依契約約定，通常得選擇**請求交付現物股票**（將股票撥轉至其個人證券集保戶頭），或由受託人於集中市場賣出後**交付現金**。\n2.  **中途自願退會或跳槽離職**：\n    *   員工自行提撥金所購之股票與現金：依章程、信託契約及適用規定辦理。\n    *   公司獎助金部分：依企業留才條款（歸屬比例 Vesting Schedule）約定，服務未滿特定年資者，公司補助部分可能依約收回或沒收！\n"},{"id":"c06","filename":"06_不動產信託與資產證券化_實務篇.md","title":"不動產信託與資產證券化","icon":"06","badge":"第 06 章","weight":"18% REITs／SPT","markdown":"# 第 06 章：不動產信託與資產證券化（實務篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n本章說明不動產開發信託、不動產證券化及金融資產證券化的主要制度與風險隔離原則。\n本章主要由兩大支柱構成：\n1. **防止爛尾樓的「不動產開發與價金信託」**。\n2. **將不動產變現流動的「REITs vs REATs」與「金融資產證券化（SPT）」**。\n\n![ 不動產開發信託與買賣價金履約信託安全架構](images/chart_06_01.svg)\n\n---\n\n##  一、不動產開發信託與買賣價金信託（防爛尾防線）\n\n買預售屋最怕遇到建商把買方繳的工程款拿去炒股、或者建商中途破產蓋一半落跑！\n信託制度如何成為保護購屋族與地主的「定海神針」？\n\n![ 不動產開發信託專款專用與續建完工承諾防弊體系](images/chart_06_02.svg)\n\n### 1. 不動產開發信託 vs 買賣價金信託 對照比較\n\n| 項目 | 不動產開發信託 | 買賣價金信託 |\n| :--- | :--- | :--- |\n| **信託財產內容** | **土地所有權 ＋ 興建興造資金 ＋ 起造人名義** | **僅有買方所繳納之購屋預收款（價金）** |\n| **主要功能** | 依契約管理土地、興建資金及相關權利；資金撥付依信託契約與查核程序辦理 | 依契約管理買方所繳價金，依約定條件撥付或返還 |\n| **續建安排** | 是否有續建安排及保證，依個案契約與相關機制判斷 | 不預設續建或全額返還；依信託契約及適用規定辦理 |\n\n---\n\n##  二、不動產證券化：REITs 與 REATs 制度比較\n\nREIT 與 REAT 名稱相近，但法律架構、資產來源及受益證券性質不同：\n\n![ REITs vs REATs 雙雄世紀對決與法規要求](images/chart_06_03.svg)\n\n### 1. REITs vs REATs 重點常見考點對照表\n\n> **制度整理**：\n> ① **REIT（不動產投資信託）**：募集或私募資金後，依信託契約投資不動產、不動產相關權利及法定範圍內的標的。契約須載明收益分配方式；適用的處理辦法要求每年配息比率達可分配收益 90% 以上，並於會計年度結束後 6 個月內完成分配。\n> ② **REAT（不動產資產信託）**：委託人移轉不動產或相關權利予受託機構，再依計畫募集或私募受益證券。現金流、期限、順位與到期安排依信託契約及受益證券條件判斷，不預設固定利率或全額還本。\n\n| 比較項目 | 不動產投資信託（REITs） | 不動產資產信託（REATs） |\n| :--- | :--- | :--- |\n| **發起出資思維** | **投資型**：先找投資人的錢，再去買房地產收租金 | **融資型**：委託人手頭有現成大樓，為取得資金而信託發行證券 |\n| **證券本質** | 受益權及收益依信託契約與適用規定辦理 | 受益權及收益依資產信託計畫、受益證券條件與適用規定辦理 |\n| **期限** | 依信託契約及適用規定 | 依信託契約及發行文件 |\n| **追加募集或發行** | 依適用法規及核准內容判斷 | 依適用法規及核准內容判斷 |\n| **收益分配** | 契約應載明分配方式；特定處理辦法要求每年分配可分配收益 90% 以上 | 依信託契約及受益證券條件分配 |\n| **借款限制** | 依適用法規及信託契約判斷 | 依適用法規及信託契約判斷 |\n\n> ** 考古題解題口訣**：\n> *   判讀 REIT 時，應核對募集方式、契約及法定收益分配規範。\n> *   判讀 REAT 時，應核對受託資產、受益證券條件及契約約定。\n\n---\n\n##  三、金融資產證券化：特殊目的信託（SPT）與破產隔離\n\n銀行手上有上百億元的 30 年期房屋貸款，雖然每年有利息收入，但資金被死死卡住 30 年不能動。\n如何把這 100 億房貸立刻變現？答案就是**金融資產證券化**！\n\n![ 金融資產證券化特殊目的信託 (SPT) 與破產隔離架構](images/chart_06_04.svg)\n\n### 1. 什麼是「真實出售（True Sale）」與「破產隔離（Bankruptcy Remoteness）」？\n\n*   **假設案例（不指涉特定金融機構）**：\n    某金融機構持有一組房貸債權，為籌措資金而評估辦理特殊目的信託（SPT）：\n    ① **資產移轉**：創始機構將房貸債權依契約移轉予受託機構；是否構成真實出售，須依契約、交易實質及適用法規判斷。\n    ② **破產隔離**：資產是否與創始機構破產財團區隔，須依移轉效力、契約及法令判斷。\n    資產移轉後的現金流分配依信託契約及受益證券條件辦理。\n\n*   **真實出售**：是否構成真實出售，須依資產移轉效力、交易實質與相關法律及會計規定判斷。\n*   **破產隔離**：資產與創始機構破產財團的區隔效果，須視資產移轉是否有效及相關法令判斷。\n\n---\n\n### 2. 內部信用增強機制：切蛋糕分等級（優先與次順位）\n\n為了讓投資人安心購買受益證券，SPT 會把發行的證券進行「分級切片」：\n\n![ 資產證券化內部信用增強：優先/中順位/次順位分券架構](images/chart_06_05.svg)\n\n*   **優先順位證券（Senior）**：享有最優先分配本金利息的權利，風險最低、信評最高（通常 AAA 級）。\n*   **次順位證券（Subordinated）**：又稱「劣後證券」或「吸收損失緩衝墊」。只要資產池有人房貸違約不繳，**先扣次順位證券的錢**！直到次順位全賠光了，才會傷到優先順位！\n*   **超額擔保（Over-collateralization）**：信託資產總額（如 110 億）大於發行證券總額（如 100 億），多出來的 10 億就是額外的安全緩衝墊。\n"},{"id":"c07","filename":"07_公益信託與特殊形態信託_實務篇.md","title":"公益信託與特殊型態","icon":"07","badge":"第 07 章","weight":"12% 公益與照護","markdown":"# 第 07 章：公益信託、基金保管與安養照護信託（實務篇）\n\n---\n\n##  本章學習導航與核心地圖\n\n本章囊括了測驗中的三大常見考點常見模組：\n1. **公益信託**：整理主管機關監督、信託監察人及信託消滅時財產歸屬等規定。\n2. **保管機構業務**：說明證券投資信託基金及全權委託投資中保管機構的責任。\n3. **「高齡安養與身障照護信託」**（信託 2.0 政策核心，現代社會保障安全網）。\n\n![ 特殊形態信託三大核心支柱全景架構](images/chart_07_01.svg)\n\n---\n\n##  一、公益信託：回饋社會的法定架構（信託法第 69~85 條）\n\n設立公益信託可用於慈善、獎學金或環境保育等公益目的。是否適用稅務優惠，仍須符合各該稅法條件；信託法另規定主管機關的監督、信託監察人及資訊公開義務。\n\n![ 公益信託設立許可、信託監察人必設與年度申報法定體系](images/chart_07_02.svg)\n\n### 1. 公益信託 vs 私益信託 常見考點差異表\n\n| 比較項目 | 私益信託（一般民事/商業信託） | 公益信託（信託法第 8 章） |\n| :--- | :--- | :--- |\n| **設立方式** | 契約信託、遺囑信託 | 契約信託、遺囑信託、**法人宣言信託** |\n| **成立生效要件** | 雙方簽約即成立（遺囑信託於死亡時生效） | **必須經「目的事業主管機關」許可**始生效力 |\n| **信託監察人設置** | **得**選設（自由決定） | **應**設置（**強制必須設立，法無例外！**） |\n| **受託人辭任規定** | 經委託人及受益人同意得辭任 | **非有正當理由，並經主管機關許可，不得辭任** |\n| **信託消滅財產歸屬** | 依信託法第 65 條及信託行為約定 | 信託行為未訂歸屬權利人時，目的事業主管機關得使信託關係為類似目的存續，或移轉財產至有類似目的的公益法人或公益信託（第 79 條） |\n\n> ** 考古題常見考點三大陷阱（何者錯誤）**：\n> *   **陷阱 1**：公益信託之主管機關一律為金融監督管理委員會？\n>     *    **錯！** 是依其業務性質由各「**目的事業主管機關**」管轄（例：助學金歸教育部、醫療救助歸衛福部、環境保育歸環境部）。\n> *   **陷阱 2**：公益信託得由委託人自由決定是否設置信託監察人？\n>     *    **錯！** 法律明定**「應」**設置信託監察人，一人或數人均可。\n> *   **陷阱 3**：公益信託目的無法達成終止時，信託財產得返還予出資之委託人？\n>     *    **錯！** 信託行為未訂財產歸屬權利人時，依第 79 條由目的事業主管機關決定是否使信託為類似目的存續，或移轉至有類似目的的公益法人或公益信託。\n\n---\n\n##  二、保管機構業務：基金投資人的守門員\n\n在台灣買「元大台灣50（0050）」或任何境內共同基金，你的錢並不是匯給投信公司，而是直接匯入獨立的**「基金保管機構」（通常為信託銀行）**！\n\n![ 共同基金運作機制：投信 (決策) 與保管機構 (保管) 雙權分立](images/chart_07_03.svg)\n\n### 1. 防弊防火牆：投信公司與保管機構持股限制\n*   投信公司與基金保管機構之間，**不得具有實質控制關係**。\n*   任一方持有他方股份總額超過 **10%** 者，**不得擔任該投信基金之保管機構**！\n\n---\n\n### 2. 全權委託保管銀行業務與越權交易監督防線\n\n【全權委託代操經理人違法越權下單之保管行防線】\n張董與大華投信簽訂 1 億元全權委託投資契約，契約明定「單一股票投資上限不得超過委託資產之 20%（即2,000萬元）」，並指定第一銀行為全權委託保管機構：\n① **違法越權指示**：大華投信經理人看好某中小型飆股，竟向券商下單 3,500 萬元，並向第一銀行發出撥款交割指示；\n② **保管銀行實質把關（拒絕盲從）**：第一銀行保管部在審核交割指示時，發現該筆交易超過契約 2,000 萬元上限達 1,500 萬元，構成法定之「越權交易」！\n③ **法定處理程序**：第一銀行依規定必須立即出具書面「越權交易通知書」通知大華投信、委託人張董，並副知金管會及投信投顧公會；\n④ **履行責任自負**：超出的 1,500 萬元交割款項，依規定必須由「大華投信以自有資金負履行交割之責」，該超額股票亦撥入投信自有帳戶處理，張董的委託資產專戶絲毫不受損害！這正是保管銀行設立的重點防火牆意義。\n **解題口訣**：「經理指示超上限，保管審核抓越權，拒絕撥款出通報，投信自掏腰包填」\n\n---\n\n##  三、高齡安養與身心障礙者信託（信託 2.0 守護神）\n\n面對台灣超高齡社會與少子化，長輩最擔心的兩件事：\n1. 萬一失智或生重病，辛苦存的養老金被不孝子孫騙走提領一空。\n2. 留給身心障礙子女的照顧費用，在父母百年後被親戚霸佔挪用。\n\n![ 高齡安養信託專款專用與信託監察人防護罩機制](images/chart_07_04.svg)\n\n*   **專款專用機制**：長輩的生活費、護理院月費、醫療開銷直接由銀行受託帳戶撥付給安養院或醫院，不經由旁人之手，防止遭到金融剝削。\n*   **信託監察人安排**：可在信託契約中約定監察人權限及須由其同意的事項；保障效果依契約內容與適用法律判斷。\n"},{"id":"c08","filename":"08_歷屆考題高頻數字與易錯陷阱速查手冊.md","title":"法規數字與易錯觀念","icon":"08","badge":"第 08 章","weight":"期間、比率與例外","markdown":"# 第 08 章：法規數字與易錯觀念速查（衝刺篇）\n\n---\n\n##  本章使用說明\n\n本手冊整理信託法規與實務中常用的金額、比例、期限及易混淆觀念，供複習時快速查找。\n歷屆題目的法規與制度可能依年度不同而改變；閱讀速查資料時，應同時核對題目年度及現行官方條文。\n\n---\n\n##  一、常見考點「時間與期間」速查金榜\n\n![ 信託法規關鍵法定期間總彙整](images/chart_08_01.svg)\n\n| 法定期間 | 法規依據 | 核心事件與考點情境 | 陷阱防範提醒 |\n| :--- | :--- | :--- | :--- |\n| **20 日前** | 金融資產證券化條例第 24 條 | 受託機構或信託監察人召集受益人會議，應於開會 **20 日前**書面通知各受益人。 | 常被改成「10 日前」或「30 日前」 |\n| **30 日** | 遺產及贈與稅法第 24 條、第 24 條之 1 | 他益信託發生依法應課贈與稅情形時，依贈與行為發生日計算申報期限；公益信託另依法律規定。 | 先判斷是否屬應課贈與稅情形，再核對申報期間。 |\n| **1 個月** | 信託業法第 34 條 | 信託公司取得營業執照後，應於 **1 個月內**以現金或政府債券繳存賠償準備金於中央銀行。 | 常被改成「3 個月」或「營業前」 |\n| **3 個月** | 信託業法施行細則第 12 條<br/>信託法第 72 條 | 1. 信託業之**信託財產評審委員會每 3 個月至少開會評審一次**，並報告董事會。<br/>2. 公益信託受託人於每會計年度終了後 **3 個月內**編具報告向主管機關申報並公告。 | 常被改成「每月」或「每半年」 |\n| **6 個月** | 信託法第 6 條第 2 項<br/>不動產證券化條例第 28 條 | 1. 信託行為成立後 **6 個月內**委託人受破產宣告者，**推定該信託有害及債權**。<br/>2. REITs 依約定應分配之收益，應於會計年度結束後 **6 個月內**分配完畢。 | 常被改成「1 年內」或「3 個月內」 |\n| **1 年 / 10 年** | 信託法第 7 條 | 詐害信託之撤銷權除斥期間：<br/>• 自債權人**知有撤銷原因起，1 年間**不行使而消滅。<br/>• 自信託行為**成立時起，逾 10 年**者亦同。 | 歷屆常見！背法：**知一成十**！ |\n| **1 月底前** | 所得稅法第 92 條之 1 | 信託受託人應於每年 **1 月底前**向稽徵機關申報上一年度信託所得申報書及扣繳憑單。 | 遇農曆春節等連假順延至 2 月 5 日 |\n| **2 月 10 日前** | 所得稅法第 92 條之 1 | 信託受託人應於每年 **2 月 10 日前**將扣繳憑單或免扣繳憑單填發給受益人。 | 遇連續假期延長至 2 月 15 日 |\n\n---\n\n##  二、常見考點「金額、比率與避坑防線」速查金榜\n\n![ 信託法規金額門檻與關鍵投資比率全景速查對照表](images/chart_08_02.svg)\n\n| 項目門檻 | 正確法定數字 | 法規依據 | 記憶口訣與常見避坑陷阱 |\n| :--- | :--- | :--- | :--- |\n| **信託公司最低實收資本額** | **新臺幣 20 億元**<br/>• 僅辦理 REIT：10 億元<br/>• 僅辦理 REAT：3 億元 | 信託業設立標準第 3 條 | 門檻極高！發起人出資以現金為限，且**於發起時按實收資本額全額一次認足**！ |\n| **賠償準備金最低門檻** | **新臺幣 5,000 萬元** | 信託業法第 34 條<br/>金管會公告標準 | 繳存**中央銀行**，專款專用於委託人或受益人損害賠償之優先受償。每年 5 月 20 日前按受託財產計提，逾資本額 50% 應即增資。 |\n| **營業保證金與賠償準備金** | 信託業法第 34 條規範賠償準備金，未設一般信託業者按實收資本額 5% 提存的營業保證金制度。 | 信託業法第 34 條 | 實際規定應以信託業法第 34 條及金管會公告為準；特定兼營機構的部分營業保證金符合條件時，得充作賠償準備金。 |\n| **信託業利害關係人持股標準** | **5%**（主要股東）<br/>**10%**（負責人持股企業） | 信託業法第 7 條 | 掌握「**5%**（持有信託業股份）」與「**10%**（負責人等持有企業股份）」兩大關鍵數字！ |\n| **集管帳戶投資單一標的上限** | **10%**（雙十原則） | 信託資金集合管理運用管理辦法第 9 條 | • 個別帳戶投資任一公司總額不得超過該帳戶淨資產 **10%**<br/>• 全體帳戶投資任一公司總額不得超過該公司實收資本額 **10%** |\n| **REITs 收益分配法定比率** | **90% 以上** | 受託機構募集或私募不動產投資信託受益證券處理辦法第 3 條 | 強制將收益分配給受益人，不得隨意保留作資本公積，且須於年度結束後 **6 個月內**分配。 |\n| **全權委託投資業務資本額辨析** | 投信：**3 億元**<br/>投顧：**3 億元**（免受 20 倍限制） | 投信事業設置標準第 7 條<br/>全權委託投資業務管理辦法第 13 條 | 投信公司門檻為 3 億元；投顧代操若達 3 億元則接受委託金額不受淨值 20 倍限制。 |\n\n---\n\n##  三、常見考點「會議與表決權門檻」\n\n| 會議與主體 | 事項與法規依據 | 法定出席門檻 | 法定決議同意門檻 |\n| :--- | :--- | :--- | :--- |\n| **銀行董事會** | 銀行法第 33 條：達法定金額的利害關係人擔保授信 | **董事三分之二以上出席**（2/3） | **出席董事四分之三以上同意**（3/4） |\n| **土地信託受益人會議** | 信託業法第 26 條：以開發為目的之土地信託借入款項 | **受益權總數三分之二以上出席**（2/3） | **出席表決權數過半數同意**（二分之一以上） |\n| **證券化受益人會議** | 金融資產證券化條例第 25 條：普通決議事項 | **表決權總數二分之一以上出席**（過半數） | **出席受益人表決權過半數同意** |\n| **證券化受益人會議** | 金融資產證券化條例第 26 條：決議有損害特定種類受益人之權利 | **該特定種類表決權總數二分之一以上出席** | **出席受益人表決權三分之二以上同意** |\n| **受益人請求召集門檻** | 金融資產證券化條例第 24 條：受益人請求召集會議 | **持有本金持分總數 3% 以上**<br/>（請求後 15 日不召集得報主管機關許可自行召集） | 開會 **20 日前**書面通知；重大事項（解任、變更契約）**不得以臨時動議提出**！ |\n\n---\n\n## 🚨 四、「何者錯誤」三大逆向陷阱破題直覺法則\n\n下列文字可能提示考生注意適用對象、原則及例外；仍應依題目事實與法規條文判斷，不能只憑關鍵字猜答案：\n\n![⚠ 歷屆信託考題三大常見致命文字陷阱避坑指南](images/chart_08_03.svg)\n\n1.  **先判斷信託業法第 25 條的禁止事項與例外**：\n    信託財產不具運用決定權，或標的為政府發行債券時，依條文有法定例外；不得把受益人書面同意單獨視為第 25 條的例外。\n2.  **「應」vs「得」文字遊戲**：\n    *   公益信託**應**設置信託監察人（寫「得設置」者錯誤）。\n    *   受託人**原則上應親自處理**信託事務（寫「得隨意委託他人」者錯誤）。\n3.  **「獨立性例外」判斷**：\n    只要債權是「委託人一般的個人欠款」或「受託人自己的私人借貸」，想扣押信託財產？**一律錯誤！** 只有「信託前已設定抵押」、「因處理信託事務產生（如修繕大樓費用）」才能強制執行！\n"}],"quizzes":{"c01":[{"id":"c01_q01","source_id":"past-52-law-2","source_chapter":"c01","term":52,"     // ==================== 法規語意高亮引擎 ====================
    function highlightLegalText(html) {
      if (!html) return '';
      // 透過正則匹配所有 HTML 標籤 (<[^>]+>)，只對標籤之外的純文字節點做關鍵詞高亮，絕不破壞標籤與屬性！
      return html.replace(/(<[^>]+>)|([^<]+)/g, (match, tag, text) => {
        if (tag) return tag;
        let res = text;
        res = res.replace(/(不得|嚴禁|禁止|罰鍰|沒入|撤銷|無效|除外|未經許可)/g, '<span class="legal-word legal-ban">$1</span>');
        res = res.replace(/(應於|應經|應向|應由|必須|應提列|強制)/g, '<span class="legal-word legal-duty">$1</span>');
        res = res.replace(/(得由|得向|得經|可行|任選)/g, '<span class="legal-word legal-allow">$1</span>');
        res = res.replace(/(但書|但|若|如遇)/g, '<span class="legal-word legal-condition">$1</span>');
        res = res.replace(/(\d+個月|\d+年|\d+日內|即日起|屆滿)/g, '<span class="legal-word legal-time">$1</span>');
        return res;
      });
    }

    function enhanceResponsiveTables(root) {
      if (!root || typeof root.querySelectorAll !== 'function') return;

      root.querySelectorAll('.table-scroll-wrapper').forEach(wrapper => {
        const table = wrapper.querySelector('table');
        if (!table) return;

        const headers = Array.from(table.querySelectorAll('thead th')).map((th, index) => {
          const label = (th.textContent || '').trim();
          return label || `欄位 ${index + 1}`;
        });

        table.querySelectorAll('tbody tr').forEach(row => {
          Array.from(row.children).forEach((cell, index) => {
            if (!cell || String(cell.tagName || '').toLowerCase() !== 'td') return;
            cell.setAttribute('data-label', headers[index] || `欄位 ${index + 1}`);

        });
      });
