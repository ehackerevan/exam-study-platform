<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="360" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託利益權利價值計算（遺產及贈與稅法第 10 條之 2）</text>

  <g transform="translate(60, 70)" filter="url(#shadow)">
    <rect width="800" height="240" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    
    <text x="400" y="40" fill="#c084fc" font-size="18" font-weight="700" text-anchor="middle"> 本金現值 (PV) 與孳息現值拆解折現法</text>

    <!-- 左邊公式 -->
    <g transform="translate(40, 70)">
      <rect width="340" height="130" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="170" y="32" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">1. 本金現值計算公式</text>
      <text x="170" y="65" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">PV = P ÷ (1 + i)ⁿ</text>
      <text x="20" y="95" fill="#94a3b8" font-size="12">P: 信託財產總時價 | n: 信託剩餘年數</text>
      <text x="20" y="115" fill="#38bdf8" font-size="12">i: 郵政儲金一年期定期儲金固定利率</text>
    </g>

    <!-- 右邊公式 -->
    <g transform="translate(420, 70)">
      <rect width="340" height="130" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="170" y="32" fill="#fda4af" font-size="16" font-weight="700" text-anchor="middle">2. 孳息部分信託利益價值</text>
      <text x="170" y="65" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">孳息價值 = P － PV</text>
      <text x="20" y="95" fill="#cbd5e1" font-size="12">總財產現值扣除本金折現值，剩餘即為孳息現值</text>
      <text x="20" y="118" fill="#fca5a5" font-size="13" font-weight="700"> 本金他益看折現現值；孳息他益原則看總價值減本金現值</text>
    </g>
  </g>

</svg>