<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="460.0" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託財產評審委員會開會週期與職權規範 (信託業法第 21 條)</text>

  <g transform="translate(50, 75)" filter="url(#shadow)">
    <rect width="220" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="110" y="40" fill="#60a5fa" font-size="18" font-weight="700" text-anchor="middle"> 組織設置</text>
    <text x="20" y="80" fill="#cbd5e1" font-size="13">• 信託業依法應設置</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">• 核心職責：定期評審</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="13">  信託財產並報告董事會</text>
    <text x="20" y="155" fill="#38bdf8" font-size="13"> 組成細節依相關規範辦理</text>
  </g>

  <g transform="translate(350, 75)" filter="url(#shadow)">
    <rect width="220" height="180" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="110" y="40" fill="#c084fc" font-size="18" font-weight="700" text-anchor="middle"> 開會週期</text>
    <text x="110" y="80" fill="#f43f5e" font-size="22" font-weight="800" text-anchor="middle">每 3 個月</text>
    <text x="110" y="110" fill="#fda4af" font-size="14" font-weight="700" text-anchor="middle">依法每 3 個月評審一次</text>
    <text x="20" y="145" fill="#cbd5e1" font-size="13">• 評審信託財產</text>
    <text x="20" y="168" fill="#fbbf24" font-size="13"> 並報告董事會</text>
  </g>

  <g transform="translate(650, 75)" filter="url(#shadow)">
    <rect width="220" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="40" fill="#34d399" font-size="18" font-weight="700" text-anchor="middle"> 報告監督</text>
    <text x="20" y="80" fill="#cbd5e1" font-size="13">• 第 21 條要求</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="13">  向【董事會】報告</text>
    <text x="20" y="135" fill="#cbd5e1" font-size="13">• 不另加「季後 1 個月」</text>
    <text x="20" y="160" fill="#34d399" font-size="13"> 等條文未規定期限</text>
  </g>

  <path d="M 270 165 L 350 165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 570 165 L 650 165" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>

</svg>