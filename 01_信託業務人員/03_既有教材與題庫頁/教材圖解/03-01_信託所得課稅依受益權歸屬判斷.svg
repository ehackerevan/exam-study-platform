<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="380" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託所得課稅：依受益權歸屬判斷</text>

  <!-- 收益來源 (左) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="38" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle"> 收益來源</text>
    <text x="90" y="68" fill="#cbd5e1" font-size="13" text-anchor="middle">房租 / 股票股利</text>
    <text x="90" y="90" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">賺取 100 萬元</text>
  </g>

  <!-- 中間：透明水管 (信託關係) -->
  <g transform="translate(280, 80)" filter="url(#shadow)">
    <rect width="360" height="130" rx="14" fill="#082f49" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,4"/>
    <text x="180" y="36" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="middle"> 一般信託：依受益權歸屬計算所得</text>
    <text x="180" y="66" fill="#93c5fd" font-size="13" text-anchor="middle">受益人特定且存在時，原則按所得發生年度歸屬</text>
    <text x="180" y="92" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle"> 受益人不特定／尚未存在等情形另有法定處理</text>
    <text x="180" y="114" fill="#e2e8f0" font-size="12" text-anchor="middle">公益信託等符合要件者，也有特別課稅規定</text>
  </g>

  <!-- 右邊：接水者 (實質納稅人) -->
  <g transform="translate(700, 70)" filter="url(#shadow)">
    <rect width="180" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="28" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">自益信託</text>
    <text x="90" y="52" fill="#e2e8f0" font-size="13" text-anchor="middle"> 委託人為受益人時，依規定申報</text>
  </g>
  <g transform="translate(700, 155)" filter="url(#shadow)">
    <rect width="180" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="28" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">他益信託</text>
    <text x="90" y="52" fill="#e2e8f0" font-size="13" text-anchor="middle"> 受益人特定存在時，依規定歸屬所得</text>
  </g>

  <!-- 水流動態箭頭 -->
  <path d="M 220 145 L 280 145" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 640 115 L 700 105" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 640 175 L 700 190" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- 底部時間線提醒 -->
  <g transform="translate(160, 260)" filter="url(#shadow)">
    <rect width="600" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="32" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle"> 報稅日期：</text>
    <text x="300" y="58" fill="#cbd5e1" font-size="13" text-anchor="middle">受託人應於每年 1 月底前開具憑單向國稅局申報，並於 2 月 10 日前填發給受益人！</text>
  </g>

</svg>