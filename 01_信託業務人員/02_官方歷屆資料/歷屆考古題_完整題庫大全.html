金投資風險","提高信託資金之運用效率"],"a":"1","tp":"單獨及集合管理分類與權限","note":""},{"p":46,"s":2,"n":73,"t":"信託資金集合管理運用帳戶之信託財產運用於國內投資標的時，應以下列何者之信託財產名義表彰？","o":["受益人","委託人","信託監察人","信託業"],"a":"4","tp":"集合帳戶投資限制與流動性","note":""},{"p":46,"s":2,"n":74,"t":"集合管理運用帳戶終止時，信託業至遲應於主管機關核准清算後多久期間內完成帳戶之清算？","o":["一個月","二個月","三個月","四個月"],"a":"3","tp":"集合帳戶申請設置與合併","note":""},{"p":46,"s":2,"n":75,"t":"張三將一百萬元交付信託，約定受益人為其子張小明，並同意受託人將信託資金集合管理運用，但保留該集合管理運用帳戶受益權之行使，請問約定條款有關應對受益人所為之行為，應向何人為之？","o":["張三與張小明","張三或張小明","張小明","張三"],"a":"4","tp":"集合帳戶申請設置與合併","note":""},{"p":46,"s":2,"n":76,"t":"集合管理運用帳戶信託財產之淨資產價值之計算標準，應由下列何者擬訂？","o":["信託業","信託同業公會","信託監察人","受益人大會"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":46,"s":2,"n":77,"t":"有關擔任證券投資信託基金保管機構之資格，下列敘述何者正確？","o":["須擔任證券投資信託事業監察人","須為銀行法第二十條所稱之銀行或信託業法第二條所稱之信託業","須投資於證券投資信託事業已發行股份總數百分之十以上","須擔任證券投資信託事業董事"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":46,"s":2,"n":78,"t":"有關信託業辦理以信託受益權為擔保之質權設定時，下列敘述何者錯誤？","o":["信託契約應載明管理處分權限","信託業不得自信託財產收取本息","信託存續期間內信託業不得因行使質權而提前終止信託契約","得辦理商品（服務）禮券所收取金額交付信託之受益權質權設定"],"a":"4","tp":"公會自律與行為規範","note":""},{"p":46,"s":2,"n":79,"t":"委託人將現金100 萬元交付甲銀行成立信託，並指示甲銀行購買Ａ公司股票，依我國信託業法之規定屬下列何種信託？","o":["金錢之信託","有價證券之信託","金錢債權之信託","其他財產權之信託"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":46,"s":2,"n":80,"t":"企業員工持股信託契約終止時，有關非內部人員工信託財產之返還，下列敘述何者錯誤？","o":["得以折算金錢方式返還","信託財產返還時，應課贈與稅","得以信託財產現狀返還","得選擇部分股票部分金錢方式返還"],"a":"2","tp":"退出終止與財產返還","note":""},{"p":48,"s":1,"n":1,"t":"依「公開發行股票公司股務處理準則」規定，辦理信託過戶，下列何者不屬應具備之文件？","o":["買賣成交單","過戶申請書","信託契約或遺囑","稅務機關有關證明文件"],"a":"1","tp":"內部人持股申報與權益行使","note":""},{"p":48,"s":1,"n":2,"t":"下列何者不得作為設立信託財產之標的？","o":["動產","不動產","商譽","專利權"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":3,"t":"有關遺囑信託之敘述，下列何者錯誤？","o":["遺囑信託為單獨行為","立遺囑人應於生前預先將財產移轉予受託人","以遺囑設立信託者，應依民法所定遺囑之方式為之","立遺囑人得於遺囑中載明將其財產之全部或一部辦理信託"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":4,"t":"債權人就修繕信託財產之修繕費債權取得執行名義，是否得對信託財產強制執行？","o":["得強制執行","不得強制執行","視受益人同意與否而定","未獲委託人同意不得強制執行"],"a":"1","tp":"財產獨立性與強制執行","note":""},{"p":48,"s":1,"n":5,"t":"甲為契約信託之委託人，乙為受託人，丙為信託受益人，丁為信託監察人，下列何者對信託財產有管理處分權？","o":["丁","丙","乙","甲"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":6,"t":"有關私益信託之信託三大確定性，就財產須確定之原則，下列敘述何者正確？","o":["信託財產限於物權","信託財產限於現存者","委託人得對其無處分權之財產為移轉並確定","委託人須對該財產有處分權且須為受託人依法可取得之財產權"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":7,"t":"依信託法規定，有關受託人任務終了之原因，下列敘述何者錯誤？","o":["受託人解散","受託人逕行辭任","受託人破產宣告","受託人撤銷設立登記"],"a":"2","tp":"終止變更與剩餘財產歸屬","note":""},{"p":48,"s":1,"n":8,"t":"有關受益人之權利，下列敘述何者錯誤？","o":["對強制執行提起異議之訴","同意變更信託財產之方法","聲請撤銷受託人違反信託本旨處分信託財產之行為","單獨終止信託"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":48,"s":1,"n":9,"t":"他益信託情形下，關於信託財產管理方法之變更，下列敘述何者錯誤？","o":["得經委託人、受託人及受益人之同意變更","委託人死亡時，其繼承人得承繼行使該權利","委託人死亡後，僅需受託人與受益人同意即可","委託人、受益人或受託人得聲請法院變更之"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":10,"t":"受託人係為他人管理或處分信託財產，因此，受託人就信託財產或處理信託事務時，得行使抵充權，下列何者不是抵充權之範圍？","o":["受託人處理信託事務所支出之稅務","受託人處理信託事務所支出之費用","受託人處理信託事務所負擔之債務","受託人收取信託報酬應繳納之稅費"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":48,"s":1,"n":11,"t":"受託人有數人者，對受益人因信託行為負擔之債務，須負下列何種責任？","o":["分別清償責任","共同清償責任","不真正連帶責任","連帶清償責任"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":12,"t":"下列何者簽訂信託契約時，應另取得法定代理人之書面同意？","o":["限制行為能力人","受輔助宣告之人","破產人","未滿七歲之未成年人"],"a":"1","tp":"設立能力與監督管轄","note":""},{"p":48,"s":1,"n":13,"t":"依信託法規定，有關信託財產轉為受託人自有財產，下列敘述何者錯誤？","o":["憑受託人意願自由取得","受託人經受益人書面同意，並依市價取得","受託人係經由集中市場競價取得","受託人有不得已事由經法院許可取得"],"a":"1","tp":"財產獨立性與強制執行","note":""},{"p":48,"s":1,"n":14,"t":"公益信託之設立應經目的事業主管機關之許可，其許可之申請應由下列何人為之？","o":["委託人","受託人","受益人","信託監察人"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":48,"s":1,"n":15,"t":"依信託法規定，信託監察人有數人時，其職務之執行，下列敘述何者錯誤？","o":["信託財產之保存行為應全體同意始能為之","可依法院之指定方式為之","可依信託行為訂定之方式為之","如無其他特別約定，以過半數決之"],"a":"1","tp":"信託監察人","note":""},{"p":48,"s":1,"n":16,"t":"公益信託成立後發生信託行為當時不能預見之情事時，下列何者可參酌信託本旨，變更信託條款？","o":["信託監察人","法院","目的事業主管機關","委託人及受託人"],"a":"3","tp":"公益信託與監督機關","note":""},{"p":48,"s":1,"n":17,"t":"自益信託之信託關係因委託人死亡而消滅者，如無信託行為所定之歸屬權利人時，信託財產應優先歸屬於下列何者？","o":["國庫","受託人","委託人之繼承人","地方政府或自治團體"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":18,"t":"下列何者非屬公益信託「公共利益」之範疇？","o":["救助孤兒或棄嬰","資助傳染病防治","於委託人身故後，支應心愛寵物之開銷","促進生態保育"],"a":"3","tp":"公益信託與監督機關","note":""},{"p":48,"s":1,"n":19,"t":"信託法規定，下列何種信託行為無效？","o":["受託人處理信託事務時，因有必要而提出訴願或訴訟","以耕地為信託財產，並以私法人為耕地所生孳息之受益人","信託行為有害於委託人之債權人權利者","以耕地為信託財產，並以私法人為耕地所有權之受益人"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":20,"t":"呂美與甲銀行簽訂信託契約，由呂美交付新臺幣壹千萬元，指示甲銀行投資於國內上市公司股票，約明信託期間全部信託利益由其姐呂麗享有，則信託關係消滅時，下列敘述何者正確？","o":["信託財產歸屬之順序，信託契約所定者優先於呂美，呂美優先於呂麗","信託財產歸屬之順序，信託契約所定者優先於呂麗，呂麗優先於呂美或呂美之繼承人","信託財產歸屬之順序，信託契約未約定時，呂美與呂麗之順序相同","信託關係消滅時，受託人所製作之結算書及報告書不須取得呂麗之承認"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":48,"s":1,"n":21,"t":"下列敘述何者正確？","o":["非信託業得辦理不特定多數人委託經理信託業法第十六條之信託業務","信託業得辦理承諾擔保本金或最低收益率之信託業務","非信託業不得使用信託業或易使人誤認為信託業之名稱","證券投資信託事業優先適用信託業法之規定"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":48,"s":1,"n":22,"t":"信託業不得為下列何項之行為？","o":["於事先取得受益人書面同意，將信託財產存放於其銀行業務部門作為存款","依信託契約之約定，承諾擔保本金","依信託契約之約定，將不同信託之信託資金集合管理及運用","辦理委託人不指定營運範圍或方法之金錢信託業務"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":48,"s":1,"n":23,"t":"土地為信託財產者，應課徵土地增值稅之情形，下列何者正確？","o":["信託關係成立，委託人移轉信託財產於受託人時","因信託行為被撤銷，受託人移轉信託財產於委託人時","信託關係存續中，受託人將信託財產移轉為其自有財產時","信託關係存續中，受託人變更，原受託人移轉信託財產於新受託人時"],"a":"3","tp":"土地稅與土地增值稅","note":""},{"p":48,"s":1,"n":24,"t":"有關銀行兼營信託業務，下列敘述何者錯誤？","o":["營業及會計必須獨立","應指撥營運資金專款經營","不得以信託資金辦理放款","得洩露客戶資料予其他部門"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":48,"s":1,"n":25,"t":"依信託業法規定，除法律另有規定外，下列何者為“非信託業者”得辦理之業務？","o":["擔任金錢信託之信託監察人","接受不特定多數人之有價證券信託","接受不特定多數人之不動產信託","接受不特定多數人之金錢信託"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":48,"s":1,"n":26,"t":"有關信託業商業同業公會之敘述，下列何者錯誤？","o":["係為加強信託業自律功能所設","可增進委託人或受益人對信託業之信賴","公會之業務管理規則，由主管機關定之","信託業加入信託業商業同業公會非強制規定"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":48,"s":1,"n":27,"t":"有關信託業管理、運用或處分信託財產，下列敘述何者正確？","o":["信託業得以信託財產購買本身之不動產","信託業得以信託財產購買本身發行之股票","信託業不得以公司債信託財產讓售與信託業本身","信託業得以信託財產辦理銀行法第五條之二所定授信業務項目"],"a":"3","tp":"監理處分罰則與損害賠償","note":""},{"p":48,"s":1,"n":28,"t":"與信託業有下列何種關係之企業為信託業之利害關係人？","o":["兼營信託業之銀行分行襄理與他人合夥之事業","兼營信託業之銀行轉投資之企業，持股超過該企業已發行股份總數百分之三者","持有兼營信託業之銀行已發行股份總數百分之三之股東","兼營信託業銀行之總行經理因個人投資關係擔任董事之企業"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":48,"s":1,"n":29,"t":"有關信託業應負義務之敘述，下列何者錯誤？","o":["善良管理人之注意義務","忠實義務","分別管理義務","保證收益義務"],"a":"4","tp":"基本義務與契約記載事項","note":""},{"p":48,"s":1,"n":30,"t":"依信託業法規定，有關兼營信託業務銀行得經營之業務項目，下列敘述何者錯誤？","o":["出租保管箱業務","保證發行公司債券","擔任債券發行簽證人","提供投資及財務管理顧問服務"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":48,"s":1,"n":31,"t":"依「信託業負責人應具備資格條件暨經營與管理人員應具備信託專門學識或經驗準則」規定，下列何者屬信託業經營與管理人員之督導人員？","o":["財政部部長","銀行信託部之副理","總稽核","銀行分支機構之經理"],"a":"3","tp":"人員資格訓練與利益限制","note":""},{"p":48,"s":1,"n":32,"t":"信託業依信託業法提存之賠償準備金，下列敘述何者錯誤？","o":["受託人就該項賠償準備金有優先受償之權","賠償準備金得以現金方式提存","賠償準備金應繳存於中央銀行","賠償準備金應於取得營業執照後一個月內繳存"],"a":"1","tp":"賠償準備金與盈餘分配","note":""},{"p":48,"s":1,"n":33,"t":"依信託業法規定，信託業於法定盈餘公積未達資本總額前，其最高現金盈餘分配，不得超過其資本總額百分之多少？","o":["十","十五","三十","五十"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":48,"s":1,"n":34,"t":"信託業如發生存款不足退票等一定之重大事由，至遲應於事實發生翌日起幾日內向主管機關申報？","o":["一個營業日","二個營業日","三個營業日","五個營業日"],"a":"2","tp":"監理處分罰則與損害賠償","note":""},{"p":48,"s":1,"n":35,"t":"依信託業法規定，信託業不得以信託財產借入款項，但辦理下列何種業務並經全體受益人同意者，不在此限？","o":["動產之信託","著作權之信託","有價證券之信託","以開發為目的之土地信託"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":48,"s":1,"n":36,"t":"安先生因鑒於海洛因之製造買賣藏有暴利，因此出資五千萬交付海先生與其簽訂信託契約，由海先生依契約訂定之方式經營海洛因之製造買賣，收益歸安先生，並約明高額之信託報酬與海先生，該信託契約之法律效力為何？","o":["有效","效力未定","得撤銷","無效"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":37,"t":"信託業商業同業公會之理事有違反法令怠於實施該會章程、規則、濫用職權或違背誠實信用原則之行為時，主管機關得為下列何種處分？","o":["予以糾正或逕行解任該理事","予以糾正或命令監事解任該理事","予以糾正或命令該理事辭任","予以糾正或命令信託業商業同業公會解任該理事"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":48,"s":1,"n":38,"t":"信託業經主管機關指定外部機構或派員執行輔導所生之費用，應由下列何者負擔？","o":["主管機關","輔導機構","受輔導之信託業","金融重建基金"],"a":"3","tp":"監理處分罰則與損害賠償","note":""},{"p":48,"s":1,"n":39,"t":"信託業運用信託財產於國外投資者，應經下列何機關的同意？","o":["財政部","經濟部","中央銀行","金管會"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":1,"n":40,"t":"信託業法之訂定在健全信託業之經營與發展，並以保障委託人與下列何者之權益為目的？","o":["受託人","受益人","信託財產評審委員會","信託監察人"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":48,"s":1,"n":41,"t":"依銀行法規定，銀行經營下列何項業務時，應指撥營運資金專款經營？","o":["保證業務","簽發信用狀業務","信託業務","存款業務"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":48,"s":1,"n":42,"t":"信託業接受以股票或公司債券為信託者，除應為信託登記外，尚須通知下列何者？","o":["財政部","金管會證期局","外匯指定單位","發行公司"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":48,"s":1,"n":43,"t":"蔡先生交付銀行新臺幣貳佰萬元成立信託，其於信託契約中僅約定銀行購買國內債券型基金，但購買之時點與基金別授權銀行決定，此信託係屬於下列何種信託？","o":["指定單獨管理運用有價證券信託","指定單獨管理運用金錢信託","不指定單獨管理運用金錢信託","特定單獨管理運用金錢信託"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":48,"s":1,"n":44,"t":"信託業法對信託業自有財產之運用範圍，下列敘述何者正確？","o":["限信託業法第四十條有關信託業自有財產之運用範圍，惟兼營信託業務之銀行除外","信託業自有財產購買自用不動產之總額，不得超過該信託業之法定資本","信託業自有財產之運用範圍應於營業執照上載明之","信託業之自有財產不得投資上市及上櫃股票"],"a":"1","tp":"自有財產運用限制","note":""},{"p":48,"s":1,"n":45,"t":"有關信託業辦理信託業務，應向委託人揭露並明確告知之事項，下列敘述何者錯誤？","o":["信託報酬","可能涉及之風險","各項費用與其收取方式","投資風險應包含最大可能收益"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":48,"s":1,"n":46,"t":"信託業違反內部控制及內部稽核相關規定時，主管機關得依其情節為處罰，下列敘述何者錯誤？","o":["命令信託業解除或停止負責人之職務","停止一部或全部之業務","撤銷營業許可","處行為負責人三年以下有期徒刑"],"a":"4","tp":"內控稽核與風險管理","note":""},{"p":48,"s":1,"n":47,"t":"信託業對共同信託基金淨資產價值之計算期間及應為公告期限，下列何者得例外以共同信託基金契約約定辦理？","o":["黃金","公司債","金融債券","動產及不動產"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":48,"s":1,"n":48,"t":"依信託業內部控制及稽核制度實施辦法，信託公司營業單位襄理級以上人員之遴派，應以具有下列何種經驗者為優先？","o":["會計單位","外匯業務","存款業務","稽核單位"],"a":"4","tp":"內控稽核與風險管理","note":""},{"p":48,"s":1,"n":49,"t":"洪先生於一零七年七月五日與甲銀行簽訂信託契約，約定由其女洪小琳享受全部信託利益，信託金額約定為新臺幣一千萬元，並於七月七日及七月八日分別匯款五百萬元存入信託專戶，試問依遺產及贈與稅法之規定，下列何日為贈與行為之發生日？","o":["七月五日","七月六日","七月七日","七月八日"],"a":"1","tp":"遺產及贈與稅","note":""},{"p":48,"s":1,"n":50,"t":"以不動產為信託財產，受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，應由下列何人估價立契，課徵贈與契稅？","o":["委託人","受託人","歸屬權利人","享有信託孳息之受益人"],"a":"3","tp":"遺產及贈與稅","note":""},{"p":48,"s":2,"n":1,"t":"有關銀行兼營信託業務應遵守之規定，下列敘述何者錯誤？","o":["應設置獨立資本額","應提存賠償準備金","應設立信託財產評審委員會","營業及會計必須獨立"],"a":"1","tp":"經營組織與兼營獨立","note":""},{"p":48,"s":2,"n":2,"t":"下列何者屬於受託人不具有運用決定權之信託？","o":["特定集合管理運用金錢信託","指定營運範圍或方法之單獨管理運用金錢信託","指定營運範圍或方法之集合管理運用金錢信託","不指定營運範圍或方法之單獨管理運用金錢信託"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":48,"s":2,"n":3,"t":"黃先生以新臺幣三千萬元投資ABC 信託業發行之不動產投資信託受益證券，則黃先生應繳納之稅負，下列敘述何者正確？","o":["應繳納地價稅","應繳納土地增值稅","應繳納證券交易所得稅","應繳納利息所得並採分離課稅"],"a":"4","tp":"證券化商品分離課稅與交易稅","note":""},{"p":48,"s":2,"n":4,"t":"有關金融資產證券化之敘述，下列何者錯誤？","o":["本質上即為傳統所稱之「直接金融」","現金流量得委由服務機構代為管理","以證券化之特定金融資產為信用評等之基礎","創始機構應移轉資產予特殊目的機構"],"a":"1","tp":"證券化計畫與其他制度","note":""},{"p":48,"s":2,"n":5,"t":"銀行辦理特定金錢信託投資國外有價證券業務，下列敘述何者錯誤？","o":["以銀行為結匯申報人","信託資金得以外幣方式交付","結匯金額應計入委託人每年結匯額度內","投資標的得為符合一定條件之基金、債券或股票"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":6,"t":"有關企業員工持股信託業務，下列敘述何者錯誤？","o":["屬於一種準集團信託","員工得自由參加企業員工持股信託","員工持股會為非法人團體","因其投資標的為該公司之股票，故非屬金錢信託"],"a":"4","tp":"員工福利信託特性與制度","note":""},{"p":48,"s":2,"n":7,"t":"依「信託業建立非專業投資人商品適合度規章應遵循事項」規定，信託業界定商品風險等級前應確認之事項，下列敘述何者非屬之？","o":["商品之期限","商品之投資假設","商品風險報酬之合理性","受託投資之適當性及有無利益衝突情事"],"a":"1","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":48,"s":2,"n":8,"t":"委託人經由特定金錢信託業務投資共同基金時，應與受託銀行簽訂下列何種契約？","o":["買賣契約","信託契約","委任契約","代理契約"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":48,"s":2,"n":9,"t":"銀行辦理特定金錢信託投資國內外共同基金業務，下列敘述何者錯誤？","o":["委託人應負擔基金之申購、轉換、回贖等各項費用","委託人得委託受託銀行以定期定額方式投資","受託銀行應以委託人名義向國外相關機構辦理投資手續","受託銀行於委託人交付信託資金後，應發給信託憑證或對帳單或基金存摺以資為憑"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":48,"s":2,"n":10,"t":"下列何者非屬「預收款信託｣？","o":["禮券","生前契約","電子票證","抵用券"],"a":"4","tp":"預收款禮券與履約保障","note":""},{"p":48,"s":2,"n":11,"t":"受託銀行辦理特定金錢信託業務，對委託人投資基金運用之責任為何？","o":["保本","保息","不保本不保息","保本又保息"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":48,"s":2,"n":12,"t":"銀行辦理特定金錢信託投資境外基金時，所投資之基金原則上至少必須成立滿幾年？","o":["半年","一年","二年","三年"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":13,"t":"張三將現金一千萬元交付甲銀行成立信託，並約定五百萬元購買不動產，三百萬元購買股票，二百萬元存放於定期存款， 該信託屬信託業法中之下列何種信託？","o":["不動產信託","有價證券信託","金錢信託","其他財產權信託"],"a":"3","tp":"土地開發與不動產管理信託","note":""},{"p":48,"s":2,"n":14,"t":"有關特定金錢信託投資國外有價證券業務所收受信託資金之信託期限，下列何者正確？","o":["最少須為一個月","最多為五年","最多為二年","得不受限制"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":15,"t":"委託人透過銀行以特定金錢信託之方式投資於境外基金時，下列敘述何者正確？","o":["只限單筆投資","只限定期定額投資","信託項下之境外所得免納入個人基本所得額","投資標的如因主管機關修訂規範致有所不符，以單筆方式投資者，得按原訂契約繼續持有"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":16,"t":"特定金錢信託投資境外基金，其為增加投資效率持有衍生性商品未沖銷之風險暴露，不得超過該境外基金淨資產價值之多少？","o":["百分之十五","百分之二十","百分之三十","百分之四十"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":17,"t":"有關信託資金得投資之境外基金，該境外基金投資範圍之規定，下列敘述何者正確？","o":["不得投資衍生性商品","得投資商品現貨","得投資不動產","得投資境外指數股票型基金(ETF)"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":18,"t":"辦理「新臺幣」特定金錢信託投資「外幣」有價證券業務，下列何者正確？","o":["信託資金收受得以外幣為之","屆期本金返還得以外幣為之","期間收益攤還得以外幣為之","屆期本益攤還均應以新臺幣為之"],"a":"4","tp":"外匯結匯與國際金融業務","note":""},{"p":48,"s":2,"n":19,"t":"有價證券之信託與保管相比較，下列何者錯誤？","o":["兩者均須移轉有價證券之占有","採信託方式時，名義上應由受託人行使股東權利","兩者均須移轉有價證券之所有權","採保管方式時，得約定由受任人領取股息"],"a":"3","tp":"證券信託種類與保管差異","note":""},{"p":48,"s":2,"n":20,"t":"依中央銀行規定，銀行辦理新臺幣特定金錢信託投資國外有價證券業務（非大額）時，原則上外幣結匯是否占用委託人依中央銀行規定之每年結匯額度？","o":["自然人與法人均占用","自然人與法人均不占用","自然人占用、法人不占用","自然人不占用、法人占用"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":21,"t":"有關銀行辦理信託業務，所收受信託資金之管理運用，下列敘述何者錯誤？","o":["可以單獨管理運用","可以依客戶指示定期定額投資於國內基金","可以投資於國外有價證券","投資於未上市公司股票時不必辦理信託登記"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":48,"s":2,"n":22,"t":"史小姐與甲銀行簽訂信託契約，指定將新臺幣一百萬元投資於ABC 基金公司經理之境外基金，則在此信託關係中，下列敘述何者正確？","o":["史小姐為委託人","甲銀行為受益人","ABC 基金公司為受託人","新臺幣一百萬元為信託收益"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":23,"t":"詹先生經由銀行以特定金錢信託投資境外基金，下列敘述何者錯誤？","o":["詹先生應交付信託資金","詹先生應指定運用標的","詹先生毋須支付任何費用","詹先生不得要求銀行保證最低收益"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":24,"t":"有關信託財產評審委員會對特定金錢信託業務之審查方式，下列敘述何者正確？","o":["應逐案加以審查","信託財產交付金額為新臺幣4,000 萬元，抽查比率不得低於百分之五","因信託業不具運用決定權故無須審查與報告","由專責部門就信託財產彙總運用概況提出報告"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":48,"s":2,"n":25,"t":"有關非專業投資人特定金錢信託投資國外有價證券業務項下所能投資之標的，下列敘述何者錯誤？","o":["經金管會核准之境外基金","向金管會申報生效之境外基金","大陸企業赴海外發行之公司債","符合一定信用評等以上之美國公司債券"],"a":"3","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":48,"s":2,"n":26,"t":"有關「滾入平均成本法」之敘述，下列何者錯誤？","o":["是一種定期定額投資理財方式","對一種股票做機械式之定期定額連續投資","股價上揚時購入之成本提高，總持有股票之價值減少","長期而言，平均投資成本通常會比一般單筆投資之成本低"],"a":"3","tp":"投資運用與分別管理","note":""},{"p":48,"s":2,"n":27,"t":"企業員工持股信託之委託人死亡時，該委託人之信託關係消滅，其信託財產應歸屬下列何者？","o":["受託人","員工持股會代表人","委託人之繼承人","員工持股會之其他會員"],"a":"3","tp":"持股會組織協議與當事人","note":""},{"p":48,"s":2,"n":28,"t":"有關企業員工持股信託業務，下列敘述何者錯誤？","o":["員工得自由決定是否加入員工持股會","員工入會時，應填具員工持股會入會申請書","員工持股會代表人代表全體會員與公司簽訂協議書","公司負責人代表全體會員與受託人簽訂信託契約"],"a":"4","tp":"員工福利信託特性與制度","note":""},{"p":48,"s":2,"n":29,"t":"信託業辦理「企業員工福利及儲蓄信託」業務所簽訂之信託契約，其委託人為下列何者？","o":["員工福利及儲蓄信託委員會","員工福利及儲蓄信託委員會之代表人","參加委員會之員工本人","企業之代表人"],"a":"3","tp":"持股會組織協議與當事人","note":""},{"p":48,"s":2,"n":30,"t":"企業員工持股信託之投資風險係由下列何者承擔？","o":["委託人","受託人","員工持股會","員工服務之公司"],"a":"1","tp":"投資運用與分別管理","note":""},{"p":48,"s":2,"n":31,"t":"受託人參加企業員工持股信託持有股票之股東會，議決權應如何行使？","o":["依持股會代表人之指示統一行使","依持股會會員之指示分別行使","依持股會委員之指示分別行使","依受託人之意思行使"],"a":"1","tp":"持股會組織協議與當事人","note":""},{"p":48,"s":2,"n":32,"t":"企業員工持股信託投資標的之公司召開股東會時，有關其議決權之行使，下列敘述何者正確？","o":["受託人可成為公司董監事選舉之候選人","持有之股東表決權可由持股會代表人行使","持有之股票表決權可由委託人行使","遇董監事改選時，具有之表決權可分別支持數人"],"a":"4","tp":"投資運用與分別管理","note":""},{"p":48,"s":2,"n":33,"t":"辦理企業員工持股信託業務時，有關公司獎助金提撥方式之協議書，係由下列何者共同簽訂？","o":["委託人與受託人","公司與受託銀行","員工持股會會員與公司","員工持股會代表人與公司"],"a":"4","tp":"持股會組織協議與當事人","note":""},{"p":48,"s":2,"n":34,"t":"有關企業員工持股信託業務，倘委託人於信託期間，因其個人不得已事由而中途退出時，應經下列何者審核通過？","o":["受託人","受益人","員工持股會代表人","該公司董事會"],"a":"3","tp":"持股會組織協議與當事人","note":""},{"p":48,"s":2,"n":35,"t":"有關企業員工持股信託業務之發展概況，下列敘述何者錯誤？","o":["係源自美國員工持股信託及日本從業員持株信託制度","開辦初期僅限國內第一類股票上市公司辦理","現已放寬至股票上市上櫃公司（含全額交割股）皆可辦理","未上市上櫃公司之員工得投資購買其關係企業之上市櫃股票"],"a":"3","tp":"員工福利信託特性與制度","note":""},{"p":48,"s":2,"n":36,"t":"委託人為營利事業成立確定受益人之他益有價證券信託時，須由下列何者課稅？","o":["由營利事業法人繳納贈與稅","由營利事業法人繳納所得稅","由受益人繳納贈與稅","由受益人繳納所得稅"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":48,"s":2,"n":37,"t":"本金自益孳息他益之有價證券信託，孳息受益人所獲配之現金及股票股利，於申報繳納所得稅時，將併入下列何者之當年度所得計算？","o":["委託人","受益人","委託人及受益人各一半","受託人"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":48,"s":2,"n":38,"t":"有關有價證券信託之公示登記制度，下列敘述何者錯誤？","o":["有價證券係屬信託法規定應登記之財產權","信託業接受股票為信託者，應通知發行公司","若未於有價證券上載明為信託財產，則信託契約無效","公開發行公司股票已辦理信託過戶作業者，視為符合通知發行公司之規定"],"a":"3","tp":"證券信託種類與保管差異","note":""},{"p":48,"s":2,"n":39,"t":"下列何者以其持有之公司股票為信託時，雖涉及信託關係股權移轉之異動登記，不需辦理股權申報？","o":["董事","監察人","經理人","持有公司股份總額百分之五之大股東"],"a":"4","tp":"內部人持股申報與權益行使","note":""},{"p":48,"s":2,"n":40,"t":"委託人與受託人簽訂有價證券信託契約，以有價證券之保管、股利及股息之收取為目的，一般稱之為何種信託？","o":["管理型有價證券信託","租賃型有價證券信託","運用型有價證券信託","處分型有價證券信託"],"a":"1","tp":"內部人持股申報與權益行使","note":""},{"p":48,"s":2,"n":41,"t":"受託機構如擬於國外募集不動產投資信託基金投資國內不動產者，於申請核准或申報生效募集前，應先報請下列何者同意？","o":["經濟部","內政部","中央銀行","財政部"],"a":"3","tp":"REIT募集投資標的與限制","note":""},{"p":48,"s":2,"n":42,"t":"有關不動產投資信託基金之會計處理，下列敘述何者錯誤？","o":["不動產投資信託基金之投資所得，應每年分配","受託機構對於所募集或私募之不動產投資信託基金，應有獨立之會計","受託機構因運用、管理所產生之費用及稅捐，得逕自信託財產中扣除繳納之","依不動產投資信託契約約定應分配之收益，至遲應於會計年度結束後一年內分配"],"a":"4","tp":"REIT募集投資標的與限制","note":""},{"p":48,"s":2,"n":43,"t":"依民法規定，不動產物權中所稱擔保物權包括下列何者？","o":["抵押權","永佃權","地役權","地上權"],"a":"1","tp":"土地開發與不動產管理信託","note":""},{"p":48,"s":2,"n":44,"t":"不動產證券化條例受益證券之發行主體為下列何者？","o":["受託機構","承銷商","發起人","安排機構"],"a":"1","tp":"不動產證券化共通規定","note":""},{"p":48,"s":2,"n":45,"t":"為能達到不動產證券化受益權分散之目的，原則上信託契約應載明～所有受益證券持有人，於每一年度中至少有三百三十五日，合計應達多少人以上？","o":["35 人","50 人","75 人","100 人"],"a":"2","tp":"不動產證券化共通規定","note":""},{"p":48,"s":2,"n":46,"t":"依不動產證券化條例規定，有關受託機構依不動產投資信託契約之約定，以信託財產借入款項之目的，下列敘述何者錯誤？","o":["以配發孳息為目的","以配發利益為目的","以不動產營運為目的","為轉投資其他不動產相關行業為目的"],"a":"4","tp":"REIT募集投資標的與限制","note":""},{"p":48,"s":2,"n":47,"t":"有關不動產資產信託契約得移轉之財產權敘述，下列何者非屬之？","o":["出租中之商業辦公大樓","出租中之工業廠房","南京東路旁興建中之辦公大樓","地上權"],"a":"3","tp":"REAT資產信託與證券發行","note":""},{"p":48,"s":2,"n":48,"t":"依不動產證券化條例規定，不動產證券化受益證券持有人之收益分配請求權，自發放日起幾年間不行使而消滅？","o":["五年","十年","十五年","二十年"],"a":"1","tp":"不動產證券化共通規定","note":""},{"p":48,"s":2,"n":49,"t":"依不動產證券化條例規定，本條例主管機關為下列何者？","o":["財政部","內政部","經濟部","金融監督管理委員會"],"a":"4","tp":"不動產證券化共通規定","note":""},{"p":48,"s":2,"n":50,"t":"有關金融資產證券化之特性，下列敘述何者正確？","o":["由創始機構發行有價證券","其信用評等與創始機構有關","創始機構應移轉資產予服務機構","投資人之收益來自特定金融資產之現金流量"],"a":"4","tp":"證券化特性與經濟效益","note":""},{"p":48,"s":2,"n":51,"t":"有關金融資產證券化之受益證券，下列敘述何者錯誤？","o":["應為記名式","可以帳簿劃撥方式交付","不得印製實體有價證券","非將受讓人之姓名或名稱、住所通知受託機構，不得對抗受託機構"],"a":"3","tp":"受益證券募集發行與受益人會議","note":""},{"p":48,"s":2,"n":52,"t":"有關金融資產證券化對金融機構之效益，下列敘述何者錯誤？","o":["降低資金調度成本","處分自有不動產","分散金融資產風險","提高金融資產之流動性"],"a":"2","tp":"證券化特性與經濟效益","note":""},{"p":48,"s":2,"n":53,"t":"有關我國金融資產證券化條例所採行之導管體，下列敘述何者正確？","o":["僅採特殊目的公司體制","僅採特殊目的信託體制","特殊目的公司與特殊目的信託之雙軌制體制","特殊目的公司、特殊目的信託及無限合夥三體制"],"a":"3","tp":"證券化特性與經濟效益","note":""},{"p":48,"s":2,"n":54,"t":"依金融資產證券化條例規定，下列何者受託機構不得以信託財產充之？","o":["信託監察人之報酬","因處理事務所支出之必要費用","可歸責於自己事由所受損害之補償","非可歸責於自己事由所受損害之補償"],"a":"3","tp":"特殊目的信託公司與參與機構","note":""},{"p":48,"s":2,"n":55,"t":"有關金融資產證券化信託監察人之敘述，下列何者錯誤？","o":["負善良管理人之注意義務","創始機構與服務機構不得擔任信託監察人","信託監察人得視狀況由創始機構選任","得以自己之名義為資產基礎證券持有人為訴訟上或訴訟外之行為"],"a":"3","tp":"特殊目的信託公司與參與機構","note":""},{"p":48,"s":2,"n":56,"t":"金融資產證券化架構下，有關內部信用增強機制，下列敘述何者錯誤？","o":["提供超額資產","運用優先劣後架構","現金準備帳戶","投保信用保險"],"a":"4","tp":"信用增強評等與風險分散","note":""},{"p":48,"s":2,"n":57,"t":"有關全權委託投資保管銀行之作業，下列敘述何者錯誤？","o":["保管銀行應按客戶別設帳保管","委託投資之資金應分批存入保管銀行","受任人及保管銀行之自有財產應與全權委託投資之資產分別獨立管理","除法令另有規定外，全權委託投資之資產如為有價證券，應由保管銀行委託集保公司保管"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":48,"s":2,"n":58,"t":"甲為兼營信託業務之銀行，並投資於乙投信公司百分之十二之股份，在下列何種情況下才可以擔任乙投信公司所募集證券投資信託基金之保管機構？","o":["限創業基金","不擔任董、監事","不擔任簽證銀行","經主管機關核准"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":48,"s":2,"n":59,"t":"有關保管銀行之敘述，下列何者錯誤？","o":["境外外國人投資之國內有價證券不須指定保管銀行保管","保險公司銷售之投資型保險商品專設帳簿資產須指定保管銀行保管","境外外國投資機構投資人投資之國內有價證券須指定保管銀行保管","經營全權委託投資業務之證券投資顧問事業依規定繳存之營業保證金須指定保管銀行保管"],"a":"1","tp":"其他資產保管與營業保證金","note":""},{"p":48,"s":2,"n":60,"t":"信託業應於會計年度終了後至遲幾個月內，就各集合管理運用帳戶分別編具集合管理運用信託財產年度決算報告？","o":["一個月","二個月","三個月","四個月"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":48,"s":2,"n":61,"t":"有關擔任華僑及外國人投資國內有價證券保管機構之作業，下列敘述何者錯誤？","o":["保管機構不得擔任僑外資之國內代理人","帳務處理實務採權責發生制","提供上市櫃公司重大資訊之通知","以保管機構受託保管專戶名義開設帳戶"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":48,"s":2,"n":62,"t":"全權委託投資之三方權義協定書係由委任人及保管銀行與下列何者簽訂？","o":["證券商","台灣證券集中保管公司","投信投顧公會","證券投資信託事業或證券投資顧問事業"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":48,"s":2,"n":63,"t":"有關基金保管機構依投信 金錢信託時，其營運範圍不包括下列何者？","o":["現金","公債","上市股票","發行人經主管機關認可之信用評等機構評等達一定等級以上之公司債"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":49,"s":1,"n":35,"t":"信託業募集共同信託基金發行之受益證券，應採下列何種方式？","o":["記名式","無記名式","空白式","可由客戶自行決定為記名式或無記名式"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":49,"s":1,"n":36,"t":"依信託業法規定，信託財產評審委員會應將信託財產每幾個月評審一次，報告董事會？","o":["一個月","三個月","六個月","九個月"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":49,"s":1,"n":37,"t":"依信託業法規定，除其他法律或主管機關另有規定者外，下列何者不是指定用途信託資金契約應記載事項？","o":["信託存續期間","信託財產管理及運用方法","受託人之報酬標準","信託財產之預期報酬率"],"a":"4","tp":"基本義務與契約記載事項","note":""},{"p":49,"s":1,"n":38,"t":"下列敘述何者錯誤？","o":["信託業法所稱對信託財產具有運用決定權者，於信託公司，指對信託財產之運用具有最後核定權限之主管及人員","信託業法所定信託業經營之業務項目，以委託人交付、移轉或為其他處分之財產種類，定其分類","信託財產，應以信託業之信託財產名義表彰之。但信託財產運用於國外之投資標的時，得依信託業與國外受託保管機構所訂契約之約定辦理","信託業法所稱有價證券之信託，係指受託人接受信託財產為金錢，以該金錢投資於有價證券者"],"a":"4","tp":"業務種類與交付財產分類","note":""},{"p":49,"s":1,"n":39,"t":"兼營信託業務之銀行，其業務之經營涉及得全權決定運用標的，且將信託財產運用於證券交易法第六條規定之有價證券時，依信託業法規定應申請兼營下列何種業務？","o":["證券投資信託業務","證券投資顧問業務","證券自營商業務","證券承銷商業務"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":49,"s":1,"n":40,"t":"有關信託業募集發行共同信託基金及成立日係以下列何者為基準？","o":["經主管機關核准之日","向主管機關申請之日","經主管機關核准之次日","經主管機關核准後3 日"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":49,"s":1,"n":41,"t":"信託業運用信託財產於國外投資者，應經下列何機關的同意？","o":["財政部","中央銀行","經濟部","金管會"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":1,"n":42,"t":"有關信託業經核准募集共同信託基金後，主管機關得廢止其核准之情形，不含下列何者？","o":["信託監察人辭任","未於所定期限內開始募集","辦理共同基金業務有虛偽之情事","發生對受益人有重大影響事項且未於事實發生之起二個營業日內公告"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":49,"s":1,"n":43,"t":"本國銀行或外國銀行之各分支機構辦理信託業務，下列敘述何者正確？","o":["得辦理經主管機關核准之業務","經信託公會之核准，得辦理信託財產之管理、運用及處分","原則上除信託財產之收受外，亦得辦理信託財產之管理、運用及處分","原則上得辦理與總行信託業務專責部門所有業務，包括信託財產之管理、運用及處分"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":49,"s":1,"n":44,"t":"依信託業法規定，信託業應由具有專門學識或經驗之人員經營與管理，有關該等規定，下列敘述何者錯誤？","o":["信託業之董事應有一定比例具備","信託業之監察人應有一定比例具備","信託業之督導、管理及業務人員均應具備","由信託業定期舉辦專門學識及經驗之測驗"],"a":"4","tp":"人員資格訓練與利益限制","note":""},{"p":49,"s":1,"n":45,"t":"依信託業法規定，有關「金錢之信託」之敘述，下列何者錯誤？","o":["辦理保管業務係屬信託業法規定信託業得經營之「金錢之信託」業務項目", ,"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":7,"t":"有關在我國銷售之境外基金管理機構條件，下列敘述何者錯誤？","o":["成立滿二年以上","於我國境內設有分公司者","最近二年未受當地主管機關處分並有紀錄在案者","管理以公開募集方式集資投資於證券之基金總資產淨值（不含退休基金或全權委託帳戶）超過20 億美元者"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":8,"t":"有關銀行辦理特定金錢信託投資境外基金業務，下列何者為該境外基金可投資之標的？","o":["不動產","黃金","商品現貨","美國證券集中交易市場交易之股票"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":9,"t":"信託業法所規範之信託資金，在實務上係屬於下列何種信託？","o":["不動產信託","金錢信託","專利權信託","動產信託"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":49,"s":2,"n":10,"t":"客戶與銀行簽訂信託契約，交付新臺幣一百萬元信託資金，指定投資於國內證券投資信託基金時，係屬於下列何種信託？","o":["金錢債權之信託","金錢之信託","有價證券之信託","其他財產權之信託"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":49,"s":2,"n":11,"t":"有關特定金錢信託之信託財產運用決定權，下列敘述何者正確？ A.委託人具有運用決定權 B.受託人具有運用決定權 C.委託人指定之第三人具有運用決定權 D.受託人指定之第三人具有運用決定權","o":["僅AB","僅BC","僅AC","僅CD"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":49,"s":2,"n":12,"t":"銀行辦理特定金錢信託時，對本金及收益之敘述，下列何者正確？","o":["不保本不保息","視銀行與客戶訂立之契約而定","可以保障本金與最低收益","只保障本金，不保障最低收益"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":49,"s":2,"n":13,"t":"依中央銀行規定，銀行辦理新臺幣特定金錢信託投資國外有價證券業務時，有關外幣結購或結售，應計入下列何者每年之結匯額度？","o":["委託人","受託銀行","受益人","不計入任何人的結匯額度"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":14,"t":"有關特定金錢信託投資國外基金業務，下列何者錯誤？","o":["應依中央銀行規定填送各種報表","應提供境外基金之投資人須知予客戶","由於投資標的係由客戶指定，故不須作信託財產評審","主管機關開放銀行辦理「自行質借｣業務"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":15,"t":"有關銀行辦理特定金錢信託業務，下列敘述何者錯誤？","o":["以新台幣信託資金投資國外時，得以受託人名義結匯","投資之本金得辦理無本金交割之新台幣與外幣間遠期外匯交易","每次辦理新台幣結匯匯出投資國外時，應將委託人之相關資料提供予結匯銀行","應將符合境外基金短線交易投資人資料，於投資人申請買回次一營業日下午五時前提供予總代理人"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":49,"s":2,"n":16,"t":"陳先生去年定期定額申購甲新興市場基金，目前仍持續扣款中，若今年三月起，甲新興市場基金因故終止或暫停在國內募集及銷售，陳先生可採取的措施為何？","o":["得按原訂契約金額繼續投資","可增加該筆定期定額扣款金額","可先停扣該筆定期定額投資，三個月後更改日期繼續投資","可停扣該筆定期定額投資，但須強制贖回該基金所有投資金額"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":17,"t":"有關充分瞭解客戶(KYC)所應留存之基本資料，下列何者正確？ A.財務背景 B.資金來源 C.健康狀態","o":["僅AB","僅BC","僅AC","ABC"],"a":"1","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":49,"s":2,"n":18,"t":"有關信託業辦理特定金錢信託投資國外有價證券業務應遵守之事項，下列敘述何者錯誤？","o":["投資標的涉及連動債券時，應揭露個別商品條件與所涉風險","為提供客戶充足投資資訊，應主動寄送特定商品說明書予一般大眾","其自交易對手取得之信託報酬事項，應將相關內容納入信託契約中","境外基金投資人須知須按季更新，其範本由投信投顧公會擬訂，報金管會核定"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":19,"t":"銀行辦理特定金錢信託投資國外有價證券業務時，有關委託人投資期限之敘述，下列何者正確？","o":["以一年為限","以二至五年為限","以十五年為限","無最長期限規範"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":20,"t":"依據信託財產評審委員會之組織及評審規範，對於受託人就信託財產具有運用決定權之信託，信託財產評審委員會評審時，其信託財產交付金額達新臺幣五千萬元以上者，其抽查比率不得低於多少？","o":["百分之三","百分之四","百分之五","百分之六"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":49,"s":2,"n":21,"t":"目前有關特定金錢信託之限制，下列敘述何者錯誤？","o":["信託資金期限並無限制","信託資金得以新台幣或外幣交付","保本型之結構式商品可納入信託資金投資國外有價證券之選擇範圍","投資國外有價證券標的以購買國外銀行發行之定期存單或外國政府機構在公開市場出售之國庫券或公債為限"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":49,"s":2,"n":22,"t":"依境外基金管理辦法規定，銷售機構以自己名義為投資人投資時，應經由證券集中保管事業指定之銀行專戶辦理，信託業依特定金錢信託契約為客戶投資境外基金時，下列敘述何者正確？","o":["應比照辦理","得免受限制","經申請得免適用","由信託客戶決定"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":49,"s":2,"n":23,"t":"現行企業員工持股信託於信託終了返還信託財產時，應負擔之稅負為何？","o":["由信託財產中扣除所得稅","列入受益人當年度之綜合所得稅","無需課稅","由員工持股會負擔證券交易稅"],"a":"3","tp":"員工持股信託的課稅與返還","note":""},{"p":49,"s":2,"n":24,"t":"企業員工持股信託有關信託事務之指示由下列何者出具？","o":["員工持股會之代表人","受託人","成立員工持股會之公司","員工持股會"],"a":"1","tp":"員工福利信託特性與制度","note":""},{"p":49,"s":2,"n":25,"t":"有關企業員工持股信託之投資運用管理，下列敘述何者錯誤？","o":["以長期持股為投資方針","採滾入平均成本法分散風險","信託業不得承諾擔保本金或最低收益","公司應盡力維持股價以穩定員工向心力"],"a":"4","tp":"投資運用與分別管理","note":""},{"p":49,"s":2,"n":26,"t":"下列何者可為企業員工持股信託業務之受託人？","o":["證券投資顧問公司","特殊目的公司","證券投資信託公司","兼營信託業務之銀行"],"a":"4","tp":"持股會組織協議與當事人","note":""},{"p":49,"s":2,"n":27,"t":"有關企業員工持股信託業務之投資運用風險，係由下列何者承擔？","o":["委託人","受託人","員工持股會代表人","公司代表人"],"a":"1","tp":"投資運用與分別管理","note":""},{"p":49,"s":2,"n":28,"t":"員工持股信託所投資標的之發行公司有改選董監事時，下列何者錯誤？","o":["受託人應依員工持股會代表人之指示行使議決權","員工持股會代表人得自行行使議決權","受託人可支持多數候選人","受託人不可為董監事候選人"],"a":"2","tp":"投資運用與分別管理","note":""},{"p":49,"s":2,"n":29,"t":"有關「滾入平均成本法」之敘述，下列何者錯誤？","o":["是一種定期定額投資理財方式","對一種股票做機械式之定期定額連續投資","股價上揚時購入之成本提高，總持有股票之價值減少","長期而言，平均投資成本通常會比一般單筆投資之成本低"],"a":"3","tp":"投資運用與分別管理","note":""},{"p":49,"s":2,"n":30,"t":"甲公司員工成立乙員工持股會並選任丙為員工持股會之代表人，委託丁銀行為受託人辦理企業員工持股信託業務，並向戊證券商下單交易。下列何者與甲公司簽訂協議書，約定獎助金之提撥獎助方式？","o":["乙員工持股會","丙員工持股會之代表人","丁銀行","戊證券商"],"a":"2","tp":"持股會組織協議與當事人","note":""},{"p":49,"s":2,"n":31,"t":"有關企業員工持股信託，下述敘述何者正確？","o":["因會員提撥資金投資股票，故屬金錢信託","委託人或員工持股會代表人得要求受託人分割行使議決權","因投資標的為股票，故屬有價證券信託","會員因死亡、退休或留職停薪，不得申請退會"],"a":"1","tp":"員工福利信託特性與制度","note":""},{"p":49,"s":2,"n":32,"t":"下列何者非屬有價證券信託可受理之標的？","o":["商品優惠券","政府債券","新股權利證書","記名式公司股票"],"a":"1","tp":"證券信託種類與保管差異","note":""},{"p":49,"s":2,"n":33,"t":"「借券信託」是屬於下列何類型有價證券信託？","o":["管理型有價證券信託","運用型有價證券信託","處分型有價證券信託","保管型有價證券信託"],"a":"2","tp":"有價證券借貸交易與擔保","note":""},{"p":49,"s":2,"n":34,"t":"有關有價證券信託之敘述，下列何者正確？","o":["一般可分為管理型、運用型及處分型","僅信託財產為股票及公債時方須辦理信託登記","辦理有價證券借貸時並無任何法令限制","委託人將有價證券交付信託時，應繳交證券交易稅"],"a":"1","tp":"證券信託種類與保管差異","note":""},{"p":49,"s":2,"n":35,"t":"有關有價證券信託業務，下列何種行為無須課徵證券交易稅？","o":["受託人將信託財產中之有價證券轉為自有財產","受託人將自有財產中之有價證券轉為其管理運用信託財產","有價證券信託成立時，委託人將有價證券移轉予受託人","受託人將信託財產中之有價證券轉為受託人其他信託財產中之有價證券"],"a":"3","tp":"證券交易稅","note":""},{"p":49,"s":2,"n":36,"t":"依信託法及信託業法規定，有關信託公示之敘述，下列何者錯誤？","o":["信託公示為信託關係之生效要件","以股票為信託者，應通知發行公司","應於證券或其他表彰權利之文件上載明為信託財產","非依目的事業主管機關之規定辦理信託公示者，不得對抗第三人"],"a":"1","tp":"登記公示與對抗效力","note":""},{"p":49,"s":2,"n":37,"t":"依有價證券集中保管帳簿劃撥作業辦法規定，信託業接受委託人交付上市公司股票信託時，得透過下列何者通知發行公司，以符合信託公示登記之規定？","o":["證券集中保管事業","證券商","台灣證券交易所","信託公會"],"a":"1","tp":"證券信託種類與保管差異","note":""},{"p":49,"s":2,"n":38,"t":"有關公開發行公司董事為委託人以該公司股份成立有價證券信託之申報，下列敘述何者錯誤？","o":["應辦理股票轉讓事前申報","董事保留運用決定權之交付信託股份不得計入證券交易法規定計算之全體董事、監察人所持有記名股票之最低持股數","於轉讓之次月五日應向所屬公司申報上月份持股異動","董事保留運用決定權之交付信託股份，嗣後股份變動仍續由該位董事依規定辦理申報"],"a":"2","tp":"內部人持股申報與權益行使","note":""},{"p":49,"s":2,"n":39,"t":"有關有價證券信託之敘述，下列何者錯誤？","o":["無記名式之有價證券得為成立信託之標的","認股權證不得為成立信託之標的","自信託成立時起，至信託終了止，並不以始終保持該有價證券原狀為必要","所稱之有價證券，係指表彰具有財產價值之私有權益證券，其權益之發生、移轉或行使，須全部或一部以證券形式為之者而言"],"a":"2","tp":"證券信託種類與保管差異","note":""},{"p":49,"s":2,"n":40,"t":"由受託機構依不動產證券化條例募集發行或私募交付受益證券，以投資不動產、不動產相關權利、不動產相關有價證券等而成立之信託業務名稱，下列何者正確？","o":[" 無需任何意思表示，當然享受","受益人要對外宣示方得享受","尚未出生之嬰兒，無權享受"],"a":"2","tp":"受益人權利與撤銷救濟","note":""},{"p":50,"s":1,"n":10,"t":"有關受託人報酬之敘述，下列何者錯誤？","o":["受託人係信託業或信託行為訂有給付報酬者，得請求報酬","受託人因管理不當致信託財產發生損害時，委託人、受益人或其他受託人得請求減免報酬","受託人處理信託事務之報酬，得以信託財產充之","受託人之報酬有優先於信託財產無擔保債權人受償之權"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":50,"s":1,"n":11,"t":"下列信託關係人中，何者僅需具有權利能力？","o":["委託人","受益人","受託人","委託人與受託人"],"a":"2","tp":"設立能力與監督管轄","note":""},{"p":50,"s":1,"n":12,"t":"他益信託之委託人，得於信託條款中保留下列何種權利？","o":["隨時解任受託人之權利","變更受益人之權利","限制委託人之債權人聲請法院撤銷信託之權利","限制信託前存在於該財產之抵押權人聲請強制執行信託財產之權利"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":50,"s":1,"n":13,"t":"依信託法規定，私益信託之受託人如違反分別管理義務，未將信託財產與自有財產分別管理而獲得利益者，委託人或受益人得為下列何種請求或主張？","o":["請求將所獲利益歸於信託財產","逕行解任受託人，不必向法院聲請","請求將所獲利益歸於委託人","請求將所獲利益歸於受益人"],"a":"1","tp":"財產獨立性與強制執行","note":""},{"p":50,"s":1,"n":14,"t":"依信託法規定，信託監察人得以下列何者名義，為受益人為有關信託之訴訟上或訴訟外之行為？","o":["自己","委託人","受託人","信託財產"],"a":"1","tp":"信託監察人","note":""},{"p":50,"s":1,"n":15,"t":"有關信託之監督，下列敘述何者錯誤？","o":["營業信託由信託業主管機關監督","公益信託由目的事業主管機關監督","一般民事信託之私益信託由法院監督","私益信託由中華民國信託業商業同業公會監督"],"a":"4","tp":"設立能力與監督管轄","note":""},{"p":50,"s":1,"n":16,"t":"以下列何者為目的設立之信託非為公益信託？","o":["以推動慈善為目的","以提升文化為目的","以家族企業利益為目的","以獎勵學術為目的"],"a":"3","tp":"公益信託與監督機關","note":""},{"p":50,"s":1,"n":17,"t":"有關聲請法院選任信託監察人之敘述，下列何者錯誤？","o":["受益人不特定或尚未存在","為保護受益人之利益認有必要","聲請人限檢察官","受監護或輔助宣告之人，不得為信託監察人"],"a":"3","tp":"信託監察人","note":""},{"p":50,"s":1,"n":18,"t":"有關公益信託與財團法人之敘述，下列何者錯誤？","o":["兩者同是以公共利益為目的","公益信託須特別創設一權利義務主體","公益信託不必向法院為法人登記","財團法人須設獨立事務所"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":50,"s":1,"n":19,"t":"甲以其子丙為受益人成立信託，信託期間十年，且於信託契約中未有其他特別或保留約定，五年後因丙積欠債務，甲欲提前終止本信託關係，應如何辦理？","o":["須由甲與丙共同終止","甲單獨提出終止即可","須丙之債權人同意","須向法院聲請終止"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":50,"s":1,"n":20,"t":"張五先生與甲銀行簽訂信託契約，交付新臺幣五千萬元予該銀行，並約定由甲銀行投資於Ａ基金，不得投資於其它標的，信託期間一年，並約定僅王美女士得享受信託利益，他人不得享有，則下列敘述何者錯誤？","o":["信託關係於信託期間一年屆滿，而信託關係消滅","王美於信託契約成立後六個月死亡，信託契約繼續有效","該基金經我國政府宣告不得投資，並限期所有持有人須立即贖回者，信託關係將隨之消滅","Ａ基金被合併而消滅時，信託關係消滅"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":50,"s":1,"n":21,"t":"申請設立信託公司辦理有價證券信託業務，其最低實收資本額為新臺幣多少元？","o":["五億元","十億元","二十億元","三十億元"],"a":"3","tp":"設立標準與分支機構","note":""},{"p":50,"s":1,"n":22,"t":"依信託業設立標準規定，有關申請設立信託公司之型態，下列何者正確？","o":["得為公開發行公司","應為公開發行公司","應為上市公司","應為上市或上櫃公司"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":50,"s":1,"n":23,"t":"依信託業設立標準規定，信託公司之發起人及股東，除金融控股公司或符合特定資格條件之銀行或保險機構或基金管理機構及不動產管理機構外，同一人或同一關係人持有同一信託公司之股份，分別不得超過該公司已發行股份總數之多少比例？","o":["百分之五十","百分之四十","百分之三十","百分之二十五"],"a":"4","tp":"設立標準與分支機構","note":""},{"p":50,"s":1,"n":24,"t":"對信託財產具有運用決定權之信託業，有關其經營業務應遵守之規定，下列何者正確？","o":["僅能辦理信託業法第十六條規定之信託業務及第十七條規定之附屬業務","以信託財產辦理放款時，應盡善良管理人之注意義務","為提高銀行整體利益之考量，得將管理或處分信託財產之消息提供給銀行其他部門","為提供信託財產之運用績效，必要時得以信託財產借入款項"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":50,"s":1,"n":25,"t":"有關信託業之利害關係人之敘述，下列何者錯誤？","o":["擔任信託業負責人或兼營信託業務之銀行負責人","信託業或兼營信託業務之銀行持股比例超過百分之五之企業","持有信託業或兼營信託業務之銀行已發行股份總數或資本總額百分之三以上者","對於信託財產之運用具有最後核定權限之主管及人員"],"a":"3","tp":"利害關係人與利益衝突","note":""},{"p":50,"s":1,"n":26,"t":"下列何者不屬於信託業得經營之業務或附屬業務？","o":["著作權之信託","擔任信託監察人","擔任遺囑執行人及遺產管理人","辦理有價證券買賣融資融券業務"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":50,"s":1,"n":27,"t":"信託業得否以信託財產購買其銀行業務部門經紀之票券？","o":["信託業事先取得受益人書面同意者，得以信託財產購買其銀行業務部門經紀之票券","信託業經主管機關許可者，得以信託財產購買其銀行業務部門經紀之票券","信託業於有不得已之事由時，得以信託財產購買其銀行業務部門經紀之票券","信託業絕對不得以信託財產購買其銀行業務部門經紀之票券"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":50,"s":1,"n":29,"t":"辦理信託業務之副科長，屬信託業之何類人員？","o":["管理人員","業務人員","督導人員","業務兼管理人員"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":50,"s":1,"n":30,"t":"違反信託業法有關強制或禁止規定，除該法另有處罰規定外，可處多少罰鍰？","o":["銀元六十萬元以上三百萬元以下罰鍰","新臺幣一百萬元以上三百萬元以下罰鍰","新臺幣六十萬元以上五百萬元以下罰鍰","新臺幣六十萬元以上三百萬元以下罰鍰"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":50,"s":1,"n":31,"t":"有關信託業之賠償準備金，下列敘述何者錯誤？","o":["應以現金或政府債券繳存中央銀行","委託人或受益人有優先受償之權","係依據信託業之營業額按比例計收","應於該信託業取得營業執照後一個月內繳存之"],"a":"3","tp":"賠償準備金與盈餘分配","note":""},{"p":50,"s":1,"n":32,"t":"銀行兼營信託業者，其負責信託財產之管理、運用及處分之部門為下列何者？","o":["各分支機構","信託專責部門","會計部門","稽核部門"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":50,"s":1,"n":33,"t":"銀行經營信託業務，應指撥營運資金專款經營，其指撥營運資金數額之規定為何？","o":["不得低於新臺幣五千萬元","不得低於新臺幣一億元","不得低於新臺幣二億元","不得低於新臺幣四億元"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":50,"s":1,"n":35,"t":"信託財產評審委員會應至少多久將信託財產評審一次報告董事會？","o":["一個月","二個月","三個月","六個月"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":50,"s":1,"n":36,"t":"除兼營信託業務之銀行外，信託業自有財產之運用範圍，除經主管機關核准之事項外，不包括下列何者？","o":["投資期貨","銀行存款","充作營業支出","購買自用不動產、設備"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":50,"s":1,"n":37,"t":"下列何者非屬信託業法規定信託契約應記載之事項？","o":["信託目的","受益人責任","簽訂契約之日期","信託關係消滅時信託財產之歸屬"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":50,"s":1,"n":38,"t":"依銀行法規定，銀行清理時，清理人就任後，應即為催告債權人申報債權之公告，其公告期間下列何者正確？","o":["一日以上","二日以上","三日以上","不限期間"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":50,"s":1,"n":39,"t":"下列何者情事發生時，信託業須於事實發生之翌日起二個營業日內向主管機關申報？","o":["因印鑑錯誤而被退票","更換分支機構經理","編製營業報告書及財務報告","簽訂重要契約"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":50,"s":1,"n":40,"t":"依信託業商業同業公會會員自律公約規定，會員舉發市場違規事項，而使本會有違約金收入者，得於該已收取之違約金中，酌撥已收取金額之多少比例做為獎金鼓勵？","o":["10%","15%","20%","25%"],"a":"3","tp":"公會自律與行為規範","note":""},{"p":50,"s":1,"n":41,"t":"信託業之內部控制應依信託業內部控制及稽核制度實施辦法辦理，有關內部控制及稽核制度之敘述，下列何者錯誤？","o":["信託業應設置隸屬董事會之稽核單位","信託業作業手冊之範本由主管機關訂定供各信託業參考","自行查核報告及其工作底稿至少應留存五年備查","訂定各種作業及管理規範時應有稽核及資訊單位之參與"],"a":"2","tp":"內控稽核與風險管理","note":""},{"p":50,"s":1,"n":42,"t":"有關信託業運用信託財產於國外或涉及外匯投資之規定，下列何者錯誤？","o":["不得以新臺幣計價","委託人為專業機構投資人時適用","投資涉及大陸地區有價證券時有限制","投資本國企業赴國外發行之有價證券時有限制"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":50,"s":1,"n":43,"t":"有關信託業處理信託事務之規定，下列敘述何者正確？ A.應以善良管理人之注意為之，並負忠實義務 B.不得對委託人或受益人有詐欺之行為 C.對信託財產具有運用決定權者，得兼任其他業務之經營 D. 應依信託契約之約定提供定期會計報告","o":["A.B.C","A.B.D","A.C.D","B.C.D"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":50,"s":1,"n":44,"t":"依信託業法及共同信託基金管理辦法規定，下列何者得募集共同信託基金？ A.證券投資信託事業 B. 證券投資顧問事業 C.兼營信託業務之銀行 D.依信託業法成立之信託公司","o":["A 與B 均可","A 與D 均可","B 與C 均可","C 與D 均可"],"a":"4","tp":"共同信託基金募集與運用","note":""},{"p":50,"s":1,"n":45,"t":"下列敘述何者正確？","o":["共同信託基金受益證券可為記名式及無記名式","非信託業不得辦理不特定多數人委託經理信託業法第十六條之信託業務，但其他法律另有規定者，不在此限","信託業如事先取得委託人之書面同意，得以信託財產購買信託業本身之財產","信託業如經委託人之書面同意，得以信託財產借入款項"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":50,"s":1,"n":46,"t":"個人委託人成立受益人不特定之金錢信託時，信託存續期間之所得稅納稅義務人為何？","o":["信託監察人","受益人","委託人","受託人"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":50,"s":1,"n":47,"t":"委託人甲將名下時價（房屋評定價值）伍佰萬元之房屋，成立他益信託照顧受益人乙，信託期間五年，五年間房屋租金歸乙，五年期滿後房屋亦移轉給乙，而乙不幸於第四年年底死亡，當時房屋時價為參佰萬元，則下列敘述何者正確？","o":["甲應以參佰萬元申報繳納遺產稅","乙之繼承人應以參佰萬元申報繳納遺產稅","乙之繼承人無需申報繳納遺產稅","乙之繼承人應以參佰萬元按郵政儲金匯業局一年期定期儲金固定利率折現一年之價值申報繳納遺產稅"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":50,"s":1,"n":48,"t":"依據信託導管理論，受託人因運用信託財產所產生之利益，其利益因係於發生時直接歸屬受益人所有，故立法採下列何種課稅原則？","o":["發生時課稅原則","給付時課稅原則","分配時課稅原則","分離課稅原則"],"a":"1","tp":"信託課稅原則與形式移轉","note":""},{"p":50,"s":1,"n":49,"t":"土地為信託財產時，信託契約中有下列何種約定者，土地應與受益人在同一直轄市或縣（市）轄區內所有之土地，合併計算地價總額？","o":["受益人享有全部信託利益，但委託人保留變更受益人之權利者","受益人為信託財產原本受益人，但委託人保留變更受益人之權利者","委託人未保留變更受益人權利，且受益人為信託財產孳息受益人者","委託人未保留變更受益人權利，且受益人已確定並享有全部信託利益"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":50,"s":1,"n":50,"t":"依所得稅法規定，扣繳義務人給付公益信託之所得，除下列何者外，得免依所得稅法第八十八條規定扣繳稅款？","o":["短期票券利息所得","上市股票之股票股利","定期存款之利息所得","上市股票之現金股利"],"a":"1","tp":"所得稅與扣繳","note":""},{"p":50,"s":2,"n":1,"t":"有關「信託財產評審委員會之組織及評審規範」，下列敘述何者正確？","o":["由信託業自行訂定，並經金管會洽悉","委員會職責在於審查信託財產之運用是否遵循法令規範及信託契約約定，採事前審查機制","委員會由五至九人組成，而信託業務部門主管擔任委員人數應低於委員總人數之二分之一","委員會由召集人召開，委員會之決議應有三分之二委員出席，出席委員過半數之同意"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":50,"s":2,"n":2,"t":"除法令另有規定外，有關特定金錢信託受益權之轉讓，下列敘述何者錯誤？","o":["信託契約得約定不得轉讓","受益權之受讓人需為專業投資人","受益人總數合計不得逾三十五人","受益人於轉讓其受益權前，需經信託監察人及受託人同意，始得轉讓"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":50,"s":2,"n":3,"t":"證券商申請主管機關許可兼營金錢之信託及有價證券之信託，得辦理之特定項目，下列敘述何者錯誤？","o":["以信託方式辦理財富管理業務","以信託方式辦理公益之信託","以信託方式辦理全權委託投資業務","以信託方式辦理客戶委託保管及運用其款項業務"],"a":"2","tp":"證券信託種類與保管差異","note":""},{"p":50,"s":2,"n":4,"t":"有關特定金錢信託業務，下列敘述何者錯誤？","o":["委託人及其指定的第三人具運用決定權","業務內容較為單純及較易推動","目前為信託業辦理之最主要業務","是指制式化信託契約，無法量身訂製服務"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":50,"s":2,"n":5,"t":"信託資金結匯時，除法律另有規定外，原則上係占用下列何者之每年結匯額度？","o":["委託人","受託人","受益人","不占用任何人額度"],"a":"4","tp":"外匯結匯與國際金融業務","note":""},{"p":50,"s":2,"n":6,"t":"依現行法令規定，特定金錢信託投資國外有價證券之本金，所得從事之新臺幣與外幣間避險工具不包括下列何者？","o":["遠期外匯交易","換匯交易","換匯換利交易 "],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":50,"s":2,"n":66,"t":"依我國現行法令規定，下列何者毋須指定保管機構？","o":["期貨商依規定繳存之營業保證金","臍帶血預繳保管費交付信託之資金","證券投資信託事業募集發行之證券投資信託基金","證券投資顧問事業經營全權委託投資業務，其委任人委託投資之資產"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":50,"s":2,"n":67,"t":"全權委託投資業務以委任關係辦理者，有關全權委託投資越權交易通知書之通知對象，不包括下列何者？","o":["委任人","受任人","台灣證券交易所","交易對象及投信投顧公會"],"a":"3","tp":"全權委託保管與越權交易","note":""},{"p":50,"s":2,"n":68,"t":"依證券投資信託及顧問法規定，除經主管機關核准者外，下列何者非屬不得擔任各該證券投資信託事業基金保管機構之情形？","o":["擔任該證券投資信託基金之簽證機構","與證券投資信託事業屬於同一金融控股公司之子公司","由證券投資信託事業擔任董事或監察人之保管機構","證券投資信託事業持有該保管機構已發行股份總數百分之五者"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":50,"s":2,"n":69,"t":"證券投資信託基金投資於國內有價證券，交割日若為Ｔ＋１日時，除經雙方協議者外，則交割指示之合理到達保管銀行之時間至遲應為下列何者？","o":["Ｔ＋２日保管銀行營業時間結束以前","Ｔ＋１日保管銀行營業時間開始以前","Ｔ＋１日保管銀行營業時間結束以前","Ｔ日下午一時前"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":50,"s":2,"n":70,"t":"集合管理運用帳戶設置後，有關其管理運用計畫或約定條款之變更，下列何者正確？","o":["報經信託公會同意後即可變更","報經信託監察人同意後即可變更","經受益人大會決議通過後即可變更，無須經主管機關核准","原則上應函送信託公會審查後，由公會檢送審查意見轉報主管機關核准"],"a":"4","tp":"集合帳戶申請設置與合併","note":""},{"p":50,"s":2,"n":71,"t":"有關集合管理運用帳戶信託受益人之受益權轉讓，下列何者正確？","o":["不得轉讓","經委託人同意即可轉讓","經受託人同意即可轉讓","可視其需要轉讓或不轉讓"],"a":"1","tp":"集合帳戶受益權淨值與退出","note":""},{"p":50,"s":2,"n":72,"t":"有關集合管理運用帳戶之作業，下列敘述何者錯誤？","o":["信託業應於會計年度終了後四個月內，編製年度決算報告，經會計師查核簽證後函報主管機關備查，並通知委託人及受益人","信託業應將清算後之信託財產依信託受益權之比例分派與各受益人","集合管理運用帳戶終止時，信託業應於主管機關核准清算後，六個月內完成清算","信託業應於集合管理運用帳戶清算程序終結後兩個月內，將處理結果函報主管機關備查並通知受益人"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":50,"s":2,"n":73,"t":"信託資金以集合管理運用方式辦理者，有關其分類，下列何者錯誤？","o":["不指定集合管理運用金錢信託","不特定集合管理運用金錢信託","指定集合管理運用金錢信託","特定集合管理運用金錢信託"],"a":"2","tp":"單獨及集合管理分類與權限","note":""},{"p":50,"s":2,"n":74,"t":"依集合管理運用金錢信託流動性資產範圍及比率準則規定，除經主管機關核淮外，下列何者非屬集合管理運用帳戶流動性資產之範圍？","o":["銀行存款","公債","金融債券","短期票券"],"a":"3","tp":"集合帳戶投資限制與流動性","note":""},{"p":50,"s":2,"n":75,"t":"有關集合管理運用帳戶之名稱，下列何者錯誤？","o":["不得使人誤信擔保本金及最低收益率","名稱如涉及「全球」、「國際」時，其運用地區或國家須跨二洲以上","集合管理運用帳戶之名稱得與運用範圍及地區有明顯區隔","集合管理運用帳戶之名稱得表彰某個國家或市場；惟其運用於該國家或市場應達帳戶淨資產價值60%以上"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":50,"s":2,"n":76,"t":"委託人以實體股票交付受託人成立信託，如僅為所有權移轉登記而未於股票上載明為信託財產，則其信託關係之效力為何？","o":["尚未成立","已成立但未生效","效力未定","已生效但不得對抗第三人"],"a":"4","tp":"證券信託種類與保管差異","note":""},{"p":50,"s":2,"n":77,"t":"許先生與乙銀行簽訂信託契約辦理金錢信託，指定將新臺幣一百萬元投資於ABC 境外基金，下列敘述何者錯誤？","o":["就乙銀行而言，新臺幣一百萬元為信託資金","就該基金公司而言，乙銀行為信託委託人","就許先生而言，乙銀行為受託人","就乙銀行而言，其持有之ABC 境外基金受益權單位為信託財產"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":50,"s":2,"n":78,"t":"下列何者非目前特定金錢信託之主要業務？","o":["信託資金投資國外有價證券","信託資金投資國內外基金","企業員工持股信託","由信託公司確定用途之信託資金"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":50,"s":2,"n":79,"t":"有關不動產投資信託之敘述，下列何者錯誤？","o":["性質上為金錢信託","應於主管機關核准函送達之日起三個月內開始募集","如有經信用評等機構評定其等級者，應於公開說明書中說明","對不特定人公開招募時，應向購買人或應募人提供投資說明書"],"a":"4","tp":"REIT募集投資標的與限制","note":""},{"p":50,"s":2,"n":80,"t":"有關金融資產證券化之特性，下列敘述何者正確？","o":["由創始機構發行有價證券","信用評等之基礎為特殊目的機構之信用評等","投資人之收益來自特定金融資產之現金流量","得採提供超額資產、利差帳戶、現金準備帳戶等外部信用增強機制"],"a":"3","tp":"證券化特性與經濟效益","note":""},{"p":51,"s":1,"n":1,"t":"某甲將公司債交付信託，已依規定辦理信託公示，但未通知該公司債發行公司，則該信託行為之效力為何？","o":["無效","有效，但不能對抗第三人","無效，但能對抗第三人","有效，但不能對抗該發行公司"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":2,"t":"受託人應依信託本旨，為受益人利益或為特定目的管理或處分信託財產，下列敘述何者正確？","o":["委託人應將財產權移轉給信託監察人","委託人應將財產權移轉給法院","委託人應將財產權移轉給受託人","委託人應將財產權移轉給受益人"],"a":"3","tp":"受益人權利與撤銷救濟","note":""},{"p":51,"s":1,"n":3,"t":"依信託法規定，下列何者非屬無效之信託行為？","o":["其目的違反禁止規定","其目的違反善良風俗","以進行訴願為主要目的","信託行為有害於委託人之債權人權利"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":4,"t":"以地上權為信託財產，應如何辦理信託公示？","o":["土地權利信託登記","公告","在土地上標示","通知土地所有人"],"a":"1","tp":"登記公示與對抗效力","note":""},{"p":51,"s":1,"n":5,"t":"有關對信託財產可請求強制執行，下列敘述何者錯誤？","o":["信託成立前，該信託財產即已設定抵押權","修繕信託財產之房屋所支出的修繕費","受託人請求損害賠償或報酬","完成信託登記之信託財產"],"a":"4","tp":"財產獨立性與強制執行","note":""},{"p":51,"s":1,"n":6,"t":"以應登記或註冊之財產權為信託者，有關信託財產登記之規定，下列敘述何者錯誤？","o":["非經信託登記，不得對抗第三人","土地權利登記得以遺囑為之","以股票為信託者，應向臺灣證券交易所辦理登記","以有價證券為信託者，應於證券上或其他表彰權利之文件上載明為信託財產"],"a":"3","tp":"登記公示與對抗效力","note":""},{"p":51,"s":1,"n":7,"t":"受託人變更時，何人應就信託事務之處理作成結算書及報告書？","o":["原受託人","新受託人","信託監察人","法院"],"a":"1","tp":"受託人義務報酬與責任","note":""},{"p":51,"s":1,"n":8,"t":"十八歲已婚之甲不得擔任信託關係中何種角色？","o":["委託人","受託人","自益信託之受益人","他益信託之受益人"],"a":"2","tp":"設立能力與監督管轄","note":""},{"p":51,"s":1,"n":9,"t":"信託財產如不足清償受託人就處理信託事務所支出之費用，受託人得向下列何者請求補償？","o":["信託監察人","檢察官","受益人","委託人之法定代理人或監護人"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":51,"s":1,"n":10,"t":"信託行為中受託人因處理信託事務之支出，有優先於無擔保債權人受償之部分，下列敘述何者錯誤？","o":["稅捐","負擔之債務","受託人之報酬","處理信託事務支出之費用"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":11,"t":"依信託法規定，受託人違反信託本旨處分信託財產時，下列何者得聲請法院撤銷其處分？","o":["委託人","受益人","信託業主管機關","法院依職權行使撤銷"],"a":"2","tp":"受益人權利與撤銷救濟","note":""},{"p":51,"s":1,"n":12,"t":"依信託法規定，受託人違反分別管理之義務，致信託財產受有損害，除受託人證明縱為分別管理，而仍不免發生損害者，受託人可免責外，受託人於下列何種情況須負損害賠償責任？","o":["限於受託人故意時","限於受託人有重大過失時","受託人雖無過失亦應負損害賠償責任","限於受託人同時違反善良管理人注意義務與分別管理義務時"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":51,"s":1,"n":13,"t":"信託利益非由委託人全部享有者，除信託行為另有訂定外，應如何終止信託？","o":["委託人之一方得隨時終止","受益人之一方得隨時終止","委託人或其繼承人得隨時終止","委託人及受益人得隨時共同終止"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":14,"t":"私益信託除信託行為另有訂定外，為保護受益人之利益認有必要時，下列何者得因檢察官之聲請選任信託監察人？","o":["法院","金融監督管理委員會","目的事業主管機關","法務部"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":15,"t":"公益信託之受託人有不得已事由須將信託財產轉為自有財產，應取得下列何者許可始得為之？","o":["法院","目的事業主管機關","信託監察人","受益人"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":51,"s":1,"n":16,"t":"信託財產之管理方法因情事變更致不符合受益人之利益時，下列何者得聲請法院變更之？","o":["限於委託人","限於受託人","限於受益人","委託人、受託人或受益人均得聲請法院變更"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":51,"s":1,"n":17,"t":"依信託法規定，下列何者非屬信託關係消滅之事由？","o":["信託行為所定信託關係消滅事由發生","信託目的已完成","信託目的不能完成","受託人調降財測"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":51,"s":1,"n":18,"t":"營業信託以外之私益信託，係由下列何者監督？","o":["財政部","中央銀行","法院","法務部"],"a":"3","tp":"設立能力與監督管轄","note":""},{"p":51,"s":1,"n":19,"t":"安先生因鑒於海洛因之製造買賣藏有暴利，因此出資五千萬交付海先生與其簽訂信託契約，由海先生依契約訂定之方式經營海洛因之製造買賣，收益歸安先生，並約明高額之信託報酬與海先生，該信託契約之法律效力為何？","o":["有效","效力未定","得撤銷","無效"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":20,"t":"下列何者不屬於公益信託之租稅優惠？","o":["遺產及贈與稅","營業稅","房屋稅","地價稅"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":51,"s":1,"n":21,"t":"除銀行經主管機關之許可兼營信託業務者外，信託業之組織，以下列何種為限？","o":["股份有限公司","有限公司","無限公司","合夥"],"a":"1","tp":"經營組織與兼營獨立","note":""},{"p":51,"s":1,"n":22,"t":"依銀行法規定，商業銀行及專業銀行經營信託業務，下列何者必須獨立？","o":["營業及會計","會計及資本","營業及資本","營業、會計及資本"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":51,"s":1,"n":23,"t":"依我國信託業法暨信託業設立標準規定，有關信託公司其專業股東之敘述，下列何者錯誤？","o":["符合規定條件之銀行得擔任專業股東","符合規定條件之投資顧問公司得擔任專業股東","原則上專業股東所認股份合計不得小於實收資本額之百分之四十","專業股東為發起人，其轉讓股份時應事先報主管機關備查"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":51,"s":1,"n":24,"t":"信託財產評審委員會之委員，屬信託業之何類人員？","o":["管理人員","督導人員","業務人員","監察人員"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":51,"s":1,"n":25,"t":"信託業得否以信託財產辦理銀行法第五條之二所定授信業務？","o":["不得以信託財產辦理授信業務","得依信託契約之訂定辦理授信業務","得經全體受益人同意辦理授信業務","得經主管機關許可辦理授信業務"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":51,"s":1,"n":26,"t":"依信託業法規定，下列何者非信託業得經營之附屬業務項目？","o":["辦理中長期放款","擔任股票及債券發行簽證人","擔任遺囑執行人及遺產管理人","辦理出租保管箱業務"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":51,"s":1,"n":27,"t":"有關信託業得辦理之業務項目，下列何者錯誤？","o":["金錢信託","有價證券信託","農育權信託","著作權信託"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":51,"s":1,"n":28,"t":"信託業得否以信託財產購買其銀行業務部門經紀之票券？","o":["信託業事先取得受益人書面同意者，得以信託財產購買其銀行業務部門經紀之票券","信託業經主管機關許可者，得以信託財產購買其銀行業務部門經紀之票券","信託業於有不得已之事由時，得以信託財產購買其銀行業務部門經紀之票券","信託業絕對不得以信託財產購買其銀行業務部門經紀之票券"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":51,"s":1,"n":29,"t":"下列何者應依照信託資金集合管理運用管理辦法辦理？","o":["指定營運範圍或方法之單獨管理運用金錢信託","不指定營運範圍或方法之集合管理運用金錢信託","特定集合管理運用金錢信託","共同信託基金"],"a":"2","tp":"單獨及集合管理分類與權限","note":""},{"p":51,"s":1,"n":30,"t":"信託業的會計處理原則，應由下列何單位訂定報請主管機關核定？","o":["證券商業同業公會","信託業同業公會","銀行商業同業公會","期貨商業同業公會"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":51,"s":1,"n":31,"t":"依信託業法規定，下列何者為信託業應設置之單位？","o":["檢查人","稽核單位及信託財產評審委員會","信託監察人","清算人"],"a":"2","tp":"內控稽核與風險管理","note":""},{"p":51,"s":1,"n":32,"t":"有關「銀行經營信託或證券業務之營運範圍及風險管理準則」之規範，下列敘述何者錯誤？","o":["信託業務與銀行其他業務間之共同行銷，不得有利害衝突而損及客戶權益之行為","銀行各分支機構辦理信託業務，限於信託財產之收受及運用，其管理及處分均應統籌由該專責部門為之","銀行辦理信託業務，應盡善良管理人之注意義務及忠實義務","銀行不擔保信託業務之管理及運用績效，委託人及受益人應自負盈虧"],"a":"2","tp":"內控稽核與風險管理","note":""},{"p":51,"s":1,"n":33,"t":"依信託業設立標準規定，僅辦理不動產投資信託業務之信託公司，其最低實收資 生設立一未保留權利之全部他益之信託契約，信託財產包括土地及上市股票，並約定土地部分之受益人為其子陳俊，上市股票之受益人為其女陳美，請問下述有關此信託行為之課稅方式何者正確？","o":["土地部分應依信託契約訂立當期之公告現值作為計算信託利益權利價值之基準，由陳俊繳納贈與稅","上市股票部分應依信託契約訂立當日之收盤價格作為計算信託利益權利價值之基準，由陳美繳納贈與稅","應對陳老先生課徵贈與稅，贈與總額之計算標準土地係以當期之公告土地現值，上市股票則以訂立信託契約日當日之收盤價格為計算標準","於信託關係消滅時，土地部分返還於陳俊時應課徵土地增值稅，計算標準之原地價為陳老先生移轉土地於受託人當期之公告現值"],"a":"3","tp":"遺產及贈與稅","note":""},{"p":51,"s":1,"n":47,"t":"以土地或房屋為信託財產者，在信託關係存續中，係以下列何者為地價稅或房屋稅之納稅義務人？","o":["委託人","受益人","受託人","信託監察人"],"a":"3","tp":"土地稅與土地增值稅","note":""},{"p":51,"s":1,"n":48,"t":"因信託行為成立，委託人與受託人間，基於信託關係財產之移轉，下列敘述何者錯誤？","o":["不課徵土地增值稅","不課徵所得稅","不課徵贈與稅","視為銷售貨物依規定課徵營業稅"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":51,"s":1,"n":49,"t":"遺贈人、受遺贈人或繼承人提供財產，捐贈或加入於被繼承人死亡時已成立之公益信託並符合一定規定者，該財產不計入遺產總額課遺產稅，下列何者非屬該一定規定者？","o":["受託人為信託業法所稱之信託業","各公益信託除為其設立目的舉辦事業而必須支付之費用外，不以任何方式對特定或可得特定之人給予特殊利益","應以受託人為納稅義務人，按規定之扣繳稅率申報繳納所得稅","信託行為明定信託關係解除、終止或消滅時，信託財產移轉於各級政府、有類似目的之公益法人或公益信託"],"a":"3","tp":"遺產及贈與稅","note":""},{"p":51,"s":1,"n":50,"t":"受益人於信託存續期間內死亡，其所享有信託利益之權利未領受部分應課徵遺產稅，關於其價值之計算， 下列敘述何者錯誤？","o":["受益人享有全部信託利益之權利者，信託利益為金錢以外之財產時，以受益人死亡時信託財產之時價計算","受益人享有孳息以外信託利益之權利者，以受益人死亡時信託財產之時價，按未領受期間，依當時郵政儲金匯業局一年期定期儲金固定利率複利，折算現值計算之","受益人享有信託利益之權利為按期定額給付者，以每年享有信託利益之數額，依當時郵政儲金匯業局一年期定期儲金固定利率，按年複利折算現值之總和計算之","受益人享有孳息部分信託利益之權利者，以歷年平均每年享有之孳息，依當時郵政儲金匯業局一年期定期儲金固定利率複利，折算現值之總和計算之"],"a":"4","tp":"遺產及贈與稅","note":""},{"p":51,"s":2,"n":1,"t":"「生前契約信託」之信託財產，若運用於經核准設置之殯儀館，其投資總額不得逾投資時信託財產當時價值之多少百分比？","o":["20%","25%","30%","35%"],"a":"2","tp":"預收款禮券與履約保障","note":""},{"p":51,"s":2,"n":2,"t":"有關特定金錢信託投資國外基金業務之敘述，下列何者正確？","o":["基金投資屬於存款保險範圍，如有損失可請求賠償","受託銀行對於基金之投資保本但不保息","投資人須自負盈虧","基金以往績效可作為未來績效之保障"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":51,"s":2,"n":3,"t":"銀行辦理特定金錢信託投資國外有價證券業務，除了取得主管機關辦理信託業務許可外，還須經下列何者核可後始可辦理？","o":["投信投顧公會","臺灣證券交易所","經濟部","中央銀行"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":51,"s":2,"n":4,"t":"有關信託業辦理特定金錢信託投資境外結構型商品應揭露之基本風險，下列何者錯誤？","o":["作業風險","利率風險","流動性風險","提前贖回風險"],"a":"1","tp":"結構型商品與衍生性金融商品","note":""},{"p":51,"s":2,"n":5,"t":"依境外結構型商品管理規則規定，境外結構型商品計價幣別，不包括下列何者？","o":[ 基金應與委任之證券投資信託公司簽署下列何種契約？","o":["保管契約","委任契約","委託投資契約","證券投資信託契約"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":51,"s":2,"n":68,"t":"有關擔任僑外資投資我國有價證券之保管機構，下列敘述何者正確？","o":["不得同時擔任僑外資之國內代理人","應為經中央銀行核准得經營保管業務之銀行","應提供交易確認之服務","毋須提供公司重大資訊通知之服務"],"a":"3","tp":"外資全球保管與代理登記","note":""},{"p":51,"s":2,"n":69,"t":"有關證券投資信託基金保管機構提供之服務，下列敘述何者錯誤？","o":["須處理越權交易","簽署年度財務報表","支付受益憑證買回價款","與證券投資信託事業共同簽署受益憑證"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":51,"s":2,"n":70,"t":"信託業辦理集合管理運用帳戶發生下列何事項時，信託業應即辦理公告？","o":["淨資產價值跌幅達10%","淨資產價值跌幅達20%","帳戶約定條款變更","受益人不特定"],"a":"3","tp":"集合帳戶申請設置與合併","note":""},{"p":51,"s":2,"n":71,"t":"有關信託資金集合管理運用帳戶之信託受益權轉讓之規定，下列何者正確？","o":["由委託人背書轉讓","集合管理運用帳戶之信託受益權不得轉讓","由受益人背書轉讓","由原受益人通知受託人劃撥轉讓予新受益人"],"a":"2","tp":"集合帳戶受益權淨值與退出","note":""},{"p":51,"s":2,"n":72,"t":"有關信託業集合管理運用帳戶之信託報酬收取規定，下列敘述何者錯誤？","o":["可以信託契約約定信託報酬收取標準","可於信託契約及集合管理運用帳戶分別收取","信託契約已收取者，集合管理運用帳戶不得另收","得約定於集合管理運用帳戶項下之信託財產扣除支應"],"a":"2","tp":"單獨及集合管理分類與權限","note":""},{"p":51,"s":2,"n":73,"t":"信託資金集合管理運用帳戶流動性資產占淨資產價值之最低比率為何？","o":["百分之二","百分之三","百分之五","百分之十"],"a":"3","tp":"集合帳戶投資限制與流動性","note":""},{"p":51,"s":2,"n":74,"t":"信託業集合管理運用帳戶信託監察人變更時，應報請下列何者備查？","o":["金管會","信託公會","中央銀行","受益人大會"],"a":"1","tp":"單獨及集合管理分類與權限","note":""},{"p":51,"s":2,"n":75,"t":"依信託資金集合管理運用管理辦法之相關規定，有關自然人擔任集合管理運用帳戶信託監察人之敘述，下列何者錯誤？","o":["曾任金融機構總機構副理以上，且具有信託業務經驗達五年以上，成績優良者","領有會計師或律師執照且具有實務工作經驗達五年以上者","曾於國內外專科以上學校教授信託相關課程達三年以上者","擔任與信託業務有關之金融行政管理工作經驗達二年以上，並曾任薦任九職等以上者"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":51,"s":2,"n":76,"t":"某董事長至銀行辦理特定金錢信託投資美元計價之國外有價證券時，有關其交付之信託資金，下列何者正確？","o":["僅得以等值之新臺幣資金交付","僅得以美元資金交付","經金管會同意後得以美元資金交付","依銀行規定得交付等值新臺幣或美元資金"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":51,"s":2,"n":77,"t":"有關營業保證金之提存，下列敘述何者錯誤？","o":["更換提存之金融機構，應先函報證期局核准","營業保證金得分別提存於不同金融機構","營業保證金應向主管機關核准得辦理保管業務且達一定信評以上之金融機構提存","營業保證金應以現金、定存單、政府債券、金融債券提存"],"a":"2","tp":"其他資產保管與營業保證金","note":""},{"p":51,"s":2,"n":78,"t":"有關信託相關稅負之敘述，下列何者正確？","o":["個人經由特定金錢信託投資國內基金，分配所得之收益均免納所得稅","參加企業員工持股信託，投資標的除權後所配得之股利，免納所得稅","投資不動產投資信託受益證券分配所得之孳息，於次年需申報所得稅","投資金融資產證券化受益證券之利息所得，採分離課稅方式"],"a":"4","tp":"證券化商品分離課稅與交易稅","note":""},{"p":51,"s":2,"n":79,"t":"60 歲之丁蟹先生為照顧21 歲小丁未來生活所需，以名下台塑石化公司上市股票面額3,000 萬元與大同銀行簽約成立一個十年期有價證券信託，約定每年股息歸小丁，到期股票仍屬丁蟹先生，則依目前稅法規定下列何者為丁蟹先生應繳納之稅負？","o":["營業稅","股利所得稅","證券交易所得稅","贈與稅"],"a":"4","tp":"遺產及贈與稅","note":""},{"p":51,"s":2,"n":80,"t":"依現行法令規定，下列何種資產得毋須另委由保管機構保管？","o":["證券商之營業保證金","僑外資投資國內之有價證券","證券投資信託事業發行之基金","信託業以信託關係辦理之全權委託投資資產"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":52,"s":1,"n":1,"t":"依信託法規定，下列敘述何者錯誤？","o":["受託人死亡時，信託財產不屬於其遺產","受託人破產時，信託財產不屬於其破產財團","不管任何原因，信託財產絕對不得強制執行","屬於信託財產之債權與不屬於該信託財產之債務不得相互抵銷"],"a":"3","tp":"財產獨立性與強制執行","note":""},{"p":52,"s":1,"n":2,"t":"某甲將公司債交付信託，已依規定辦理信託公示，但未通知該公司債發行公司，則該信託行為之效力為何？","o":["無效","有效，但不能對抗第三人","無效，但能對抗第三人","有效，但不能對抗該發行公司"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":3,"t":"在我國，有關契約信託之一般成立要件，不包括下列何者？","o":["當事人（委託人、受託人）","意思表示（雙方合意）","標的（財產權移轉）","關係人（信託監察人）"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":4,"t":"甲為契約信託之委託人，乙為受託人，丙為信託受益人，丁為信託監察人，下列何者對信託財產有管理處分權？","o":["丁","丙","乙","甲"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":5,"t":"信託關係消滅時，於受託人移轉信託財產於歸屬權利人前，信託關係視為存續，該信託關係屬下列何者？","o":["契約信託","遺囑信託","宣言信託","法定信託"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":52,"s":1,"n":6,"t":"信託行為因有害委託人之債權人權利而被撤銷時，對善意受益人利益之影響，下列何者正確？","o":["未屆清償期之取得利益不受影響","已屆清償期之取得利益不受影響","不論是否已屆清償期之取得利益均受影響","不論是否已屆清償期之取得利益均不受影響"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":7,"t":"依信託法規定，有關受託人之義務，下列敘述何者錯誤？","o":["忠實義務","備置帳簿義務","善良管理人注意義務","與委託人共同管理所有信託財產義務"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":52,"s":1,"n":8,"t":"受託人因信託行為對受益人所負擔之債務負履行責任之範圍，下列敘述何者正確？","o":["僅於信託財產限度內負履行責任","僅於信託財產一半限度內負履行責任","僅於信託財產三分之一限度內負履行責任","應於自有財產及信託財產負履行責任"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":9,"t":"下列何者簽訂信託契約時，應另取得法定代理人之書面同意？","o":["受輔助宣告之人","限制行為能力人","破產人","未滿七歲之未成年人"],"a":"2","tp":"設立能力與監督管轄","note":""},{"p":52,"s":1,"n":10,"t":"受託人違反信託本旨處分信託財產，於聲請法院撤銷其處分時，係由下列何者為之？","o":["得由委託人為之","須由全體受益人一同為之","得由其他受託人為之","得由受益人中之一人為之"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":52,"s":1,"n":11,"t":"有關受託人之直接管理義務，下列敘述何者錯誤？","o":["信託行為得另訂第三人代為處理信託事務","信託行為有不得已之事由者，得使第三人代為處理信託事務","受託人違反信託直接管理義務時，應就第三人之行為負完全責任","受託人違反信託直接管理義務，使第三人代為處理信託事務時，該第三人所為法律行為效力可及於信託財產"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":52,"s":1,"n":12,"t":"私益信託委託人所指定之信託監察人擬辭任，應取得下列何者之同意？","o":["委託人","受益人","受託人","其他信託監察人"],"a":"1","tp":"信託監察人","note":""},{"p":52,"s":1,"n":13,"t":"公益信託之受託人有為違背其職務之行為時，委託人得向下列何機關申請將其解任？","o":["法院","檢察機關","警察機關","目的事業主管機關"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":52,"s":1,"n":14,"t":"公益信託關係消滅時，受託人應作成結算書及報告書，並取得下列何者承認後，向目的事業主管機關申報？","o":["受益人","委託人","法院","信託監察人"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":52,"s":1,"n":15,"t":"下列何者非屬主管機關對公益信託得撤銷其許可或為其他必要處置之情況？","o":["違反設立許可條件","違反目的事業主管機關監督命令","無正當理由連續二年不為活動","為其他有害公益之行為"],"a":"3","tp":"公益信託與監督機關","note":""},{"p":52,"s":1,"n":16,"t":"某一為保護黑面琵鷺而設立之公益信託，其信託關係消滅時，若無信託行為所指定之信託財產歸屬權利人者，有關農委會得採取之措施，下列敘述何者錯誤？","o":["得為類似之目的，使信託關係存續","使信託財產移轉於有類似目的之公益法人","使信託財產移轉於其他目的之公益信託","使信託財產移轉於有類似目的之公益信託"],"a":"3","tp":"公益信託與監督機關","note":""},{"p":52,"s":1,"n":17,"t":"受託人違反規定於信託財產上取得利益時，委託人或受益人得請求將其所得利益歸於信託財產，該請求權自事實發生時起，逾幾年不行使而消滅？","o":["一年","二年","三年","五年"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":52,"s":1,"n":18,"t":"有關信託監察人之職務，下列敘述何者正確？","o":["得代受益人拋棄其享有信託利益之權利","保護委託人及信託財產，並監督受託人執行其職務","應以受益人名義為有關信託之訴訟上或訴訟外之行為","信託監察人有數人時，就信託財產之保存行為得單獨為之"],"a":"4","tp":"信託監察人","note":""},{"p":52,"s":1,"n":19,"t":"有關信託業擔任信託監察人時，其職務之敘述，下列何者正確？","o":["受託人變更時會同移交信託財產於新受託人","信託關係消滅時接收信託財產","為信託業有關信託之訴訟上或訴訟外的行為","編制信託財產目錄表及收支計算表"],"a":"1","tp":"評審委員會與內部職責","note":""},{"p":52,"s":1,"n":20,"t":"下列何種情形為遺囑信託？","o":["甲生前至銀行簽訂信託契約，並交付銀行新臺幣壹千萬元，約明以甲之死亡為條件，待甲死亡時，該信託契約方生效","甲生前至銀行簽訂信託契約，並交付銀行新臺幣壹千萬元，約明以甲之死亡日為信託期間之起日","甲於遺囑中指示其遺囑執行人，自其遺產中提撥五千萬由遺囑執行人信託予一慈善機構","甲依法律規定之方式於遺囑中指定將其部份遺產，指定一受託人成立信託"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":21,"t":"有關信託業之設立與監督，信託業法多準用銀行法之相關規定，係因認定信託業為下列何種行業？","o":["金融業","證券業","票券業","保險業"],"a":"1","tp":"設立標準與分支機構","note":""},{"p":52,"s":1,"n":22,"t":"除銀行經主管機關之許可兼營信託業務者外，信託業之組織，以下列何種為限？","o":["有限公司","股份有限公司","無限公司","合夥"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":52,"s":1,"n":23,"t":"信託公司之專業發起人及股東，具有管理或經營國際證券投資信託基金業務經驗，且該機構及其百分之五十以上控股之附屬機構所管理資產中，以公開募集方式集資投資於證券或不動產之共同基金、單位信託或投資信託之基金資產，總值須達新臺幣若干，始符合規定之資格條件？","o":["六百五十億元","六百億元","五百五十億元","五百億元"],"a":"1","tp":"設立標準與分支機構","note":""},{"p":52,"s":1,"n":24,"t":"信託業依信託業法第十六條規定辦理動產之信託時，其與客戶間之法律關係為何？","o":["信託關係","非信託關係","委任關係","信託關係或委任關係皆可"],"a":"1","tp":"賠償準備金與盈餘分配","note":""},{"p":52,"s":1,"n":25,"t":"信託業對信託財產有運用決定權時，有關信託財產之管理及運用方法，下列敘述何者錯誤？","o":["不得購買本身或其利害關係人發行之有價證券或票券","不得購買本身或其利害關係人之不動產","除政府發行之債券外，不得讓售信託財產予本身或其利害關係人","得以信託財產辦理銀行法第五條之二所定授信業務"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":52,"s":1,"n":26,"t":"依信託業應負之義務及相關行為規範規定，信託業處理信託業務，應考量下列何者之利益？","o":["除考量受益人的利益，亦應考量銀行之利益","除考量受益人的利益，亦應考量信託業務人員之權益","只應考量受益人之利益","除應考量受益人的利益，亦應考量銀行業務之發展"],"a":"3","tp":"公會自律與行為規範","note":""},{"p":52,"s":1,"n":27,"t":"有關銀行兼營信託業務，辦理信託業法所規定之附屬業務，下列敘述何者正確？","o":["得由信託專責部門人員辦理","均適用信託關係","開辦前毋須事先經主管機關核定","屬於無運用決定權之信託"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":52,"s":1,"n":28,"t":"信託業收受以公司債為信託財產之信託，經償還後轉化為金錢，併為信託財產運用，係屬於下列何種信託？","o":["金錢之信託","金錢債權之信託","有價證券之信託","動產之信託"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":29,"t":"甲以現金新臺幣一千萬元與乙銀行訂定信託契約，並約定信託財產的運用僅限於在臺灣證券交易所上市之股票，請問此種運用方法係屬下列何種信託？","o":["指定運用之金錢信託","特定運用之金錢信託","不指定運用之金錢信託","指定運用之有價證券信託"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":52,"s":1,"n":30,"t":"信託業應提存之賠償準備金，得以下列何者繳存於中央銀行？ A.現金 B.金融債券 C.政府債券 D. 公司債","o":["僅A、B","僅A、C","僅A、D","僅B、C"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":52,"s":1,"n":31,"t":"依信託業法規定，信託契約訂定時，有關應記載事項，下列何者錯誤？","o":["信託目的","信託財產之種類","受益人之責任","簽訂契約之日期"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":52,"s":1,"n":32,"t":"信託財產運用所生之收益及損失應由下列何者享受與承擔？","o":["受託人","委託人","受益人","從信託契約之約定"],"a":"3","tp":"委託人權利與信託標的","note":""},{"p":52,"s":1,"n":33,"t":"信託公會訂定會員機構辦理信託業務之自律公約，其內容不包括下列何者？","o":["忠實義務","廣告促銷","客戶權益保障","內部控制及稽核"],"a":"4","tp":"公會自律與行為規範","note":""},{"p":52,"s":1,"n":34,"t":"銀行兼營信託業務時，應指撥營運資金，另信託業依信託業法第三十四條之規定應提存賠償準備金，下列敘述何者錯誤？","o":["營運資金不得低於新臺幣五千萬元","賠償準備金與營運資金合計最少不得低於新臺幣一億元","賠償準備金不得低於新臺幣五千萬元","營運資金得充當賠償準備金"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":52,"s":1,"n":35,"t":"信託業為下列何者行為，應經主管機關許可？","o":["與委託人訂定信託契約","編製財務報告","變更章程","以自有財產投資金融債券"],"a":"3","tp":"監理處分罰則與損害賠償","note":""},{"p":52,"s":1,"n":36,"t":"信託業有因訴訟、非訟、行政處分，對公司財務或業務有重大影響者，應於事實發生之翌日起幾個營業日內向主管機關申報？","o":["二個營業日內","三個營業日內","四個營業日內","五個營業日內"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":52,"s":1,"n":37,"t":"除經主管機關核准者外，信託業辦理委託人不指定營運範圍或方法之金錢信託所得投資之標的，下列何者錯誤？","o":["銀行存款","公司債券","金融債券","貨幣型基金"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":52,"s":1,"n":38,"t":"信託業除兼營信託業務之銀行外，其自有財產運用於購買自用不動產之購買總額，不得超過多少？","o":["該信託業之資本總額","該信託業之流動負債","該信託業之法定盈餘","該信託業之淨值"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":52,"s":1,"n":39,"t":"依我國信託業法及其施行細則，信託業設立共同信託基金以投資證券交易法第六條之有價證券為目的者， 包括下列何者？","o":["投資於證券交易法第六條之有價證券金額為新臺幣三億元者","投資於證券交易法第六條之有價證券金額為新臺幣五億元者","投資於證券交易法第六條之有價證券占該信託基金募集發行額度百分之三十者","投資於證券交易法第六條之有價證券占該信託基金募集發行額度百分之五十者"],"a":"4","tp":"共同信託基金募集與運用","note":""},{"p":52,"s":1,"n":40,"t":"依信託業應負之義務及相關行為規範，有關信託業之資訊揭露及定期報告，下列敘述何者錯誤？","o":["應依規定通知委託人及受益人各項信託相關事宜","應每一年營業年度將其資產負債表以規定方式公告","資產負債表公告方式，得為於所在地日報公告或備置於每一營業處所及金管會指定網站","應依規定分別向委託人及受益人定期為信託財產管理運用之報告"],"a":"2","tp":"行銷訂約與風險揭露","note":""},{"p":52,"s":1,"n":41,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，證券投資信託事業以信託方式經營全權委託投資業務，其接受委託人原始信託財產達新臺幣多少元以上者，符合應申請主管機關許可之一定條件？","o":["五百萬元","一千萬元","一千五百萬元","二千萬元"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":52,"s":1,"n":42,"t":"有關信託受益權轉讓之敘述，除法令另有規定外，下列何者錯誤？","o":["受益人總數不得超過三十五人","受益權之受讓人不須為專業投資人","受益人分割讓與後之每一受益人所持有受益權單位金額不得低於新臺幣一千萬元","受益人應於轉讓受益權前，提供受讓人之身分資料等，經信託業同意轉讓後，受益人始得轉讓"],"a":"2","tp":"行銷訂約與風險揭露","note":""},{"p":52,"s":1,"n":43,"t":"依信託業法規定，有關信託業募集共同信託基金之敘述，下列何者正確？","o":["得以發行受益證券或記帳方式向不特定多數人募集","共同信託基金受益證券，得為記名或不記名式","共同信託基金受益證券，不得由受益人背書轉讓","信託業得於發行計畫內載明承諾擔保本金或最低收益率"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":52,"s":1,"n":45,"t":"信託業如符合主管機關規定，除涉及特定業務者外，得對其營業執照已登載之信託業務項下所設計之新種信託商品逕行開辦，並至遲於開辦後幾日內檢具營業計劃書、信託契約範本報請主管機關備查？","o":["十日內","十五日內","三十日內","六十日內"],"a":"2","tp":"設立標準與 :""},{"p":52,"s":2,"n":8,"t":"信託業依據境外基金管理辦法，對於投資私募之境外基金規定，下列何者正確？","o":["信託業得複委託其他機構辦理","信託業得與相關機構簽訂合作銷售契約","投資標的限境外已發行成立二年以上，基金規模達等值美金二億以上之基金","國內投資人投資金額占個別私募境外基金比率，不得超過基金淨資產價值之90%"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":9,"t":"有關銀行辦理特定金錢信託投資境外基金業務與客戶簽訂之信託契約，下列敘述何者正確？","o":["期限至少須一個月","應載明委託人之責任","應載明受託人之責任","應載明投資標的之報酬"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":10,"t":"委託人以特定金錢信託方式投資國外有價證券，因相關法令修正致投資標的不符規定時，下列敘述何者錯誤？","o":["一律強制贖回","於契約期滿前得按原訂契約金額繼續持有","以定期定額投資者，得按原契約金額繼續投資至全數贖回為止","以定期不定額投資者，得按原契約金額繼續投資至全數贖回為止，但投資人不得增加基準扣款金額"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":11,"t":"委託人與銀行簽訂特定金錢信託契約，並指定將信託資金委由國外經理機構運用時，下列敘述何者錯誤？","o":["由受託人與國外經理公司簽約","國外經理公司應於設定之投資規範內操作","委託人應與國外保管機構直接簽約","委託人應負擔銀行信託手續費"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":52,"s":2,"n":12,"t":"殯葬禮儀服務業與消費者簽訂生前殯葬服務契約，其有預先收取費用者，應將該費用百分之多少交付信託業管理？","o":["百分之七十","百分之七十五","百分之八十","百分之百"],"a":"2","tp":"預收款禮券與履約保障","note":""},{"p":52,"s":2,"n":13,"t":"依境外基金管理辦法規定，境外基金除境外指數股票型基金外，其應符合之條件，不包括下列何者？","o":["不得投資於黃金","不得投資於衍生性商品","不得投資於商品現貨","境外基金必須成立滿一年"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":14,"t":"張三向甲銀行辦理特定金錢信託投資境外基金，下列何者非甲銀行可能出具之文件？","o":["對帳單","交易報告書","受益憑證","信託契約"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":15,"t":"信託業應定期作成信託財產目錄並編製收支計算表，送交下列何者？ A.銀行董事會 B.委託人 C.受益人","o":["僅AB","僅BC","僅AC","ABC"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":52,"s":2,"n":16,"t":"有關信託業辦理特定金錢信託投資境外結構型商品業務，若投資標的為信用連結型商品時，應加強揭露說明其定義內容之風險，下列何者錯誤？","o":["破產風險","重整風險","作業風險","無法履行債務風險"],"a":"3","tp":"結構型商品與衍生性金融商品","note":""},{"p":52,"s":2,"n":17,"t":"李四將新臺幣三千萬元交付乙銀行成立信託，並授權王五得指示乙銀行以信託財產存放於定期存款或購買境外基金，王五依約指示乙銀行將三千萬元存放於一年期固定利率定期存款，下列敘述何者正確？","o":["該信託屬特定金錢信託","乙銀行得承諾擔保本金","該信託屬指定金錢信託","該信託屬不指定金錢信託"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":18,"t":"有關國際金融業務分行辦理信託業務之敘述，下列何者錯誤？","o":["得對境外客戶辦理新臺幣信託","原則上限收受信託財產","帳務設於國際金融業務分行","信託財產之管理運用及處分，應統籌由信託業務專責部門為之"],"a":"1","tp":"外匯結匯與國際金融業務","note":""},{"p":52,"s":2,"n":19,"t":"有關特定金錢信託投資國外有價證券之本金，其新臺幣與外幣間匯率避險得採行之方式，下列何者錯誤？","o":["換匯交易","換匯換利交易","期貨","遠期外匯交易"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":20,"t":"銀行辦理信託業務收取之手續費收入，有關其相關稅負之敘述，下列何者錯誤？","o":["依法應報繳營業稅","未於信託契約載明或註記收到銀錢文字者，免納印花稅","以信託申請書代替信託手續費收入憑證者，免納印花稅","以信託申請書代替信託手續費收入憑證者，應報繳印花稅"],"a":"3","tp":"營業稅與印花稅","note":""},{"p":52,"s":2,"n":21,"t":"依境外基金管理辦法規定，信託業辦理特定金錢信託投資境外基金時，得與境外基金機構及總代理人共同簽訂何種契約？","o":["代理契約","銷售契約","投資契約","信託契約"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":22,"t":"有關「信託財產評審委員會之組織及評審規範」規定，委員會應審議信託財產運用是否遵循法令、符合信託約定等，評審時應進行抽查，每次抽查件數就交付信託財產達新臺幣五千萬元以上者，抽查比率至少不得低於百分之多少？","o":["百分之一","百分之三","百分之五","百分之十"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":52,"s":2,"n":23,"t":"企業員工持股信託契約存續期間中，係由下列何者負責與受託人就信託相關事務為協議、指示、確認、同意？","o":["公司代表人","工會代表人","員工持股會代表人","每一加入之員工"],"a":"3","tp":"持股會組織協議與當事人","note":""},{"p":52,"s":2,"n":24,"t":"採行企業員工持股信託之公司辦理現金增資發行新股時，下列敘述何者錯誤？","o":["享有認購權利之名義人為受託人（信託專戶）本身","信託專戶應依參與認購新股者之認購權益比例計算暨分配","委託人得以股東身分直接參與認購","受託人接獲現金增資通知時，應轉通知委託人"],"a":"3","tp":"員工福利信託特性與制度","note":""},{"p":52,"s":2,"n":25,"t":"有關企業員工持股信託資金之運用，下列敘述何者正確？","o":["得投資境外基金","採定期定額投資法","以短期投資獲利為主要目的","當股價高時應鼓勵員工多提撥提存金"],"a":"2","tp":"資金提撥與公司獎勵","note":""},{"p":52,"s":2,"n":26,"t":"企業員工持股信託之委託人死亡時，原則上其信託財產歸屬下列何者？","o":["該員工之繼承人","員工持股會","公司","員工持股會指定之第三人"],"a":"1","tp":"持股會組織協議與當事人","note":""},{"p":52,"s":2,"n":27,"t":"下列何者為企業員工持股信託之投資標的？","o":["證券投資信託基金","公司債","興櫃股票","員工所屬企業已上市之股票"],"a":"4","tp":"投資運用與分別管理","note":""},{"p":52,"s":2,"n":28,"t":"有關企業員工持股信託業務信託資金之敘述，下列何者錯誤？","o":["原則上由員工每月固定提撥信託資金予受託人","員工得依個人投資理財需要，隨時額外追加提存","公司辦理現金增資時，員工不得另行追加提存金參與認購","公司發放年終獎金時，員工得依其每月薪資提存金之數倍追加提存"],"a":"3","tp":"資金提撥與公司獎勵","note":""},{"p":52,"s":2,"n":29,"t":"有關企業員工持股信託其投資風險之承擔者，下列何者正確？ A.委託人 B.受益人 C.員工持股會 D.員工持股會代表人 E.員工持股會會員 F.受託人","o":["僅ABF","僅ADE","僅ABE","僅CEF"],"a":"3","tp":"持股會組織協議與當事人","note":""},{"p":52,"s":2,"n":30,"t":"有關企業員工持股信託股東會議決權之行使，下列何者錯誤？","o":["依法由員工持股會代表人出席並行使議決權","員工持股會代表人不得要求受託人分割行使議決權","公司股東名簿係以受託人之名義登記","受託人不得成為董監事選舉時之候選人人選"],"a":"1","tp":"員工福利信託特性與制度","note":""},{"p":52,"s":2,"n":31,"t":"有關企業員工持股信託，下列敘述何者正確？ A.員工中途退出領回信託財產時，應予課所得稅 B.於契約終止時，信託財產僅得折算為金錢方式返還","o":["僅A","僅B","AB 皆對","AB 皆錯"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":52,"s":2,"n":32,"t":"委託人交付新股認購權利證書為信託財產時，屬於下列何種信託業務？","o":["金錢之信託","動產之信託","有價證券之信託","金錢債權及其擔保物權之信託"],"a":"3","tp":"內部人持股申報與權益行使","note":""},{"p":52,"s":2,"n":33,"t":"依證交所規定，有價證券借貸之定價交易相關費率，下列何者正確？ A.依證交所公告之固定借券費率，採逐筆撮合成交 B.證券商向借貸雙方收取之手續費為借券費用0.2% C.證交所向借貸雙方收取之借貸服務費為借券費用1.6%","o":["僅A","僅B","僅C","僅AC"],"a":"4","tp":"有價證券借貸交易與擔保","note":""},{"p":52,"s":2,"n":34,"t":"運用型有價證券信託如得辦理有價證券借貸時，依有價證券借貸辦法規定，下列敘述何者錯誤？","o":["出借人得向借券人收取借券費用","借券產生之證券交易稅由出借人繳交","所謂借券需求，係指特定法人機構為交易及履約之借券以及證券商或證券金融事業交割之借券","所謂有價證券借貸，係指出借人同意將有價證券出借，並由借券人以相同種類數量有價證券返還之行為"],"a":"2","tp":"有價證券借貸交易與擔保","note":""},{"p":52,"s":2,"n":35,"t":"委託人將持有公開發行公司股票信託時，下列何者無需依證券交易法規定辦理股權異動申報？","o":["董事","監察人","持有公司股份超過百分之五之股東","持有公司股份超過百分之十之股東"],"a":"3","tp":"內部人持股申報與權益行使","note":""},{"p":52,"s":2,"n":36,"t":"有價證券信託之信託公示相關規定，下列何者錯誤？","o":["應於證券上載明為信託財產","應向主管機關核備登載","應於其他表彰權利文件上載明為信託財產","信託財產登載，應依目的事業主管機關之規定，否則不得對抗第三人"],"a":"2","tp":"證券信託種類與保管差異","note":""},{"p":52,"s":2,"n":37,"t":"甲公開發行公司董事將其持有該公司之股票向信託業辦理保留運用決定權之信託，依證券交易法規定計算全體董事所持有記名股票之最低持股數，下列敘述何者正確？","o":["信託之股數得計入最低持股數","僅信託之股票為上市公司股票時，得計入最低持股數","信託之股數不得計入最低持股數","僅信託之股票為上櫃公司股票時，得計入最低持股數"],"a":"1","tp":"內部人持股申報與權益行使","note":""},{"p":52,"s":2,"n":38,"t":"不動產投資信託係向不特定人募集資金投資於不動產，屬下列何種信託？","o":["有價證券信託","金錢信託","金錢債權信託","動產信託"],"a":"2","tp":"REIT募集投資標的與限制","note":""},{"p":52,"s":2,"n":39,"t":"不動產投資信託基金除經主管機關核准者外，其基金類型以下列何者為限？","o":["開放型基金","封閉型基金","並無限制","連結型基金"],"a":"2","tp":"REIT募集投資標的與限制","note":""},{"p":52,"s":2,"n":40,"t":"有關不動產投資信託基金有發起人者，下列敘述何者錯誤？","o":["發起人對於其所提供辦理受益證券之募集、發行之資料，不得有虛偽或其他足致他人誤信之行為","發起人因發行之資料有虛偽不實者，對於該受益證券之善意取得人或出賣人，應負賠償責任","發起人擬讓與之不動產有設定抵押權者，發起人應予塗銷","發起人擬讓與之不動產有設定抵押權者，發起人應依不動產證券化條例辦理受益權轉讓"],"a":"4","tp":"REIT募集投資標的與限制","note":""},{"p":52,"s":2,"n":41,"t":"有關不動產證券化條例對不動產證券化之限制，下列何者錯誤？","o":["以信託為架構","限制借出款上限","政府參與監督","制訂利害關係人迴避原則"],"a":"2","tp":"不動產證券化共通規定","note":""},{"p":52,"s":2,"n":42,"t":"有關不動產證券化特性之敘述，下列何者錯誤？","o":["投資金額較低","權益具不可分割性","營運透明化","經營專業化"],"a":"2","tp":"不動產證券化共通規定","note":""},{"p":52,"s":2,"n":43,"t":"不動產資產信託之委託人係指下列何者？","o":["受益證券之投資人","不動產或不動產相關權利之所有人","不動產或不動產相關權利之債權人","不動產或不動產相關權利之承租人"],"a":"2","tp":"REAT資產信託與證券發行","note":""},{"p":52,"s":2,"n":44,"t":"下列何者非屬不動產證券化條例所規定之不動產資產信託契約得移轉之財產權？","o":["已有穩定收入之不動產","已有穩定收入之不動產相關權利","已有穩定收入之地上權權利","依不動產證券化條例發行之受益證券"],"a":"4","tp":"資產移轉債權與債務人通知","note":""},{"p":52,"s":2,"n":45,"t":"有關不動產投資信託基金借入款項之限制，下列敘述何者正確？","o":["借款人為管理機構","借入款項之用途限為不動產營運、或配發利益、孳息或其他收益需要","應於借款契約生效日起5 日內辦理公告","基於投資效益，主管機關不得訂定借入款項之比率上限"],"a":"2","tp":"REIT募集投資標的與限制","note":""},{"p":52,"s":2,"n":46,"t":"依不動產證券化條例規定，有關募集不動產投資信託基金之敘述，下列何者錯誤？","o":["應於核准函送達之日或申報生效之日起三個月內開始募集","得向主管機關申請展延","展延期限最長不得超過六個月","展延以一次為限"],"a":"3","tp":"REIT募集投資標的與限制","note":""},{"p":52,"s":2,"n":47,"t":"有關金融資產證券化對金融機構之可能效益，下列何者錯誤？","o":["擴大資產負債規模","提高自有資本比率及經營績效","擴大金融機構資金調度之管道","提高金融資產之流動性及資金使用效率"],"a":"1","tp":"證券化特性與經濟效益","note":""},{"p":52,"s":2,"n":48,"t":"有關國內外最常採用之內部信用增強方法，下列何者錯誤？","o":["提供擔保","利差帳戶","更換部分資產","運用優先劣後架構"],"a":"1","tp":"信用增強評等與風險分散","note":""},{"p":52,"s":2,"n":49,"t":"依金融資產證券化條例規定，若特殊目的信託契約並未另有約定，則受益人會議決議指定新受託機構，應以下列何種決議方式為之？","o":["應有表決權總數三分之二以上受益人之出席，出席受益人表決權過半數之同意行之","應有表決權總數二分之一以上受益人之出席，出席受益人表決權三分之二之同意行之","應由全體受益人同意為之","應有表決權總數二分之一以上受益人之出席，出席受益人表決權過半數之同意行之"],"a":"4","tp":"特殊目的信託公司與參與機構","note":""},{"p":52,"s":2,"n":50,"t":"有關受託機構依資產信託證券化計畫所發行之受益證券，下列敘述何者錯誤？","o":["受益證券應為記名式","受益證券之轉讓應以記名背書方式為之","受益證券不得以無實體方式發行","受益證券轉讓後，應將受讓人之姓名或名稱、住所通知受託機構，始能對抗受託機構"],"a":"3","tp":"特殊目的信託公司與參與機構","note":""},{"p":52,"s":2,"n":51,"t":"依特殊目的公司設立及許可準則規定，特殊目的公司最低實收資本額為新臺幣多少元？","o":["十萬元","一百萬元","五百萬元","一千萬元"],"a":"1","tp":"特殊目的信託公司與參與機構","note":""},{"p":52,"s":2,"n":52,"t":"下列何者非屬金融資產證券化之特性？","o":["創始機構應移轉資產予特殊目的機構","由特殊目的機構發行有價證券","投資人之收益來自創始機構之經營績效","現金流量可委由服務機構代為管理"],"a":"3","tp":"證券化特性與經濟效益","note":""},{"p":52,"s":2,"n":53,"t":"有關募集金融資產證券化受益證券之敘述，下列何者錯誤？","o":["向特定人私募受益證券必須依規定交付公開說明書","公開招募時應向證券主管機關申請核准或申報生效","符合主管機關所定條件之應募，其人數上限目前為三十五人","公開招募時應強制接受信用評等"],"a":"1","tp":"受益證券募集發行與受益人會議","note":""},{"p":52,"s":2,"n":54,"t":"依金融資產證券化條例規定，特殊目的公司發行用以表彰持有人對受讓資產所享權利之權利憑證或證書為下列何者？","o":["受益證券","受益憑證","信託憑證","資產基礎證券"],"a":"4","tp":"特殊目的信託公司與參與機構","note":""},{"p":52,"s":2,"n":55,"t":"金融資產證券化符合資格之受益人，提出召集受益人會議之請求後，原則上有召集權之人至遲應於幾日內召集受益人會議？","o":["5 日","10 日","15 日","20 日"],"a":"3","tp":"受益證券募集發行與受益人會議","note":""},{"p":52,"s":2,"n":56,"t":"有關全權委託投資業務之三方權義協定書，下列何者不屬於簽約當事人？","o":["保管銀行","委任人","證券商","證券投資顧問事業或證券投資信託事業"],"a":"3","tp":"全權委託保管與越權交易","note":""},{"p":52,"s":2,"n":57,"t":"下列何者不得召開證券投資信託基金受益人大會？","o":["受益人","基金保管機構","證券投資信託事業","信託業商業同業公會"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":52,"s":2,"n":58,"t":"有關保管機構辦理證券投資信託基金交割作業，下列敘述何者錯誤？","o":["應確認交易對象","應確認有權人員簽章","不論交割完成與否，均應以書面回報投信公司","交割指示內容不明確，保管機構仍應依交割指示辦理交割，並儘速通知投信公司"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":52,"s":2,"n":59,"t":"甲外國機構投資人來台投資，委任乙銀行擔任其保管機構，實務上應以下列何者名義開設新臺幣活期存款帳戶？","o":["甲","甲之國外保管機構","乙銀行","乙銀行受託保管甲外國機構投資專戶"],"a":"4","tp":"外資全球保管與代理登記","note":""},{"p":52,"s":2,"n":60,"t":"下列何項不得作為提存證券商營業保證金之標的？","o":["無實體公債","股票","金融債券","定存單"],"a":"2","tp":"其他資產保管與營業保證金","note":""},{"p":52,"s":2,"n":61,"t":"我國證券投資信託及顧問法未規定者，應優先適用下列何項規定？","o":["證券交易法","民法","信託法","信託業法"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":52,"s":2,"n":62,"t":"全權委託投資之保管機構，如認為受任人有越權交易且無法及時協商解決時，最遲應於何時出具越權交易通知書？","o":["成交日次二營業日上午十時前","成交日次二營業日上午十一時前","成交日次一營業日上午十時前","成交日次一營業日上午十一時前"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":52,"s":2,"n":63,"t":"境外外國機構投資人持有公開發行公司之股份者，有關行使表決權之敘述，下列何者正確？","o":["持股未達三十萬股者，得不指派人員出席","持股達三十萬股以上者，應一律親自出席參與表決","一律不得以書面或電子方式行使表決","無論持股數多寡，均應指派國內代理人或代表人出席"],"a":"1","tp":"外資全球保管與代理登記","note":""},{"p":52,"s":2,"n":64,"t":"境外華僑及外國人投資國內證券，應向下列何者申請辦理登記？","o":["中央銀行","經濟部","財政部","臺灣證券交易所"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":65,"t":"全權委託投資業務以委任關係辦理者，下列何者錯誤？","o":["委任人委託資金應於簽約時存入保管銀行","原則上每一全權委託投資帳戶之保管銀行以一家為限","越權交易所需交割之款券，原則上應由委任人負責撥入保管帳戶","除法令或主管機關另有規定外，原則上不得接受共同之委任"],"a":"3","tp":"全權委託保管與越權交易","note":""},{"p":52,"s":2,"n":66,"t":"信託業兼營證券投 擔任證券投資信託基金保管機構","經中華信用評等股份有限公司評定，長期債務信用評等達twBBB-級以上，短期債務信用評等達twA-3 級以上者，得擔任金融資產證券化之受託機構","經中華信用評等股份有限公司評定，長期債務信用評等達twBBB-級以上債務人所發行之短期票券，得為信託資金集合管理運用管理辦法規定可投資之短期票券"],"a":"4","tp":"信用評等與機構資格綜合比較","note":""},{"p":52,"s":2,"n":79,"t":"ABC 壽險公司與XYZ 銀行簽訂信託契約並交付新臺幣五十億元獨立設帳投資於國外有價證券，信託資金之運用由ABC 壽險公司選定國外經理公司並給予概括指示由其負責運用，此於信託分類上係屬於下列何者？","o":["指定單獨管理金錢信託","特定單獨管理金錢信託","指定單獨管理有價證券信託","特定單獨管理有價證券信託"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":52,"s":2,"n":80,"t":"有關不動產證券化，下列敘述何者錯誤？","o":["不動產資產信託，如屬於募集受益證券者應洽經證券主管機關核准","除經主管機關核准外，受託機構不得對投顧業者私募不動產投資信託基金","僅辦理不動產投資信託之信託業，最低實收資本額為新臺幣三億元","運用不動產投資信託基金原則上不得為保證"],"a":"3","tp":"不動產證券化共通規定","note":""},{"p":53,"s":1,"n":1,"t":"有關信託業收受信託財產之敘述，下列何者錯誤？","o":["以船舶為信託財產時，應為信託登記","以股票或其他表彰權利之文件上為信託財產者，應於股票上載明為信託財產","以公司債為信託財產者，應通知發行公司","以金錢為信託財產時，應為信託登記"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":53,"s":1,"n":2,"t":"有關信託財產之敘述，下列何者錯誤？","o":["受託人死亡時，信託財產不屬於其遺產","受託人因信託行為取得之財產權為信託財產","屬於信託財產之債權與不屬於該信託財產之債務得互相抵銷","受託人因信託財產之管理、處分、滅失取得之財產權，仍屬信託財產"],"a":"3","tp":"委託人權利與信託標的","note":""},{"p":53,"s":1,"n":3,"t":"依信託法規定，宣言信託係委託人以下列何者為受託人設立之信託？","o":["法院","信託監察人","委託人自己","目的事業主管機關"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":53,"s":1,"n":4,"t":"信託目的違反強制規定或公序良俗時，該信託行為之效力如何？","o":["得撤銷","無效","得終止","效力未定"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":53,"s":1,"n":5,"t":"依信託法規定，他益信託之信託關係消滅時，受託人應就信託事務之處理作成結算書，並取得相關人之承認，下列何者非前述所指之相關人？","o":["受益人","信託監察人","委託人","其他歸屬權利人"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":53,"s":1,"n":6,"t":"因信託關係存續中信託財產所生之地價稅，下列敘述何者錯誤？","o":["以受託人為納稅義務人","稅捐機關得逕對欠稅之信託財產強制執行","受託人不繳納時，稅捐機關不得執行受託人之自有財產","受託人得逕由信託財產中抵充之"],"a":"3","tp":"土地稅與土地增值稅","note":""},{"p":53,"s":1,"n":7,"t":"依信託法規定，信託關係消滅之原因，下列敘述何者正確？","o":["委託人死亡","受益人喪失行為能力","受託人撤銷設立登記","委託人與受託人、受益人合意解約"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":53,"s":1,"n":8,"t":"對於信託財產之強制執行，於受託人變更時，債權人仍得依原執行名義，以下列何者為債務人續行強制執行？","o":["原受託人","委託人","受益人","新受託人"],"a":"4","tp":"財產獨立性與強制執行","note":""},{"p":53,"s":1,"n":9,"t":"下列何者非委託人之權利？","o":["得於信託之行為時為權利之保留","對強制執行提起異議之訴之權利","共同為變更信託財產管理之權利","單獨終止他益信託之權利"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":53,"s":1,"n":10,"t":"甲、乙、丙為同一信託關係之受益人，如受託人違反信託本旨處分信託財產時，有關受益人撤銷權之行使， 下列敘述何者錯誤？","o":["得由甲、乙、丙其中一人為之","必須向法院提出聲請","必須由甲、乙、丙三人共同為之","自受益人知有撤銷原因時起，一年間不行使而消滅"],"a":"3","tp":"受益人權利與撤銷救濟","note":""},{"p":53,"s":1,"n":11,"t":"有關受託人之報酬，下列何者錯誤？","o":["信託報酬應載明於信託契約","受託人得依信託行為之訂定，自信託財產收取","受託人得依情事變更，請求法院增減約定之報酬","受託人之報酬請求權為優先債權，即優先於無擔保債權人之受償"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":53,"s":1,"n":12,"t":"他益信託之受託人辭任或被解任時，除信託行為另有訂定外，下列何者得指定新受託人？","o":["委託人","原受託人","受益人","信託監察人"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":53,"s":1,"n":13,"t":"受託人僅於下列何種情形時，得享有信託利益？","o":["受託人為委託人中之一人時","受託人與他人為共同受益人時","受託人為法人時","受託人與委託人為同一人時"],"a":"2","tp":"受益人權利與撤銷救濟","note":""},{"p":53,"s":1,"n":14,"t":"下列何者為信託監察人不得行使之權利？","o":["請求閱覽受託人所作成之信託財產目錄及收支計算表","對違反規定所為強制執行提起異議之訴權利","享有信託利益及拋棄信託利益","對不當管理信託財產之受託人，請求損害賠償"],"a":"3","tp":"信託監察人","note":""},{"p":53,"s":1,"n":15,"t":"依信託法規定，有關信託財產轉為受託人自有財產，下列敘述何者錯誤？","o":["憑受託人意願自由取得","受託人經受益人書面同意，並依市價取得","受託人係經由集中市場競價取得","受託人有不得已事由經法院許可取得"],"a":"1","tp":"財產獨立性與強制執行","note":""},{"p":53,"s":1,"n":16,"t":"依信託法規定，受託人因管理不當致信託財產發生損害或違反信託本旨處分信託財產時，下列敘述何者正確？","o":["受益人得主張該信託行為無效","受益人得請求損害賠償或回復原狀","受益人不得主張任何權利","受益人得聲請由檢察官監督之"],"a":"2","tp":"受益人權利與撤銷救濟","note":""},{"p":53,"s":1,"n":17,"t":"有關信託之監督機關，下列敘述何者錯誤？","o":["營業信託之監督機關為經濟部","公益信託之監督機關為公益目的事業之主管機關","一般民事信託中的私益信託之監督機關為法院","信託業之主管機關為金管會"],"a":"1","tp":"設立能力與監督管轄","note":""},{"p":53,"s":1,"n":18,"t":"信託關係消滅時，其法律關係自何時起失其效力？","o":["自消滅之時起失其效力","溯自信託行為發生時失其效力","溯自信託訂約時失其效力","自始無效"],"a":"1","tp":"終止變更與剩餘財產歸屬","note":""},{"p":53,"s":1,"n":19,"t":"甲以其子丙為受益人成立信託，信託期間十年，且於信託契約中未有其他特別或保留約定，五年後因丙積欠債務，甲欲提前終止本信託關係，應如何辦理？","o":["須由甲與丙共同終止","甲單獨提出終止即可","須丙之債權人同意","須向法院聲請終止"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":53,"s":1,"n":20,"t":"信託關係原則上不因法人受託人被撤銷設立登記而消滅；於此情形，在公益信託時，除信託行為另有訂定外，應如何處理？","o":["原受託人應依法指定新受託人","由利害關係人或檢察官聲請法院選任新受託人","信託監察人得指定新受託人，如不能或不為指定者，法院得因利害關係人或檢察官之聲請選任新受託人","委託人得指定新受託人，如不能或不為指定者，目的事業主管機關得依申請或職權選任新受託人"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":53,"s":1,"n":21,"t":"有關銀行經營信託業務之經營與管理，下列敘述何者錯誤？","o":["應指撥營運資金專款經營","營運範圍及風險管理規定，由業者逕自定之","經營信託業務之人員應對客戶交易資料保守秘密","除其他法律另有規定者外，準用銀行法第六章之規定"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":53,"s":1,"n":22,"t":"信託業為下列何項行為時，須逐案經主管機關許可？","o":["招募理財專員","增設分支機構","增設理財區域中心","將部分業務委託他人經營"],"a":"2","tp":"監理處分罰則與損害賠償","note":""},{"p":53,"s":1,"n":23,"t":"有關信託業之設立，下列何者錯誤？","o":["信託公司之股票得為無記名式","發起人及股東中須有特定之專業股東","主管機關許可時，得於必要範圍附加附款","申請文件須記載一定事項，且須備有業務章則或營業計畫書"],"a":"1","tp":"設立標準與分支機構","note":""},{"p":53,"s":1,"n":24,"t":"依信託業法規定，信託業得經營之業務項目，下列何者錯誤？","o":["動產之信託","租賃權之信託","專利權之信託","商標權之信託"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":53,"s":1,"n":25,"t":"與信託業有下列何種關係之企業為信託業之利害關係人？","o":["兼營信託業之銀行分行襄理與他人合夥之事業","兼營信託業之銀行轉投資之企業，持股超過該企業已發行股份總數百分之三者","持有兼營信託業之銀行已發行股份總數百分之三之股東","兼營信託業銀行之總行經理因個人投資關係擔任董事之企業"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":53,"s":1,"n":26,"t":"下列何者非信託業法所定信託業得經營之附屬業務項目？","o":["設置信託資金集合管理運用帳戶","擔任有價證券發行簽證人","擔任破產管理人及公司重整監督人","提供投資財務管理及不動產開發顧問服務"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":53,"s":1,"n":27,"t":"信託業務項目之分類，係依下列何者決定之？","o":["委託人與受託人之約定","受託人接受信託時之財產狀態","信託期間處分財產之方式","返還信託財產予受益人時之財產狀態"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":53,"s":1,"n":28,"t":"信託業得以信託財產為下列何種行為？","o":["購買本身之不動產","辦理放款","對於以開發為目的之土地信託經全體受益人同意而借入款項","購買其利害關係人發行之股票"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":53,"s":1,"n":29,"t":"依「信託業負責人應具備資格條件暨經營與管理人員應具備信託專門學識或經驗準則」規定，下列何者非屬信託業經營與管理人員之分類？","o":["督導人員","管理人員","分析人員","業務人員"],"a":"3","tp":"人員資格訓練與利益限制","note":""},{"p":53,"s":1,"n":30,"t":"依信託業法所定罰鍰，倘受罰人未依訴願及行政訴訟程序，請求救濟，罰鍰經限期繳納而逾期不繳者，自逾期之日起，每日加收滯納金為若干？","o":["罰鍰之百分之一","罰鍰之百分之三","罰鍰之千分之一","罰鍰之千分之五"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":53,"s":1,"n":31,"t":"信託業為下列何種行為，將負刑事責任？","o":["未經主管機關核准，募集共同信託基金","未經全體受益人同意，以該信託財產借入款項","辦理集合管理運用之金錢信託，未保持適當之流動性","未經受益人書面同意，而將信託財產存放於其銀行業務部門作為存款"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":53,"s":1,"n":32,"t":"信託業提存賠償準備金應繳存於何處？","o":["中央銀行","財政部國庫署","財政部之指定銀行","保管機構"],"a":"1","tp":"賠償準備金與盈餘分配","note":""},{"p":53,"s":1,"n":33,"t":"某兼營信託業務之銀行實收資本額為100 億元，其受託之金錢信託共50 億元，不動產信託10 億元，有價證券信託5 億元，有關該信託業應提存之賠償準備金，下列敘述何者正確？","o":["資本額之1%","其所受託之信託財產合計之15.125%","新臺幣五千萬元","新臺幣一億五千萬元"],"a":"3","tp":"設立標準與分支機構","note":""},{"p":53,"s":1,"n":34,"t":"信託公司之稽核單位對營業單位每年應至少辦理一般查核幾次？","o":["一次","二次","三次","四次"],"a":"1","tp":"內控稽核與風險管理","note":""},{"p":53,"s":1,"n":35,"t":"兼營信託業之銀行，經主管機關派員接管時，其銀行之經營權及財產之管理處分權由下列何者行使之？","o":["股東會","董事會","總經理","接管人"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":53,"s":1,"n":36,"t":"銀行經營下列何種業務，其營業及會計必須獨立？","o":["代理收付業務","信託業務","買賣黃金業務","收受支票存款業務"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":53,"s":1,"n":37,"t":"有關信託公司之設立，下列敘述何者錯誤？","o":["發起人之出資以現金為限","信託公司經核發營業執照後，滿三個月尚未開始營業者，主管機關應廢止其設立之許可","發起人持有信託公司已發行股份總數百分之五十以上者，以投資一家信託公司為限","應於核准設立後六個月內向經濟部申請公司設立登記"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":53,"s":1,"n":38,"t":"信託業經主管機關派員監管、接管或勒令停業進行清理時，下列敘述何者錯誤？","o":["主管機關得通知有關機關或機構禁止信託業負責人財產之移轉","主管機關得通知有關機關或機構禁止有違法嫌疑之職員財產之移轉","主管機關得通知有關機關或機構禁止有信託業負責人三親等以內血親財產之移轉","主管機關得函請入出境許可之機關限制有違法嫌疑之職員出境"],"a":"3","tp":"監理處分罰則與損害賠償","note":""},{"p":53,"s":1,"n":39,"t":"甲委託人與乙受託人，訂立信託契約，由甲交付乙新台幣五百萬元成立信託，甲於信託契約中約明指示乙購買國內債券型基金，並同意乙擁有運用決定權，且得將甲之信託資金與其他不同信託行為之信託資金集合管理運用，此種信託係屬下列何種信託？","o":["特定單獨管理運用金錢信託","特定集合管理運用金錢信託","指定單獨管理運用金錢信託","指定集合管理運用金錢信託"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":53,"s":1,"n":40,"t":"依信託業商業同業公會會員自律公約規定，會員涉及違反相關法令、本會章則及公約時，其審議程序依序為下列何者？ A.自律規範案件審議會議 B.法規紀律委員會 C.業務發展委員會 D.理事會","o":["ADBC","ACBD","DACB","DABC"],"a":"2","tp":"公會自律與行為規範","note":""},{"p":53,"s":1,"n":41,"t":"信託公司訂定各種作業及管理規範，應有下列何單位之參與？","o":["僅需稽核單位","會計及資訊","稽核及資訊","稽核及會計"],"a":"3","tp":"內控稽核與風險管理","note":""},{"p":53,"s":1,"n":42,"t":"有關信託業公告事項及方式之敘述，下列何者錯誤？","o":["應每半年營業年度編製營業報告","將資產負債表於其所在地之日報公告","應每半年營業年度編製財務報告","如有信託業法第四十一條之情事發生時，至遲應於事實發生之翌日起三個營業日內辦理公告"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":53,"s":1,"n":43,"t":"呂美與甲銀行簽訂信託契約，由呂美交付新臺幣壹千萬元，指示甲銀行投資於國內上市公司股票，約明信託期間全部信託利益由其姐呂麗享有，則信託關係消滅時，下列敘述何者正確？","o":["信託財產歸屬之順序，信託契約所定者優先於呂美，呂美優先於呂麗","信託財產歸屬之順序，信託契約所定者優先於呂麗，呂麗優先於呂美或呂美之繼承人","信託財產歸屬之順序，信託契約未約定時，呂美與呂麗之順序相同","信託關係消滅時，受託人所製作之結算書及報告書不須取得呂麗之承認"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":53,"s":1,"n":44,"t":"甲、乙將土地信託予丙信託業，辦理以開發為目的之自益信託，嗣甲死，受益權由丁繼承，下列敘述何者錯誤？","o":["地價稅之納稅義務人為丙信託業","丙信託業得自行視開發之需要以信託財產借入款項","不適用集合管理運用金錢信託流動性資產範圍及比率準則","丁應就甲得享有信託利益之權利未領受部分，申報遺產稅"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":53,"s":1,"n":45,"t":"土地為信託財產者，應課徵土地增值稅之情形，下列何者正確？","o":["信託關係成立，委託人移轉信託財產於受託人時","因信託行為被撤銷，受託人移轉信託財產於委託人時","信託關係存續中，受託人將信託財產移轉為其自有財產時","信託關係存續中，受託人變更，原受託人移轉信託財產於新受託人時"],"a":"3","tp":"土地稅與土地增值稅","note":""},{"p":53,"s":1,"n":46,"t":"依信託課稅之理論及原則，所有權人與享有利益之人之關係為何？","o":["同一權利主體","不同權利主體","無法明顯區分之混合體","容易明顯區分之混合體"],"a":"2","tp":"信託課稅原則與形式移轉","note":""},{"p":53,"s":1,"n":47,"t":"信託課稅所稱之「實質課稅原則」，係指對下列何者課稅之原則？","o":["實質所得人","實質支出人","實質管理人","所得發生時之所有權人"],"a":"1","tp":"信託課稅原則與形式移轉","note":""},{"p":53,"s":1,"n":48,"t":"甲以20 萬股股票成立一信託，信託期間五年，期間配息、配股及期滿股票皆歸乙，假設贈與時郵政儲金匯業局一年期定期儲金固定利率為1%，契約日當天收盤價每股新台幣50 元，則甲贈與乙之權利價值為何？〔1/(1+1%)5 =0.9515〕","o":["新台幣1000 萬元","新台幣 951.5 萬元","新台幣48.5 萬元","零"],"a":"1","tp":"贈與權利價值與折現計算","note":""},{"p":53,"s":1,"n":49,"t":"陳先生有房屋一棟，將房屋以自益信託方式，信託登記給A 銀行，A 銀行將之出租他人做營業使用，下列應納之稅捐何者錯誤？","o":["房屋稅改以A 銀行為納稅義務人","信託登記時由陳先生申報繳納房屋契稅","地價稅改以A 銀行為納稅義務人","年度租金收入應由陳先生併入當年度所得額，依規定申報課稅"],"a":"2","tp":"信託稅務綜合比較","note":""},{"p":53,"s":1,"n":50,"t":"個人或營利事業成立稅法規定之公益信託，其財產得列為何種支出自所得額中扣除？","o":["其他支出","捐贈支出","營業支出","公益支出"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":53,"s":2,"n":1,"t":"依信託業商業同業公會會員辦理預收款信託業務應行注意事項規定，廠商如有發行商品服務憑證時，其商品服務憑證存續期間至少多久？","o":["六個月以上","一年以上","一年半以上","二年以上"],"a":"2","tp":"預收款禮券與履約保障","note":""},{"p":53,"s":2,"n":2,"t":"有關信託業辦理新臺幣特定金錢信託投資外幣有價證券業務之委託人資格，下列何者錯誤？","o":["得為本國法人","得為本國自然人","得為領有外僑居留證之外國自然人","得為未經我國政府認許之外國法人"],"a":"4","tp":"外匯結匯與國際金融業務","note":""},{"p":53,"s":2,"n":3,"t":"依境外基金管理辦法規定，銷售機構代理境外基金之募集及銷售時，應充分知悉並評估客戶之事項，下列何者錯誤？","o":["財務狀況","投資知識與經驗","家庭成員及消費習慣","承受投資風險之程度"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":53,"s":2,"n":4,"t":"目前屬於金錢信託者，下列何者錯誤？","o":["預收款信託","退休安養信託","有價證券之信託","信託資金投資國外有價證券"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":53,"s":2,"n":5,"t":"銀行辦理特定金錢信託投資國內外共同基金業務，下列敘述何者錯誤？","o
