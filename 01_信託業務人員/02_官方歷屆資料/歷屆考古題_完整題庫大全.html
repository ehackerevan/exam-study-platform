te":""},{"p":53,"s":2,"n":78,"t":"有關信託業務經營規定之敘述，下列何者錯誤？","o":["特定金錢信託之受託人對信託財產不具有運用決定權","保管銀行業務係屬信託業附屬業務","依現行規定，信託業應提存至少新臺幣五千萬元之賠償準備金","有價證券信託係採形式讓渡課稅原則"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":53,"s":2,"n":79,"t":"證券投資信託基金受益人之收益分配請求權，自收益發放日起之消滅時效期間為何？","o":["一年","三年","五年","十五年"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":53,"s":2,"n":80,"t":"有關全權委託投資業務保管銀行之敘述，下列何者錯誤？","o":["客戶得將委託投資資產信託移轉予保管銀行","被指定之保管銀行不得為受任之證券投顧事業之董事","客戶如為信託業時，可自行保管委託投資之資產","除法令或金管會另有規定外，不得接受共同委任"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":54,"s":1,"n":1,"t":"某甲參加該公司之員工持股信託，事後如某甲積欠乙銀行房屋貸款未償還，則乙銀行可否對某甲之員工持股信託財產強制執行？","o":["經法院同意得強制執行","經受託人同意得強制執行","經某甲同意得強制執行","不得強制執行"],"a":"4","tp":"員工福利信託特性與制度","note":""},{"p":54,"s":1,"n":2,"t":"依我國信託業法規定，下列何者非屬信託業得經營之業務？","o":["金錢債權之信託業務","專利權之信託業務","不動產開發顧問業務","保證業務"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":54,"s":1,"n":3,"t":"下列何種財產交付信託時，非經通知發行公司，不得對抗該公司？","o":["股票","金錢","動產","不動產"],"a":"1","tp":"登記公示與對抗效力","note":""},{"p":54,"s":1,"n":4,"t":"錢先生交付一千萬元成立金錢信託，希望銀行幫他投資在股票型基金並代為操作，係屬下列何種信託？","o":["指定單獨金錢信託","特定單獨金錢信託","不指定單獨金錢信託","不特定單獨金錢信託"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":54,"s":1,"n":5,"t":"依信託法規定，下列何種情形為當然無效之信託行為？","o":["委託人積欠稅金而將其財產權信託者","以設有質權之有價證券為信託者","信託行為有害於委託人之債權人權利者","以依法不得受讓特定財產權之人為該財產權之受益人者"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":54,"s":1,"n":6,"t":"因信託關係存續中信託財產所生之地價稅，下列敘述何者錯誤？","o":["以受託人為納稅義務人","稅捐機關得逕對欠稅之信託財產強制執行","受託人不繳納時，稅捐機關不得執行受託人之自有財產","受託人得逕由信託財產中抵充之"],"a":"3","tp":"土地稅與土地增值稅","note":""},{"p":54,"s":1,"n":7,"t":"下列何者得為信託關係中之受託人？ A.成年人 B.已婚之未成年人 C.二十歲以上之受輔助宣告之人 D.二十歲以上之破產人","o":["僅 A","僅AB","僅 ACD","ABCD"],"a":"1","tp":"財產獨立性與強制執行","note":""},{"p":54,"s":1,"n":8,"t":"依信託法規定，受託人違反信託本旨處分信託財產時，下列何者不屬於委託人之權利？","o":["請求減免報酬","請求回復原狀","聲請法院撤銷其處分","請求以金錢賠償信託財產所受損害"],"a":"3","tp":"受益人權利與撤銷救濟","note":""},{"p":54,"s":1,"n":9,"t":"下列何項非受託人任務終了之情形？","o":["法人受託人被撤銷設立登記時","委託人死亡時","受託人辭任時","受託人解任時"],"a":"2","tp":"終止變更與剩餘財產歸屬","note":""},{"p":54,"s":1,"n":10,"t":"依信託法規定，受託人違反信託本旨處分信託財產時，下列何者得聲請法院撤銷其處分？","o":["委託人","受益人","信託業主管機關","法院依職權行使撤銷"],"a":"2","tp":"受益人權利與撤銷救濟","note":""},{"p":54,"s":1,"n":11,"t":"他益信託之受託人辭任或被解任時，除信託行為另有訂定外，下列何者得指定新受託人？","o":["委託人","原受託人","受益人","信託監察人"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":54,"s":1,"n":12,"t":"私益信託委託人所指定之信託監察人擬辭任，應取得下列何者之同意？","o":["委託人","受益人","受託人","其他信託監察人"],"a":"1","tp":"信託監察人","note":""},{"p":54,"s":1,"n":13,"t":"信託關係消滅時，於受託人移轉信託財產於歸屬權利人前，信託關係視為存續，並以下列何者為該法定信託之受益人？","o":["委託人","信託監察人","主管機關","歸屬權利人"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":54,"s":1,"n":14,"t":"有關變更受託人事由，下列敘述何者錯誤？","o":["受託人死亡","受託人受破產宣告","受託人出國旅遊","受託人經解散或撤銷設立登記"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":54,"s":1,"n":15,"t":"某甲成立以從事法制研究、法律服務或其他與法務相關事項為目的之公益信託，其設立及受託人應經下列何者許可？","o":["財政部","法務部","地方法院","律師公會"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":54,"s":1,"n":16,"t":"信託監察人得以自己名義，為下列何者行使有關信託之訴訟上或訴訟外之行為？","o":["委託人","受託人","受益人","目的事業主管機關"],"a":"3","tp":"信託監察人","note":""},{"p":54,"s":1,"n":17,"t":"依信託法規定，信託關係消滅時，若享有全部信託利益之受益人死亡，且信託行為未訂歸屬權利人，該信託財產應歸屬於下列何者？","o":["國庫","受託人","委託人或其繼承人","地方政府或自治團體"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":54,"s":1,"n":18,"t":"委託人甲與受託人乙訂定信託契約，指定丙為受益人，並約定信託存續期間內，得由甲單獨終止信託， 下列敘述何者正確？","o":["基於他益信託關係，該契約仍須由甲、丙共同終止信託關係","丙依法可終止信託關係","須由甲與乙共同終止信託關係","依信託契約所定，由甲終止信託關係即可"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":54,"s":1,"n":19,"t":"張五先生與甲銀行簽訂信託契約，移轉一上市公司之股票五十萬股與該銀行，並約定銀行之信託目的限於保管股票、收取股息與紅利、出席股東會行使投票權、表決權、公司增資發行新股之認購，同時約明股息紅利等所有孳息之收益人為其長子張華先生，則下列之敘述何者正確？","o":["該信託為有價證券運用信託","其信託未經通知發行公司前其信託契約不生效力","該信託為有價證券管理信託","張五先生雖未於信託契約另有保留，仍得隨時終止信託契約"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":54,"s":1,"n":20,"t":"呂美與甲銀行簽訂信託契約，由呂美交付新臺幣壹千萬元，指示甲銀行投資於國內上市公司股票，約明信託期間全部信託利益由其姐呂麗享有，則信託關係消滅時，下列敘述何者正確？","o":["信託財產歸屬之順序，信託契約所定者優先於呂美，呂美優先於呂麗","信託財產歸屬之順序，信託契約所定者優先於呂麗，呂麗優先於呂美或呂美之繼承人","信託財產歸屬之順序，信託契約未約定時，呂美與呂麗之順序相同","信託關係消滅時，受託人所製作之結算書及報告書不須取得呂麗之承認"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":54,"s":1,"n":21,"t":"銀行辦理信託業務必須優先適用下列何種法律？","o":["信託投資公司管理規則","銀行法","信託業法","證券投資信託事業管理規則"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":54,"s":1,"n":22,"t":"下列何者專屬信託業得辦理之業務？","o":["保管業務","募集共同信託基金","擔任股票及債券發行簽證人","擔任信託監察人"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":54,"s":1,"n":23,"t":"一般受理民事信託之人，除其他法令另有規定外，得受託經理下列何者之信託財產？","o":["特定人","不特定多數人","特定人及不特定多數人","視信託財產之種類而定"],"a":"1","tp":"委託人權利與信託標的","note":""},{"p":54,"s":1,"n":24,"t":"依信託業法規定，信託業除依信託契約約定外，擬以信託財產購買其銀行業務部門經紀之有價證券，有何限制？","o":["應先經受託人之同意","應取得主管機關之同意","應取得信託監察人之同意","應事先取得受益人之書面同意"],"a":"4","tp":"基本義務與契約記載事項","note":""},{"p":54,"s":1,"n":25,"t":"下列何者不屬於信託業之利害關係人？","o":["信託業總公司之經理","對信託財產具有運用決定權者","持有信託業已發行股份總數百分之三之企業","信託業持股比率超過百分之五之企業"],"a":"3","tp":"利害關係人與利益衝突","note":""},{"p":54,"s":1,"n":26,"t":"信託業對信託財產，須盡善良管理人及忠實義務，下列行為何者錯誤？","o":["購買本身發行之有價證券","不得購買本身之財產","不得購買本身利害關係人之財產","不得購買本身發行之票券"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":54,"s":1,"n":27,"t":"有關信託財產之運用，下列敘述何者正確？","o":["信託業得以信託財產辦理銀行法第五條之二所定授信業務項目","信託業得經信託監察人同意後，將信託財產存放其銀行業務部門","信託業得依信託契約約定，將信託財產運用於具保本保息性質之標的","以開發為目的之土地信託經二分之一以上受益人之同意，得以信託財產借入款項"],"a":"3","tp":"委託人權利與信託標的","note":""},{"p":54,"s":1,"n":28,"t":"對信託業之經營，下列敘述何者錯誤？","o":["信託業不得經營未經主管機關核定之業務","信託業經營信託業務，不得對委託人有虛偽、詐欺之行為","信託業之經營與管理，應由具有專門學識或經驗之人員為之","銀行信託專責部門中對信託財產具有運用決定權者，得兼任其他業務之經營"],"a":"4","tp":"人員資格訓練與利益限制","note":""},{"p":54,"s":1,"n":29,"t":"下列敘述何者屬於信託業須經受益人之書面同意而為之行為？","o":["以信託財產購買本身銀行業務部門承銷之有價證券或票券","以信託財產購買本身或其利害關係人之財產","以信託財產購買政府債券","以信託財產購買本身銀行業務部門經紀之有價證券或票券"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":54,"s":1,"n":30,"t":"信託業為擔保因違反受託人義務對受益人等所負之損害賠償，至少應提存多少賠償準備金？","o":["信託財產百分之十五","信託財產百分之五十","新臺幣五千萬元","新臺幣一億元"],"a":"3","tp":"賠償準備金與盈餘分配","note":""},{"p":54,"s":1,"n":31,"t":"信託業違反法令或信託契約，或因可歸責於信託業之事由，致委託人或受益人受有損害者，應負連帶賠償責任之對象，下列何者不包括在內？","o":["負責之董事","監察人","主管人員","該信託業"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":54,"s":1,"n":32,"t":"銀行經營信託業務，依其風險管理準則規定，信託業務專責部門辦理信託業務，應以顯著方式於營業櫃檯標示之事項，下列何者錯誤？","o":["銀行不擔保信託業務之管理或運用績效","信託財產一律受存款保險之保障","委託人或受益人應自負盈虧","銀行應盡善良管理人之注意義務及忠實義務"],"a":"2","tp":"內控稽核與風險管理","note":""},{"p":54,"s":1,"n":33,"t":"信託業為下列何種行為，將負刑事責任？","o":["未經主管機關核准，募集共同信託基金","未經全體受益人同意，以該信託財產借入款項","辦理集合管理運用之金錢信託，未保持適當之流動性","未經受益人書面同意，而將信託財產存放於其銀行業務部門作為存款"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":54,"s":1,"n":34,"t":"銀行各分支機構辦理信託業務，除經主管機關核准者外，限於對信託財產為下列何種行為？","o":["管理","運用","處分","收受"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":54,"s":1,"n":35,"t":"銀行因解散而進行清算時，有關信託資金及信託財產之處理，應依下列何者為之？","o":["依清算人之決定","依主管機關之命令","依信託契約之約定","依股東會之決議"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":54,"s":1,"n":36,"t":"除兼營信託業務之銀行外，信託業自有財產之運用範圍，下列何者錯誤？","o":["購買自用不動產","投資公司債","銀行存款","投資未上市或未上櫃股票"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":54,"s":1,"n":37,"t":"有關共同信託基金受益證券之說明，下列何者正確？","o":["法律未規定其形式","法律規定應為不記名式","法律規定應為記名式","原則為記名式，經委託人要求可改為不記名式"],"a":"3","tp":"共同信託基金募集與運用","note":""},{"p":54,"s":1,"n":38,"t":"信託業須事先取得受益人之同意所為之事項，下列敘述何者正確？","o":["購買利害關係人之財產","購買本身承銷之有價證券","對非利害關係人辦理放款","以開發為目的之土地信託而借入款項"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":54,"s":1,"n":39,"t":"下列何者情事發生時，信託業須於事實發生之翌日起二個營業日內向主管機關申報？","o":["因印鑑錯誤而被退票","更換分支機構經理","編製營業報告書及財務報告","簽訂重要契約"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":54,"s":1,"n":40,"t":"共同信託基金終止時，信託業應於主管機關核准或備查後多久期限內完成清算？","o":["二個月","三個月","六個月","九個月"],"a":"2","tp":"共同信託基金募集與運用","note":""},{"p":54,"s":1,"n":41,"t":"有關信託業公告事項及方式之敘述，下列何者錯誤？","o":["應每半年營業年度編製營業報告","應每半年營業年度編製財務報告","將資產負債表於其所在地之日報或依主管機關指定之方式公告","如有信託業法第四十一條之情事發生時，至遲應於事實發生之翌日起三個營業日內辦理公告"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":54,"s":1,"n":42,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，有關證券商兼營信託業務之信託財產保管，下列敘述何者錯誤？","o":["應委由符合主管機關認可之信用評等機構評等達一定等級以上之信託公司或銀行保管","信託財產為金錢者，應以專戶存放符合規定之銀行並以受託人名義表彰","應每半年營業年度編製信託帳之財務報表及信託財產目錄彙送主管機關","信託帳之財務報表及信託財產目錄應公告於同業公會網站"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":54,"s":1,"n":43,"t":"下列敘述何者正確？","o":["非信託業得辦理不特定多數人委託經營信託業法第十六條之信託業務","信託業得辦理承諾擔保本金或最低收益率之信託業務","非信託業不得使用信託業或易使人誤認為信託業之名稱","證券投資信託事業優先適用信託業法之規定"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":54,"s":1,"n":44,"t":"政黨交付信託之財產及其信託利益之取得及分配，應由下列何者定期公告？","o":["政黨","內政部","信託業","信託公會"],"a":"3","tp":"人員資格訓練與利益限制","note":""},{"p":54,"s":1,"n":45,"t":"有關信託業之管理與監督，下列敘述何者正確？ A.信託業應提存賠償準備金 B.信託業應至少每年編製一次營業報告書並向主管機關申報 C.信託業違反信託業法主管機關得糾正並限期改善 D.信託業法之罰則均得易科罰金","o":["A.B","B.C :""},{"p":54,"s":2,"n":18,"t":"客戶經由特定金錢信託以定期定額方式投資境外基金，如因主管機關修改規定致投資標的不符時，銀行應以下列何種方式處理？","o":["應辦理基金轉換","應於三年內調整至符合規定","原則上得按原契約金額繼續投資，至委託人全數贖回為止","應停止定期定額投資，但原基金可持有至信託契約屆滿或委託人全數贖回為止"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":54,"s":2,"n":19,"t":"特定金錢信託業務項下所能投資之境外基金，除經專案核准或基金註冊地經我國承認並公告者外，其成立時間應至少達多久以上？","o":["六個月","一年","二年","三年"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":54,"s":2,"n":20,"t":"有關信託業辦理特定金錢信託投資國外有價證券業務應遵守之事項，下列敘述何者錯誤？","o":["投資標的涉及連動債券時，應揭露個別商品條件與所涉風險","為提供客戶充足投資資訊，應主動寄送特定商品說明書予一般大眾","其自交易對手取得之信託報酬事項，應將相關內容納入信託契約中","境外基金投資人須知須按季更新，其範本由投信投顧公會擬訂，報金管會核定"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":54,"s":2,"n":21,"t":"有關兼營信託業務銀行於其國際金融業務分行(OBU)對境外客戶辦理外幣信託，下列敘述何者錯誤？","o":["應依國際金融業務條例之規定，於申請核准後，始得辦理","OBU 原則上限於信託財產之收受","信託財產之管理運用應統籌由信託業務專責部門為之","本項業務之帳務應設於信託業務專責部門，另以附註方式揭露於OBU 之財務報表中"],"a":"4","tp":"外匯結匯與國際金融業務","note":""},{"p":54,"s":2,"n":22,"t":"信託業辦理特定金錢信託投資國外有價證券業務，依現行法令規定，原則上其信託資金之委託期限為何？","o":["至少一個月","至少半年","最長五年","沒有期限限制"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":54,"s":2,"n":23,"t":"企業員工持股信託之委託人死亡時，原則上其信託財產歸屬下列何者？","o":["該員工之繼承人","員工持股會","公司","員工持股會指定之第三人"],"a":"1","tp":"持股會組織協議與當事人","note":""},{"p":54,"s":2,"n":24,"t":"企業員工持股信託存續期間，係由下列何者與受託人就信託相關事務為指示、確認、協議、同意及其他相關事宜？","o":["每一加入之員工","公司之代表人","工會代表","員工持股會代表人"],"a":"4","tp":"持股會組織協議與當事人","note":""},{"p":54,"s":2,"n":25,"t":"有關員工持股信託業務之敘述，下列何者錯誤？","o":["為「金錢之信託」之一種","員工持股會須為登記之法人團體","採滾入平均成本法進行投資","員工持股會代表人全權代表全體會員與受託人簽訂信託契約"],"a":"2","tp":"員工福利信託特性與制度","note":""},{"p":54,"s":2,"n":26,"t":"有關可擔任企業員工持股信託業務之受託人，下列敘述何者正確？","o":["經主管機關核准之信託業","證券投資信託公司","資產管理顧問公司","都市更新投資信託公司"],"a":"1","tp":"持股會組織協議與當事人","note":""},{"p":54,"s":2,"n":27,"t":"企業員工持股信託之投資風險係由下列何者承擔？","o":["委託人","受託人","員工持股會","員工服務之公司"],"a":"1","tp":"投資運用與分別管理","note":""},{"p":54,"s":2,"n":28,"t":"企業員工持股信託於投資標的公司股東會議決權之行使，下列何者正確？ A.議決權可分割行使 B.受託人應依員工持股會代表人書面指示辦理 C.委託人得以股票持有人之身分要求出席並行使議決權","o":["僅AB","僅B","僅AC","ABC 皆錯誤"],"a":"2","tp":"持股會組織協議與當事人","note":""},{"p":54,"s":2,"n":29,"t":"有關企業員工持股信託業務，下列敘述何者正確？","o":["信託財產有毀損或滅失之虞時，受託人應立即採取必要且適法之防範措施","信託財產係以員工持股會之名義登記管理","信託財產可由員工隨時自由退出領回","員工不得向受託人請求閱覽信託帳簿"],"a":"1","tp":"員工福利信託特性與制度","note":""},{"p":54,"s":2,"n":30,"t":"有關企業員工持股信託契約之期前終止事由，下列敘述何者錯誤？","o":["信託目的不能或無法達成時","企業員工持股信託投資標的公司解散或破產時","信託資金太少致不符運用效益","信託當事人任一方皆得不通知他方，隨時期前終止契約"],"a":"4","tp":"退出終止與財產返還","note":""},{"p":54,"s":2,"n":32,"t":"依臺灣證券交易所股份有限公司有價證券借貸辦法規定，有關有價證券借券之敘述，下列何者正確？","o":["借券人不需付費用","不得延長借貸期間","借券人得於約定期限內隨時返還借券","借貸期間自借貸交易成交日起算，最長不得超過三個月"],"a":"3","tp":"有價證券借貸交易與擔保","note":""},{"p":54,"s":2,"n":33,"t":"依有價證券借貸辦法規定，有價證券借貸交易型態不包括下列何者？","o":["競價交易","定價交易","議借交易","標價交易"],"a":"4","tp":"有價證券借貸交易與擔保","note":""},{"p":54,"s":2,"n":34,"t":"下列何項有價證券信託業務係指將有價證券標的為借貸之運用管理為目的？","o":["管理型有價證券信託","運用型有價證券信託","融資型有價證券信託","處分型有價證券信託"],"a":"2","tp":"有價證券借貸交易與擔保","note":""},{"p":54,"s":2,"n":35,"t":"依有價證券借貸辦法之規定，下列何者非屬於定價交易之借款人返還有價證券之方式？","o":["到期日還券","到期前還券","提前還券要求","以現金核算返還"],"a":"4","tp":"有價證券借貸交易與擔保","note":""},{"p":54,"s":2,"n":36,"t":"非信託業者受託有價證券信託之信託財產，其對外未以信託財產名義表彰者，如該受託人為內部人時，其自有財產與信託財產應以下列何種原則申報？","o":["各自申報原則","合併申報原則","信託財產申報原則","自有財產申報原則"],"a":"2","tp":"內部人持股申報與權益行使","note":""},{"p":54,"s":2,"n":37,"t":"依現行相關法規，以無記名證券為有價證券信託之財產標的時，下列敘述何者錯誤？","o":["無記名證券不得為信託之標的","無法信託公示","無法對抗第三人","信託關係有效"],"a":"1","tp":"證券信託種類與保管差異","note":""},{"p":54,"s":2,"n":38,"t":"為能達到不動產證券化受益權分散之目的，原則上信託契約應載明～所有受益證券持有人，於每一年度中至少有三百三十五日，合計應達多少人以上？","o":["35 人","50 人","75 人","100 人"],"a":"2","tp":"不動產證券化共通規定","note":""},{"p":54,"s":2,"n":39,"t":"有關受託機構運用不動產投資信託基金之禁止事項，下列敘述何者錯誤？","o":["不得從事證券信用交易","除不動產證券化條例另有規定外，不得放款","不得投資於其他不動產資產信託受益證券","除不動產證券化條例另有規定外，不得提供擔保"],"a":"3","tp":"REIT募集投資標的與限制","note":""},{"p":54,"s":2,"n":40,"t":"不動產投資信託基金除經主管機關核准者外，其基金類型以下列何者為限？","o":["開放型基金","封閉型基金","並無限制","連結型基金"],"a":"2","tp":"REIT募集投資標的與限制","note":""},{"p":54,"s":2,"n":41,"t":"有關不動產投資信託及不動產資產信託計劃，下列敘述何者正確？","o":["不動產投資信託及不動產資產信託計劃均採核准制度","不動產投資信託採核准制度及不動產資產信託計劃採核備制度","不動產投資信託採核備制度及不動產資產信託計劃採核准制度","不動產投資信託及不動產資產信託計劃均採核備制度"],"a":"1","tp":"REIT募集投資標的與限制","note":""},{"p":54,"s":2,"n":42,"t":"採募集方式之不動產投資信託基金投資於開發型不動產或不動產相關權利， ote":""},{"p":54,"s":2,"n":56,"t":"有關證券投資信託基金保管機構辦理基金資產之交割作業，下列敘述何者錯誤？","o":["交割如已完成即毋須再回報投信公司","應先核對交割指示函之有權人員簽樣","必須取得交易對象之銀行存款帳號","交割標的為公司債時，應取得其樣張"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":57,"t":"目前國內依法可從事全權委託投資業務之事業，不包括下列何者？","o":["證券投資信託事業","證券投資顧問事業","兼營證券投資顧問業務之信託業","保險事業"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":54,"s":2,"n":58,"t":"全權委託投資之資金應由「保管機構」保管，此保管機構是指經主管機關核准得辦理保管業務，信用評等機構評等並達一定等級以上之下列何者？","o":["證券公司","證券投資信託事業","保險公司","兼營信託業務之銀行或信託公司"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":54,"s":2,"n":59,"t":"客戶（委任人）與全權委託保管機構簽訂信託契約者，關於保證金與權利金收付及結算買賣交割，應以下列何者為代理人？","o":["集保公司","保管機構","證券公司","證券投顧事業或證券投資信託事業"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":54,"s":2,"n":60,"t":"甲證券投資信託公司於運用基金持有資產前，應先指示乙保管銀行以何者名義開設資產運用帳戶？","o":["甲證券投資信託公司","乙銀行總行名義","乙銀行受託經管甲證券投資信託基金專戶","甲證券投資信託公司負責人"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":61,"t":"下列何者為主管機關為保障公共利益或維護市場秩序，得隨時要求基金保管銀行或其關係人為何種處置？","o":["提高賠償準備金成數","檢查其財務業務狀況","提高營業保證金成數","提高資本適足率"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":62,"t":"有關目前我國僑外資保管機構所辦理之事項，下列何者錯誤？","o":["證券商開戶","結匯申請","股東會出席","買賣下單"],"a":"4","tp":"外資全球保管與代理登記","note":""},{"p":54,"s":2,"n":63,"t":"投信公司運用證券投資信託基金所持有之資產應以下列何者名義登記？","o":["投信公司","基金保管機構","證券集保公司","基金保管機構之保管基金專戶"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":64,"t":"全球保管銀行應為投資人行使之股東權利不包括下列何者？","o":["有價證券之借貸","代理投票","認股權證轉換","可轉換債券轉換"],"a":"1","tp":"外資全球保管與代理登記","note":""},{"p":54,"s":2,"n":65,"t":"有關目前我國保管銀行所辦理之業務項目，下列何者錯誤？","o":["證券商營業保證金","期貨商營業保證金","中小企業信用保證基金","期貨交易輔助人營業保證金"],"a":"3","tp":"其他資產保管與營業保證金","note":""},{"p":54,"s":2,"n":66,"t":"全權委託投資發生越權交易且受任人或保管機構任一方對於越權交易有爭議時，下列敘述何者正確？","o":["交由投信投顧公會處理","依金管會證期局指示辦理","依受任人之意見辦理","依保管機構出具之越權交易通知書內容辦理"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":54,"s":2,"n":67,"t":"下列何者非屬我國證券投資信託基金保管銀行之服務事項？","o":["買賣之交割","收益之分配","受益憑證之簽署","績效分析之評估"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":68,"t":"有關保管機構之敘述，下列何者錯誤？","o":["僑外資保管機構就帳務處理得採權責發生制","證券投資信託基金之保管機構應達一定等級以上之信用評等","證券投資信託基金之簽證機構應同時擔任該基金之保管機構","全權委託投資業務之客戶為信託業時，得由客戶自行保管委託投資資產"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":69,"t":"若證券投資信託公司無法召開受益人大會時，保管機構得依主管機關之指示及證券投資信託契約有關受益人大會規則規定，召開受益人大會，其費用由下列何者負擔？","o":["該證券投資信託基金","該保管機構","金管會證期局","該證券投資信託公司"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":70,"t":"信託業就運用於不同種類投資標的之信託資金分別設置集合管理運用帳戶集合管理運用，有關不同集合管理運用帳戶之帳務應如何管理？","o":["以合併記帳方式管理","以分別記帳方式管理","由信託業自行決定","以部分合併記帳、部分分別記帳方式管理"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":54,"s":2,"n":71,"t":"依信託資金集合管理運用管理辦法規定，下列何者得擔任集合管理運用帳戶之信託監察人？","o":["財團法人","社團法人","保險公司","信託業，但不得為該帳戶之受託人"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":54,"s":2,"n":72,"t":"有關信託資金集合管理運用之架構，下列敘述何者錯誤？","o":["係由信託業就相同之營運範圍之信託資金設置集合管理運用帳戶","係由委託人以契約約定方式，同意信託業得應多數委託人之請求，將其信託資金與其他委託人之信託資金集合管理運用","受益人可依受益權比例分享信託利益","信託資金集合管理帳戶限採公益方式為之"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":54,"s":2,"n":73,"t":"依信託資金集合管理運用管理辦法規定，個別集合管理運用帳戶，投資於同一公司股票、短期票券或公司債（次順位公司債投資金額應併入）之金額，分別不得超過個別集合管理運用帳戶投資當日淨資產總價值之百分之多少？","o":["百分之一","百分之五","百分之十","百分之二十"],"a":"3","tp":"集合帳戶投資限制與流動性","note":""},{"p":54,"s":2,"n":74,"t":"信託資金以集合管理運用方式辦理者，有關其分類，下列何者錯誤？","o":["不指定集合管理運用金錢信託","不特定集合管理運用金錢信託","指定集合管理運用金錢信託","特定集合管理運用金錢信託"],"a":"2","tp":"單獨及集合管理分類與權限","note":""},{"p":54,"s":2,"n":75,"t":"集合管理運用帳戶之信託財產應以下列何者之名義表彰之？","o":["委託人","受益人","信託業之信託財產","信託監察人"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":54,"s":2,"n":76,"t":"有關「證券投資信託基金保管機構辦理基金資產交割作業準則」中之規定，下列敘述何者錯誤？","o":["為確認交割指示資料之有效性，保管機構應取得投信公司所有權人之簽章樣本或密碼","保管機構不論交割完成與否，均應以書面回報投信公司","基金存款不足時，保管機構不得先行墊款，但得抵用待交換票據","保管機構應以善良管理人之注意義務辦理交割事宜"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":77,"t":"有關銀行辦理特定金錢信託業務，下列敘述何者正確？","o":["信託資金之存續期間並無限制","受託銀行於委託人交付信託資金後須立即發給受益憑證以資為憑","受託銀行對委託人所交付之資金具有運用決定權","目前銀行開辦之特定金錢信託業務，只接受委託人以新臺幣交付信託資金"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":54,"s":2,"n":78,"t":"有關信託業務性質及規定，下列敘述何者錯誤？","o":["特定金錢信託投資國外有價證券係屬集團信託","證券投資信託基金之淨資產價值應於每一營業日計算","金融資產證券化之特殊目的公司為股份有限公司","綜合證券商得為金融資產證券化條例規定之創始機構"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":54,"s":2,"n":79,"t":"證券投資信託基金受益人之收益分配請求權，自收益發放日起之消滅時效期間為何？","o":["一年","三年","五年","十五年"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":54,"s":2,"n":80,"t":"依信託業商業同業公會會員辦理預收款信託業務應行注意事項規定，信託業辦理本業務，對於信託財產管理之應注意事項，下列敘述何者錯誤？","o":["除法令另有規定外，不得以信託財產投資基金","應依法令規定及契約約定辦理信託財產之結算及提補","應依據廠商所提供商品或服務之履行、解除或終止相關證明文件或書面說明，返還信託財產","信託關係消滅時，應依規定將信託財產提存信託公會"],"a":"4","tp":"預收款禮券與履約保障","note":""},{"p":55,"s":1,"n":1,"t":"依信託法規定，信託行為以進行訴訟為主要目的者，其效力為何？","o":["有效","得撤銷","得終止","無效"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":55,"s":1,"n":2,"t":"依信託法規定，有關宣言信託之敘述，下列何者錯誤？","o":["應由法人為之","得以私益為目的","應經目的事業主管機關許可","應對外宣言自為委託人及受託人"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":55,"s":1,"n":3,"t":"受託人因信託財產之管理、處分、滅失、毀損或其他事由取得之財產權，仍屬信託財產。此即信託財產之何種特性？","o":["獨立性","公示性","連續性","物上代位性"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":55,"s":1,"n":4,"t":"信託法第一條「稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。」依此，下列何者為正確？","o":["受託人是以受益人名義管理處分信託財產","信託財產雖移轉予受託人，委託人仍有自行管理及處分權","受託人是以委託人名義管理處分信託財產","在信託法上，稱「受託人管理權」，也包括其處分權在內"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":55,"s":1,"n":5,"t":"甲（委託人）與乙（受託人）簽訂信託契約，指定丙為受益人，甲於信託契約存續期間死亡時，除信託行為另有訂定外，該項信託關係之效力為何？","o":["不消滅","不生效","信託關係終止","信託監察人得聲請法院撤銷之"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":55,"s":1,"n":6,"t":"以股票交付信託時，如已依相關規定為信託之公示，惟未通知股票發行公司，其效力為何？","o":["得對抗第三人，亦得對抗發行公司","得對抗第三人，但不得對抗發行公司","不得對抗第三人，但得對抗發行公司","不得對抗第三人，亦不得對抗發行公司"],"a":"2","tp":"登記公示與對抗效力","note":""},{"p":55,"s":1,"n":7,"t":"依信託法規定，有關法人受託人任務終了之原因，下列敘述何者錯誤？","o":["受託人解散","受託人逕行辭任","受託人破產宣告","受託人被撤銷設立登記"],"a":"2","tp":"終止變更與剩餘財產歸屬","note":""},{"p":55,"s":1,"n":8,"t":"受託人違反信託本旨處分信託財產時，受益人得聲請法院撤銷其處分，下列敘述何者錯誤？","o":["受益人有數人者，得由其中一人為之","撤銷權自處分時起，逾十年不行使而消滅","撤銷權自受益人知有撤銷原因時起，一年間不行使而消滅","信託財產為應登記之財產時，如未為信託登記仍得聲請撤銷"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":55,"s":1,"n":9,"t":"有關受託人之直接管理義務，下列敘述何者錯誤？","o":["信託行為得另訂第三人代為處理信託事務","信託行為有不得已之事由者，得使第三人代為處理信託事務","受託人違反信託直接管理義務時，應就第三人之行為負完全責任","受託人違反信託直接管理義務，使第三人代為處理信託事務時，該第三人所為法律行為效力可及於信託財產"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":55,"s":1,"n":10,"t":"他益信託之共同受託人處理信託事務原則上應由全體受託人共同為之，但當受託人意思不一致時，應得下列何者同意？","o":["全體委託人","全體受益人","信託監察人","直接向法院聲請裁定"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":55,"s":1,"n":11,"t":"依信託法規定，有關受託人應將信託財產分別管理之敘述，下列何者錯誤？","o":["信託財產為金錢者，得以分別記帳方式為之","信託財產為不動產者，不得以分別記帳為之","受託人之自有財產與信託財產間，如信託行為訂定得不必分別管理者，從其約定","受託人收受不同之信託財產間，除信託行為另有訂定外，應分別管理"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":55,"s":1,"n":12,"t":"下列何者簽訂信託契約時，應另取得法定代理人之書面同意？","o":["受輔助宣告之人","限制行為能力人","破產人","未滿七歲之未成年人"],"a":"2","tp":"設立能力與監督管轄","note":""},{"p":55,"s":1,"n":13,"t":"下列何者為信託監察人不得行使之權利？","o":["請求閱覽受託人所作成之信託財產目錄及收支計算表","對違反規定所為強制執行提起異議之訴權利","享有信託利益及拋棄信託利益","對不當管理信託財產之受託人，請求損害賠償"],"a":"3","tp":"信託監察人","note":""},{"p":55,"s":1,"n":14,"t":"受託人因公益信託而為下列何種行為之收入，得免徵營業稅？","o":["舉辦受託人個人之新書發表會","舉辦演唱會，並給予歌星報酬","以公益為名義，為廠商舉辦商品展售會","舉辦義賣或義演，並全部供作公益事業之用"],"a":"4","tp":"營業稅與印花稅","note":""},{"p":55,"s":1,"n":15,"t":"依信託法規定，有關信託財產轉為受託人自有財產，下列敘述何者錯誤？","o":["憑受託人意願自由取得","受託人經受益人書面同意，並依市價取得","受託人係經由集中市場競價取得","受託人有不得已事由經法院許可取得"],"a":"1","tp":"財產獨立性與強制執行","note":""},{"p":55,"s":1,"n":16,"t":"公益信託有下列何種情形者，其目的事業主管機關得撤銷其許可或為其他必要之處置？","o":["受託人變更者","信託財產減少者","信託監察人變更者","無正當理由連續三年不為活動者"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":55,"s":1,"n":17,"t":"信託關係消滅時，於受託人移轉信託財產於歸屬權利人之前，信託關係視為「存續」，以下列何者視為受益人？","o":["歸屬權利人","受託人","信託監察人","委託人"],"a":"1","tp":"終止變更與剩餘財產歸屬","note":""},{"p":55,"s":1,"n":18,"t":"私益信託除營業信託外由下列何者監督？","o":["金管會","法務部","法院","目的事業主管機關"],"a":"3","tp":"設立能力與監督管轄","note":""},{"p":55,"s":1,"n":19,"t":"李先生於96 年 7 月 1 日至其摯友程律師處，雙方言明訂立信託契約，由李先生交付一上市公司之股票壹佰萬股予程律師管理，管理之收益歸屬於其子李明，下列敘述何者錯誤？","o":["該信託屬於民事信託","該信託屬於本金自益孳息他益之信託","該信託契約未以書面為之，故無效","李先生於信託契約成立時，應考慮是否需繳納贈與稅"],"a":"3","tp":"終止變更與剩餘財產歸屬","note":""},{"p":55,"s":1,"n":20,"t":"委託人李先生與受託人吳先生成立信託，由李先生交付新台幣一千萬元予吳先生，約定由吳先生購買耕地，契約成立時李先生善意不知吳先生已受破產宣告，嗣後方得知，李先生得向吳先生為下列何種主張？","o":["主張信託關係自始無效","主張因錯誤而為意思表示，撤銷信託契約","請求雙方合意主張終止信託契約","主張因法定事由發生而自動終止信託關係"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":55,"s":1,"n":21,"t":"信託業商業同業公會之性質為何？","o":["政府機構","營利之社團法人","非營利之社團法人","與一般商號相同"],"a":"3","tp":"監理處分罰則與損害賠償","note":""},{"p":55,"s":1,"n":22,"t":"依我國之「不動產證券化條例」開辦之「不動產投資信託」，係屬下列何種信託？","o":["金錢信託","動產信託","有價證券信託","金錢債權信託"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":55,"s":1,"n":23,"t":"信託公司之發起人及股東如為同一人或同一關係人者，除屬專業之管理機構外，所持有股份，分別不得超過已發行股份總數之多少比例？","o":["百分之五","百分之十","百分之十五","百分之二十五"],"a":"4","tp":"設立標準與分支機構","note":""},{"p":55,"s":1,"n":24,"t":"依信託業法規定，除經主管機關核准者外，下列何者為信託業得經營之附屬業務項目？","o":["信用卡業務","證券經紀業務","股票承銷業務","擔任股票發行簽證人業務"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":55,"s":1,"n":25,"t":"下列何者非屬信託業應遵守之行為規範？","o":["不得承諾擔保本金或最低收益率","不得對委託人有虛偽、詐欺之行為","以信託財產辦理授信，應事先取得受益人書面同意","對信託財產有運用決定權者，不能兼任其他業務之經營"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":55,"s":1,"n":26,"t":"依信託業負責人應具備資格條件暨經營與管理人員應具備信託專門學識或經驗準則規定，不動產投資信託基金應至少指定一名下列何種人員，專責處理基金資產運用及管理之事務？","o":["管理人員","業務人員","分析人員","具有運用決定權人員"],"a":"4","tp":"人員資格訓練與利益限制","note":""},{"p":55,"s":1,"n":27,"t":"依信託業法規定，信託業之利害關係人，指持有信託業或兼營信託業務之銀行已發行股份總數或資本總額多少比例以上者？","o":["百分之三","百分之四","百分之五","百分之七"],"a":"3","tp":"利害關係人與利益衝突","note":""},{"p":55,"s":1,"n":28,"t":"兼營信託業務之銀行辦理對信託財產具有運用決定權之信託時，於事先取得受益人之書面同意者，得為下列何項行為？","o":["將信託財產貸放於受益人指定之人","以信託財產為擔保借入款項，投資於有價證券","以信託財產購買其銀行業務部門經紀之有價證券","以信託財產購買其銀行業務部門承銷之有價證券"],"a":"3","tp":"利害關係人與利益衝突","note":""},{"p":55,"s":1,"n":29,"t":"信託業辦理有運用決定權之信託，未遵守謹慎投資人的規則，係違反下列何種義務？","o":["保密義務","直接管理義務","誠實義務","善良管理人之注意義務"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":55,"s":1,"n":30,"t":"信託業為擔保其因違反受託人義務，應提存賠償準備金，下列何者對該賠償準備金具有優先受償之權？","o":["委託人或受益人","受託人","信託監察人","受託人之債權人"],"a":"1","tp":"賠償準備金與盈餘分配","note":""},{"p":55,"s":1,"n":31,"t":"信託業至少應提存多少賠償準備金？","o":["新臺幣一千萬元","新臺幣二千萬元","新臺幣三千萬元","新臺幣五千萬元"],"a":"4","tp":"賠償準備金與盈餘分配","note":""},{"p":55,"s":1,"n":32,"t":"依信託業法規定，除其他法律另有規定者外，非信託業之法人辦理不特定多數人委託經理信託業法第十六條之信託業務者，如何處罰？","o":["對法人處以罰鍰","處其行為負責人刑罰","對法人處以罰金","處其行為負責人罰鍰"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":55,"s":1,"n":33,"t":"銀行辦理信託業務，下列敘述何者正確？","o":["信託財產經運用於存款以外之標的者，仍受存款保險之保障","銀行須擔保信託業務之管理或運用績效","委託人或受益人應自負盈虧","信託業務與證券業務之會計應整併處理"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":55,"s":1,"n":34,"t":"信託業辦理信託資金集合管理運用業務，有關其運用範圍之規定，下列敘述何者正確？","o":["投資於同一公司股票，短期票券或 何者可作為信託資金集合管理運用帳戶之流動性資產項目？","o":["基金受益憑證","上市股票","可轉換公司債","短期票券"],"a":"4","tp":"集合帳戶投資限制與流動性","note":""},{"p":55,"s":2,"n":71,"t":"信託業辦理信託資金集合管理運用之運用範圍，存放於同一金融機構之存款、投資其發行之金融債券與其保證之公司債及短期票券金額，合計不得超過投資當日全體集合管理運用帳戶淨資產總價值百分之三十及該金融機構淨值之多少？","o":["百分之五","百分之十","百分之二十","百分之三十"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":55,"s":2,"n":72,"t":"有關信託資金集合管理運用帳戶之信託受益權轉讓之規定，下列何者正確？","o":["由委託人背書轉讓","集合管理運用帳戶之信託受益權不得轉讓","由受益人背書轉讓","由原受益人通知受託人劃撥轉讓予新受益人"],"a":"2","tp":"集合帳戶受益權淨值與退出","note":""},{"p":55,"s":2,"n":73,"t":"有關集合管理運用帳戶之設置及終止，下列何者錯誤？","o":["帳戶之設置，委託人為非專業投資人者，係採核准機制","信託業可一次同時申請數個帳戶","信託業得任意終止帳戶","受託機構之信用評等須達一定等級"],"a":"3","tp":"集合帳戶申請設置與合併","note":""},{"p":55,"s":2,"n":74,"t":"有關信託業辦理信託資金集合管理運用之運用範圍，下列敘述何者正確？","o":["得辦理放款","得從事證券信用交易","不得辦理放款且不得從事證券信用交易","得向公營行庫提供擔保，但不得從事證券信用交易"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":55,"s":2,"n":75,"t":"有關信託業辦理集合管理運用帳戶信託報酬收取之規定，下列何者錯誤？","o":["不得重複收取","得依約定條款之約定另行重複酌收","在不重複收取之原則下，應可以信託契約約定信託報酬收取標準","在不重複收取之原則下，得於信託契約中約明信託報酬於集合管理運用帳戶之信託財產扣取"],"a":"2","tp":"單獨及集合管理分類與權限","note":""},{"p":55,"s":2,"n":76,"t":"依信託資金集合管理運用管理辦法規定，信託業申請設置集合管理運用帳戶時，申請書件應先送交下列何者審查？","o":["財政部","金管會證期局","中華民國信託業商業同業公會","中華民國證券投資信託暨顧問商業同業公會"],"a":"3","tp":"集合帳戶申請設置與合併","note":""},{"p":55,"s":2,"n":77,"t":"依現行法令規定，除銀行兼營信託業外，僅擔任不動產投資信託之受託機構，其最低實收資本額為新台幣多少元？","o":["3 億","5 億","10 億","20 億"],"a":"3","tp":"REIT募集投資標的與限制","note":""},{"p":55,"s":2,"n":78,"t":"有關擔任證券投資信託基金保管機構之資格，下列敘述何者正確？","o":["須擔任證券投資信託事業監察人","須為銀行法第二十條所稱之銀行或信託業法第二條所稱之信託業","須投資於證券投資信託事業已發行股份總數百分之十以上","須擔任證券投資信託事業董事"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":55,"s":2,"n":79,"t":"甲銀行兼營信託業務，辦理金錢信託、有價證券信託及保管銀行業務，其金錢信託中並無保本保息之代為確定用途信託資金，今該銀行有指撥營運資金新台幣五千萬元，請問甲銀行至少應再提存信託賠償準備金為多少元？","o":["二千萬元","三千萬元","四千萬元","得以指撥營運資金充當賠償準備金"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":55,"s":2,"n":80,"t":"依信託法及信託業法規定，有關金錢信託之信託登記，下列敘述何者正確？","o":["交付與運用時所取得財產均應信託登記","交付與運用時所取得財產均無信託登記之必要","交付時應信託登記；運用時所取得之財產，無須信託登記","交付時無須信託登記；運用時所取得之財產為應登記財產者，應注意其信託登記事宜"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":56,"s":1,"n":1,"t":"以有價證券為信託者，非依規定於證券上或其他表彰權利的文件上載明為信託財產，其法律效力為何？","o":["其信託行為無效","不得對抗第三人","其信託關係不成立","受託人得撤銷其信託"],"a":"2","tp":"登記公示與對抗效力","note":""},{"p":56,"s":1,"n":2,"t":"信託財產之房屋失火焚燬而取得之保險金債權仍屬信託財產，此為信託財產之何種特性？","o":["安全性","獲利性","獨立性","物上代位性"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":56,"s":1,"n":3,"t":"依信託法規定，以進行訴願或訴訟為主要目的之信託行為，其效力為何？","o":["有效","得撤銷","無效","得終止"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":4,"t":"私益信託之三大確定性，除信託目的與信託財產外，尚有下列何者亦須確定？","o":["委託人","受託人","受益人","信託監察人"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":5,"t":"信託關係存續中因信託財產所生之房屋稅，受託人拒不繳納時，稅捐稽徵機關得如何執行？","o":["得對信託財產強制執行","僅得對委託人財產強制執行","僅得對受益人財產強制執行","僅得對受託人自有財產強制執行"],"a":"1","tp":"房屋稅與契稅","note":""},{"p":56,"s":1,"n":6,"t":"有關宣言信託之敘述，下列何者錯誤？","o":["宣言信託為要式行為","宣言信託為單獨行為","委託人以自己為受託人","自然人與法人均可對外宣言成立"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":7,"t":"受託人違反規定將信託財產轉為自有財產時，委託人、受益人或其他受託人得對受託人主張請求之權利， 下列敘述何者錯誤？","o":["如有損害信託財產，得請求以金錢賠償","如有利益，得請求將其歸入信託財產","受託人無過失者，即無須負損害賠償責任","請求權自知悉之日起，二年間不行使而消滅"],"a":"3","tp":"財產獨立性與強制執行","note":""},{"p":56,"s":1,"n":8,"t":"依信託法規定，受託人就信託財產或處理信託事務所支出之稅捐、費用或負擔之債務，得以信託財產充之， 該費用償還請求權是否有優先權？","o":["優先於無擔保之債權","無優先於無擔保之債權","與有擔保債權共同分配受償","優先於有擔保之債權"],"a":"1","tp":"受託人義務報酬與責任","note":""},{"p":56,"s":1,"n":9,"t":"依信託法規定，受託人違反信託本旨處分信託財產時，下列何者得聲請法院撤銷其處分？","o":["委託人","其他受託人","受益人","主管機關"],"a":"3","tp":"受益人權利與撤銷救濟","note":""},{"p":56,"s":1,"n":10,"t":"某甲將財產信託予乙，並指定其未出生之長孫為受益人，由於受益人尚未存在，得由利害關係人或檢察官向下列何者聲請選任信託監察人？","o":["法院","內政部","財政部","目的事業主管機關"],"a":"1","tp":"信託監察人","note":""},{"p":56,"s":1,"n":11,"t":"依信託法規定，受託人處理信託事務，應依信託本旨，並盡到何種注意義務或責任？","o":["善良管理人之注意義務","與處理自己事務同一注意義務","無過失責任","重大過失責任"],"a":"1","tp":"受益人權利與撤銷救濟","note":""},{"p":56,"s":1,"n":12,"t":"下列何者非基於信託當事人之法律行為而成立？","o":["契約信託","遺囑信託","宣言信託","法定信託"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":13,"t":"依信託法規定，公益信託關係因信託目的已完成而消滅時，受託人應於多久期間內，將消滅事由及年月日， 向目的事業主管機關申報？","o":["一個月內","二個月內","三個月內","四個月內"],"a":"1","tp":"公益信託與監督機關","note":""},{"p":56,"s":1,"n":14,"t":"信託業擔任公益信託之受託人者，除有正當理由並經下列何者之許可始得辭任？","o":["公益信託之目的事業主管機關","信託業商業同業公會","法院","檢察機關"],"a":"1","tp":"公益信託與監督機關","note":""},{"p":56,"s":1,"n":15,"t":"信託監察人有數人時，除法院另有指定或信託行為另有訂定外，對信託財產之保存行為，係以下列何種方式為之？","o":["應經全體同意決之","應以過半數決之","得單獨為之","應以四分之三多數決之"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":16,"t":"信託利益全部由委託人享有者，有關信託終止之敘述，下列何者正確？","o":["委託人或其繼承人得隨時終止信託","委託人須取得信託監察人之同意，始得終止信託","委託人或其繼承人均不得終止信託","委託人須取得受託人之同意，始得終止信託"],"a":"1","tp":"終止變更與剩餘財產歸屬","note":""},{"p":56,"s":1,"n":17,"t":"依信託法規定，信託關係消滅時，受託人應就信託事務之處理作成下列何種書類，並取得受益人、信託監察人或其他歸屬權利人之承認？","o":["收支計算表","現金流量表","結算書及報告書","資產負債表"],"a":"3","tp":"終止變更與剩餘財產歸屬","note":""},{"p":56,"s":1,"n":18,"t":"有關委託人在信託行為中所負之義務，下列敘述何者錯誤？","o":["給付報酬","處理信託事務","負終止信託之損害賠償責任","移轉或處分信託財產給受託人"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":19,"t":"下列何者不得申請設立祭祀公益信託？","o":["以祭祀至聖先師孔子為目的","以祭祀特定家族之祖先為目的","以祭祀忠勇先烈為目的","以祭祀明朝末年歷史人物鄭成功為目的"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":56,"s":1,"n":20,"t":"依信託法規定，信託是以管理或處分信託財產為目的，下列何者不能為信託財產？","o":["有價證券","金錢債權","商譽","地上權"],"a":"3","tp":"委託人權利與信託標的","note":""},{"p":56,"s":1,"n":21,"t":"有關公開發行公司實體股票辦理信託登記需檢附之文件，下列何者錯誤？","o":["過戶申請書","股票","信託契約或遺囑","集保存摺"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":56,"s":1,"n":22,"t":"依信託業設立標準規定，依不動產證券化條例僅辦理不動產資產信託業務之信託公司，其最低實收資本額為多少？","o":["新臺幣三億元","新臺幣五億元","新臺幣十億元","新臺幣二十億元"],"a":"1","tp":"設立標準與分支機構","note":""},{"p":56,"s":1,"n":23,"t":"有關信託業相關法規之適用，下列敘述何者錯誤？","o":["信託業之設立係依據信託業法","信託業經營全權委託投資業務，仍須受證券相關法規之規範","銀行法有關營業及會計獨立之規定，信託業法亦有相關規定，故應先適用信託業法","除其他法律另有規定外，銀行經營信託業務，準用銀行法信託投資公司章之規定辦理"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":56,"s":1,"n":24,"t":"依「信託業負責人應具備資格條件暨經營與管理人員應具備信託專門學識或經驗準則」規定，下列何者屬信託業經營與管理人員之督導人員？","o":["財政部部長","銀行信託部之副理","總稽核","銀行分支機構之經理"],"a":"3","tp":"人員資格訓練與利益限制","note":""},{"p":56,"s":1,"n":25,"t":"有關信託業得經營之附屬業務，下列何者錯誤？","o":["擔任破產管理人及公司重整監督人","辦理保管業務","辦理出租保管箱業務","以信託財產辦理銀行法第五條之二所訂授信業務項目"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":26,"t":"信託業收受以公司債為信託財產之信託，經償還後轉化為金錢，併為信託財產運用，係屬於下列何種信託？","o":["金錢之信託","金錢債權之信託","有價證券之信託","動產之信託"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":27,"t":"依信託業法規定，兼營信託業務之公營銀行得為下列何種行為？","o":["以信託財產購買本身或利害關係人之財產","以信託財產購買公債","以信託財產辦理放款","以受託之有價證券借入款項"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":56,"s":1,"n":28,"t":"有關信託財產運用具有運用決定權之人，下列何者正確？","o":["可兼任其他業務之經營","督導信託部之副總經理非屬之","不得辦理信託業法第十七條之附屬業務","信託部之人員皆屬之"],"a":"2","tp":"委託人權利與信託標的","note":""},{"p":56,"s":1,"n":29,"t":"受託人於委託人概括指定之營運範圍或方法內，對信託財產具有運用決定權者，係屬下列何種信託？","o":["指定營運範圍或方法之金錢信託","不指定營運範圍或方法之金錢信託","特定營運範圍或方法之金錢信託","特定營運範圍或方法之金錢債權信託"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":56,"s":1,"n":30,"t":"有關信託業提存賠償準備金之規定，下列何者錯誤？","o":["至少應提存新臺幣五千萬元","應以現金或政府債券繳存財政部","該準備金係為擔保信託業違反受託人義務，而對委託人或受益人所負損害賠償、利益返還責任","銀行經營信託業務應指撥之營運資金得充當賠償準備金"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":56,"s":1,"n":31,"t":"信託業辦理不指定營運範圍或方法之金錢信託時，其營運範圍不包括下列何者？","o":["現金","公債","上市股票","發行人經主管機關認可之信用評等機構評等達一定等級以上之公司債"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":32,"t":"信託業辦理信託資金集合管理運用業務時，存放於同一金融機構之存款、投資其發行之金融債券與其保證之公司債及短期票券金額，合計不得超過投資當日全體集合管理運用帳戶淨資產總價值之多少比例？","o":["百分之十","百分之十五","百分之二十","百分之三十"],"a":"4","tp":"集合帳戶投資限制與流動性","note":""},{"p":56,"s":1,"n":33,"t":"有關信託業營業範圍之許可，下列何者錯誤？","o":["信託業經營之業務種類，須經主管機關核定，其有變更者，亦同","信託業就信託契約之訂定，仍須經主管機關個別核定","信託業就共同信託基金之發行，須經主管機關核准","信託業就集合管理運用帳戶之設置，須經主管機關核准"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":56,"s":1,"n":34,"t":"兼營信託業務之銀行經營信託業務，對委託人有虛偽或詐欺之行為者，其行為負責人應受下列何種處罰？","o":["僅受警告處分","僅受停止職務處分","應受刑事處罰","應受行政罰之處罰"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":35,"t":"銀行違反法令、章程或有礙健全經營之虞時，下列何者非主管機關得為之處分？","o":["命其與其他銀行合併","命其限期改善","停止銀行部分業務","糾正"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":36,"t":"下列對銀行兼營信託業務之敘述何者錯誤？","o":["商業銀行得經主管機關許可兼營信託業務","專業銀行得經主管機關許可兼營信託業務","銀行兼營信託業務時，其營業及會計應與銀行之其他部門合併","銀行兼營信託業務時，應指撥營運資金專款經營"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":56,"s":1,"n":37,"t":"依信託業法規定，信託業受託管理下列何種信託財產，應保持適當之流動性？","o":["有價證券信託","不動產信託","指定營運範圍或方法之集合管理運用金錢信託","不指定營運範圍或方法之單獨管理運用金錢信託"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":56,"s":1,"n":38,"t":"依信託業法規定，信託契約之訂定應以書面為之，下列何者非屬應記載事項？","o":["信託契約之變更事由","信託目的","信託存續期間","受益人責任"],"a":"4","tp":"基本義務與契約記載事項","note":""},{"p":56,"s":1,"n":39,"t":"下列何者非信託業法規定信託業應公告之事項？","o":["損益表","總經理變動","存款不足退票","簽訂重要契約"],"a":"1","tp":"財產評審報告與會計公告","note":""},{"p":56,"s":1,"n":40,"t":"有關銀行經營信託業務之風險管理，下列敘述何者錯誤？","o":["本國銀行總行應設置信託業務專責部門，該專責部門及其分支機構均得負責信託財產之管理、運用及處分","信託業務之會計應整併於信託帳處理","銀行辦理信託業務，專責部門之營業場所應與銀行其他部門區隔","信託業務與銀行其他業務間之共同行銷、資訊交互運用等不得有利益衝突之行為"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":41,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，證券投資信託事業以信託方式經營全權委託投資業務，其接受委託人之「原始信託財產」，係指下列何者？","o":["僅限委託人最初委託投資金額","僅限委託人最初委託投資金額扣除應納稅捐後之淨額","僅限委託人最初委託投資金額扣除稅捐及費用後之淨額","包括委託人最初委託及增加委託投資之金額"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":42,"t":"信託業申請募集發行共同信託基金經核准後，除法令另有規定外，應於核准函送達之日起多久期間內開始募集？","o":["二個月","三個月","四個月","六個月"],"a":"4","tp":"共同信託基金募集與運用","note":""},{"p":56,"s":1,"n":43,"t":"依信託業法規定，除兼營信託業務之銀行外，信託業之淨值如為新臺幣五十億元，則其投資公司債、上市及上櫃股票、受益憑證之總額，最高不得超過下列何金額？","o":["五十億元","三十億元","二十五億元","十五億元"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":56,"s":1,"n":44,"t":"信託業辦理不指定營運範圍或方法之金錢信託時，下列敘述何者正確？","o":["得訂定最低收益率","得將全部信託財產存放於同一金融機構","得依信託契約集合管理運用","未申請主管機關專案核准得運用於購買土地"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":56,"s":1,"n":45,"t":"銀行及保險公司擔任信託公司之專業發起人及股東，所須具備之資格條件相關敘述，下列何者正確？","o":["銀行須具有國際金融、證券或信託業務經驗，且最近一年資產或淨值之世界排名須居前二千名以內","銀行須具有國際金融、證券或信託業務經驗，且最近二年資產或淨值之世界排名均須居前一千名以內","保險公司須具有保險資金管理經驗，且持有之證券及不動產資產總金額須達二百億美元以上","保險公司須具有保險資金管理經驗，且持有之證券及不動產資產總金額須達新臺幣二百億元以上"],"a":"4","tp":"設立標準與分支機構","note":""},{"p":56,"s":1,"n":46,"t":"依遺贈相關稅法有關財產之估價規定，下列敘述何者正確？","o":["房屋以評定標準價格為準","未上櫃股票以收盤價為準","上市股票以淨值為準","土地以市價為準"],"a":"1","tp":"遺產及贈與稅","note":""},{"p":56,"s":1,"n":47,"t":"受益人不特定或尚未存在之信託財產運用所得應以受託人為納稅義務人，依下列何種扣繳率申報納稅？","o":["百分之十","百分之二十","百分之三十","百分之四十"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":56,"s":1,"n":48,"t":"甲以1,000 萬元成立一信託，信託期間5 年，投資5 年期票面約載利率為8%之公債1,000 萬元，期間孳息歸乙，期滿財產歸甲，假設贈與時郵政儲金匯業局一年期定期儲金固定利率為1%，則甲贈與乙之權利價值為何？〔1/(1+1%) =0.9901，1/(1+1%)2 =0.9803，1/(1+1%)3 =0.9706，1/(1+1%)4 =0.9610，1/(1+1%)5 =0.9515〕","o":["約新台幣 3,883 千元","約新台幣 6,117 千元","約新台幣 9,515 千元","約新台幣 485 千元"],"a":"1","tp":"贈與權利價值與折現計算","note":""},{"p":56,"s":1,"n":49,"t":"有關信託所得課稅，下列敘述何者錯誤？","o":["依信託導管理論，以發生時課稅為原則","均於分配時課稅","共同信託基金係於分配時課稅","實質上謹守稅捐立法中立性"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":56,"s":1,"n":50,"t":"受託人依信託本旨移轉信託不動產於委託人以外之歸屬權利人時，應由歸屬權利人估價立契，申報繳納下列何者稅負？","o":["買賣契稅","交換契稅","贈與契稅","分割契稅"],"a":"3","tp":"房屋稅與契稅","note":""},{"p":56,"s":2,"n":1,"t":"有關銀行辦理外幣特定金錢信託投資國外有價證券業務，下列敘述何者錯誤？","o":["委託人得以外幣交付信託資金","受託銀行須先向外匯局申請始得開辦本業務","委託人辦理基金贖回時受託銀行應直接以外幣支付","委託人辦理基金贖回時受託銀行應直接以新臺幣支付"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":56,"s":2,"n":2,"t":"依信託業商業同業公會會員辦理預收款信託業務應行注意事項規定，廠商如未發行預收款商品服務憑證，信託業應要求廠商對於預收款商品或服務契約應有適當之防制措施，有關其控管方式，下列敘述何者錯誤？","o":["契約應有編號由廠商自行登錄控管，信託業得派員或委託他人查核","信託業應要求廠商提供契約編號簿冊及載明消費者資料","信託業應自行影印或縮影照相方式留存消費者之各項證件","廠商定期提供信託業經會計師簽認已向消費者預收且尚未提供商品服務之餘額報表"],"a":"3","tp":"預收款禮券與履約保障","note":""},{"p":56,"s":2,"n":3,"t":"除法令另有規定外，有關特定金錢信託受益權之轉讓，下列敘述何者錯誤？","o":["信託契約得約定不得轉讓","受益權之受讓人需為專業投資人","受益人總數合計不得逾三十五人","受益人於轉讓其受益權前，經信託監察人同意，即可轉讓"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":56,"s":2,"n":4,"t":"銀行辦理特定金錢信託投資國外基金業務，下列敘述何者錯誤？","o":["得發給客戶基金存摺","得向客戶保證獲利","得發給客戶對帳單","發給客戶之信託憑證應予記名"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":56,"s":2,"n":5,"t":"受託銀行辦理特定金錢信託投資國內外基金業務時，有關營業櫃檯應標示之事項，下列敘述何者錯誤？","o":["銀行辦理信託業務，應盡善良管理人之注意義務及忠實義務","信託財產經運用於存款以外之標的者，不受存款保險之保障","基金以往績效代表未來投資之表現，投資人應慎選投資標的","銀行不擔保信託業務之管理或運用績效，委託人或受益人應自負盈虧"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":56,"s":2,"n":6,"t":"信託業運用信託財產於國外或涉及外匯之投資，為避險目的得依受託人名義以客戶身分與銀行從事之交易，下列敘述何者正確？A.新臺幣與外幣間換匯交易 B.新臺幣與外幣間換匯換利交易 C.新臺幣與外幣間匯率期貨交易","o":["僅AB","僅BC","僅AC","ABC"],"a":"1","tp":"外匯結匯與國際金融業務","note":""},{"p":56,"s":2,"n":7,"t":"銀行辦理特定金錢信託時，對本金及收益之敘述，下列何者正確？","o":["不保本不保息","依銀行與客戶約定之報酬而定","可以保障本金與最低收益","只保障本金，不保障最低收益"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":56,"s":2,"n":8,"t":"信託業法對特定金錢信託契約應記載之信託存續期間，其規定為何？","o":["並未規定","至少一個月","至少六個月","至少一年"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":56,"s":2,"n":9,"t":"一般而言，有關企業員工持股信託契約得終止之原因，下列何者錯誤？","o":["員工持股會代表人退休","信託財產不符運用績效","員工服務之公司股票下市或下櫃","員工服務之公司解散或被合併"],"a":"1","tp":"退出終止與財產返還","note":""},{"p":56,"s":2,"n":10,"t":"依所得稅法規定，信託財產發生之收入，原則上應以下列何者為納稅義務人辦理扣繳？","o":["委託人","受託人","無須辦理扣繳","他益信託之受益人"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":56,"s":2,"n":11,"t":"有關特定金錢信託之運用決定權，歸屬於下列何者？","o":["委託人","受託人","信託監察人","信託公會"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":56,"s":2,"n":12,"t":"信託業運用信託財產於國外或涉及外匯之投資，委託人屬非專業投資人者，其信託財產運用規範，下列何者錯誤？","o":["外國再次證券化商品或合成型證券化商品","依期貨信託基金管理辦法募集外幣計價之期貨信託基金","依證券投資信託基金管理辦法募集外幣計價之證券投資信託基金","依外國發行人募集與發行有價證券處理準則發行且已於次級市場交易之外幣計價債券"],"a":"1","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":56,"s":2,"n":13,"t":"江董事長有一筆款項欲信託與信託業管理，雙方簽訂特定金錢信託契約，將信託財產分散運用於股票及債券，有關信託登記事宜，下列敘述何者正確？","o":["僅股票需辦理信託登記","僅債券需辦理信託登記","股票及債券均需辦理信託登記","特定金錢信託於信託期間無須適用信託登記規定"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":56,"s":2,"n":14,"t":"有關非專業投資人特定金錢信託投資國外有價證券業務項下所能投資之標的，下列何者錯誤？","o":["經金管會核准之境外基金","向金管會申報生效之境外基金","大陸企業赴海外發行之公司債","符合一定信用評等以上之美國公司債券"],"a":"3","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":56,"s":2,"n":15,"t":"依信託業商業同業公會訂定之「會員辦理預收款信託業務應行注意事項」規定，下列敘述何者錯誤？","o":["預收款信託為先付款後消費性質之款項信託","信託業應要求廠商須於網站提供消費者查詢預收款信託","預收款信託契約存續期間到期日前二個月信託業應與廠商完成續約","信託財產管理者不得從事不動產等具有投資風險之運用"],"a":"3","tp":"預收款禮券與履約保障","note":""},{"p":56,"s":2,"n":16,"t":"下列何者與自行查核之目的較無直接關聯？","o":["及早發現業務經營上之缺失，俾及時補正或改進，以避免可能發生之損失","藉由查核加強內部牽制，進而產生嚇阻舞弊作用","輔助稽核單位稽核頻次之不足","使金融機構資訊更加透明化"],"a":"4","tp":"內控稽核與風險管理","note":""},{"p":56,"s":2,"n":17,"t":"銀行辦理特定金錢信託投資國外有價證券業務，對原經申請核准或申報生效之境外基金，因故終止或暫停國內募集或銷售者應如何處理？","o":["單筆方式投資者，應辦理贖回","定期定額投資者，可繼續持有但不可繼續扣款","單筆方式投資者，得繼續持有且可增加投資金額","定期定額投資者，得按原信託契約繼續投資但不可增加扣款日期或提高扣款金額"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":56,"s":2,"n":18,"t":"依境外基金管理辦法相關規定，境外基金為增加投資效率，持有衍生性商品未沖銷部位之風險暴露，不得超過該境外基金淨資產價值之多少百分比？","o":["百分之十五","百分之三十","百分之四十","百分之百"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":56,"s":2,"n":19,"t":"有關信託財產評審委員會之組成與運作，下列何者錯誤？","o":["應設置召集人","採事前審查機制","委員人數為五至九人","每三個月評審一次信託財產，報告董事會"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":56,"s":2,"n":20,"t":"信託業依特定金錢信託契約受託投資境外基金時，應遵守下列何種法令規定？ A.信託法 B.信託業法 C.境外基金管理辦法 D.洗錢防制法","o":["僅AB","僅ABC","僅ABD","ABCD 易","note":""},{"p":56,"s":2,"n":58,"t":"有關證券投資信託基金保管機構辦理基金資產交割，下列敘述何者錯誤？","o":["應取得投信公司有權人員之簽章樣本及密碼","原則上應款券同時交割","交割指示內容不明確時，應拒絕辦理交割","交割未完成才需回報投信公司及交易對象，並做成書面紀錄"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":56,"s":2,"n":59,"t":"接受單一全權委託投資客戶（委任人）委託投資資產之最低金額，目前規定為何？","o":["新臺幣五千萬元","新臺幣三千萬元","新臺幣一千萬元","新臺幣五百萬元"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":56,"s":2,"n":60,"t":"我國目前大多由下列何者辦理保管銀行業務？","o":["專業銀行","工業銀行","銀行信託專責部門","信託投資公司"],"a":"3","tp":"其他資產保管與營業保證金","note":""},{"p":56,"s":2,"n":61,"t":"以委任方式經營全權委託投資業務，全權委託保管機構應由下列何者指定？","o":["委任人（客戶）","受任人","證券集保公司","投信投顧公會"],"a":"1","tp":"全權委託保管與越權交易","note":""},{"p":56,"s":2,"n":62,"t":"依證券投資信託及顧問法規定，除經主管機關核准者外，不得擔任各該證券投資信託事業基金保管機構之情形，下列何者非屬之？","o":["擔任該證券投資信託基金之簽證機構","由證券投資信託事業擔任董事或監察人之保管機構","與證券投資信託事業屬於同一金融控股公司之子公司","證券投資信託事業持有該保管機構已發行股份總數百分之五者"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":56,"s":2,"n":63,"t":"下列何者依法必須存放於保管機構？ A.信託業募集發行貨幣市場共同信託基金之資產 B.表彰海外存託憑證而提存之有價證券 C.期貨交易輔助人之營業保證金 D.委任關係全權委託投資之資產","o":["BCD","ACD","ABC","ABD"],"a":"1","tp":"全權委託保管與越權交易","note":""},{"p":56,"s":2,"n":64,"t":"證券投資信託基金之「基金保管機構」係指本於下列何種關係，擔任證券投資信託契約受託人？","o":["委任","寄託","信託","代理"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":56,"s":2,"n":65,"t":"依外資管理辦法規定，保管機構應辦理證券商交易明細之確認事宜，並於交易日（T 日）之下列何時辦理交割？","o":["T＋1 日","T＋2 日","T＋3 日","T 日當天下午"],"a":"2","tp":"外資全球保管與代理登記","note":""},{"p":56,"s":2,"n":66,"t":"有關信託業辦理非專業投資人得委託投資之信託資金集合管理運用，下列敘述何者正確？","o":["經信託契約載明者，得提供擔保","以具有次級交易市場之投資標的為原則","經主管機關核准者，得從事證券信用交易","除已獲准上市（櫃）而正辦理承銷中之股票外，其他未上市（櫃）股票亦得投資"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":56,"s":2,"n":67,"t":"全權委託投資之保管銀行於有越權交易時，至遲應於何時就越權部分出具越權交易通知書？","o":["於成交日當日下午二時前","於成交日次一營業日上午十一時前","於成交日次一營業日下午二時前","於成交日次二營業日上午十一時前"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":56,"s":2,"n":68,"t":"有關證券投資信託基金之保管機構，下列敘述何者正確？","o":["應由其他之證券投資信託公司擔任","得由募集基金之證券投資信託公司本身擔任","得經受益人大會決議由證券投資顧問公司擔任","主要由信託業或銀行信託部擔任"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":56,"s":2,"n":69,"t":"信託業辦理信託資金集合管理運用係屬下列何種信託？","o":["有價證券之信託","金錢債權之信託","動產之信託","金錢之信託"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":56,"s":2,"n":70,"t":"信託業依信託資金集合管理運用管理辦法規定，設置非專業投資人得委託投資之集合管理運用帳戶，係採下列何種方式？","o":["報備制","核准制","申報生效制","自動生效制"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":56,"s":2,"n":71,"t":"信託業設置信託資金集合管理運用帳戶之運用範圍涉及證券交易法第六條規定之有價證券時，應向證券主管機關申請兼營下列何種業務？","o":["證券投資信託業務","證券商業務","期貨業務","證券投資顧問業務"],"a":"4","tp":"集合帳戶申請設置與合併","note":""},{"p":56,"s":2,"n":72,"t":"有關信託資金集合管理運用帳戶之特性，下列敘述何者錯誤？","o":["投資報酬免稅","小額資金參與投資","節省受託人管理運用成本","依受益權比例分享信託利益"],"a":"1","tp":"單獨及集合管理分類與權限","note":""},{"p":56,"s":2,"n":73,"t":"除信託資金集合管理運用帳戶約定條款另有約定外，信託業應於多久期間就各集合管理運用帳戶分別計算其每一信託受益權之淨資產價值？","o":["每一營業日","每一週","每一個月","每三個月"],"a":"1","tp":"集合帳戶投資限制與流動性","note":""},{"p":56,"s":2,"n":74,"t":"依信託資金集合管理運用管理辦法規定，下列何者非屬信託業應辦理公告之事由？","o":["更換集合管理運用帳戶經理人","集合管理運用帳戶約定條款變更","集合管理運用帳戶運用計畫變更","經主管機關命令終止集合管理運用帳戶"],"a":"1","tp":"集合帳戶申請設置與合併","note":""},{"p":56,"s":2,"n":75,"t":"有關信託業拒絕受益人退出信託資金集合管理運用帳戶之規定，下列敘述何者錯誤？","o":["因匯兌交易受限制，得暫時拒絕受益人退出之請求","因通常使用之通訊中斷，得暫時拒絕受益人退出之請求","拒絕受益人退出之請求，應於事後立即報請同業公會核備","集中交易市場非因例假日而停止交易期間，得暫時拒絕受益人退出之請求"],"a":"3","tp":"集合帳戶受益權淨值與退出","note":""},{"p":56,"s":2,"n":76,"t":"委託人羅小姐與甲銀行簽訂信託契約，約定受益人為李小明，後因故受託銀行變更為乙銀行，則信託財產由甲銀行移轉至乙銀行時，必須課徵何種稅捐？","o":["贈與稅","營業稅","契稅","無須課徵稅捐"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":56,"s":2,"n":77,"t":"信託業應於會計年度終了後至遲幾個月內，就各集合管理運用帳戶分別編具集合管理運用信託財產年度決算報告？","o":["一個月","二個月","三個月","四個月"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":56,"s":2,"n":78,"t":"下列敘述何者錯誤？","o":["金融資產證券化之受益證券係由受託機構發行","不動產投資信託基金除經主管機關核准外，以封閉型為限","證券投資信託基金保管銀行不論交割完成與否，均應以電話回報投信公司","委託人（自然人）透過銀行辦理特定金錢信託投資國外有價證券時，並不占用其當年度結購結售外匯額度"],"a":"3","tp":"其他資產保管與營業保證金","note":""},{"p":56,"s":2,"n":79,"t":"林先生與A 銀行簽訂特定金錢信託投資國外有價證券契約，並指定投資B 基金公司之國外基金，則下列敘述何者錯誤？","o":["林先生與A 銀行為信託關係","A 銀行與B 基金公司非為信託關係","林先生與A 銀行、B 基金公司皆為信託關係","林先生為B 基金公司發行受益憑證之受益人"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":56,"s":2,"n":80,"t":"有關營業保證金之提存，下列敘述何者錯誤？","o":["更換提存之金融機構，應先函報證期局核准","保管機構得對營業保證金逕行抵銷、質設","營業保證金應向主管機關核准得辦理保管業務且達一定信用評等以上之金融機構提存","營業保證金應以現金、定存單、政府債券、金融債券提存"],"a":"2","tp":"其他資產保管與營業保證金","note":""},{"p":57,"s":1,"n":1,"t":"依信託法規定，受託人關於信託財產之占有，應承繼下列何者占有之瑕疵？","o":["委託人","受益人","信託監察人","委託人及受益人"],"a":"1","tp":"受託人義務報酬與責任","note":""},{"p":57,"s":1,"n":2,"t":"依信託法規定，委託人於信託成立後六個月內，有下列何種情形者，得推定其行為有害及債權？","o":["死亡","失蹤","受破產之宣告","受禁治產之宣告"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":3,"t":"依信託法規定，以應登記或註冊之財產權為信託者，非經信託登記，其效力如何？","o":["不生效","不得對抗第三人","效力未定","不成立"],"a":"2","tp":"登記公示與對抗效力","note":""},{"p":57,"s":1,"n":5,"t":"有關私益信託須具備信託三大確定性，如信託財產之標的不明確時，其效果如何？","o":["為有效之信託","信託不成立","信託效力未定","信託成立，但委託人可撤銷之"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":6,"t":"除信託行為另有訂定外，有關受託人因信託財產毀損所取得之保險金或補償金，下列敘述何者正確？","o":["屬於信託財產","屬於受託人自有財產","屬於受益人自有財產","回復為委託人自有財產"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":7,"t":"他益信託除信託行為另有約定外，得由誰隨時終止信託？","o":["委託人與受益人共同終止","委託人、信託監察人與受益人共同終止","委託人與受託人共同終止","受益人與受託人共同終止"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":8,"t":"有關共同受託人之敘述，下列何者錯誤？","o":["對其中一人所為之意思表示，對全體不生效力","共同受託人對於處理信託事務所負擔之債務，負連帶清償責任","共同受託人對受益人因信託行為所負擔之債務，負連帶清償責任","共同受託人意思不一致時，應得受益人全體之同意"],"a":"1","tp":"受託人義務報酬與責任","note":""},{"p":57,"s":1,"n":9,"t":"依信託法規定，受託人因信託行為對受益人所負擔之債務，應於何種限度內負履行責任？","o":["信託財產","自有財產","信託報酬","信託契約約定"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":10,"t":"受託人僅於下列何種情形時，得享有信託利益？","o":["受託人為委託人中之一人時","受託人與他人為共同受益人時","受託人為法人時","受託人與委託人為同一人時"],"a":"2","tp":"受益人權利與撤銷救濟","note":""},{"p":57,"s":1,"n":11,"t":"成立有效之遺囑信託，委託人至少需年滿幾歲？","o":["二十歲","十八歲","十六歲","七歲"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":12,"t":"受託人因信託行為另有訂定或有不得已之事由，依法使第三人代為處理信託事務，其相關責任為何？","o":["受託人不須負任何責任","第三人不須負任何責任","受託人就第三人之行為與就自己之行為負同一之責任","受託人僅就第三人之選任與監督其職務之執行負其責任"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":13,"t":"下列何者不屬於公益信託之消滅事由？","o":["信託目的已完成","信託目的不能完成","目的事業主管機關撤銷或廢止設立許可","受託人辭任"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":57,"s":1,"n":14,"t":"下列何者不須經公益信託之目的事業主管機關許可？","o":["公益信託之設立","辭任公益信託之受託人","擔任公益信託之受託人","擔任公益信託之委託人"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":57,"s":1,"n":15,"t":"依信託法規定，信託監察人得以下列何者名義，為受益人為有關信託之訴訟上或訴訟外之 s":1,"n":41,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，證券投資信託事業以信託方式經營全權委託投資業務，其接受委託人原始信託財產達新臺幣多少元以上者，符合應申請主管機關許可之一定條件？","o":["五百萬元","一千萬元","一千五百萬元","二千萬元"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":57,"s":1,"n":42,"t":"有關信託公司之經營與管理，下列敘述何者錯誤？","o":["信託公司之董事長應具備信託業督導人員之資格條件","政黨不得投資或經營信託業","信託公司之股票應為記名式","信託公司內部稽核報告至少應留存三年備查"],"a":"4","tp":"人員資格訓練與利益限制","note":""},{"p":57,"s":1,"n":43,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，證券投資顧問事業申請兼營信託業務之特定項目時，應自主管機關許可之日起幾個月內申請換發營業執照或許可證照？","o":["一個月","三個月","六個月","一年"],"a":"3","tp":"設立標準與分支機構","note":""},{"p":57,"s":1,"n":44,"t":"他益信託委託人權利之行使，下列敘述何者正確？","o":["得隨時終止信託","得任意變更受益人","得隨時處分受益人之權利","債權人違反信託法規定對信託財產強制執行時，除信託行為另有保留外，得提起異議之訴"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":57,"s":1,"n":45,"t":"有關信託業辦理共同信託基金業務之規定，下列敘述何者正確？","o":["得發行貨幣市場共同信託基金","得運用共同信託基金資產從事證券信用交易","同一信託業管理之共同信託基金間得互為交易","共同信託基金之受益證券不得由受益人背書轉讓"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":57,"s":1,"n":46,"t":"甲以20 萬股上市公司股票成立一信託，信託期間五年，期間孳息歸乙，期滿股票歸甲，假設贈與時中華郵政儲金一年期定期儲金固定利率為1%，契約日當天收盤價每股新臺幣50 元，則甲贈與乙之權利價值為何？ 〔1/(1+1%)5 =0.9515〕","o":["新臺幣1,000 萬元","新臺幣 951.5 萬元","新臺幣48.5 萬元","零"],"a":"3","tp":"贈與權利價值與折現計算","note":""},{"p":57,"s":1,"n":47,"t":"委託人為營利事業之信託契約，信託成立時，明定信託利益之全部之受益人為非委託人者，該信託利益之權利價值應由下列何者併入成立年度之所得額申報，課徵所得稅？","o":["委託人","受託人","受益人","該營利事業負責人"],"a":"3","tp":"贈與權利價值與折現計算","note":""},{"p":57,"s":1,"n":48,"t":"以土地為信託財產者，於信託期間依土地稅法之規定，以下列何者為地價稅之納稅義務人？","o":["委託人","受託人","受益人","依信託契約內所訂之人為納稅義務人"],"a":"2","tp":"土地稅與土地增值稅","note":""},{"p":57,"s":1,"n":49,"t":"土地為信託財產者，受託人將信託財產移轉於受益人時，下列敘述何者錯誤？","o":["不課徵受益人所得稅","不課徵受託人贈與稅","受益人為委託人時，不課徵土地增值稅","遺囑信託受託人將信託財產交付予受益人時應課徵土地增值稅"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":57,"s":1,"n":50,"t":"營利事業成立時受益人不特定或尚未存在之非公益信託之信託財產運用，原則上其所得如何課稅？","o":["於受益人確定時再併入確定年度所得申報","不予課徵所得稅","於發生年度，以委託人為納稅義務人，併入其所得申報","於發生年度，以受託人為納稅義務人，按規定之扣繳率申報納稅"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":57,"s":2,"n":1,"t":"依信託業商業同業公會會員辦理預收款信託業務應行注意事項規定，受益權人會議召開的時機，下列何者正確？ A.廠商連續三年虧損 B.廠商歇業 C.廠商宣告破產 D.廠商撤銷登記","o":["僅 A.B","僅 B.C","僅 B.C.D","A.B.C.D"],"a":"3","tp":"預收款禮券與履約保障","note":""},{"p":57,"s":2,"n":2,"t":"信託業辦理特定金錢信託業務，以受託投資外國有價證券為目的者，除境外基金管理辦法及境外結構型商品管理規則另有規定外，有關其業務推展活動，下列何者正確？","o":["寄發商品說明書予一般大眾","舉辦說明會並發布新聞稿","主動洽詢媒體公開宣導特定投資標的","將商品說明書放置特定營業櫃檯"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":3,"t":"有關信託業辦理「指定」與「不指定」營運範圍或方法之金錢信託，下列敘述何者正確？","o":["「指定」營運範圍可辦理中長期授信","「不指定」營運範圍可辦理中長期授信","「指定」與「不指定」營運範圍皆可辦理中長期授信","「指定」與「不指定」營運範圍皆不可辦理中長期授信"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":4,"t":"目前國內銀行最常辦理之信託業務為下列何者？","o":["特定金錢信託業務","不動產信託業務","金錢債權信託業務","有價證券信託業務"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":5,"t":"銀行辦理特定金錢信託業務，所收受之金錢，其信託登記規定為何？","o":["無信託登記之必要","僅投資國外有價證券時，金錢需為信託登記","僅投資國內有價證券時，金錢需為信託登記","投資國內、國外有價證券時，均應將金錢辦理信託登記"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":6,"t":"陳先生去年定期定額申購甲新興市場基金，目前仍持續扣款中，若今年三月起，甲新興市場基金因故終止或暫停在國內募集及銷售，陳先生可採取的措施為何？","o":["得按原訂契約金額繼續投資","可增加該筆定期定額扣款金額","可先停扣該筆定期定額投資，三個月後更改日期繼續投資","可停扣該筆定期定額投資，但須強制贖回該基金所有投資金額"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":7,"t":"有關信託財產評審委員會之規定，下列敘述何者錯誤？","o":["委員會由五至九人組成，並設召集人一人","信託財產每三個月評審一次，報告董事會","信託財產之評審採事後審查制","對信託財產具有運用決定權之信託，應由業務專責部門就信託財產彙總運用概況提出報告"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":57,"s":2,"n":8,"t":"有關充分瞭解客戶(KYC)所應留存之基本資料，下列何者正確？ A.財務背景 B.資金來源 C.健康狀態","o":["僅 AB","僅 BC","僅 AC","ABC"],"a":"1","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":57,"s":2,"n":9,"t":"有關銀行辦理特定金錢信託投資國內外基金業務，下列敘述何者正確？","o":["銀行應定期推薦特定熱賣基金","受託銀行不得公開陳列任何境外基金資料","委託人的投資盈虧應由基金公司及受託銀行共同負責","委託人應負擔基金之申購、轉換、贖回等各項費用，並另支付受託人信託管理費"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":10,"t":"依現行法令規定，特定金錢信託之信託期限最長為何？","o":["一年","三年","五年","無規定"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":11,"t":"有關國際金融業務分行辦理信託業務之敘述，下列何者錯誤？","o":["得對境外客戶辦理新臺幣信託","原則上限收受信託財產","帳務設於國際金融業務分行","信託財產之管理運用及處分，應統籌由信託業務專責部門為之"],"a":"1","tp":"外匯結匯與國際金融業務","note":""},{"p":57,"s":2,"n":12,"t":"委託人與銀行簽訂契約，約定每月自其活期存款帳戶扣新臺幣5,000 元投資於境外基金，請問委託人不必承擔下列何種風險？","o":["匯率風險","淨值下跌的風險","銀行逾放比過高，經營績效不彰之風險","交易市場流動性不足之風險"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":13,"t":"有關銀行辦理特定金錢信託投資境外基金業務，下列敘述何者錯誤？","o":["境外基金應經主管機關核准或申報生效","基金管理機構應成立滿二年以上","基金管理機構應為最近二年未受當地主管機關處分並有紀錄在案者","基金管理機構所管理基金總資產淨值（包括退休基金或全權委託帳戶），至少應超過三十億美元或等值之外幣"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":14,"t":"有關外幣特定金錢信託投資「外幣」有價證券業務，下列敘述何者錯誤？","o":["信託資金之收受應以外幣為之","屆期本益之攤還，得以新臺幣為之","委託人不得以信託資金為擔保辦理借款","委託人應於指定銀行開立外匯存款帳戶"],"a":"2","tp":"外匯結匯與國際金融業務","note":""},{"p":57,"s":2,"n":15,"t":"信託業辦理特定金錢信託投資於境外結構型商品時，下列何者非屬應對委託人揭露之「基本風險」？","o":["最低收益風險","通貨膨脹風險","利率風險","信用風險"],"a":"2","tp":"結構型商品與衍生性金融商品","note":""},{"p":57,"s":2,"n":16,"t":"某壽險公司為分散資金運用風險，欲以壽險資金投資國外有價證券，下列敘述何者正確？","o":["為穩健經營僅限投資債券","可投資之金額不受任何限制","可以與銀行簽訂信託契約辦理","不可辦理新臺幣與外幣間之避險交易"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":17,"t":"特定金錢信託投資國內證券投資信託基金業務之投資指定，應由下列何者為之？","o":["受託人","委託人","受託人或委託人皆可","得概括授權受託人代為操作"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":18,"t":"銀行辦理信託業務收取之手續費收入，有關其相關稅負之敘述，下列何者錯誤？","o":["依法應報繳營業稅","未於信託契約載明或註記收到銀錢文字者，免納印花稅","以信託申請書代替信託手續費收入憑證者，免納印花稅","以信託申請書代替信託手續費收入憑證者，應報繳印花稅"],"a":"3","tp":"營業稅與印花稅","note":""},{"p":57,"s":2,"n":19,"t":"銀行收受委託人交付新臺幣信託資金辦理特定金錢信託投資境外基金，係以下列何者名義辦理結匯事宜？","o":["委託人","受託銀行","基金公司","基金保管銀行"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":20,"t":"依「信託業營運範圍受益權轉讓限制風險揭露及行銷訂約管理辦法」規定，信託業運用信託財產涉及外匯之投資，為避險目的得從事之交易，不包括下列何者？","o":["新臺幣與外幣間換匯交易","新臺幣與外幣間換匯換利交易","新臺幣與外幣間利率期貨交易","新臺幣與外幣間匯率選擇權交易"],"a":"3","tp":"行銷訂約與風險揭露","note":""},{"p":57,"s":2,"n":21,"t":"於我國銷售之境外基金，為增加投資效率，持有衍生性商品未沖銷部位之風險暴露，最高不得超過該境外基金淨資產價值多少比例？","o":["10%","20%","30%","40%"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":57,"s":2,"n":22,"t":"依「信託業建立非專業投資人商品適合度規章應遵循事項」規定，信託業界定商品風險等級前應確認之事項，下列何者非屬之？","o":["商品銷售地區","商品之投資假設","商品風險報酬之合理性","受託投資之適當性及有無利益衝突之情事"],"a":"1","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":57,"s":2,"n":23,"t":"現行企業員工持股信託於信託終了返還信託財產時，應負擔之稅負為何？","o":["由信託財產中扣除所得稅","列入受益人當年度之綜合所得稅","無需課稅","由員工持股會負擔證券交易所得稅"],"a":"3","tp":"員工持股信託的課稅與返還","note":""},{"p":57,"s":2,"n":24,"t":"有關企業員工持股信託之投資運用管理，下列敘述何者錯誤？","o":["以長期持股為投資方針","採滾入平均 託公會","信託監察人","受益人大會"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":57,"s":2,"n":76,"t":"委託人交付新股認購權利證書為信託財產時，屬於下列何種信託業務？","o":["金錢之信託","動產之信託","有價證券之信託","金錢債權及其擔保物權之信託"],"a":"3","tp":"內部人持股申報與權益行使","note":""},{"p":57,"s":2,"n":77,"t":"下列何者為我國信託業法之附屬業務？","o":["金錢信託業務","動產信託業務","辦理保管業務","租賃權信託業務"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":57,"s":2,"n":78,"t":"信託業辦理委託人不指定營運範圍或方法之金錢信託，下列何者非其營運範圍？","o":["公司債","金融債券","短期票券","上市公司股票"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":57,"s":2,"n":79,"t":"有關信託業得辦理之信託業務，下列何者錯誤？","o":["指定金錢信託","特定金錢信託投資國內外共同基金","管理型有價證券信託","以特殊目的公司進行不動產資產信託"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":57,"s":2,"n":80,"t":"有關銀行辦理特定金錢信託投資國外有價證券業務，下列敘述何者錯誤？","o":["信託資金之結匯由受託銀行辦理","原則上結匯之額度無須計入委託人匯出入匯款之額度內","信託資金之本金不得從事換匯交易等避險操作","受託銀行得依信託資金金額大小而收取不同之手續費"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":1,"n":1,"t":"有關宣言信託設立之敘述，下列何者正確？","o":["委託人與受益人為同一人","委託人與受託人為同一人","受託人與受益人為同一人","委託人與信託監察人為同一人"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":58,"s":1,"n":2,"t":"以公司債為信託者，下列敘述何者正確？","o":["非經通知公司債受託人者，不得對抗發行公司","非經通知公司債保證銀行者，不得對抗發行公司","非經通知發行公司者，不得對抗該發行公司","非經通知經濟部者，不得對抗發行公司"],"a":"3","tp":"登記公示與對抗效力","note":""},{"p":58,"s":1,"n":3,"t":"有關私益信託成立時不可或缺之要件，即為信託三大確定性，下列何者錯誤？","o":["信託目的之確定","信託財產之確定","受益人之確定","信託監察人之確定"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":58,"s":1,"n":4,"t":"以依法不得受讓特定財產權之人為該財產權受益人之信託，其效力為何？","o":["得撤銷","效力未定","得撤回","無效"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":58,"s":1,"n":5,"t":"依信託業法分類，所稱「金融資產證券化」屬下列何種信託？","o":["金錢信託","不動產信託","有價證券信託","金錢債權及其擔保物權信託"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":58,"s":1,"n":6,"t":"依信託法規定，受託人死亡時，除信託行為另有訂定外，下列敘述何者正確？","o":["信託關係消滅","信託財產歸屬於國庫","信託財產屬於委託人之遺產","信託財產不屬於受託人之遺產"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":58,"s":1,"n":7,"t":"受託人違反直接管理義務，使第三人代為處理信託事務時，下列敘述何者正確？","o":["由受託人自行負責","由該第三人自行負責","由受託人與該第三人負連帶責任","受託人僅就第三人之選任與監督其職務之執行負其責任"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":58,"s":1,"n":8,"t":"受託人得逕自信託財產扣除其因處理信託事務所支出之稅捐及費用，為受託人之何種權利？","o":["請求報酬之權利","行使抵充之權利","請求補償或賠償之權利","拒絕交付或留置信託財產之權利"],"a":"2","tp":"受託人義務報酬與責任","note":""},{"p":58,"s":1,"n":9,"t":"有關受託人變更時，債權人對於信託財產之強制執行，下列敘述何者正確？","o":["須另取得執行名義","無法續行強制執行","應以原受託人為債務人續行強制執行","仍得依原執行名義以新受託人為債務人續行強制執行"],"a":"4","tp":"財產獨立性與強制執行","note":""},{"p":58,"s":1,"n":10,"t":"受託人因信託行為對受益人所負擔之債務，原則上應以何財產負履行責任？","o":["僅於信託財產限度內負履行責任","應以包括自有財產與信託財產在內之所有財產負履行責任","應以自有財產負履行責任","先以信託財產負履行責任，如有不足，再以自有財產負履行責任"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":58,"s":1,"n":11,"t":"甲、乙、丙三人為信託財產之共同受託人，甲死亡時，信託財產歸屬於何人？","o":["甲之繼承人與乙、丙共同所有","成為乙、丙二人公同共有","由委託人選定一人為公同共有人","聲請法院選定一人為公同共有人"],"a":"2","tp":"終止變更與剩餘財產歸屬","note":""},{"p":58,"s":1,"n":12,"t":"依信託法規定，下列信託財產何者得以分別記帳方式為之？","o":["信託財產為動產者","信託財產為不動產者","信託財產為金錢者","信託財產為金錢債權者"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":58,"s":1,"n":13,"t":"甲、乙、丙為同一信託關係之信託監察人，其對於信託財產之保存行為，下列何者正確？","o":["必須由甲、乙、丙三人共同為之","必須事先徵求法院之許可，始得為之","甲、乙、丙得分別單獨為之","必須由甲、乙、丙以過半數決為之"],"a":"3","tp":"信託監察人","note":""},{"p":58,"s":1,"n":14,"t":"信託關係消滅時，於受託人移轉信託財產於歸屬權利人前，信託關係視為存續，依信託法規定，以下列何者為該信託之受益人？","o":["委託人","信託監察人","主管機關","歸屬權利人"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":58,"s":1,"n":15,"t":"公益信託關係消滅時，受託人應作成結算書及報告書，並取得下列何者承認後，向目的事業主管機關申報？","o":["受益人","委託人","法院","信託監察人"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":58,"s":1,"n":16,"t":"下列何者不屬於公益信託目的事業主管機關之監督權限？","o":["受託人有正當理由時，得許可其辭任","得隨時檢查信託事務及財產狀況","受託人違背其職務時，得依職權解任之","依受益人之申請，撤銷受託人違反信託本旨之處分"],"a":"4","tp":"設立能力與監督管轄","note":""},{"p":58,"s":1,"n":17,"t":"民事信託中之私益信託除信託行為另有訂定外，得因信託監察人之請求，斟酌其職務之繁簡及信託財產之狀況，就信託財產酌給相當報酬者，下列何者正確？","o":["法院","受託人","委託人","受益人"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":58,"s":1,"n":18,"t":"下列何者不是信託業依法令應公告之項目？","o":["簽訂重要契約","每半年營業年度之資產負債表","信託財產評審委員會之評審結果","董事長、總經理或三分之一以上董事發生變動者"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":58,"s":1,"n":19,"t":"有關信託之敘述，下列何者正確？","o":["事業經營權得成為信託財產","信託財產得為委託人不確定存在之財產權","受託人關於信託財產之占有，並不承繼委託人占有之瑕疵","如信託財產為土地與其上種植之果樹，果樹所生產之果實經變賣後成現金，該現金屬於信託財產"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":58,"s":1,"n":20,"t":"委託人甲與受託人乙簽訂他益信託之信託契約，並已移轉一筆土地與一棟房屋為信託財產，約定一年後將土地與房屋售出，並將售出款項用於扶養甲之弱智女兒丙，且約定甲死亡時以其兄丁為信託監察人，則信託當年度，房屋稅納稅義務人為下列何者？","o":["甲","乙","丙","丁"],"a":"2","tp":"房屋稅與契稅","note":""},{"p":58,"s":1,"n":21,"t":"有關信託公司之設立，下列敘述何者正確？","o":["信託公司應為公開發行公司","信託公司之股票得為無記名式","發起人及股東之出資以現金及不動產為限","原則上發起人應於發起時一次認足發行股份總額，並至少繳足百分之十之股款"],"a":"1","tp":"設立標準與分支機構","note":""},{"p":58,"s":1,"n":22,"t":"下列敘述何者正確？","o":["保險業得募集共同信託基金","都市更新投資信託事業屬信託業","信託投資公司即是信託業","銀行兼營信託業務屬信託業"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":58,"s":1,"n":23,"t":"依信託業設立標準規定，申請設立一般信託公司（得辦理金錢之信託），其最低實收資本額為多少？","o":["新臺幣十五億元","新臺幣二十億元","新臺幣三十億元","新臺幣五十億元"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":58,"s":1,"n":24,"t":"依信託業法規定，下列何者不屬於信託業經營之附屬業務項目？","o":["辦理保管業務","辦理出租保管箱業務","擔任有價證券發行簽證人","擔任有價證券發行承銷商"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":58,"s":1,"n":25,"t":"下列何者為信託業之利害關係人？","o":["擔任兼營信託業務之銀行之信託部襄理","擔任兼營信託業務之銀行之分行襄理","兼營信託業務之銀行持股比率達百分之三之企業","持有兼營信託業務之銀行已發行股份總數達百分之二之自然人或法人"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":58,"s":1,"n":26,"t":"信託業有關信託財產之敘述，下列何者正確？","o":["經受益人同意，得將信託財產讓售與本身","銀行辦理特定金錢信託不得投資於利害關係人所募集發行之證券投資信託基金","雖經受益人同意，仍不得以信託財產購買本身銀行業務部門經紀之有價證券或票券","具運用決定權者，不得以信託財產購買本身之不動產"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":58,"s":1,"n":27,"t":"依信託業負責人應具備資格條件暨經營與管理人員應具備信託專門學識或經驗準則規定，下列何者屬於信託業經營與管理人員中之督導人員？","o":["經理","副理","襄理","信託財產評審委員會委員"],"a":"4","tp":"人員資格訓練與利益限制","note":""},{"p":58,"s":1,"n":28,"t":"信託業不得以信託財產設定擔保借入款項，下列敘述何者正確？","o":["一律禁止","以開發土地之土地信託依信託契約約定，得借入款項，惟須經法院同意","以開發土地之土地信託依信託契約約定，得借入款項，惟須經全體委託人同意","以開發土地之土地信託依信託契約約定，得借入款項，惟須經全體受益人（或受益人會議）同意"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":58,"s":1,"n":29,"t":"柯先生與甲銀行簽訂信託契約，並交付新臺幣一百萬元，指定受託人得將該筆資金與他人之信託資金集合管理運用投資於國內上市公司股票，該種信託係屬下列何種信託？","o":["指定營運範圍或方法之單獨管理運用金錢信託","指定營運範圍或方法之集合管理運用金錢信託","不指定營運範圍或方法之單獨管理運用金錢信託","不指定營運範圍或方法之集合管理運用金錢信託"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":58,"s":1,"n":30,"t":"有關信託業提存之賠償準備金，下列敘述何者正確？ A.應於取得營業執照後一個月內繳存中央銀行 B.以現金或政府債券方式繳存中央銀行 C.委託人或受益人有優先受償之權 D.至少提存新臺幣三億元整","o":["僅ABC","僅BCD","僅ACD","ABCD"],"a":"1","tp":"設立標準與分支機構","note":""},{"p":58,"s":1,"n":31,"t":"信託業違反法令時，主管機關得為之處置，下列何者正確？ A.糾正、命其限期改善 B.停止負責人職務 C.停止一部或全部業務 D.廢止營業許可","o":["僅A","僅ABC","僅ACD","ABCD"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":58,"s":1,"n":32,"t":"信託業應報經主管機關核准之事項，下列何者錯誤？","o":["變更章程","增設分支機構","發行共同信託基金","設立信託財產評審委員會"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":58,"s":1,"n":33,"t":"依信託業法規定，信託業為下列何種行為，將負刑事責任？","o":["未經主管機關核准，募集共同信託基金","未經全體受益人同意，以該信託財產借入款項","辦理集合管理運用之金錢信託，未保持適當之流動性","未經受益人書面同意，而將信託財產存放於其銀行業務部門作為存款"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":58,"s":1,"n":34,"t":"銀行辦理信託業務，依法應向客戶充分告知之事項，不包括下列何者？","o":["銀行應善盡善良管理人之注意義務及忠實義務","銀行不擔保信託業務之管理或運用績效","信託財產經運用於存款以外之標的者，不受存款保險之保障","銀行之經營績效及淨值報酬率"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":58,"s":1,"n":35,"t":"依信託業法規定，有關信託契約之敘述，下列何者錯誤？","o":["應記載受託人之責任","應記載信託存續期間","信託契約可以口頭為之","應記載委託人、受託人及受益人之姓名、名稱及住所"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":58,"s":1,"n":36,"t":"信託業以自有財產購買自用不動產除兼營信託業務之銀行外，其購買總額有何限制規定？","o":["不得超過該信託業淨值百分之三十","不得超過該信託業淨值百分之五十","不得超過該信託業淨值","不得購買自用不動產"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":58,"s":1,"n":37,"t":"信託業發生信託財產對信託事務處理之費用，有支付不能之情事時，至遲應於事實發生之翌日幾個營業日內，向主管機關申報？","o":["二個營業日","三個營業日","五個營業日","十個營業日"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":58,"s":1,"n":38,"t":"兼營信託業務之銀行進行清算時，關於信託資金及信託財產之處理，應如何為之？","o":["依信託監察人之意見","依主管機關之命令","依信託契約之約定","依法院裁判"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":58,"s":1,"n":39,"t":"有關信託業辦理信託業務，於運用信託財產從事交易後，除法令另有規定或信託契約另有約定外，應至少多久編製對帳單一次？","o":["每月","每季","每年","無須編製"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":58,"s":1,"n":40,"t":"依信託業商業同業公會會員自律公約規定，會員涉及違反相關法令、本會章則及公約時，其審議程序依序為下列何者？ A.自律規範案件審議會議 B.法規紀律委員會 C.業務發展委員會 D.理事會","o":["ADBC","ACBD","DACB","DABC"],"a":"2","tp":"公會自律與行為規範","note":""},{"p":58,"s":1,"n":41,"t":"依信託業應負之義務及相關行為規範，為避免利益衝突，信託業辦理以自己擔任受託人之信託受益權為擔保之質權設定，應於契約載明之事項，下列何者正確？ A.信託業之管理處分權限 B.信託業不得自信託財產收取本息 C.委託人債務不履行時不得逕自提前終止信託契約 D.信託業不得實行質權","o":["僅AD","僅ABC","僅ACD","ABCD"],"a":"2","tp":"公會自律與行為規範","note":""},{"p":58,"s":1,"n":42,"t":"有關信託業辦理信託業務，依據相關法令經主管機關核准者後，得向不特定人或多數人公開募集資金之情形，下列何者錯誤？","o":["設置集合管理運用帳戶","依不動產證券化條例募集發行受益證券","依金融資產證券化條例募集發行受益證券","依共同信託基金管理辦法募集發行受益證券"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":58,"s":1,"n":43,"t":"有關共同信託基金業務，下列敘述何者正確？","o":["僅信託業得辦理之","性質為委任之法律關係","受託機構不得同時擔任保管機構","表彰其受益權之證券為受益憑證"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":58,"s":1,"n":44,"t":"依信託法及信託業法規定，有關信託業辦理定期會計報告之敘述，下列何者錯誤？","o":["應依信託契約及主管機關規定為之","信託財產評審報告每三個月應報告委託人及受益人","信託契約約定設有信託監察人者，亦應向信託監察人報告","受託人每年至少定期一次作成信託財產目錄，並編製收支計算表，送交委託人及受益人"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":58,"s":1,"n":45,"t":"依信託業法規定，信託業辦理集合管理運用之金錢信託，下列何者正確？","o":["須經受益人同意","應保持適當之流動性","信託業得任意自行設置集合管理運用帳戶","受託人對信託財產之管理運用不能有運用決定權"],"a":"2","tp":"單獨及集合管理分類與權限","note":""},{"p":58,"s":1,"n":46,"t":"下列何者非信託相關稅法所稱形式上之移轉？","o":["受託人與委託人間","受託人與受益人間","原受託人與新受託人間","受託人與信託監察人間"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":58,"s":1,"n":47,"t":"經目的事業主管機關許可設立之公益信託，其受託人因該信託關係而取得之房屋，下列哪一項符合免徵房屋稅之規定？","o":["以受託人名義取得之房屋","以公益信託名義登記之房屋","直接供辦理公益活動使用之房屋","以受託人名義取得之房屋未供營業使用者"],"a":"3","tp":"房屋稅與契稅","note":""},{"p":58,"s":1,"n":48,"t":"遺贈人提供財產，捐贈或加入被繼承人死亡時已成立之公益信託，此財產不計入遺產總額，該公益信託應符合之規定下列何者錯誤？","o":["受託人為信託業法所稱之信託業","由該目的事業主管機關擔任信託監察人","該公益信託除為其設立目的舉辦事業而必須支付之費用外，不以任何方式對特定或可得特定之人給予特殊利益","信託行為明定信託關係解除、終止或消滅時，信託財產移轉於各級政府、有類似目的之公益法人或公益信託"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":58,"s":1,"n":49,"t":"委託人（自然人）以新臺幣一千萬元成立他益信託，逾期未申報繳納贈與稅，且在中華民國境內亦無財產可供執行者，應以下列何者為納稅義務人課徵贈與稅？","o":["委託人","受益人","信託監察人","受託人"],"a":"4","tp":"遺產及贈與稅","note":""},{"p":58,"s":1,"n":50,"t":"委託人為營利事業所成立之他益信託，若受益人不特定時，應以受託人為納稅義務人，按所得稅法規定之扣繳稅率申報納稅，其現行扣繳稅率為多少？","o":["百分之十","百分之十五","百分之二十","百分之三十"],"a":"3","tp":"所得稅與扣繳","note":""},{"p":58,"s":2,"n":1,"t":"有關「生前契約信託」之敘述，下列何者錯誤？","o":["為金錢信託，其法律依據除信託法規外尚有殯葬管理條例","信託財產的運用範圍得為核准設置之火化場需用土地","殯葬業者應將消費者支付之一切對價的百分之七十五交付信託","信託業應將信託財產按月逐筆結算造冊於次月底前交付殯葬業者"],"a":"4","tp":"預收款禮券與履約保障","note":""},{"p":58,"s":2,"n":2,"t":"依據「境外基金管理辦法」，經金管會核准或申報生效在國內募集及銷售之境外基金為增加投資效率，持有衍生性商品未沖銷部位之風險暴露，不得超過該境外基金淨資產價值之百分比為何？","o":["四十","五十","六十","七十"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":3,"t":"有關銀行辦理特定金錢信託投資境外基金業務與客戶簽訂之信託契約，下列敘述何者正確？","o":["期限至少須一個月","應載明委託人之責任","應載明受託人之責任","應載明投資標的之報酬"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":4,"t":"特定金錢信託所投資之境外基金，應經金管會核准或申報生效，該基金管理機構所管理公開募集投資於證券之基金總資產淨值至少須超過等值美金多少元？","o":["十億美元","二十億美元","三十億美元","四十億美元"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":5,"t":"銀行辦理新臺幣特定金錢信託投資國外有價證券業務時，係以下列何者之名義辦理結匯？","o":["銀行","委託人","受益人","中央銀行"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":6,"t":"銀行辦理特定金錢信託投資境外基金時，所投資之基金原則上至少必須成立滿幾年？","o":["半年","一年","二年","三年"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":7,"t":"王五至A 銀行以新臺幣十萬元辦理特定金錢信託投資境外基金，該基金係由B 證券投資顧問公司提供顧問服務，則下列何者為信託關係之委託人及受託人？","o":["王五與A 銀行","A 銀行與基金經理公司","王五與基金經理公司","王五與B 證券投資顧問公司"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":8,"t":"依境外基金管理辦法及相關規定，境外基金投資國內證券市場，至多不得超過其淨資產價值之多少比率？","o":["40%","50%","60%","不得投資"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":9,"t":"銀行辦理特定金錢信託投資國外有價證券業務時，有關投資之指示，下列敘述何者正確？","o":["限由委託人或其委任之第三人指定","由委託人概括授權受託人代為操作","由受託人概括授權委託人代為操作","由信託監察人概括授權受託人代為操作"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":10,"t":"特定金錢信託之基本運作架構下，下列何者正確？","o":["委託人與信託監察人簽訂信託契約","信託業提存賠償準備金於中央銀行","信託公示報告送財政部","信託業者將信託本金返還給委託人及信託監察人"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":58,"s":2,"n":11,"t":"銀行辦理特定金錢信託投資於國內外共同基金業務時，下列敘述何者錯誤？","o":["委託人須負擔基金申購費用","委託人可委託受託銀行以定期定額方式辦理投資事宜","僅得以新臺幣信託資金型態辦理","受託銀行應將信託資金投資購得之單位數分別記錄於每一委託人帳戶"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":58,"s":2,"n":12,"t":"銀行辦理特定金錢信託投資國內外共同基金業務時，受託銀行之義務不包括下列何者？","o":["發行受益憑證","返還信託財產","定期報告之提供","向基金公司買賣下單"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":58,"s":2,"n":13,"t":"依所得稅法規定，信託財產發生之收入，扣繳義務人應於何時，應以何者為納稅義務人，依規定辦理扣繳？","o":["利益給付時、委託人","利益給付時、受託人","利益發生時、受益人","利益發生時、委託人"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":58,"s":2,"n":14,"t":"有關特定金錢信託投資國內外基金之敘述，下列何者錯誤？","o":["大陸地區人民不得為委託人","境外自然人得透過國際金融業務分行(OBU) 辦理","境外法人得透過國際金融業務分行(OBU) 辦理","國內基金申報成立時，得以委託人數計算該基金之受益人數"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":58,"s":2,"n":15,"t":"特定金錢信託投資國外有價證券時，下列何者非中央銀行規定其投資本金得運用之匯率避險工具？","o":["換匯換利交易","期貨","換匯交易","新臺幣與外幣間遠期外匯"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":1 :["甲全權委託乙投資帳戶","乙全權委託丙保管帳戶","甲全權委託丙保管帳戶","甲全權委託丙投資帳戶"],"a":"1","tp":"全權委託保管與越權交易","note":""},{"p":58,"s":2,"n":68,"t":"信託業應於會計年度終了後至遲幾個月內，就各集合管理運用帳戶分別編具集合管理運用信託財產年度決算報告？","o":["一個月","二個月","三個月","四個月"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":58,"s":2,"n":69,"t":"有關證券投資信託基金保管銀行，下列敘述何者錯誤？","o":["出席股東會行使表決權","辦理有價證券之買賣交割","副署證券投資信託公司編製之各項月報表","擔任證券投資信託基金收益分配之給付人及扣繳義務人"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":58,"s":2,"n":70,"t":"境外外國機構投資人持有公開發行公司五十萬股者，應如何行使表決權？","o":["應一律親自出席參與表決","應由外國保管機構出席參與表決","得指派國內代理人或代表人以外之人出席","應一律以通訊投票方式參與表決"],"a":"3","tp":"外資全球保管與代理登記","note":""},{"p":58,"s":2,"n":71,"t":"有關集合管理運用帳戶受益權單位之淨資產價值，除約定條款另有規定外，其計算頻率為何？","o":["每一營業日","每週","每月","每季"],"a":"1","tp":"集合帳戶投資限制與流動性","note":""},{"p":58,"s":2,"n":72,"t":"信託業應將集合管理運用帳戶終止之清算及分配之方式，於清算程序終結後至遲多久內將處理結果函報主管機關備查並通知受益人？","o":["一個月","二個月","三個月","四個月"],"a":"2","tp":"集合帳戶受益權淨值與退出","note":""},{"p":58,"s":2,"n":73,"t":"證券投資信託基金保管銀行之更換，關於新保管銀行之指定，下列敘述何者正確？","o":["由原保管機構指定","由財政部指定","由中央銀行指定","得經受益人大會之決議為之"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":58,"s":2,"n":74,"t":"有關信託業辦理信託資金集合管理帳戶會計制度之敘述，下列何者錯誤？","o":["信託業就各個帳戶，應以分別記帳方式管理之","集合管理運用帳戶因管理運用所生之稅捐，信託業得自該帳戶之信託財產中扣除支應","集合管理運用帳戶信託財產之淨資產價值計算標準應由銀行公會擬訂報請財政部核定","信託業就各個帳戶分別造具帳簿備查"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":58,"s":2,"n":75,"t":"依據信託公會之自律規範，信託業辦理特定金錢信託時，其自對手取得之信託報酬費率若以區間揭露方式記載於信託契約，則於實際費率低於區間下限時，信託業應如何處理？","o":["無須特別通知委託人","應函報主管機關備查","應取得委託人之同意","應留存紀錄並通知委託人"],"a":"1","tp":"金錢信託分類權限與運用","note":""},{"p":58,"s":2,"n":76,"t":"有關信託業務經營規定之敘述，下列何者錯誤？","o":["特定金錢信託之受託人對信託財產不具有運用決定權","保管銀行業務係屬信託業附屬業務","依現行規定，信託業應提存至少新臺幣五千萬元之賠償準備金","有價證券信託係採形式讓渡課稅原則"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":58,"s":2,"n":77,"t":"許先生與乙銀行簽訂信託契約辦理金錢信託，指定將新臺幣一百萬元投資於ABC 境外基金，下列敘述何者錯誤？","o":["就乙銀行而言，新臺幣一百萬元為信託資金","就該基金公司而言，乙銀行為信託委託人","就許先生而言，乙銀行為受託人","就乙銀行而言，其持有之ABC 境外基金受益權單位為信託財產"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":78,"t":"為保障投資人權益，「境外基金管理辦法」規範投資人須知倘有更新或修正，下列何者應就相關事項經由主管機關指定之資訊傳輸系統進行傳輸公告？","o":["銷售機構","總代理人","台灣證券交易所","台灣證券集保公司"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":79,"t":"ABC 壽險公司與XYZ 銀行簽訂信託契約並交付新臺幣五十億元獨立設帳投資於國外有價證券，信託資金之運用由ABC 壽險公司選定國外經理公司並給予概括指示由其負責運用，此於信託分類上係屬於下列何者？","o":["指定單獨管理金錢信託","特定單獨管理金錢信託","指定單獨管理有價證券信託","特定單獨管理有價證券信託"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":58,"s":2,"n":80,"t":"有關企業員工持股信託業務，下列敘述何者錯誤？","o":["屬於一種準集團信託","員工得自由參加企業員工持股信託","員工持股會為非法人團體","因其投資標的為該公司之股票，故非屬金錢信託"],"a":"4","tp":"員工福利信託特性與制度","note":""},{"p":59,"s":1,"n":1,"t":"有關受託人對信託財產的管理及處分，下列敘述何者正確？","o":["以信託財產代理人之名義為之","是信託財產對外唯一有管理及處分權之人","對信託財產無直接支配之權利","因管理或處分信託財產所生之權利義務，直接及於委託人或受益人"],"a":"2","tp":"受託人義務報酬與責任","note":""},{"p":59,"s":1,"n":2,"t":"下列敘述何者正確？","o":["信託關係因委託人或受託人之死亡而消滅","信託行為有害於委託人之債權人權利者，其信託無效","以股票或公司債為信託者，僅於證券上載明其為信託財產，即可對抗發行公司","信託成立後六個月內，委託人受破產之宣告者，推定其信託行為有害及債權"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":59,"s":1,"n":3,"t":"法人為增進公共利益，經決議對外宣言自為委託人及受託人，係屬於下列何種信託？","o":["無效之信託","遺囑信託","自益信託","宣言信託"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":59,"s":1,"n":4,"t":"黃小姐交付一筆金錢予其債權人楊先生，欲成立以清償該債務為目的之信託，而此舉不符信託成立之法則為何？","o":["受託人確定性","信託設立意圖確定性","信託標的確定性","受益人確定性"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":59,"s":1,"n":5,"t":"甲為委託人、乙為受託人，雙方簽訂信託契約，約定甲交付現金新臺幣一千萬元予乙，乙須將新臺幣一千萬元用於購買特定之Ａ基金，信託期間為一年，則下列敘述何者正確？","o":["信託契約未另有約定時，信託關係嗣後因甲之死亡而消滅","信託契約未另有約定時，信託關係嗣後因乙之死亡而消滅","信託契約未另有約定時，信託關係嗣後因乙之受禁治產宣告而消滅","依信託契約之約定，信託期間屆滿信託關係消滅"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":59,"s":1,"n":6,"t":"王五為委託人，將土地一筆、房屋一棟信託予受託人李四，並辦妥信託登記，請李四將其出售，出售後之價金得另購不動產出租，如未及出售該信託之房屋即失火，李四取得火險理賠金新臺幣五佰萬元，下列敘述何者正確？","o":["火險理賠金新臺幣五佰萬元不屬於信託財產","因信託財產已滅失，信託目的不能完成，信託關係消滅","王五之無擔保債權人於信託關係存續中得查封此火險理賠金","火險理賠金新臺幣五佰萬元仍屬於信託財產"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":59,"s":1,"n":7,"t":"除信託契約另有訂定外，他益信託財產之管理方法，得經下列何者之同意而變更？","o":["委託人及受益人即可","受益人及受託人即可","委託人及受託人即可","委託人、受託人及受益人"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":59,"s":1,"n":8,"t":"有關信託法中所定受託人之權利，下列何者錯誤？","o":["請求信託報酬之權利","請求享有信託財產利益之權利","留置信託財產之權利","請求因處理信託事務所受損害補償之權利"],"a":"2","tp":"受託人義務報酬與責任","note":""},{"p":59,"s":1,"n":9,"t":"依信託法規定，同一信託之受託人有數人時，下列敘述何者錯誤？","o":["信託財產為全體受託人公同共有","受託人意思不一致時，信託事務之處理，應得受益人全體之同意","受託人因信託行為對受益人負擔之債務應以自有財產負連帶清償責任","受託人對受益人因信託行為負擔之債務僅於信託財產限度內負連帶清償責任"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":59,"s":1,"n":10,"t":"受託人係為他人管理或處分信託財產時，受託人就信託財產或處理信託事務，得行使抵充權，下列何者不是抵充權之範圍？","o":["受託人處理信託事務所支出之稅捐","受託人處理信託事務所支出之費用","受託人處理信託事務所負擔之債務","受託人收取信託報酬應繳納之稅費"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":59,"s":1,"n":11,"t":"受託人依信託契約約定，使第三人代為處理信託事務，就該第三人之責任為何？","o":["負選任及監督之責","僅負選任之責","僅負監督之責","負選任、監督及該第三人處理結果如有損害亦負連帶責任"],"a":"1","tp":"受託人義務報酬與責任","note":""},{"p":59,"s":1,"n":12,"t":"依信託法規定，受託人經下列何者之書面同意，並依市價取得者，得將信託財產轉為自有財產？","o":["委託人","其他受託人","受益人","信託監察人"],"a":"3","tp":"財產獨立性與強制執行","note":""},{"p":59,"s":1,"n":13,"t":"公益信託之受託人有為違背其職務之行為時，委託人得向下列何機關申請將其解任？","o":["法院","檢察機關","警察機關","目的事業主管機關"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":59,"s":1,"n":14,"t":"下列何者非為公益信託設立之方式？","o":["契約","遺囑","宣言","法院之命令"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":59,"s":1,"n":15,"t":"信託行為有害於委託人之債權人權利者，委託人之債權人得行使下列何種權利？","o":["抵銷權","撤銷權","代位權","形成權"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":59,"s":1,"n":16,"t":"信託監察人之設置目的，在於保護下列何者之利益？","o":["委託人","受託人","受益人","債權人"],"a":"3","tp":"信託監察人","note":""},{"p":59,"s":1,"n":17,"t":"下列何者非為信託監察人得為受益人行使之權利？","o":["請求法院增減受託人報酬","聲請法院變更信託財產管理方法","代受益人行使拋棄信託利益之權利","對違反規定所為強制執行提起異議之訴"],"a":"3","tp":"信託監察人","note":""},{"p":59,"s":1,"n":18,"t":"有關信託監督機關之敘述，下列何者錯誤？","o":["營業信託由信託業主管機關監督","宣言信託由法院監督","公益信託由目的事業主管機關監督","民事信託中之私益信託由法院監督"],"a":"2","tp":"設立能力與監督管轄","note":""},{"p":59,"s":1,"n":19,"t":"胡小姐將價值500 萬元之A 公司股票信託予甲銀行，在股票交付信託並公示登記十年後，胡小姐向乙銀行貸款400 萬元，向丙銀行貸款300 萬元，逾期均未償還，就胡小姐在甲銀行之信託財產，下列敘述何者正確？","o":["乙銀行聲請強制執行，甲銀行不得異議","丙銀行聲請強制執行，乙銀行可提起異議之訴","乙銀行聲請強制執行，胡小姐可提起異議之訴","乙銀行與丙銀行共同聲請強制執行，甲銀行不得異議"],"a":"3","tp":"財產獨立性與強制執行","note":""},{"p":59,"s":1,"n":20,"t":"有關信託資金之敘述，下列何者為錯誤？","o":["委託人可以交付現金為信託財產","信託財產之管理運用應依照信託契約辦理","信託財產之管理方法絕對不得變更","受託人死亡時，信託財產不屬於其遺產"],"a":"3","tp":"終止變更與剩餘財產歸屬","note":""},{"p":59,"s":1,"n":21,"t":"依信託業法規定，信託業之組織，除兼營信託業務之銀行外，原則上限於下列何種公司？","o":["股份有限公司","有限公司","無限公司","上市公司"],"a":"1","tp":"經營組織與兼營獨立","note":""},{"p":59,"s":1,"n":22,"t":"下列何者適用信託業法全部法條？","o":["兼營信託業務之銀行","證券業","都市更新投資信託公司","保險公司"],"a":"1","tp":"經營組織與兼營獨立","note":""},{"p":59,"s":1,"n":23,"t":"有關銀行經營信託業務，下列敘述何者錯誤？","o":["應指撥營運資金專款經營","信託財產管理處分之資料得由銀行信託業務專責部門或其他部門控管","關於客戶之往來、交易資料，除其他法律或主管機關另有規定外，應保守秘密","應設立信託財產評審委員會，將信託財產每三個月評審一次，並將評審結果報告董事會"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":24,"t":"依信託業法規定，有關信託業經營信託業務之敘述，下列何者錯誤？","o":["經全體受益人之書面同意，得將信託財產讓售與本身或其利害關係人","不得以信託財產購買本身或其利害關係人發行之有價證券或票券","於事先取得受益人之書面同意，得以信託財產購買其銀行業務部門經紀之有價證券或票券","於事先取得受益人之書面同意，得以信託財產存放於其銀行業務部門或其利害關係人處作為存款"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":25,"t":"信託業得經營之附屬業務項目中，不包括下列何者？","o":["辦理保證業務","代理有價證券紅利之發放事項","擔任公司重整監督人","辦理與信託業務有關不動產買賣及租賃之居間"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":26,"t":"依信託業法規定，有關信託資金之性質，下列何者正確？","o":["保本","保息","保本保息","不保本不保息"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":27,"t":"甲與乙簽訂信託契約，由甲將公司債交付信託，公司債到期兌領後轉為金錢，金錢即成為信託財產，此一信託屬於下列何種信託？","o":["金錢信託","金錢債權信託","有價證券信託","動產信託"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":59,"s":1,"n":28,"t":"信託業經營之業務涉及外匯之經營者，須經下列何者同意？","o":["財政部","信託公會","銀行公會","中央銀行"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":29,"t":"依信託業法規定，有關對信託財產具有運用決定權者兼任其他業務之規定為何？","o":["不得兼任其他業務之經營","經委託人同意得兼任投資業務","可以兼任證券及票券等業務","經受益人同意得兼任銀行業務之經營"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":59,"s":1,"n":30,"t":"信託財產運用所生之收益及損失應由下列何者享受與承擔？","o":["受託人","委託人","受益人","從信託契約之約定"],"a":"3","tp":"委託人權利與信託標的","note":""},{"p":59,"s":1,"n":31,"t":"信託業之董事違反法令，致受益人受有損害者，應由下列何人負損害賠償之責？","o":["由信託業單獨負損害賠償之責，與該董事無關","該董事與信託業不須負損害賠償責任","由該董事與信託業負連帶賠償責任","由董事單獨負損害賠償之責，與信託業無關"],"a":"3","tp":"評審委員會與內部職責","note":""},{"p":59,"s":1,"n":32,"t":"銀行經營信託業務之風險管理，下列敘述何者錯誤？","o":["銀行經營信託業務其營業及會計須獨立","信託財產運用於存款者，不受存款保險之保障","銀行辦理信託業務專責部門之營業場所應與銀行其他部門區隔","信託業務與銀行其他業務間之共同行銷，不得有利害衝突之行為"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":33,"t":"信託業法所定之罰鍰，經限期繳納而受罰人逾期不繳者，自逾期之日起，每日加收之滯納金為何？","o":["罰鍰之1%","罰鍰之2%","罰鍰之3%","罰鍰之5%"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":59,"s":1,"n":34,"t":"有關信託業募集共同信託基金應遵守之相關規定，下列敘述何者正確？","o":["得從事證券信用交易","須指定保管銀行保管信託財產","本身管理之各共同信託基金間得互為交易","信託業應具備主管機關認可之信用評等機構評等達一定等級以上始得申請募集"],"a":"4","tp":"共同信託基金募集與運用","note":""},{"p":59,"s":1,"n":35,"t":"信託業因業務或財務狀況顯著惡化，不能支付其債務或有損及委託人或受益人利益之虞時，主管機關得為之處置，下列敘述何者正確？","o":["主管機關得命其將信託契約提前終止並將其信託財產移轉於受益人","主管機關得命其將信託契約及其信託財產移轉於經該信託業指定之其他信託業","主管機關得命其將信託契約及其信託財產移轉於經信託公會指定之其他信託業","主管機關得命其將信託契約及其信託財產移轉於經主管機關指定之其他信託業"],"a":"4","tp":"監理處分罰則與損害賠償","note":""},{"p":59,"s":1,"n":36,"t":"信託業有更換總經理之情事者，最遲應於多久期間內向主管機關申報？","o":["應於事實發生之翌日起二個營業日內","應於事實發生之日起二日內","應於事實發生之翌日起五日內","應於事實發生之日起五個營業日內"],"a":"1","tp":"監理處分罰則與損害賠償","note":""},{"p":59,"s":1,"n":37,"t":"依信託業法規定，信託業負責人應具備之資格條件，由下列何者定之？","o":["信託業商業同業公會","金融監督管理委員會","經濟部","中央銀行"],"a":"2","tp":"人員資格訓練與利益限制","note":""},{"p":59,"s":1,"n":38,"t":"信託公司經核發營業執照後，滿多久期間尚未開始營業者，除有正當理由經主管機關核准者外，主管機關應廢止其設立之許可？","o":["二個月","三個月","六個月","十二個月"],"a":"3","tp":"設立標準與分支機構","note":""},{"p":59,"s":1,"n":39,"t":"不指定營運範圍或方法之金錢信託，除經主管機關核准外，其營運範圍不包括下列何者？","o":["銀行存款","金融債券","受益憑證","短期票券"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":59,"s":1,"n":40,"t":"有關信託業就所從事之信託業務為廣告等活動時，下列敘述何者錯誤？","o":["除主管機關另有規定外，不得提供贈品","以獲利為廣告者，必須同時報導其風險，以作為平衡報導","不得以經主管機關核准信託業務之開辦，作為受益權價值保證","廣告內容於對外使用前僅須經風控主管審核確定內容無不當之情事"],"a":"4","tp":"行銷訂約與風險揭露","note":""},{"p":59,"s":1,"n":41,"t":"有關信託業之會計處理原則，下列敘述何者錯誤？","o":["應由銀行公會報請主管機關核定之","自有帳會計處理原則應依主管機關規定及一般公認會計原則辦理","信託資產與信託負債之認列、評價，除主管機關另有規定外，應依一般公認會計原則處理","除法令另有規定者外，應依「信託業會計處理原則辦理」；未規定者，依一般公認會計原則辦理"],"a":"1","tp":"財產評審報告與會計公告","note":""},{"p":59,"s":1,"n":42,"t":"依信託業應負之義務及相關行為規範，有關信託業之資訊揭露及定期報告，下列敘述何者錯誤？","o":["應依規定通知委託人及受益人各項信託相關事宜","應每一年營業年度將其資產負債表以規定方式公告","資產負債表公告方式，得為於所在地日報公告或備置於每一營業處所及金管會指定網站","應依規定分別向委託人及受益人定期為信託財產管理運用之報告"],"a":"2","tp":"行銷訂約與風險揭露","note":""},{"p":59,"s":1,"n":43,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，證券商為開辦兼營信託業務之特定項目，其應於開辦前完成之事項，下列敘述何者錯誤？","o":["換發營業執照或許可證照","提存賠償準備金","於主管機關指定網站完成新增營業項目之登錄","經中華民國銀行公會同意入會"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":59,"s":1,"n":44,"t":"信託業對委託人或受益人有虛偽、詐欺或其他足致他人誤信之行為時，依信託業法規定，其行為負責人應受之罰則，下列何者正確？","o":["處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金","處一年以上七年以下有期徒刑或科或併科新臺幣一千萬元以下罰金","處二年以上五年以下有期徒刑或科或併科新臺幣二千萬元以下罰金","處三年以上十年以下有期徒刑或科或併科新臺幣三千萬元以下罰金"],"a":"2","tp":"監理處分罰則與損害賠償","note":""},{"p":59,"s":1,"n":45,"t":"土地為信託財產者，應課徵土地增值稅之情形，下列何者正確？","o":["信託關係成立，委託人移轉信託財產於受託人時","因信託行為被撤銷，受託人移轉信託財產於委託人時","信託關係存續中，受託人將信託財產移轉為其自有財產時","信託關係存續中，受託人變更，原受託人移轉信託財產於新受託人時"],"a":"3","tp":"土地稅與土地增值稅","note":""},{"p":59,"s":1,"n":46,"t":"信託導管理論係以下列何者為課稅主體？","o":["信託財產","信託財產之所有權人","信託原始委託人","信託利益或財產之實質權利人"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":59,"s":1,"n":47,"t":"因遺囑成立之信託，其受益人取得土地信託財產再移轉時，計算土地漲價總數額，依下列何者認定前次移轉地價？","o":["依遺囑人死亡日當期之公告土地現值","依遺囑成立時之首期公告土地現值","依繼承人取得土地時之首期公告土地現值","依被繼承人取得土地時之首期公告土地現值"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":59,"s":1,"n":48,"t":"有關所得稅之課徵，下列何者不是採信託利益實際分配時課稅原則？","o":["共同信託基金","證券投資信託基金","其他經主管機關核准之信託基金","集合管理運用帳戶"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":59,"s":1,"n":49,"t":"受益人不特定或尚未存在時，信託財產發生之收入，應以受託人為納稅義務人，於當年度依規定扣繳率申報納稅，現行規定之扣繳率為多少？","o":["百分之六","百分之十","百分之十五","百分之二十"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":59,"s":1,"n":50,"t":"委託人甲將其名下之房屋交付信託，約定信託期間十年，十年間房屋租金歸乙，十年後房屋亦移轉登記為乙所有，關於此案之契稅課徵，下列敘述何者正確？","o":["委託人甲應於信託成立時繳納","由受託人於信託期間繳納","信託期滿，受託人移轉房屋給受益人乙時，由委託人甲繳納","信託期滿，受託人移轉房屋給受益人乙時，由受益人乙繳納"],"a":"4","tp":"房屋稅與契稅","note":""},{"p":59,"s":2,"n":1,"t":"下列何者非屬「預收款信託」","o":["禮券","抵用券","電子票證","生前契約"],"a":"2","tp":"預收款禮券與履約保障","note":""},{"p":59,"s":2,"n":2,"t":"有關信託業擔任證券投資基金銷售機構之敘述，下列何者正確？","o":["應與投資人簽訂銷售契約","得與投資人簽訂特定金錢信託契約","各項憑證之保存方式及期限得由銷售機構自行訂定","無論如何均不得以自己名義為投資人申購證券投資信託基金"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":59,"s":2,"n":3,"t":"依信託業商業同業公會會員辦理信託業務之信託報酬及風險揭露應遵循事項規定，下列何者非屬信託業辦理特定金錢信託業務投資結構型商品對委託人應揭露之基本風險？","o":["信用風險","利率風險","本金轉換風險","流動性風險"],"a":"3","tp":"結構型商品與衍生性金融商品","note":""},{"p":59,"s":2,"n":4,"t":"銀行辦理特定金錢信託投資國外有價證券業務，其營運範圍應由下列何者指定？","o":["委託人","受託人","受益人","信託監察人"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":59,"s":2,"n":5,"t":"依境外基金管理辦法及相關規定，境外基金除股票指數型基金外，有關其從事衍生性商品交易，下列敘述何者錯誤？","o":["為避險需要，可持有衍生性商品","衍生性商品僅限持有期貨一種","為增加投資效率，
