","tp":"REIT募集投資標的與限制","note":""},{"p":59,"s":2,"n":41,"t":"受託機構運用不動產投資信託基金購置不動產時，應委請專業估價者出具估價報告書，應符合相關規定，而下列規定何者錯誤？","o":["同一宗交易金額達三億元以上者，應由二位專業估價者進行估價","交易契約成立日前估價者，其價格日期與契約成立日期不得逾六個月","專業估價者與交易當事人無財務會計準則公報所定之關係人或實質關係人之情事","專業估價者間在同一期日價格之估價達百分之二十以上差異，受託機構得採平均值為交易價格"],"a":"4","tp":"REIT募集投資標的與限制","note":""},{"p":59,"s":2,"n":42,"t":"不動產資產信託之委託人為受託機構之利害關係人時，如委託人有數人，且有利害關係之委託人就信託財產所占持分及持有擔保物權持分之合計比率未達多少時，例外允許其發行受益證券？","o":["百分之二十","百分之三十","百分之四十","百分之五十"],"a":"1","tp":"REAT資產信託與證券發行","note":""},{"p":59,"s":2,"n":43,"t":"有關不動產證券化特性之敘述，下列何者錯誤？","o":["投資金額較低","權益具不可分割性","營運透明化","經營專業化"],"a":"2","tp":"不動產證券化共通規定","note":""},{"p":59,"s":2,"n":44,"t":"不動產投資信託基金因受託機構之管理而獲致收入，其應分配信託利益予受益人時，採下列何種課稅方式？","o":["併入受益人綜合所得稅總額或營利事業所得","採分離課稅，稅率6%","得由受益人自行決定採合併申報或分離課稅","採分離課稅，稅率10%"],"a":"4","tp":"證券化商品分離課稅與交易稅","note":""},{"p":59,"s":2,"n":45,"t":"有關不動產投資信託基金投資於開發型之不動產或不動產相關權利時，下列敘述何者正確？","o":["於領得使用執照後，始得動用該基金款項","投資標的為都市更新條例核定之土地、建築","投資標的為促進民間參與都市更新法所稱公共建設","投資標的物為其他經不動產管理機構核准投資或運用的標的"],"a":"2","tp":"REIT募集投資標的與限制","note":""},{"p":59,"s":2,"n":46,"t":"有關不動產證券化條例對不動產證券化之限制，下列何者錯誤？","o":["以信託為架構","限制借出款上限","政府參與監督","制訂利害關係人迴避原則"],"a":"2","tp":"不動產證券化共通規定","note":""},{"p":59,"s":2,"n":47,"t":"依金融資產證券化條例規定，下列何者非屬特殊目的公司得辦理之業務？","o":["特定資產之管理處分","發行資產基礎證券","受讓金融資產等特定資產","兼營其他非資產證券化業務"],"a":"4","tp":"特殊目的信託公司與參與機構","note":""},{"p":59,"s":2,"n":48,"t":"下列何者非屬金融資產證券化之效益？","o":["提高金融資產之流動性","降低資金調度之成本","改善不良授信政策","提供投資人多元化之投資工具"],"a":"3","tp":"證券化特性與經濟效益","note":""},{"p":59,"s":2,"n":49,"t":"下列何者為特殊目的信託之受託機構依資產信託證券化計畫所發行，以表彰受益人享有該信託資產本金或其所生利益、 孳息及其他收益之受益權持分之權利憑證或證書？","o":["受益憑證","信託憑證","受益證券","資產基礎證券"],"a":"3","tp":"特殊目的信託公司與參與機構","note":""},{"p":59,"s":2,"n":50,"t":"有關金融資產證券化受益證券之敘述，下列何者正確？","o":["受益證券得為記名式或無記名式","受益證券不得以帳簿劃撥方式交付","實體受益證券免經簽證機構簽證","受益證券喪失時，受益人得為公示催告之聲請"],"a":"4","tp":"受益證券募集發行與受益人會議","note":""},{"p":59,"s":2,"n":51,"t":"有關金融資產證券化之信用增強機制，下列何者性質上屬於外部增強機制？","o":["利差帳戶","更換部分資產","現金準備帳戶","由金融機構提供保證"],"a":"4","tp":"信用增強評等與風險分散","note":""},{"p":59,"s":2,"n":52,"t":"創始機構為進行金融資產證券化，使其金融資產之轉移，取得對抗債務人之效力，下列敘述何者錯誤？","o":["依民法規定，通知債務人者","向債務人寄發已為金融資產證券化條例所定公告之證明書者","創始機構與債務人於契約約定不另行通知或寄發公告之證明書者","創始機構仍受受託機構之委任，而擔任服務機構者，負責向債務人收取債權，並已依規定為公告者"],"a":"3","tp":"特殊目的信託公司與參與機構","note":""},{"p":59,"s":2,"n":53,"t":"有關金融資產證券化的特性，下列敘述何者錯誤？","o":["由特殊目的機構發行有價證券","信用評等之基礎為創始機構","創始機構應移轉資產予特殊目的機構","投資人之收益來自特定金融資產之現金流量"],"a":"2","tp":"證券化特性與經濟效益","note":""},{"p":59,"s":2,"n":54,"t":"依金融資產證券化條例規定，有關特殊目的公司之組織型態，下列何者正確？","o":["股份有限公司","有限公司","兩合公司","無限公司"],"a":"1","tp":"特殊目的信託公司與參與機構","note":""},{"p":59,"s":2,"n":55,"t":"主管機關得隨時派員檢查資產證券化計畫之執行狀況，檢查的對象不包括下列何者？","o":["創始機構","受託機構","服務機構","私募之特定受益人"],"a":"4","tp":"證券化計畫與其他制度","note":""},{"p":59,"s":2,"n":56,"t":"以委任關係辦理全權委託投資業務者，全權委託保管機構應由下列何者指定？","o":["委任人","受託人","受任人","主管機關"],"a":"1","tp":"全權委託保管與越權交易","note":""},{"p":59,"s":2,"n":57,"t":"有關擔任證券投資信託基金保管機構之資格，下列敘述何者錯誤？","o":["須為銀行法所稱之銀行或信託業法所稱之信託業","須為擔任證券投資信託事業董事或監察人之銀行","須為經Moody’s Investors Service 評等者，其長期債務信用評等應達Baa3 級（含）以上","除經主管機關核准者外，不得為投資於證券投資信託事業已發行股份總數百分之十以上股份之銀行"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":59,"s":2,"n":58,"t":"有關擔任僑外資保管機構提供之服務，下列何者錯誤？","o":["證券商之開戶","交易之確認","結匯之申請","應於每月終了七日內申報資料"],"a":"4","tp":"外資全球保管與代理登記","note":""},{"p":59,"s":2,"n":59,"t":"有關證券投資信託基金收益分配，下列敘述何者錯誤？","o":["由投信公司擔任基金收益分配扣繳義務人","每次分配之總金額存入「○○基金可分配收益專戶」","可分配收益存入其專戶後即不再視為基金資產之一部分","依證券投資信託契約約定應分配收益除經主管機關核准外，應於會計年度終了後六個月內分配"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":59,"s":2,"n":60,"t":"有關保管機構辦理證券投資信託基金交割作業，發生存款不足交割時，下列敘述何者正確？","o":["得抵用待交換票據","不得抵用待交換票據","保管機構為完成交割可代墊款項","保管機構為完成交割可通知證券投資信託公司代墊款項"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":59,"s":2,"n":61,"t":"全權委託投資之保管銀行如認為受任人有越權交易且無法即時協商解決時，至遲應於何時出具越權交易通知書？","o":["成交日次一營業日上午十時前","成交日次一營業日上午十一時前","成交日次二營業日上午十時前","成交日次二營業日上午十一時前"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":59,"s":2,"n":62,"t":"有關全權委託投資業務以委任關係辦理者，下列敘述何者正確？","o":["三方權義協定書係由委任人、證券商及保管機構所簽訂","委託投資資金最低限額目前為新臺幣二千萬元","同一委任人之不同全權委託投資帳戶，於辦理買賣交割時，不得相互辦理款券轉撥","保管機構簽訂委託投資契約前，應先審核委任契約約定範圍"],"a":"3","tp":"全權委託保管與越權交易","note":""},{"p":59,"s":2,"n":63,"t":"有關僑外資投資國內有價證券之資金結匯申請，下列何者需由其委託國內代理人檢附繳納稅捐之證明文件或稽徵機關出具之完稅證明代理結匯之申請？","o":["投資本金之匯出款項","投資收益之匯出款項","投資額度內之匯入款項","超過投資額度之匯入款項"],"a":"2","tp":"所得稅與扣繳","note":""},{"p":59,"s":2,"n":64,"t":"保管機構辦理全權委託投資之保管業務時，應將其每月最後營業日製作之委任人投資保管帳戶有價證券明細表，至遲於次月幾日內交付委任人？","o":["三個營業日","五個營業日","七個營業日","十個營業日"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":59,"s":2,"n":65,"t":"依我國相關法令規定，下列何者得不另指定保管銀行保管？","o":["期貨商依規定繳存之營業保證金","投資型保險商品專設帳簿之資產","為發行海外存託憑證而提存之有價證券","信託業辦理有價證券信託之有價證券"],"a":"4","tp":"其他資產保管與營業保證金","note":""},{"p":59,"s":2,"n":66,"t":"退撫基金釋出二十億元之額度，分別由甲、乙兩證券投資信託公司得標而為其操盤，同時皆選定丙為保管機構，則丙應如何設帳？","o":["因委任人相同，故甲、乙合併設帳","因保管機構相同，故不須獨立設帳","針對甲、乙個別獨立設帳","須設立甲、乙、丙、退撫基金四個帳戶"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":59,"s":2,"n":67,"t":"證券投資信託契約終止時，原則上，清算人應於主管機關核准清算後多久完成證券投資信託基金之清算？","o":["三個月內","五個月內","六個月內","一年內"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":59,"s":2,"n":68,"t":"有關全權委託投資有價證券之保管銀行作業，當受任人之交割指示函發生越權交易時，下列敘述何者正確？","o":["所產生利益歸屬客戶","所產生損失由客戶負擔","交易稅費由保管機構負擔","保管機構無代理客戶向受任人追償之權限"],"a":"1","tp":"全權委託保管與越權交易","note":""},{"p":59,"s":2,"n":69,"t":"擔任證券投資信託基金保管機構，其信用評等如係經Standard & Poor’s Corp.評定者，其長期債務信用評等至少應達下列何種等級以上？","o":["BBB","BBB-","A-3","A-2"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":59,"s":2,"n":70,"t":"依信託資金集合管理運用管理辦法之相關規定，有關集合管理運用帳戶之敘述，下列何者錯誤？","o":["受託人就營運範圍或方法相同之信託資金為集合管理運用，不得另收信託報酬","信託財產應以信託業之信託財產名義表彰之","拒絕受益人退出集合管理運用帳戶時，應於事前報請主管機關核備","應與委託人簽訂信託契約及集合管理帳戶約定條款"],"a":"3","tp":"單獨及集合管理分類與權限","note":""},{"p":59,"s":2,"n":71,"t":"依集合管理運用金錢信託流動性資產範圍及比率準則規定，集合管理運用帳戶持有現金及銀行存款、公債、短期票券及其他經主管機關洽中央銀行同意之資產合計占所設置個別集合管理運用帳戶資產價值之最低比率為多少？","o":["百分之三","百分之五","百分之七","百分之十"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":59,"s":2,"n":72,"t":"信託資金集合管理運用帳戶之約定條款除另有約定者外，信託業應多久就各集合管理運用帳戶分別計算其每一信託受益權之淨資產價值？","o":["每一個營業日","每二個營業日","每三個營業日","每五個營業日"],"a":"1","tp":"集合帳戶投資限制與流動性","note":""},{"p":59,"s":2,"n":73,"t":"依信託資金集合管理運用管理辦法之規定，信託業設置指定信託資金集合管理帳戶，有關其得投資之標的與運用之敘述， 下列何者正確？","o":["得運用於存款，所存放之金融機構應經主管機關認可之信用評等機構評等達一定等級以上","得投資於任何一種公司債，不受限制","得辦理放款或提供擔保","購買上市公司股票時得從事證券信用交易"],"a":"1","tp":"集合帳戶投資限制與流動性","note":""},{"p":59,"s":2,"n":74,"t":"有關信託業設置之集合管理運用帳戶終止方式，下列敘述何者錯誤？","o":["依約定條款之規定終止","由信託監察人報請主管機關核准終止","信託業主管機關命令終止","中華民國信託業商業同業公會命令終止"],"a":"4","tp":"集合帳戶申請設置與合併","note":""},{"p":59,"s":2,"n":75,"t":"依信託資金集合管理運用管理辦法及其相關規定，除經主管機關核定外，集合管理運用帳戶所得持有之流動性資產範圍， 不包括下列何者？","o":["公債","短期票券","上市公司股票","現金及銀行存款"],"a":"3","tp":"集合帳戶投資限制與流動性","note":""},{"p":59,"s":2,"n":76,"t":"甲客戶與乙銀行簽訂特定金錢信託契約，並指示投資丙基金公司之國外基金，則甲客戶與乙銀行、丙基金公司間之關係， 下列敘述何者正確？","o":["甲與乙間為信託關係","甲與丙間為信託關係","甲與乙、丙皆為委任關係","甲與乙、丙皆為信託關係"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":59,"s":2,"n":77,"t":"依證券交易相關稅法規定，下列何者不須課徵證券交易稅？","o":["受託人將信託財產中之有價證券轉為自有財產","受託人將信託財產中之有價證券出售予第三人","受託人於信託終了將有價證券移轉返還委託人","受託人將信託財產中之有價證券轉為受託人其他信託財產中之有價證券"],"a":"3","tp":"證券交易稅","note":""},{"p":59,"s":2,"n":78,"t":"除特定金錢信託業務外，依規定，銷售機構以自己名義為投資人投資時，應經由下列何者指定之銀行專戶辦理？","o":["金管會","中央銀行","證券集中保管事業","總代理人"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":59,"s":2,"n":79,"t":"有關不動產證券化之敘述，下列何者錯誤？","o":["不動產資產信託性質上屬於金錢信託","僅辦理不動產資產信託之信託業，最低實收資本額為新臺幣三億元","僅辦理不動產投資信託之信託業，最低實收資本額為新臺幣十億元","不動產證券化受益證券分為向不特定人募集發行及向特定人私募二種"],"a":"1","tp":"不動產證券化共通規定","note":""},{"p":59,"s":2,"n":80,"t":"依境外基金管理辦法規定，境外基金從事衍生性商品交易，持有未沖銷空頭部位價值之總金額，不得超過該基金持有之相對應有價證券總市值多少比率？","o":["50%","75%","85%","100%"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":60,"s":1,"n":1,"t":"依信託法規定，法人為下列何種目的，經目的事業主管機關許可，得經決議對外宣言自為委託人及受託人成立宣言信託？","o":["為增資之目的","為財產管理之目的","為風險管理之目的","為增進公共利益之目的"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":60,"s":1,"n":2,"t":"依信託法規定，下列敘述何者錯誤？","o":["受託人死亡時，信託財產不屬於其遺產","受託人破產時，信託財產不屬於其破產財團","不管任何原因，信託財產絕對不得強制執行","屬於信託財產之債權與不屬於該信託財產之債務不得相互抵銷"],"a":"3","tp":"財產獨立性與強制執行","note":""},{"p":60,"s":1,"n":3,"t":"財產所有人將其財產權登記為他人所有，惟並未賦予他人管理或處分該財產權限之情形，是否屬於信託法上之信託關係？","o":["屬於信託關係","以信託關係論","視為信託關係","非為信託關係"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":60,"s":1,"n":4,"t":"有關信託設立之敘述，下列何者錯誤？","o":["一般民事信託屬要式行為","營業信託屬要式行為","我國契約信託為雙方行為","英美信託法理為單方行為"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":60,"s":1,"n":5,"t":"信託關係消滅時，於受託人移轉信託財產於歸屬權利人前，信託關係視為存續，該信託關係屬下列何者？","o":["契約信託","遺囑信託","宣言信託","法定信託"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":60,"s":1,"n":6,"t":"下列何者不得為信託標的之財產？","o":["建築改良物","債權","著作權","純債務"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":60,"s":1,"n":7,"t":"信託行為中未訂定受益人所得享有信託利益之比例時，下列敘述何者正確？","o":["依受益人數平均分配","由受益人自行議定","由受託人決定","由法院判定"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":60,"s":1,"n":8,"t":"他益信託情形下，有關信託財產管理方法之變更，下列敘述何者錯誤？","o":["得經委託人、受託人及受益人之同意變更","委託人死亡時，其繼承人得承繼行使該權利","委託人死亡後，僅需受託人與受益人同意即可","委託人、受益人或受託人得聲請法院變更之"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":60,"s":1,"n":9,"t":"下列何者不屬於委託人之義務？","o":["親自處理信託事務","將其財產權移轉或處分予受託人","給付信託報酬予受託人","於不利於受託人之時期任意終止信託時，對受託人負損害賠償責任"],"a":"1","tp":"委託人權利與信託標的","note":""},{"p":60,"s":1,"n":10,"t":"下列何者非為受託人之權利？","o":["管理或處分信託財產之權利","依法請求補償或賠償之權利","請求報酬之權利","拋棄享有信託利益之權利"],"a":"4","tp":"受託人義務報酬與責任","note":""},{"p":60,"s":1,"n":11,"t":"依信託法規定，受託人違反信託本旨處分信託財產時，受益人得聲請法院撒銷其處分，自受益人知有撤銷原因時起，多久內不行使而消滅？","o":["一年","二年","五年","十年"],"a":"1","tp":"終止變更與剩餘財產歸屬","note":""},{"p":60,"s":1,"n":12,"t":"原則上受託人不得以任何名義，享有信託利益。但有下列何種情形者，不在此限？","o":["受託人與他人為共同受益人時","受託人為信託業法所稱之信託業時","經主管機關同意者","經信託監察人同意者"],"a":"1","tp":"受益人權利與撤銷救濟","note":""},{"p":60,"s":1,"n":13,"t":"公益信託之受託人如有正當理由，應經下列何種程序始得辭任？","o":["經法院許可","經委託人及受益人同意","經信託監察人同意","經目的事業主管機關許可"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":60,"s":1,"n":14,"t":"依信託法規定，受託人妨礙法院檢查者，應處新臺幣多少之罰鍰？","o":["一萬元以上，五萬元以下","二萬元以上，五萬元以下","一萬元以上，十萬元以下","二萬元以上，十萬元以下"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":60,"s":1,"n":15,"t":"公益信託關係消滅，而無信託行為所訂信託財產歸屬權利人時，目的事業主管機關得為類似之目的，使信託關係存續，或使信託財產移轉於下列何者？","o":["政府機關","公司","自然人","有類似目的之公益法人或公益信託"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":60,"s":1,"n":16,"t":"除信託行為另有訂定外，下列何者為信託關係消滅事由之一？","o":["委託人死亡","受託人死亡","信託監察人死亡","信託目的不能完成"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":60,"s":1,"n":17,"t":"公益信託之信託關係消滅時，受託人於向目的事業主管機關申報前，其結算書及報告書應先取得下列何人之承認？","o":["信託財產歸屬權利人","委託人","受益人","信託監察人"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":60,"s":1,"n":18,"t":"有關公益信託及私益信託之比較，下列敘述何者錯誤？","o":["公益信託得以宣言之方式設立，私益信託僅限以契約或遺囑之方式設立","公益信託由目的事業主管機關監督，除營業信託外之私益信託由法院監督","公益信託必為他益信託，私益信託可為自益信託或他益信託","公益信託之受託人得依信託行為所定，或經委託人及受益人之同意辭任，私益信託之受託人有不得已之事由時，亦得聲請法院許可其辭任"],"a":"4","tp":"公益信託與監督機關","note":""},{"p":60,"s":1,"n":19,"t":"下列何種情形為遺囑信託？","o":["甲生前至銀行簽訂信託契約，並交付銀行新臺幣壹仟萬元，約明以甲之死亡為條件，待甲死亡時，該信託契約方生效","甲生前至銀行簽訂信託契約，並交付銀行新臺幣壹仟萬元，約明以甲之死亡日為信託期間之起日","甲於遺囑中指示其遺囑執行人，自其遺產中提撥伍仟萬元由遺囑執行人信託予一慈善機構","甲依法律規定之方式於遺囑中指定將其部份遺產，指定一受託人成立信託"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":60,"s":1,"n":20,"t":"依信託法規定，下列何種信託行為無效？","o":["受託人處理信託事務時，因有必要而提出訴願或訴訟","以耕地為信託財產，並以私法人為耕地所生孳息之受益人","信託行為有害於委託人之債權人權利者","以耕地為信託財產，並以私法人為耕地所有權之受益人"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":60,"s":1,"n":21,"t":"信託業之組織，除經主管機關許可兼營信託業務者外，以下列何者為限？","o":["以有限公司為限","以財團法人為限","以社團法人為限","以股份有限公司為限"],"a":"4","tp":"經營組織與兼營獨立","note":""},{"p":60,"s":1,"n":22,"t":"信託業得辦理下列何種信託業務？","o":["吸收存款","授信放款","自營買賣有價證券","特定金錢信託"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":23,"t":"銀行辦理信託業務必須優先適用下列何種法律？","o":["信託業法","銀行法","信託投資公司管理法","信託財產管理法"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":24,"t":"信託業辦理以開發為目的之土地信託經下列何者之同意，得以信託財產借入款項？","o":["信託監察人","法院","全體受益人","內政部"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":25,"t":"有關信託業具運用決定權信託財產之規定，下列何者正確？","o":["得以信託財產購買本身或其利害關係人發行之股票","得以信託財產購買本身或其利害關係人之不動產","得以股票信託財產讓售與本身或其利害關係人","不得以信託財產購買本身銀行業務部門承銷之股票"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":60,"s":1,"n":26,"t":"依信託業法規定，下列何者不是信託業之利害關係人？","o":["持有信託業已發行股份總數百分之十者","擔任兼營信託業務銀行之負責人","對信託財產具有運用決定權者","兼營信託業務銀行之持股比率為百分之三之企業"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":60,"s":1,"n":27,"t":"依信託業法規定，下列何者為信託業得經營之附屬業務項目？","o":["動產之信託","金錢債權及其擔保物權之信託","其他財產權之信託","提供投資、財務管理及不動產開發顧問服務"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":28,"t":"信託公司開始營業至少滿多久期限後，得向財政部申請設立分公司？","o":["半年","一年","三年","五年"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":60,"s":1,"n":29,"t":"信託業法所稱共同信託基金，係屬下列何種信託？","o":["金錢之信託","金錢債權之信託","有價證券之信託","動產之信託"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":60,"s":1,"n":30,"t":"有關信託業之設立及營業應依下列何種方式為之？","o":["信託業總機構，非經完成設立程序，並發給營業執照，不得開始營業。分支機構之設立則只須於營業後十天內向主管機關核備即可","信託業總機構之設立營業，不須先向主管機關申請核准。惟分支機構之增設，則應事先申請主管機關核准","信託業總機構，非經完成設立程序，並發給營業執照，不得開始營業。增設分支機構時，應向主管機關申請許可及營業執照","信託業不論係總機構或分支機構，不須於營業前申請主管機關核准，惟均應於開始營業後十天內向主管機關申請核備"],"a":"3","tp":"設立標準與分支機構","note":""},{"p":60,"s":1,"n":31,"t":"除兼營信託業務之銀行外，信託業購買自用不動產，不得超過該信託業淨值之多少百分比？","o":["百分之百","百分之五十","百分之三十","百分之五"],"a":"1","tp":"經營組織與兼營獨立","note":""},{"p":60,"s":1,"n":32,"t":"銀行經營信託業務所指撥之營運資金，並得充當下列何者？","o":["信託資金準備","流動準備","賠償準備金","存款準備金"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":34,"t":"信託業不得辦理擔保本金或最低收益率之信託，違反該規定者，應負何種責任？","o":["負刑事責任","負民事賠償責任","負民事及刑事責任","負行政處分責任"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":35,"t":"信託業辦理全權決定運用之金錢信託，如涉及證券交易法之有價證券且達一定金額時，應申請兼營下列何種業務？","o":["證券投資信託業務","期貨交易輔助人業務","資產管理業務","證券投資顧問業務"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":36,"t":"信託業辦理信託業法第十六條各款所定信託業經營之業務項目時，應依下列何項規定辦理？","o":["應送請中華民國信託業商業同業公會核定","不須檢附營業計畫書","不須檢附信託契約範本","應依信託業法第十八條，報請主管機關核定"],"a":"4","tp":"賠償準備金與盈餘分配","note":""},{"p":60,"s":1,"n":37,"t":"信託業法第十六條各款所定信託業經營之業務項目，如何定其分類？","o":["以委託人交付、移轉或為其他處分之財產種類，定其分類","以信託目的，定其分類","以交付予受益人之財產權定其分類","以信託關係消滅時，歸還予受益人之財產權定其分類"],"a":"1","tp":"賠償準備金與盈餘分配","note":""},{"p":60,"s":1,"n":38,"t":"兼營信託業之銀行虧損逾資本三分之一者，主管機關首先得採取下列何種措施？","o":["勒令停業","撤銷許可","命其補足資本","清理"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":60,"s":1,"n":39,"t":"信託業接受以股票或公司債券為信託者，應通知下列何者？","o":["發行公司","簽證機構","保管機構","主管機關"],"a":"1","tp":"登記公示與對抗效力","note":""},{"p":60,"s":1,"n":40,"t":"有關信託業辦理信託業務，得交付受益權書面證明文件予受益人之情形，下列何者錯誤？","o":["募集共同信託基金","設置集合管理運用帳戶","依不動產證券化條例募集發行受益證券","依金融資產證券化條例募集發行受益證券"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":60,"s":1,"n":41,"t":"信託業辦理政黨政治團體財產信託期間，應於每屆營業年度終了後幾個月內辦理委託人名稱及信託財產之種類等公告？","o":["四個月","六個月","七個月","八個月"],"a":"1","tp":"人員資格訓練與利益限制","note":""},{"p":60,"s":1,"n":42,"t":"有關信託受益權轉讓之敘述，除法令另有規定外，下列何者錯誤？","o":["受益人總數不得超過三十五人","受益權之受讓人不須為專業投資人","受益人分割讓與後之每一受益人所持有受益權單位金額不得低於新臺幣一仟萬元","受益人應於轉讓受益權前，提供受讓人之身分資料等，經信託業同意轉讓後，受益人始得轉讓"],"a":"2","tp":"行銷訂約與風險揭露","note":""},{"p":60,"s":1,"n":43,"t":"信託業之會計處理原則係由下列何者報請主管機關核定？","o":["會計師同業公會","銀行商業同業公會","信託業本身","信託業商業同業公會" ":""},{"p":60,"s":2,"n":77,"t":"銀行辦理特定金錢信託投資國外有價證券業務，下列何者不是禁止行為？","o":["與委託人作保證報酬之約定","與委託人作保本保息之約定","推薦特定基金","提供投資人須知予投資人"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":60,"s":2,"n":78,"t":"有關保管及證券化業務之敘述，下列何者錯誤？","o":["短期票券得為證券商營業保證金提存之標的","金融資產證券化條例之主管機關為銀行法之主管機關","為發行海外存託憑證而提存之有價證券應指定保管機構保管","擔任證券投資信託基金簽證之銀行，非經主管機關核准，不得擔任該基金之保管機構"],"a":"1","tp":"其他資產保管與營業保證金","note":""},{"p":60,"s":2,"n":79,"t":"有關證券投資信託基金保管機構辦理基金資產交割作業之敘述，下列何者錯誤？","o":["交割指示未於合理時間內送達者，保管機構得拒絕交割","交割作業所作成之書面記錄及交割指示函至少保存三年","基金存款不足時，保管機構不得墊款亦不得抵用待交換票據","保管機構應於投信公司擬交易對象通知送達十個營業日內完成相關交易之基本資料建檔並回報投信公司"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":60,"s":2,"n":80,"t":"有關不動產資產信託之敘述，下列何者正確？","o":["性質上為金錢信託","受託機構以設立滿三年以上且信用評等達一定等級以上之信託業為限","向主管機關申請核准或申報生效前，免先洽請專業估價者就信託財產依不動產估價師法之規定出具估價報告書","依信託契約之約定，信託土地於信託終止後毋須返還委託人者，於信託行為成立移轉土地所有權時，即應以委託人為納稅義務人課徵土地增值稅"],"a":"4","tp":"REAT資產信託與證券發行","note":""},{"p":61,"s":1,"n":1,"t":"有關信託財產應與受託人之自有財產分離，下列敘述何者正確？","o":["受託人死亡時，其繼承人可以繼承該信託財產","受託人受破產宣告時，得將信託財產列入其破產財團","屬於信託財產之債權與不屬於該信託財產之債務不得互相抵銷","受託人非因處理信託事務負擔之債務，其債權人得聲請強制執行信託財產"],"a":"3","tp":"財產獨立性與強制執行","note":""},{"p":61,"s":1,"n":2,"t":"依土地登記規則規定，信託以遺囑為之者，如遺囑未指定遺囑執行人時，原則上應由下列何者辦理信託登記？","o":["委託人會同受託人","委託人","受託人","繼承人會同受託人"],"a":"4","tp":"登記公示與對抗效力","note":""},{"p":61,"s":1,"n":3,"t":"甲為契約信託之委託人，乙為受託人，丙為受益人，丁為信託監察人，下列何者是信託財產對外有管理處分權之人？","o":["丁","丙","乙","甲"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":4,"t":"依信託法規定，委託人以依法不得受讓特定財產權之人為該財產權之受益人者，其信託行為效力如何？","o":["得終止","得撤銷","無效","得中止"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":5,"t":"有價證券中之股票及公司債券，除須依目的事業主管機關規定，於證券上載明其為信託財產外，尚須通知下列何者，始得對抗該公司？","o":["證券期貨局","證券交易所","發行公司","經濟部"],"a":"3","tp":"公益信託與監督機關","note":""},{"p":61,"s":1,"n":6,"t":"遺囑人死亡後，其繼承人依遺囑之指示，與受託人簽訂契約，將財產權移轉予該受託人管理所設立之信託， 屬下列何種信託關係？","o":["遺囑信託關係","契約信託關係","宣言信託關係","擬制信託關係"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":7,"t":"受託人違反信託本旨處分信託財產，於聲請法院撤銷其處分時，係由下列何者為之？","o":["得由委託人為之","須由全體受益人一同為之","得由其他受託人為之","得由受益人中之一人為之"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":61,"s":1,"n":8,"t":"甲將現金1,000 萬元信託予乙，成立一他益信託，信託期間五年，指定受益人為丙子及丁女，一年後甲不幸身故，今丙欲變更信託財產之管理方式，應另取得何人之同意？","o":["僅乙","乙、丁","僅丁","不需他人同意"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":9,"t":"有關受託人忠實義務原則之敘述，下列何者錯誤？","o":["受託人不得置信託財產利益與本身利益於可能衝突立場","受託人處理信託事務時，不得圖謀自身或第三人之利益","受託人原則上應照自己的意思處理信託事務","受託人原則上不得享有信託利益"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":61,"s":1,"n":10,"t":"依信託法規定，下列何者不得擔任受託人？","o":["有行為能力之成年人","信託業","受監護或輔助宣告之人","兼營信託業務之銀行"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":61,"s":1,"n":11,"t":"受託人因處理信託事務所支出之費用或負擔之債務，得對信託財產行使何種權利？","o":["代位權","抵充權","撤銷權","終止權"],"a":"2","tp":"受託人義務報酬與責任","note":""},{"p":61,"s":1,"n":12,"t":"受託人因有不得已之事由，合法使第三人代為處理信託事務者，其應負之責任為何？","o":["無須負任何責任","應與該第三人負連帶責任","僅就第三人之選任與監督其職務之執行負其責任","應就該第三人之行為與就自己之行為負同一責任"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":61,"s":1,"n":13,"t":"有關信託監察人之敘述，下列何者錯誤？","o":["可選任數人為信託監察人","信託監察人限為自然人","委託人得於信託契約中指定信託監察人","破產人不得擔任信託監察人"],"a":"2","tp":"信託監察人","note":""},{"p":61,"s":1,"n":14,"t":"設置信託監察人之主要目的為何？","o":["保護受託人之利益","保護委託人之利益","保護受益人之利益","保護與受託人交易之第三人之利益"],"a":"3","tp":"信託監察人","note":""},{"p":61,"s":1,"n":15,"t":"除信託行為另為訂定外，信託關係不因下列何種情形而消滅？","o":["自然人之委託人死亡時","因信託行為所定事由發生時","委託人與受益人共同終止信託時","信託目的已完成或不能完成時"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":16,"t":"目的事業主管機關得撤銷公益信託許可之事由，下列何者與信託法之規定不符？","o":["無正當理由連續二年不為活動","為有害公益之行為","違反目的事業主管機關監督命令","違反設立許可條件"],"a":"1","tp":"公益信託與監督機關","note":""},{"p":61,"s":1,"n":17,"t":"公益信託受託人之辭任應經下列何者許可？","o":["法院","目的事業主管機關","委託人同意即可","信託監察人同意即可"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":61,"s":1,"n":18,"t":"有關信託業以發行受益證券方式募集共同信託基金，下列敘述何者正確？","o":["共同信託基金受益證券應為無記名式","共同信託基金受益證券不得背書轉讓","信託業得募集保本保息之共同信託基金","受益證券得由受益人背書轉讓後，並將受讓人之姓名或名稱通知信託業，始得對抗該信託業"],"a":"4","tp":"共同信託基金募集與運用","note":""},{"p":61,"s":1,"n":19,"t":"依信託法規定，除信託行為另有規定外，有關他益信託終止信託時，下列敘述何者正確？","o":["由委託人單獨終止之","由委託人或其繼承人得隨時終止之","由委託人及受託人共同終止之","由委託人及受益人共同終止之"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":20,"t":"依信託法規定，對於信託之敘述，下列何者錯誤？","o":["以應登記或註冊之財產權為信託者，應辦妥信託登記，該信託始生效力","信託得以契約或遺囑為之","委託人於信託行為未為保留時，得經受益人同意，處分受益人之權利","委託人於信託行為中保留終止信託權利者，得不經受益人之同意終止其信託"],"a":"1","tp":"登記公示與對抗效力","note":""},{"p":61,"s":1,"n":21,"t":"營業信託之監督機關為下列何者？","o":["法院","法務部","內政部","金融監督管理委員會"],"a":"4","tp":"設立能力與監督管轄","note":""},{"p":61,"s":1,"n":22,"t":"下列何者不得投資或經營信託業？","o":["銀行","信託公司","政黨或其他政治團體","主管機關核准兼營信託業務之機構"],"a":"3","tp":"人員資格訓練與利益限制","note":""},{"p":61,"s":1,"n":23,"t":"有關信託公司發起人及股東之敘述，下列何者錯誤？","o":["信託公司之發起人及股東，出資以現金為限","信託公司之發起人應於發起時，按實收資本額一次認足發行股份之總額，並至少繳足百分之五十之股款","依信託業法設立之信託公司，其專業發起人及股東，應有符合一定資格條件之銀行、保險機構、基金管理機構","依不動產證券化條例僅辦理不動產投資信託或不動產資產信託業務之信託公司，其專業發起人及股東， 得由符合一定資格條件之不動產管理機構擔任"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":61,"s":1,"n":24,"t":"下列何項行為對於信託業而言係絕對禁止？","o":["以信託財產存放於其銀行業務部門","自行決定以信託財產購買本身銀行業務部門承銷之有價證券","以信託財產購買本身銀行業務部門經紀之有價證券或票券","以信託財產與本身為信託業法第二十五條第一項以外之其他交易"],"a":"2","tp":"利害關係人與利益衝突","note":""},{"p":61,"s":1,"n":25,"t":"信託業之忠實義務，一般係指下列何者？ A.以受益人利益為處理信託事務之唯一目的 B.不得考量受託人自身利益 C.避免與受益人利害衝突","o":["僅AB","僅BC","僅AC","ABC"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":61,"s":1,"n":26,"t":"下列何種信託之委託人保留對信託資金之運用決定權？","o":["特定單獨管理運用金錢信託","指定營運範圍或方法之集合管理運用金錢信託","不指定營運範圍或方法之金錢信託","指定營運範圍或方法之單獨管理運用金錢信託"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":61,"s":1,"n":27,"t":"有關信託業之行為，下列敘述何者正確？","o":["信託業不得以信託財產辦理放款","信託業得以信託財產辦理放款，但不得保本保息","信託業得對利害關係人以外之人以信託財產辦理放款","信託業非經全體受益人同意，不得以信託財產辦理放款"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":61,"s":1,"n":28,"t":"我國已有金融機構甲成功的將其可產生現金流量之房屋貸款之債權及其擔保物權，依金融資產證券化條例規定，將其資產移轉與本身以外之信託業乙，以發行有價證券之方式銷售與投資人，下列敘述何者正確？","o":["甲為信託之受託人","該案例屬有價證券信託","該案例屬金錢債權及其擔保物權之信託","依金融資產證券化條例規定，非信託業亦得擔任該類特殊目的信託之受託人"],"a":"3","tp":"利害關係人與利益衝突","note":""},{"p":61,"s":1,"n":29,"t":"信託業之利害關係人，係指持有信託業已發行股份總數或資本額多少比例以上者？","o":["百分之一","百分之二","百分之三","百分之五"],"a":"4","tp":"設立標準與分支機構","note":""},{"p":61,"s":1,"n":30,"t":"銀行經營信託業務應指撥營運資金，其數額至少為新臺幣若干？","o":["一千萬元","二千萬元","三千萬元","五千萬元"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":61,"s":1,"n":31,"t":"有關銀行經營信託業務之風險管理，下列何者錯誤？","o":["本國銀行總行應設置信託業務專責部門","信託業務相關會計應整併於銀行帳處理","外國銀行申請認許時所設分行應設置信託業務專責部門","各分支機構辦理信託業務，除經主管機關核准外，限於信託財產之收受"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":61,"s":1,"n":32,"t":"信託業應提存之賠償準備金，得以下列何者繳存於中央銀行？ A.現金 B.金融債券 C.政府債券 D.公司債","o":["僅A、B","僅A、C","僅A、D","僅B、C"],"a":"2","tp":"賠償準備金與盈餘分配","note":""},{"p":61,"s":1,"n":33,"t":"對信託財產具有運用決定權者，係指下列何種人員？","o":["係指信託專責部門之督導人員","係指信託專責部門之管理人員","係指決定信託財產投資之部門最高主管","係指對信託財產之運用具有最後核定權限之主管及人員"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":61,"s":1,"n":34,"t":"信託業違反法令致委託人或受益人受有損害者，其應負責之董事及主管人員應與信託業連帶負損害賠償之責，該連帶責任自各應負責之董事及主管人員卸職之日起幾年內，不行使該項請求權而消滅？","o":["一年","二年","三年","五年"],"a":"2","tp":"評審委員會與內部職責","note":""},{"p":61,"s":1,"n":35,"t":"信託業三分之一以上董（理）事發生變動時，應於事實發生之翌日起多久時間內，向主管機關申報，並應於本公司所在地之日報或依主管機關指定之方式公告？","o":["二個營業日","三個營業日","五個營業日","無須申報及公告"],"a":"1","tp":"財產評審報告與會計公告","note":""},{"p":61,"s":1,"n":36,"t":"A 銀行國際金融業務分行經核准辦理「外幣特定金錢信託投資國外有價證券業務」時，該項業務應於下列何者列帳登載？","o":["國際金融業務分行","國外業務部","國內業務部","信託業務專責部門"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":61,"s":1,"n":37,"t":"有關信託契約應記載之事項，下列敘述何者錯誤？","o":["信託目的","委託人之責任","信託財產管理及運用方法","信託存續期間"],"a":"2","tp":"基本義務與契約記載事項","note":""},{"p":61,"s":1,"n":38,"t":"某甲為信託公司之監察人，下列何者得擔任同一信託公司之董事？","o":["甲之配偶","甲之岳父","甲之兄弟姊妹","以甲為負責人之法人股東"],"a":"4","tp":"評審委員會與內部職責","note":""},{"p":61,"s":1,"n":39,"t":"營業信託之信託財產原則上應以下列何者之信託財產名義表彰之？","o":["委託人","受益人","信託監察人","信託業"],"a":"4","tp":"委託人權利與信託標的","note":""},{"p":61,"s":1,"n":40,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，有關主管機關得廢止證券商兼營信託業務許可之事由，下列敘述何者正確？","o":["以信託財產借入款項","對信託財產具有運用決定權者兼任其他業務之經營","業務或財務顯著惡化不能支付其債務","以信託財產購買本身或其利害關係人之財產"],"a":"3","tp":"經營組織與兼營獨立","note":""},{"p":61,"s":1,"n":41,"t":"下列何者係信託業記錄其受託管理、運用與處分信託財產之帳務？","o":["自有帳","銀行帳","信託帳","損益帳"],"a":"3","tp":"監理處分罰則與損害賠償","note":""},{"p":61,"s":1,"n":42,"t":"信託公司經許可增設或核准遷移分公司者，最遲應自許可或核准之日起多少期間內，向主管機關申請核（換） 發營業執照並開始營業，屆期未開始營業者，應廢止其許可或核准？","o":["半年","一年","二年","三年"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":61,"s":1,"n":43,"t":"信託業應設置隸屬下列何者之稽核單位？","o":["董事會","監察人","總經理","信託財產評審委員會"],"a":"1","tp":"內控稽核與風險管理","note":""},{"p":61,"s":1,"n":44,"t":"委託人甲將其設有抵押權之不動產信託予乙，其後抵押權人Ａ死亡，由其繼承人乙繼承取得該信託財產上之抵押權。於此情形，該抵押權是否會因混同而消滅？","o":["由於信託財產之所有權與抵押權已歸屬於一人，故抵押權將因混同而消滅","受託人因繼承而承受信託財產上之抵押權時，該抵押權不因混同而消滅","抵押權是否會因混同而消滅須依信託契約之訂定","受託人絕對不得取得信託財產上之權利，故於此情形信託關係將因之消滅"],"a":"2","tp":"財產獨立性與強制執行","note":""},{"p":61,"s":1,"n":45,"t":"王蓮交付新臺幣五百萬元與乙銀行成立信託，王蓮並保留運用決定權，指定該信託資金五百萬限購買特定國內固定收益型基金，約定信託期間一年，並與他人之信託資金於營運範圍或方法相同之部分設置集合管理運用帳戶，明定受益人為本人，且其受益權不得轉讓於第三人，而下列敘述何者正確？","o":["該信託屬特定單獨管理運用信託","該信託屬特定集合管理運用信託","該信託屬指定集合管理運用信託","王蓮之受益權因其約定不得轉讓，因此不得拋棄"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":61,"s":1,"n":46,"t":"有關我國信託相關稅法採用之課稅原則，下列何者錯誤？","o":["稽徵經濟之原則","所得發生時課稅之原則","實質課稅之原則","信託財產實體課稅之原則"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":61,"s":1,"n":47,"t":"依所得稅法規定，受益人為個人時，信託財產發生收入之年度，由受託人計算出所得額後，應併入下列何者之當年度所得額，依法課徵所得稅？","o":["委託人","受託人","受益人","信託監察人"],"a":"3","tp":"所得稅與扣繳","note":""},{"p":61,"s":1,"n":48,"t":"在現行法律體制下，有關信託課稅之敘述，下列何者正確？","o":["以財產權為課稅對象","以得為權利義務主體之自然人或法人為對象","以受託人為課稅對象","以金融機構法人為課稅對象"],"a":"2","tp":"信託課稅原則與形式移轉","note":""},{"p":61,"s":1,"n":49,"t":"委託人為營利事業之私益信託契約，信託成立時，明定信託利益之全部非由委託人享有者，當其約定之受益人為尚未存在或為不特定之人時，依所得稅法之規定，應以下列何者為納稅義務人，就信託成立年度受益人享有信託利益之權利價值課徵所得稅？","o":["委託人","受託人","不課徵所得稅","信託監察人"],"a":"2","tp":"贈與權利價值與折現計算","note":""},{"p":61,"s":1,"n":50,"t":"有關信託稅制之財產所有權人，下列何者正確？","o":["為得享有信託利益之人","為信託之委託人","為信託財產之受益人","為信託之受託人"],"a":"4","tp":"信託課稅原則與形式移轉","note":""},{"p":61,"s":2,"n":1,"t":"依「信託業建立非專業投資人商品適合度規章應遵循事項」規定，信託業辦理客戶風險承受等級分類與商品風險等級適合度之適配評估作業時，如有下列何種情形應予以婉拒？ A.客戶婉拒提供相關資訊 B.客戶年齡超過60 歲 C.客戶風險承受等級評估結果超過半年 D.客戶要求購買超過其風險承受等級之商品","o":["僅AB","僅BC","僅CD","僅AD"],"a":"4","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":61,"s":2,"n":2,"t":"銀行辦理特定金錢信託業務，於運用該信託資金向證券市場買賣下單，係以下列何者名義為之？","o":["委託人","受託人","受益人","信託監察人"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":61,"s":2,"n":3,"t":"有關信託業辦理「金錢信託」業務，下列敘述何者錯誤？","o":["得依個別委託人契約採分別管理","得與委託人以契約約定採集合管理、分別記帳","受託人具運用決定權之信託資金集合管理運用應依主管機關所定之管理辦法辦理","集合管理運用得發行受益證券向不特定多數人募集資金運用"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":61,"s":2,"n":4,"t":"依境外基金管理辦法規定，銷售機構以自己名義為投資人投資時，應經由證券集中保管事業指定之銀行專戶辦理，信託業依特定金錢信託契約為客戶投資境外基金時，下列敘述何者正確？","o":["應比照辦理","得免受限制","經申請得免適用","由信託客戶決定"],"a":"2","tp":"境外基金與國外證券投資","note":""},{"p":61,"s":2,"n":5,"t":"有關特定金錢信託，在投資國外有價證券時，依目前中央銀行之規定，下列敘述何者錯誤？","o":["在銀行國內分行辦理時，委託人限為本國之自然人","銀行欲擔任受託機構者，應為經金管會核准辦理金錢信託業務之銀行","委託人如以新臺幣交付信託資金運用於國外，則由受託銀行辦理結購外匯事宜","外幣信託資金之收受及返還均應以同一外幣為之"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":61,"s":2,"n":6,"t":"依信託業法規定，有關委託人與受託人間對信託資金收益之約定，下列敘述何者正確？","o":["受託人可以應委託人要求於信託契約明訂保證收益率","受託人應依約定將信託財產運用收益交付受益人","受託人可以承諾擔保信託本金之安全","受託人可以承諾擔保最低收益率"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":61,"s":2,"n":7,"t":"依中央銀行規定，委託人交付新臺幣資金以特定金錢信託方式投資國外有價證券時，下列何者非屬委託人得辦理之新臺幣與外幣間避險交易？","o":["遠期外匯交易","換匯交易","換匯換利交易","期貨交易"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":61,"s":2,"n":8,"t":"有關特定金錢信託投資國內外基金之前置作業，受託銀行應先與基金相關機構簽訂何種契約？","o":["委託契約","信託契約","銷售契約","保管契約"],"a":"3","tp":"金錢信託分類權限與運用","note":""},{"p":61,"s":2,"n":9,"t":"有關非專業投資人之特定金錢信託投資國外有價證券，其得投資之標的，下列何者正確？ A.美國政府債券 B.日本公司在東京證券市場上市之股票 C.依境外基金管理辦法私募之境外基金 D.大陸公司在香港發行之有價證券（國企股）","o":["僅AB 正確","僅CD","僅BD","僅AC"],"a":"1","tp":"客戶認識商品適合度與投資人分類","note":""},{"p":61,"s":2,"n":10,"t":"境外基金管理辦法發布前，信託業依委託人指示，以定期定額方式投資於未經主管機關核准或申報生效在國內募集銷售之境外基金者，其處理方式，下列敘述何者正確？","o":["定期定額方式投資者，須立即全部贖回","定期定額方式投資者，不可部分贖回","定期不定額方式投資者，須定額贖回","定期定額方式投資者，得按原訂契約繼續投資，至委託人全數贖回為止"],"a":"4","tp":"境外基金與國外證券投資","note":""},{"p":61,"s":2,"n":11,"t":"依境外基金管理辦法規定，總代理人應如何委任銷售機構？","o":["書面","口頭","簡訊","電子郵件"],"a":"1","tp":"境外基金與國外證券投資","note":""},{"p":61,"s":2,"n":12,"t":"有關委託人經由受託銀行辦理新臺幣特定金錢信託投資以美元計價之境外結構型商品，如該商品發行條件列有到期百分之百美元保本者，下列敘述何者錯誤？","o":["該商品係由受託銀行保證到期百分之百還本","委託人有匯兌風險","該商品有信用風險","該商品有流動性風險"],"a":"1","tp":"結構型商品與衍生性金融商品","note":""},{"p":61,"s":2,"n":13,"t":"委託人甲與銀行簽訂信託契約，交付新臺幣一千萬元並約定如下：信託資金僅能投資A 股票，甲概括指定銀行購買價位限於二十五元至三十元之間，此信託屬於下列何種信託業務？","o":["受託人具運用決定權之有價證券信託業務","受託人不具運用決定權之金錢信託業務","受託人具運用決定權之金錢信託業務","受託人不具運用決定權之有價證券信託業務"],"a":"3","tp":"證券信託種類與保管差異","note":""},{"p":61,"s":2,"n":14,"t":"有關特定金錢信託投資境外結構型商品應揭露之「基本風險」，下列何者錯誤？","o":["信用風險","本金轉換風險","最低收益風險","委託人兼受益人提前贖回風險"],"a":"2","tp":"結構型商品與衍生性金融商品","note":""},{"p":61,"s":2,"n":15,"t":"銀行辦理特定金錢信託投資境外基金業務，有關基金應符合之條件，下列敘述何者錯誤？","o":["須經主管機關核備","個別基金必須成立滿一年","基金管理機構必須成立滿三年以上者","不得投資於黃金、商品現貨及不動產"],"a":"3","tp":"境外基金與國外證券投資","note":""},{"p":61,"s":2,"n":16,"t":"依信託業營運範圍受益權轉讓限制風險揭露及行銷訂約管理辦法之規定，有關委託人之分類，下列敘述何者錯誤？","o":["信託基金投資人","專業機構投資人","非專業投資人","專業投資人"],"a":"1","tp":"行銷訂約與風險揭露","note":""},{"p":61,"s":2,"n":17,"t":"信託業辦理特定金錢信託業務，應設置信託財產評審委員會，至少每三個月對信託財產運用狀況予以評審，並向下列何者報告？","o":["公平交易委員會","信託業商業同業公會","董事會","金管會"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":61,"s":2,"n":18,"t":"信託業對信託財產不具有運用決定權之特定金錢信託業務，係指委託人保留對信託財產之運用決定權，並得約定由下列何者對信託財產之營運範圍或方法為具體明確之指示？","o":["受託人","委託人本人或其指定之第三人","主管機關","僅限於受益人本人"],"a":"2","tp":"金錢信託分類權限與運用","note":""},{"p":61,"s":2,"n":19,"t":"有關生前契約信託之敘述，下列何者錯誤？","o":["生前契約有預先收取費用者，該費用全部均需交付信託","生前契約信託之信託財產可運用於債券型基金","殯葬禮儀服務業應將應交付信託業管理之費用，按月逐筆結算造冊","信託財產運用於經核淮設置火化場需用土地等，其投資總額不得逾投資時信託財產當時價值25%"],"a":"1","tp":"預收款禮券與履約保障","note":""},{"p":61,"s":2,"n":20,"t":"有關金錢信託業務相關之稅負，下列敘述何者錯誤？","o":["營利事業之信託資金收益仍應課徵營利事業所得稅","以信託申請書代替信託手續費收入憑證者，免繳印花稅","未於信託契約載明或註記收到銀錢文字者，免納印花稅","最低稅負制實施後，個人信託項下之境外所得亦要納入基本所得額"],"a":"2","tp":"營業稅與印花稅","note":""},{"p":61,"s":2,"n":21,"t":"依信託法規定，受託人除應於接受信託時作成信託財產目錄外，每年至少定期一次作成信託財產目錄，並編製下列何種報表送交委託人及受益人？","o":["收支計算表","信託財產損益表","信託財產分析表","信託財產資產負債表"],"a":"1","tp":"受託人義務報酬與責任","note":""},{"p":61,"s":2,"n":22,"t":"有關「信託財產評審委員會之組織及評審規範」規定，委員會應審議信託財產運用是否遵循法令、符合信託約定等，評審時應進行抽查，每次抽查件數就交付信託財產達新臺幣五千萬元以上者，抽查比率至少不得低於百分之多少？","o":["百分之一","百分之三","百分之五","百分之十"],"a":"3","tp":"財產評審報告與會計公告","note":""},{"p":61,"s":2,"n":23,"t":"有關企業員工持股信託之特性，下列何者正確？ A.加入員工為委託人兼受益人 B.可投資自己所服務公司之上市或上櫃股票 C.得逕自向受託人申請結算領回全部信託財產 D.信託財產採集合運用與分別管理","o":["僅AC","僅ABC","僅ABD","ABCD"],"a":"3","tp":"持股會組織協議與當事人","note":""},{"p":61,"s":2,"n":24,"t":"下列哪一種業務是提升企業營運績效，創造勞資雙贏之信託業務？","o":["遺孤信託","員工持股信託","安養信託","保險金信託"],"a":"2","tp":"員工福利信託特性與制度","note":""},{"p":61,"s":2,"n":25,"t":"企業員工持股信託之信託財產係以下列何者之名義登記持有？","o":["個別員工","員工持股會","受託人","委託人"],"a":"3","tp":"員工福利信託特性與制度","note":""},{"p":61,"s":2,"n":26,"t":"有關員工持股信託公司獎勵金之相關稅負，下列何者正確？ A.應納入員工當年度個人綜合所得課稅 B.應納入受託人之營業收入項下課稅","o":["只有A 對","只有B 對","AB 皆對","AB 皆錯"],"a":"1","tp":"所得稅與扣繳","note":""},{"p":61,"s":2,"n":27,"t":"企業員工持股信託契約終止時，有關信託財產之返還，下列敘述何者錯誤？","o":["得以折算金錢方式返還","信託財產返還時，應課贈與稅","得以信託財產現狀返還","得選擇部分股票部分金錢方式返還"],"a":"2","tp":"退出終止與財產返還","note":""},{"p":61,"s":2,"n":28,"t":"有關企業員工持股信託之敘述，下列何者錯誤？","o":["採滾入平均成本法投資","股價愈高購入股數愈多","分批投資分散風險","利用複利與時間累積財富"],"a":"2","tp":"員工福利信託特性與制度","note":""},{"p":61,"s":2,"n":29,"t":"按企業員工持股信託業務之運作架構，對公司行使股東表決權者為下列何者？","o":["委託人","受託人","受益人","員工持股會代表人"],"a":"2","tp":"員工福利信託特性與制度","note":""},{"p":61,"s":2,"n":30,"t":"有關企業員工持股信託之信託資金，下列敘述何者錯誤？","o":["每個月自委託人薪資中提撥一定金額作為信託資金","企業亦可相對提撥資金作為委託人之信託資金","委託人之年終獎金及紅利不宜作為信託資金","委託人因個人投資理財需要，得要求追加提存"],"a":"3","tp":"資金提撥與公司獎勵","note":""},{"p":61,"s":2,"n":31,"t":"辦理企業員工持股信託業務時，有關公司獎助金提撥獎助方式之協議書，係由下列何者共同簽訂？","o":["委託人與受託人","公司與受託人","受益人與受託人","員工持股會代表人代表全體會員與公司"],"a":"4","tp":"持股會組織協議與當事人","note":""},{"p":61,"s":2,"n":32,"t":"臺灣證券交易所公告有價證券借貸交易之類型，下列何者正確？ A.定價交易 B.競價交易 C.議借交易","o":["僅AB","僅BC","僅AC","ABC"],"a":"4","tp":"有價證券借貸交易與擔保","note":""},{"p":61,"s":2,"n":33,"t":"內部人為有價證券信託之委託人時，依證券交易法第二十五條規定應向所屬公開發行公司申報持股異動，而下列敘述何者錯誤？","o":["應於異動之次月五日前申報","經提示信託契約證明受託人對信託財產具有運用決定權，得僅申報自有持股減少","經提示信託契約證明委託人對信託財產保留運用決定權，得僅申報自有持股減少","委託人對信託財產保留運用決定權之信託，應申報所移轉股份為「保留運用決定權之交付信託股份」"],"a":"3","tp":"內部人持股申報與權益行使","note":""},{"p":61,"s":2,"n":34,"t":"王先生想辦理有價證券信託，將其下列財產交由信託業管理，但其中有一項信託業表示非屬有價證券信託所受理之信託財產，係指下列何者？","o":["政府債券","受益憑證","外幣存款存單","新股權利證書"],"a":"3","tp":"證券信託種類與保管差異","note":""},{"p":61,"s":2,"n":35,"t":"信託業辦理有價證券信託時，下列何者不屬於管理型有價證券信託之服務項目？","o":["有價證券之保管","股息股利之領取","有價證券之借貸","現金增資新股之認購"],"a":"3","tp":"證券信託種類與保管差異","note":""},{"p":61,"s":2,"n":36,"t":"下列何者以其持有之公開發行公司股票為信託時，無須事先辦理股權申報？","o":["該公司董事","該公司監察人","該公司經理人","持有該公司股份百分之五之股東"],"a":"4","tp":"內部人持股申報與權益行使","note":""},{"p":61,"s":2,"n":37,"t":"下列何者係為釐清信託財產與受託人自有財產之關係以確保交易之安全？","o":["信託申報","信託公示","信託憑證","信託聲明"],"a":"2","tp":"登記公示與對抗效力","note":""},{"p":61,"s":2,"n":38,"t":"有關不動產投資信託基金分配信託利益予受益人時課稅之敘述，下列何者正確？","o":["該信託利益應按利息所得課稅","該信託利益應按其他所得課稅","該信託利益應按租金收入課稅","該信託利益應按財產交易所得課稅"],"a":"1","tp":"證券化商品分離課稅與交易稅","note":""},{"p":61,"s":2,"n":39,"t":"有關不動產證券化之特性，下列何者錯誤？","o":["權益不可分割","投資金額較低","投資單位較多","經營專業化"],"a":"1","tp":"不動產證券化共通規定","note":""},{"p":61,"s":2,"n":40,"t":"受託機構須先洽請專業估價者依不動產估價師法規定出具估價報告書，始可運用不動產投資信託基金進行下列何種金額以上之不動產或相關權利之交易？","o":["新臺幣一億元","新臺幣八千萬元","新臺幣六千萬元","新臺幣五千萬元"],"a":"1","tp":"REIT募集投資標的與限制","note":""},{"p":61,"s":2,"n":41,"t":"有關不動產證券化條例之定義，下列敘述何者錯誤？","o":["不動產管理機構：指受委託人委任管理或處分信託財產之信託業","安排機構：指對受益證券之募集或私募安排規劃整體事務者","開發型之不動產或不動產相關權利：指正進行或規劃進行開發、建築、重建、整建之不動產或不動產相關權利","發起人：指受託機構申請或申報募集或私募不動產投資信託基金時，已確定投資之不動產之所有人、不動產相關權利之權利人或現金出資人"],"a":"1","tp":"不動產證券化共通規定","note":""},{"p":61,"s":2,"n":42,"t":"受託機構私募不動產投資信託受益證券之對象，其中符合條件之自然人、法人或基金之總數，最多不得超過幾人？","o":["15 人","20 人","35 人","50 人"],"a":"3","tp":"REIT募集投資標的與限制","note":""},{"p":61,"s":2,"n":43,"t":"有關受託機構得依不動產投資信託契約之約定，以信託財產借入款項，下列敘述何者錯誤？","o":["擔保物權之權利人於不動產抵押權或其他擔保物權之設定範圍內，不得對信託財產聲請法院裁定後強制執行","應於借款契約生效日起二日內，於受託機構本機構所在地之日報或依主管機關規定之方式辦理公告","借入款項之目的，以不動產或不動產相關權利之取得、開發、營運，或以配發利益、孳息或其他收益所必需者為限","得於借入款項之範圍，就信託財產為不動產抵押權或其他擔保物權之設定"],"a":"1","tp":"REIT募集投資標的與限制","note":""},{"p":61,"s":2,"n":44,"t":"有關不動產證券化對經濟面與社會面所產生之效益與影響，下列敘述何者錯誤？","o":["促進社會資金有效運用","增加投資管道","擴大發行市場","增加住宅市場之假性需求"],"a":"4","tp":"不動產證券化共通規定","note":""},{"p":61,"s":2,"n":45,"t":"依不動產證券化條例規定，如為募集之不動產資產信託，其信託財產得包括下列哪些項目？ A.已有穩定收入之不動產 B.已有穩定收入之不動產相關權利 C.尚在開發中之不動產 D.未開發之不動產","o":["僅AB","僅AC","僅ABC","ABCD"],"a":"1","tp":"資產移轉債權與債務人通知","note":""},{"p":61,"s":2,"n":46,"t":"不動產投資信託基金除經主管機關核准者外，應以下列何者為限？","o":["開放型基金","封閉型基金","私募型基金","債券型基金"],"a":"2","tp":"REIT募集投資標的與限制","note":""},{"p":61,"s":2,"n":47,"t":"為保護金融資產證券化受益人之利益，且避免利益衝突，下列何者可擔任信託監察人？","o":["創始機構","受託機構之職員","受託機構之利害關係人","由受益人會議選任之人員"],"a":"4","tp":"特殊目的信託公司與參與機構","note":""},{"p":61,"s":2,"n":48,"t":"受託機構依資產信託證券化計畫，發行各種種類及期間之受益證券，受益證券清償後，資產池之賸餘財產應依資產信託證券化計畫，分配予下列何者？","o":["本金受益人","次順位受益人","殘值受益人","受託機構"],"a":"3","tp":"特殊目的信託公司與參與機構","note":""},{"p":61,"s":2,"n":49,"t":"依金融資產證券化條例規定，受託機構於每營業年度終了後，應就特殊目的信託之信託財產作成下列哪些書表？","o":["損益表及現金流量表","資產負債表及現金流量表","資產負債表、損益表及現金流量表","資產負債表、損益表、信託財產管理及運用之報告書"],"a":"4","tp":"特殊目的信託公司與參與機構","note":""},{"p":61,"s":2,"n":50,"t":"依金融資產證券化條例規定，持有本金持分總數至少多少以上之受益人，為受益人之共同利益事項，得以書面記明提議事項及理由，請求有召集權之人召集受益人會議？","o":["百分之一","百分之二","百分之三","百分之五"],"a":"3","tp":"受益證券募集發行與受益人會議","note":""},{"p":61,"s":2,"n":51,"t":"以私募方式發行金融資產證券化之受益證券時，有關該受益證券持有人轉讓該受益證券之敘述，下列何者錯誤？","o":["得轉讓與銀行業","得轉讓與票券業","得轉讓與信託業","其轉讓對象不受任何限制"],"a":"4","tp":"受益證券募集發行與受益人會議","note":""},{"p":61,"s":2,"n":52,"t":"除經主管機關核定外，下列何者非屬得為金融資產證券化之創始機構？","o":["銀行","票券金融公司","保險業","證券投資信託事業"],"a":"4","tp":"特殊目的信託公司與參與機構","note":""},{"p":61,"s":2,"n":53,"t":"金融資產證券化過程為規避利差風險，應由下列何機構與利率交換相對人簽訂利率交換契約？","o":["服務機構","諮詢顧問機構","受託機構","承銷商"],"a":"3","tp":"信用增強評等與風險分散","note":""},{"p":61,"s":2,"n":54,"t":"依金融資產證券化條例，創始機構於特殊目的信託中主要係居於下列何種地位？","o":["委託人","受託人","受益人","信託監察人"],"a":"1","tp":"特殊目的信託公司與參與機構","note":""},{"p":61,"s":2,"n":55,"t":"金融資產證券化對金融機構之效益不包括下列何者？","o":["提高金融資產之流動性","擴大金融機構之資產負債規模","擴大金融機構資金調度之管道","提高金融機構之自有資本比率"],"a":"2","tp":"證券化特性與經濟效益","note":""},{"p":61,"s":2,"n":56,"t":"有關辦理全權委託投資業務，除契約另有約定者外，同一委任人之不同全權委託投資帳戶，辦理買賣交割時，下列敘述何者正確？","o":["款券得相互轉撥","款券不得相互轉撥","僅有款得相互轉撥","僅有券得相互轉撥"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":61,"s":2,"n":57,"t":"有關證券投資信託基金保管機構之規定，下列敘述何者正確？","o":["應取得中央銀行之許可","應取得證券投資信託公司之信用評等","其資本額最低應達新臺幣二百億元以上","應經主管機關認可之信用評等機構評等達一定等級以上"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":58,"t":"下列何者非屬國內證券投資信託基金保管機構之服務項目？","o":["基金收益之分配","受益憑證之簽署","基金年度財務報表之簽署","基金存款不足時提供墊款服務"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":59,"t":"依「規範境外外國機構投資人持有股票表決權之方式」規定，境外外國機構持有公開發行公司股份未達多少股者，得不指派人員出席股東會？","o":["50 萬股","40 萬股","35 萬股","30 萬股"],"a":"4","tp":"外資全球保管與代理登記","note":""},{"p":61,"s":2,"n":60,"t":"有關證券投資信託基金保管機構辦理有價證券之買賣交割，係依下列何者之指示？","o":["投資人","證券投資信託事業","受益人","證券投資顧問事業"],"a":"2","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":61,"t":"有關全權委託投資保管機構出具越權交易通知書之敘述，下列何者錯誤？","o":["應於成交日次一營業日上午十一時前出具","應分別通知委任人（客戶）、受任人、交易對象及主管機關","僅就越權部分出具越權交易通知書","越權交易通知書應載明越權交易之事由及其詳細內容"],"a":"2","tp":"全權委託保管與越權交易","note":""},{"p":61,"s":2,"n":62,"t":"甲銀行擔任乙證券投資信託事業之法人董事，如欲擔任乙所募集基金之保管機構者，須先經下列何機關之核准？","o":["金管會","台灣證券交易所","證券暨期貨發展基金會","臺灣證券集中保管公司"],"a":"1","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":63,"t":"當證券投資信託基金經核准募集後，保管機構於金融機構開設活期存款及支票存款，其戶名為何？","o":["保管機構名稱","投信公司名稱","投信公司與保管機構聯名","主管機關核准之基金專戶名稱"],"a":"4","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":64,"t":"全權委託投資業務以委任關係辦理者，其所開立之投資買賣帳戶應以下列何者名義為之？","o":["委任人","受任人","證券投資信託事業","信託業"],"a":"1","tp":"全權委託保管與越權交易","note":""},{"p":61,"s":2,"n":65,"t":"有關僑外資投資國內有價證券之保管機構得提供之服務，下列何者錯誤？","o":["交易之確認","代理投資之登記","召開受益人大會","結匯之申請"],"a":"3","tp":"外資全球保管與代理登記","note":""},{"p":61,"s":2,"n":66,"t":"依證券投資信託基金保管機構辦理基金資產交割作業準則規定，有關款項支付之敘述，下列何者錯誤？","o":["基金資產交割事宜由保管機構負責","一般交易對象款項支付方式以票據或匯款為之","基金存款不足時，基金保管機構應墊款以避免發生違約交割","基金贖回款項得匯入受益人指定轉申購之原投信公司經理之基金專戶"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":67,"t":"原則上每一投資國內有價證券之全權委託投資帳戶，最多可委任幾家保管機構？","o":["四家","三家","一家","沒有限制"],"a":"3","tp":"全權委託保管與越權交易","note":""},{"p":61,"s":2,"n":68,"t":"全權委託投資之三方權義協定書係由委任人及保管銀行與下列何者簽訂？","o":["證券商公會","台灣證券集中保管公司","投信投顧公會","證券投資信託事業或證券投資顧問事業"],"a":"4","tp":"全權委託保管與越權交易","note":""},{"p":61,"s":2,"n":69,"t":"有關證券投資信託基金之清算人，下列何者錯誤？","o":["由投信公司擔任","投信公司無法擔任時，應由基金保管機構擔任","投信公司無法擔任時，亦不得委由基金保管機構擔任","主要任務包含了結現務、處分資產、收取債權等"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":70,"t":"集合管理運用帳戶之運用計畫有重大變更時，於公告期間內信託受益權是否繼續參加或退出集合管理運用帳戶，在受益人不特定時應由下列何者決定？","o":["法院","受託人","委託人","信託公會"],"a":"3","tp":"集合帳戶申請設置與合併","note":""},{"p":61,"s":2,"n":71,"t":"信託資金集合管理運用帳戶之信託財產運用於國內投資標的時，應以下列何者之信託財產名義表彰？","o":["受益人","委託人","信託監察人","信託業"],"a":"4","tp":"集合帳戶投資限制與流動性","note":""},{"p":61,"s":2,"n":72,"t":"信託業辦理不指定營運範圍或方法之金錢信託，其存款所存放之金融機構，經Moody's Investors Service 評定，長期信用評等須達何種等級以上？","o":["Aa3","Baa1","Baa2","Baa3"],"a":"4","tp":"金錢信託分類權限與運用","note":""},{"p":61,"s":2,"n":73,"t":"主管機關對集合管理運用帳戶之流動性資產範圍及比率，於必要時得洽商下列何者後訂之？","o":["財政部","中央銀行","信託公會","銀行公會"],"a":"2","tp":"集合帳戶投資限制與流動性","note":""},{"p":61,"s":2,"n":74,"t":"有關信託資金集合管理運用帳戶之運用範圍及限制，下列敘述何者正確？","o":["得以信託資金辦理放款","不得投資於上櫃之次順位公司債","可投資於櫃檯買賣第二類股票","運用範圍以具有次級交易市場之投資標的為原則"],"a":"4","tp":"單獨及集合管理分類與權限","note":""},{"p":61,"s":2,"n":75,"t":"營運範圍相同之信託資金集合管理運用之信託報酬收取方式為何？","o":["不得另收取信託報酬","由信託業自行訂定，毋須於信託契約中約定","應於公會訂定之最高收費標準之下","分別於個別信託契約及集合管理運用帳戶中扣收"],"a":"1","tp":"集合帳戶投資限制與流動性","note":""},{"p":61,"s":2,"n":76,"t":"有關證券投資信託基金保管機構之敘述，下列何者正確？","o":["基金受益人大會不得決議更換保管機構","保管機構應於證券商開立集中保管劃撥帳戶","投信公司如因故意或過失，致損害基金之資產時，保管機構應為該基金向投信公司追償","保管機構複委任集保公司代為保管證券投資信託基金購入之有價證券時，有關費用由證券投資信託基金負擔"],"a":"3","tp":"基金保管交割與監督責任","note":""},{"p":61,"s":2,"n":77,"t":"有關金融資產證券化之特性，下列敘述何者正確？","o":["由創始機構發行有價證券","信用評等之基礎為特殊目的機構之信用評等","投資人之收益來自特定金融資產之現金流量","得採提供超額資產、利差帳戶、現金準備帳戶等外部信用增強機制"],"a":"3","tp":"證券化特性與經濟效益","note":""},{"p":61,"s":2,"n":78,"t":"有關信託業辦理以信託受益權為擔保之質權設定時，下列敘述何者錯誤？","o":["信託契約應載明管理處分權限","信託業不得自信託財產收取本息","信託存續期間內信託業不得因行使質權而提前終止信託契約","得辦理商品（服務）禮券所收取金額交付信託之受益權質權設定"],"a":"4","tp":"公會自律與行為規範","note":""},{"p":61,"s":2,"n":79,"t":"投資下列何種證券之孳息收益係採分離課稅？ A.不動產投資信託受益證券 B.不動產資產信託受益證券 C.金融資產證券化受益證券","o":["僅AB","僅BC","僅AC","ABC"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":61,"s":2,"n":80,"t":"依金融資產證券化條例所發行之受益證券，其轉讓得以空白背書方式為之者，發行期間應為幾年以下？","o":["一年","二年","三年","五年"],"a":"1","tp":"受益證券募集發行與受益人會議","note":""},{"p":62,"s":1,"n":1,"t":"下述何種信託財產在交付時無須辦理信託登記？","o":["股票","房地產","公債","金錢"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":2,"t":"有關不動產信託登記之敘述，下列何者錯誤？","o":["信託以契約為之者，信託登記應由委託人與受託人會同申請","遺囑信託，信託登記原則上由受託人單獨申請即可","信託關係消滅時，原則上由歸屬權利人會同受託人辦理相關登記","信託登記完畢，應於書狀記明信託財產，信託內容詳信託專簿"],"a":"2","tp":"登記公示與對抗效力","note":""},{"p":62,"s":1,"n":3,"t":"依信託之分類，下列何者非屬「意定信託」？","o":["契約信託","遺囑信託","法定信託","宣言信託"],"a":"3","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":4,"t":"委託人於信託成立時所移轉之財產權，不包括下列何者？","o":["純債權","專利權","漁業權","純債務"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":5,"t":"以應登記或註冊之財產權為信託者，有關信託財產登記之規定，下列敘述何者錯誤？","o":["非經信託登記，不得對抗第三人","土地權利登記得以遺囑為之","以股票為信託者，應向臺灣證券交易所辦理登記","以有價證券為信託者，應於證券上或其他表彰權利之文件上載明為信託財產"],"a":"3","tp":"登記公示與對抗效力","note":""},{"p":62,"s":1,"n":6,"t":"依信託法規定，信託行為有害於委託人之債權人權利者，債權人得向法院聲請下列何種權利？","o":["損害賠償","撤銷信託行為","給付信託財產","確認信託財產為債權人所有"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":7,"t":"有關受託人就信託財產或處理信託事務所支出之費用以信託財產抵充及其求償權利，下列敘述何者錯誤？","o":["請求權因二年間不行使而消滅","不符信託目的時，不得以信託財產充之","就信託財產取償時，有優先於擔保債權人受償之權","除信託行為另有訂定外，信託財產不足清償時，得向受益人請求補償"],"a":"3","tp":"受託人義務報酬與責任","note":""},{"p":62,"s":1,"n":8,"t":"委託人與受益人非同一人者，委託人除信託行為另有保留外，於信託成立後，未經受益人同意時，下列何者為其得行使之權利？","o":["得變更受益人","得終止其信託","得處分受益人之權利","違反對信託財產不得強制執行之規定者，委託人得在強制執行程序終結前，向執行法院對債權人提起異議之訴"],"a":"4","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":9,"t":"受託人僅於下列何種情形時，得例外享有信託利益？","o":["受託人與委託人為同一人時","受託人與他人為共同受託人時","受託人與他人為共同受益人時","受託人與他人為共同委託人時"],"a":"3","tp":"受益人權利與撤銷救濟","note":""},{"p":62,"s":1,"n":10,"t":"依信託法規定，除信託行為另有訂定外，如受託人為自然人，下列何者不是原受託人任務終了原因？","o":["受託人死亡時","委託人死亡時","受託人受破產宣告時","受託人受監護宣告時"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":11,"t":"受託人違反信託本旨處分信託財產，有關撤銷權之敘述，下列何者正確？","o":["自處分時起一年間不行使而消滅","自處分時起二年間不行使而消滅","自處分時起五年間不行使而消滅","自處分時起逾十年不行使而消滅"],"a":"4","tp":"受益人權利與撤銷救濟","note":""},{"p":62,"s":1,"n":12,"t":"依信託法規定，有關受託人得將信託財產轉為自有財產情形，下列敘述何者錯誤？","o":["經受益人書面同意，並依市價取得者","經委託人書面同意者","由集中市場競價取得者","有不得已事由經法院許可者"],"a":"2","tp":"財產獨立性與強制執行","note":""},{"p":62,"s":1,"n":13,"t":"李四與王五訂立信託契約，以王五為受託人，王五甫年滿16 歲，該法律行為之效力為何？","o":["無效","效力未定","有效","得由法院撤銷之"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":14,"t":"依信託法規定，公益信託由下列何者監督？","o":["目的事業主管機關","法院","信託法主管機關","信託業法主管機關"],"a":"1","tp":"設立能力與監督管轄","note":""},{"p":62,"s":1,"n":15,"t":"以學術研究為目的設立之公益信託，其設立及受託人之許可應向下列何機關提出申請？","o":["法務部","教育部","內政部","財政部"],"a":"2","tp":"公益信託與監督機關","note":""},{"p":62,"s":1,"n":16,"t":"有關私益信託信託監察人之敘述，下列何者錯誤？","o":["信託監察人得為受益人行使請求法院增減受託人報酬之權利","對違反規定之強制執行，信託監察人得代受益人提起異議之訴之權利","信託監察人得為受益人行使聲請變更信託財產管理方法之權利","信託監察人與受益人之關係，在解釋上不適用民法委任之規定"],"a":"4","tp":"信託監察人","note":""},{"p":62,"s":1,"n":17,"t":"依信託法規定，信託關係消滅時，信託財產之歸屬順序，除信託行為另有訂定外，下列何者正確？","o":["享有全部信託利益之受益人 → 國庫","享有全部信託利益之受益人 → 委託人或其繼承人","享有全部信託利益之受益人 → 享有全部信託利益之受益人的繼承人","享有全部信託利益之受益人 → 委託人 → 享有全部信託利益之受益人的繼承人"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":18,"t":"有關信託業擔任信託監察人時，其職務之敘述，下列何者正確？","o":["受託人變更時會同移交信託財產於新受託人","信託關係消滅時接收信託財產","為信託業為有關信託之訴訟上或訴訟外的行為","編製信託財產目錄表及收支計算表"],"a":"1","tp":"評審委員會與內部職責","note":""},{"p":62,"s":1,"n":19,"t":"吳先生於114 年7 月1 日至甲銀行辦理信託，雙方簽訂書面之信託契約，約明至114 年7 月30 日由吳先生交付土地一筆房屋一棟予甲銀行，交由甲銀行管理或處分，受益人為其妻程女士，下列敘述何者正確？","o":["吳先生只須移轉房地之占有予甲銀行，不須辦理所有權移轉登記","吳先生須辦理所有權移轉登記予甲銀行，惟登記予甲銀行後，吳先生仍有處分權得以自己之名義與第三人簽訂地上權契約","吳先生須辦理所有權移轉登記予甲銀行，移轉登記予甲銀行後，甲銀行對該信託財產，係唯一對外有權與第三人簽訂租賃契約收取租金者","吳先生須辦理所有權移轉登記予甲銀行，惟移轉登記予甲銀行後，程女士得基於受益人身分，有處分權得以自己之名義與第三人簽訂租賃契約收取租金"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":62,"s":1,"n":20,"t":"有關遺囑信託之敘述，下列何者正確？","o":["委託人須年滿十六歲","遺囑中未指定受託人時，則該信託行為無效","由遺囑人一方為意思表示，須受託人之同意才可成立","委託人在生前與人訂立信託契約，以其死亡為條件或始期，使該信託於其死亡時發生效力者，為遺囑信託"],"a":"1","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":21,"t":"信託業之組織，除經主管機關許可兼營信託業務之銀行外，以下列何者型態為限？","o":["有限公司為限","股份有限公司為限","無限公司為限","兩合公司為限"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":62,"s":1,"n":22,"t":"依信託業法設立標準之規定，申請設立信託公司，發起人及股東之出資以下列何項為限？","o":["支票","現金","股票","公債"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":62,"s":1,"n":23,"t":"原則上信託公司之發起人及股東，同一人或同一關係人持有同一信託公司之股份，分別不得超過其已發行股份總數多少比例？","o":["百分之三十五","百分之二十五","百分之十五","百分之十"],"a":"2","tp":"設立標準與分支機構","note":""},{"p":62,"s":1,"n":24,"t":"依信託業法規定，有關信託業得經營之業務，下列敘述何者錯誤？","o":["限於信託業法第16、17 條之規定","申請營業項目時得報請主管機關概括核定","業務項目變更須經主管機關分別核定","其業務涉及外匯之經營者，應經中央銀行同意"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":62,"s":1,"n":25,"t":"依信託業應負之義務及相關行為規範規定，信託業處理信託業務，應考量下列何者之利益？","o":["除考量受益人的利益，亦應考量銀行之利益","除考量受益人的利益，亦應考量信託業務人員之權益","只應考量受益人之利益","除應考量受益人的利益，亦應考量銀行業務之發展"],"a":"3","tp":"公會自律與行為規範","note":""},{"p":62,"s":1,"n":26,"t":"有關信託業對信託財產之運用，下列敘述何者正確？","o":["信託業得以信託財產辦理放款","信託業得承諾擔保本金或最低收益率","信託業不得以信託財產購買其利害關係人發行之股票","信託業得以信託財產讓售與本身"],"a":"3","tp":"利害關係人與利益衝突","note":""},{"p":62,"s":1,"n":27,"t":"信託業辦理下列何種信託業務時，得經全體受益人同意以信託財產借入款項？","o":["以開發為目的之土地信託業務","以投資為目的之金錢信託業務","以管理為目的之有價證券信託業務","以處分為目的之動產信託業務"],"a":"1","tp":"業務範圍與禁止保本保息","note":""},{"p":62,"s":1,"n":28,"t":"甲銀行持有乙信託業發行股份總數百分之六，則乙信託業得否以信託資金存放於甲銀行作為存款？","o":["乙信託業絕對不得以信託資金存放於甲銀行作為存款","信託業法對此並無限制，乙信託業得以信託財產存放於甲銀行作為存款","事先取得主管機關許可者，乙信託業得以信託資金存放於甲銀行作為存款","事先告知受益人並取得其書面同意者，乙信託業得以信託資金存放於甲銀行作為存款"],"a":"4","tp":"利害關係人與利益衝突","note":""},{"p":62,"s":1,"n":29,"t":"依信託業法規定，下列何者為兼營信託業務銀行之利害關係人？","o":["銀行之董事長","持有銀行股份百分之三者","銀行經理之四親等血親","銀行轉投資且持有股份百分之三之企業"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":62,"s":1,"n":30,"t":"依信託業法規定，信託契約訂定時，有關應記載事項，下列何者錯誤？","o":["信託目的","信託財產之種類","受益人之責任","簽訂契約之日期"],"a":"3","tp":"基本義務與契約記載事項","note":""},{"p":62,"s":1,"n":31,"t":"有關信託業之盈餘分配，下列敘述何者錯誤？","o":["信託業於完納一切稅捐後，應先提存百分之三十為法定盈餘公積","法定盈餘公積未達資本總額前，其最高現金盈餘分配，不得超過資本總額之百分之十五","法定盈餘公積已達其資本總額時，其最高現金盈餘分配，不得超過資本總額之百分之三十","除法定盈餘公積外，信託業得依章程規定或經股東會決議，提列特別盈餘公積"],"a":"3","tp":"賠償準備金與盈餘分配","note":""},{"p":62,"s":1,"n":32,"t":"銀行經營信託業務應指撥營運資金，其金額至少不得低於新臺幣多少？","o":["一千萬元","三千萬元","五千萬元","一億元"],"a":"3","tp":"業務範圍與禁止保本保息","note":""},{"p":62,"s":1,"n":33,"t":"有關對信託業所應提存賠償準備金之敘述，下列何者錯誤？","o":["應以現金或政府債券繳存財政部","賠償準備金之額度由主管機關規定之","委託人或受益人就賠償準備金有優先受償權","乃是為擔保信託業違反受託人義務而對委託人或受益人所負之損害賠償、利益返還或其他責任而設"],"a":"1","tp":"賠償準備金與盈餘分配","note":""},{"p":62,"s":1,"n":34,"t":"依信託業法規定，信託業有違其忠實義務，而對委託人或對受益人有虛偽、詐欺或其他足致他人誤信之行為時， 其行為負責人應負下列何種刑責？","o":["一年以上七年以下有期徒刑或科或併科新臺幣一千萬元以下罰金","三年以下有期徒刑、拘役或科或併科新臺幣一千萬元以下罰金","六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金","一年以下有期徒刑、拘役或科或併科新臺幣三百萬元以下罰金"],"a":"1","tp":"利害關係人與利益衝突","note":""},{"p":62,"s":1,"n":35,"t":"依信託業法規定，信託業應設立信託財產評審委員會，將信託財產每三個月評審一次，並向下列何者報告？","o":["股東會","董事會","監察人","總經理"],"a":"2","tp":"財產評審報告與會計公告","note":""},{"p":62,"s":1,"n":36,"t":"兼營信託業務之銀行辦理委託人不指定營運範圍或方法之金錢信託，其營運範圍有無限制？","o":["信託業法中就此無任何限制之規定","其營運範圍以信託業法所定者為限","信託業法中就其營運範圍雖未為具體之限制規定，但主管機關於必要時得隨時限制其投資標的","其營運範圍以投資不動產及上市、上櫃股票為限"],"a":"2","tp":"業務範圍與禁止保本保息","note":""},{"p":62,"s":1,"n":37,"t":"有關主管機關得派員檢查信託業，下列敘述何者錯誤？","o":["主管機關得隨時派員檢查","檢查內容限於信託業本身之業務、財務及其他有關事項","主管機關得委託適當機構檢查","主管機關得令信託業於限期內據實提報財務報告"],"a":"2","tp":"監理處分罰則與損害賠償","note":""},{"p":62,"s":1,"n":38,"t":"有關信託業募集共同信託基金之敘述，下列何者錯誤？","o":["共同信託基金受益證券僅能向特定人私募","共同信託基金受益證券由受益人背書轉讓之","信託業募集發行共同信託基金，應向受益人交付公開說明書","非將受益證券受讓人之姓名或名稱通知信託業，不得對抗該信託業"],"a":"1","tp":"共同信託基金募集與運用","note":""},{"p":62,"s":1,"n":39,"t":"有關銀行辦理特定金錢信託業務之規定，下列敘述何者錯誤？","o":["信託部門的營業及會計必須獨立","應指撥營運資金專款經營","經營信託業務人員需對客戶之往來交易資料應保守秘密","營運範圍及風險管理規定由信託業商業同業公會自行訂定"],"a":"4","tp":"業務範圍與禁止保本保息","note":""},{"p":62,"s":1,"n":40,"t":"依信託業會計處理原則規定，信託業對於信託財產不具有運用決定權者，其信託資產之續後評價得以何者入帳？","o":["最高價格","平均成本","最低價格","入帳成本"],"a":"4","tp":"財產評審報告與會計公告","note":""},{"p":62,"s":1,"n":41,"t":"依中華民國信託業商業同業公會會員自律公約規定，會員違反本公約，有關審議委員會得建議之處置，下列敘述何者錯誤？","o":["糾正","停止其應享有之部分或全部權益","至少處以新臺幣20 萬元以上之違約金","呈報主管機關為適當之處分"],"a":"3","tp":"公會自律與行為規範","note":""},{"p":62,"s":1,"n":42,"t":"依證券投資信託事業證券投資顧問事業證券商兼營信託業務管理辦法規定，證券商未於指定期限內辦理新增營業項目之登錄者，若有正當理由，於期限屆滿前得向主管機關申請展延幾個月，並以幾次為限？","o":["三個月；一次","六個月；一次","三個月；二次","六個月；二次"],"a":"2","tp":"經營組織與兼營獨立","note":""},{"p":62,"s":1,"n":43,"t":"有關信託業辦理政黨政治團體財產信託，信託業於契約訂定後十日內應公告事項，下列敘述何者錯誤？","o":["政黨背景介紹","信託財產之種類及數量","委託人之名稱及住址","信託收益計算、分配之對象、時期及方法"],"a":"1","tp":"人員資格訓練與利益限制","note":""},{"p":62,"s":1,"n":44,"t":"甲係成年之我國自然人，其因罹患癌症，因此於113 年6 月1 日在意識完全清楚之情況下與乙銀行簽約，約定其死亡時將其銀行存款五百萬元信託於乙銀行，受益人為其女丙，並約定該信託於甲死亡時方生效，甲於同年12 月1 日死亡，下列敘述何者正確？","o":["該信託為遺囑信託","該信託為契約信託","該信託之生效時點為113 年6 月1 日","該信託為自益信託"],"a":"2","tp":"成立方式與信託分類","note":""},{"p":62,"s":1,"n":45,"t":"有價證券之信託從信託開始至信託期間終了，其信託財產形態，下列敘述何者正確？","o":["禁止轉換為金錢","信託財產皆限定為有價證券","信託財產限定為上市、上櫃股票","信託財產經運用後得轉換為金錢持有"],"a":"4","tp":"終止變更與剩餘財產歸屬","note":""},{"p":62,"s":1,"n":46,"t":"信託財產發生之收入，受託人應於所得發生年度，按所得類別依所得稅法規定減除成本、必要費用及損耗後， 由下列何者併入當年度所得，課徵所得稅？","o":["受託人","委託人","受益人","信託監察人"],"a":"3","tp":"所得稅與扣繳","note":""},{"p":62,"s":1,"n":47,"t":"個人成立、捐贈或加入符合所得稅法規定之公益信託之財產，得列綜合所得稅列舉扣除額申報捐贈之扣除比例上限為何？","o":["全數列入","所得總額百分之四十","所得總額百分之三十","所得總額百分之二十"],"a":"4","tp":"所得稅與扣繳","note":""},{"p":62,"s":1,"n":48,"t":"王先生成立金錢信託時，下列何種情況無須申報贈與稅？","o":["成立他益信託照顧子女","自益信託變更受益人為父母時","追加信託貳佰伍拾萬元款項照顧子女時","成立信託照顧自己的退休安養生活"],"a":"4","tp":"遺產及贈與稅","note":""},{"p":62,"s":1,"n":49,"t":"信託財產為房屋者，該房屋稅之納稅義務人為下列何者？","o":["受益人","受託人","委託人","歸屬權利人"],"a":"2","tp":"房屋稅與契稅","note":""},{"p":62,"s":1,"n":50,"t":"因遺囑成立之信託，於成立時以土地為信託財產者，該土地有應課徵土地增值稅之情形時，其原地價係指下列何者？","o":["受託人辦理信託登記日當期之公告土地現值","繼承人辦理繼承登記日當期之公告土地現值","遺囑人死亡日當期之公告土地現值","受託人移轉信託財產予受益人當期之公告土地現值"],"a":"3","tp":"土地稅與土地增值稅"     let currentSubject = 0; // 0: all, 1: law, 2: prac
    let isQuizMode = false;
    let searchTimer = null;

    function init() {
      // Restore theme
      const savedTheme = localStorage.getItem('trust_all_theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);

      applyFilters();

      window.addEventListener('scroll', () => {
        const btn = document.getElementById('backToTop');
        if (window.scrollY > 300) btn.classList.add('visible');
        else btn.classList.remove('visible');
      });
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('trust_all_theme', next);
    }

    function toggleMode() {
      isQuizMode = !isQuizMode;
      const btn = document.getElementById('modeBtn');
      const text = document.getElementById('modeText');
      const icon = document.getElementById('modeIcon');

      if (isQuizMode) {
        document.body.classList.add('mode-quiz');
        btn.classList.remove('btn-primary');
        text.innerText = '顯示解答 (全覽模式)';
        icon.innerText = '🎯';
      } else {
        document.body.classList.remove('mode-quiz');
        btn.classList.add('btn-primary');
        text.innerText = '隱藏解答 (刷題模式)';
        icon.innerText = '👁️';
      }
    }

    function setSubject(subj) {
      currentSubject = subj;
      document.getElementById('subBtnAll').classList.toggle('btn-active', subj === 0);
      document.getElementById('subBtnLaw').classList.toggle('btn-active', subj === 1);
      document.getElementById('subBtnPrac').classList.toggle('btn-active', subj === 2);
      applyFilters();
    }

    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        applyFilters();
      }, 250);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      applyFilters();
    }

    function applyFilters() {
      const periodVal = document.getElementById('periodSelect').value;
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = RAW_QUESTIONS.filter(q => {
        // Period filter
        if (periodVal !== 'all' && q.p !== parseInt(periodVal)) {
          return false;
        }
        // Subject filter
        if (currentSubject !== 0 && q.s !== currentSubject) {
          return false;
        }
        // Search filter
        if (searchKeyword) {
          const inText = q.t && q.t.toLowerCase().includes(searchKeyword);
          const inTopic = q.tp && q.tp.toLowerCase().includes(searchKeyword);
          const inOpts = q.o && q.o.some(opt => opt && opt.toLowerCase().includes(searchKeyword));
          if (!inText && !inTopic && !inOpts) return false;
        }
        return true;
      });

      renderQuestions(filtered);
    }

    function renderQuestions(list) {
      const container = document.getElementById('questionsContainer');
      const countEl = document.getElementById('displayCount');
      const navGrid = document.getElementById('quickNavGrid');

      countEl.innerText = list.length;

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>查無符合條件的考題</h3><p>請嘗試更換篩選條件或關鍵字。</p></div>';
        navGrid.innerHTML = '';
        return;
      }

      // Render nav chips
      let navHtml = '';
      const limitChips = Math.min(list.length, 150);
      for (let i = 0; i < limitChips; i++) {
        const item = list[i];
        const cardId = 'q-' + item.p + '-' + item.s + '-' + item.n;
        navHtml += '<a href="#' + cardId + '" class="nav-chip" title="第' + item.p + '屆 第' + item.n + '題">' + item.n + '</a>';
      }
      if (list.length > limitChips) {
        navHtml += '<span style="font-size:0.8rem; color:var(--text-sub); align-self:center;">...共有 ' + list.length + ' 題</span>';
      }
      navGrid.innerHTML = navHtml;

      // Render question cards (虛擬高效渲染)
      let cardsHtml = '';
      list.forEach(q => {
        const cardId = 'q-' + q.p + '-' + q.s + '-' + q.n;
        const subjName = q.s === 1 ? '信託法規' : '信託實務';
        const subjBadgeClass = q.s === 1 ? 'badge-subj-law' : 'badge-subj-prac';
        const correctAns = String(q.a).trim();

        let optionsHtml = '';
        (q.o || []).forEach((opt, idx) => {
          const optNum = idx + 1;
          const isCorrect = String(optNum) === correctAns || correctAns === '全' || correctAns === '送分' || correctAns.includes(String(optNum));
          optionsHtml += `
            <div class="opt-chip ${isCorrect ? 'is-correct' : ''}" onclick="checkOption(this, ${isCorrect})">
              <span class="opt-num">(${optNum})</span>
              <span class="opt-label">${escapeHtml(opt)}</span>
              <span class="opt-check">✓ 正確答案</span>
            </div>
          `;
        });

        cardsHtml += `
          <article class="q-card" id="${cardId}">
            <div class="q-card-header">
              <div class="q-tags-row">
                <span class="badge-period">第 ${q.p} 屆</span>
                <span class="${subjBadgeClass}">${subjName}</span>
                <span class="badge-qnum">第 ${q.n} 題</span>
                <span class="badge-ans">【正確答案：(${correctAns})】</span>
              </div>
              <div style="display:flex; gap:6px; align-items:center;">
                ${q.tp ? `<span class="badge-topic">${escapeHtml(q.tp)}</span>` : ''}
                <button class="btn btn-reveal" onclick="revealSingleAns(this)">揭曉答案</button>
              </div>
            </div>

            <div class="q-text">${escapeHtml(q.t)}</div>

            <div class="options-list">
              ${optionsHtml}
            </div>

            ${q.note ? `<div class="q-note-box">⚠️ ${escapeHtml(q.note)}</div>` : ''}
          </article>
        `;
      });

      container.innerHTML = cardsHtml;
    }

    function checkOption(el, isCorrect) {
      if (!isQuizMode) return;
      if (isCorrect) {
        el.classList.add('user-selected-correct');
      } else {
        el.classList.add('user-selected-wrong');
      }
    }

    function revealSingleAns(btn) {
      const card = btn.closest('.q-card');
      const ansBadge = card.querySelector('.badge-ans');
      if (ansBadge) {
        ansBadge.style.display = 'inline-block';
      }
      card.querySelectorAll('.opt-chip.is-correct').forEach(opt => {
        opt.style.background = 'var(--success-light)';
        opt.style.borderColor = 'var(--success-border)';
        const check = opt.querySelector('.opt-check');
        if (check) check.style.display = 'inline-block';
      });
      btn.style.display = 'none';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.onload = init;
  </script>
</body>
</html>
