<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle"> 信託法規關鍵法定期間總彙整 (由短至長排序)</text>

  <!-- 5 大時階垂直排布 -->
  <g transform="translate(60, 70)" filter="url(#shadow)">
    <rect width="800" height="65" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="140" height="65" rx="10" fill="url(#gradBlue)"/>
    <text x="70" y="40" fill="#fff" font-size="17" font-weight="700" text-anchor="middle"> 30 日內</text>
    <text x="160" y="30" fill="#38bdf8" font-size="15" font-weight="700">贈與稅申報期限（符合課稅條件時）</text>
    <text x="160" y="52" fill="#cbd5e1" font-size="13">依遺產及贈與稅法第 24 條之 1，自訂定或變更契約日判斷；符合第 24 條條件時於 30 日內申報。</text>
  </g>

  <g transform="translate(60, 150)" filter="url(#shadow)">
    <rect width="800" height="65" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="140" height="65" rx="10" fill="url(#gradAmber)"/>
    <text x="70" y="40" fill="#fff" font-size="17" font-weight="700" text-anchor="middle"> 1 個月內</text>
    <text x="160" y="30" fill="#fbbf24" font-size="15" font-weight="700">信託業賠償準備金提存至中央銀行</text>
    <text x="160" y="52" fill="#cbd5e1" font-size="13">取得營業執照後 1 個月內，以現金或政府債券繳存中央銀行（至少 5,000 萬元）！</text>
  </g>

  <g transform="translate(60, 230)" filter="url(#shadow)">
    <rect width="800" height="65" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="140" height="65" rx="10" fill="url(#gradPurple)"/>
    <text x="70" y="40" fill="#fff" font-size="17" font-weight="700" text-anchor="middle"> 3 個月內</text>
    <text x="160" y="30" fill="#c084fc" font-size="15" font-weight="700">信託財產評審委員會開會 / 公益信託年度申報</text>
    <text x="160" y="52" fill="#cbd5e1" font-size="13">評審委員會每 3 個月至少開會一次；公益信託年度終了後 3 個月內向主管機關申報並公告！</text>
  </g>

  <g transform="translate(60, 310)" filter="url(#shadow)">
    <rect width="800" height="65" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="140" height="65" rx="10" fill="url(#gradRose)"/>
    <text x="70" y="40" fill="#fff" font-size="17" font-weight="700" text-anchor="middle"> 6 個月內</text>
    <text x="160" y="30" fill="#f87171" font-size="15" font-weight="700">成立後破產推定害及債權</text>
    <text x="160" y="52" fill="#cbd5e1" font-size="13">信託成立後 6 個月內委託人被宣告破產者，法律直接「推定」該信託行為有害於債權！</text>
  </g>

  <g transform="translate(60, 390)" filter="url(#shadow)">
    <rect width="800" height="65" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="140" height="65" rx="10" fill="url(#gradEmerald)"/>
    <text x="70" y="40" fill="#fff" font-size="17" font-weight="700" text-anchor="middle"> 1年 / 10年</text>
    <text x="160" y="30" fill="#34d399" font-size="15" font-weight="700">詐害信託撤銷權之除斥期間 (口訣：知一成十)</text>
    <text x="160" y="52" fill="#cbd5e1" font-size="13">自債權人知有撤銷原因時起 1 年間；自信託行為成立時起逾 10 年間不行使而消滅！</text>
  </g>

</svg>